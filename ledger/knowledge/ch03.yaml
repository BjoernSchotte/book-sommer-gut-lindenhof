based_on: ["ch02#5671c8", "ch03/s01#8e6e2f", "ch03/s02#4f7a40", "ch03/s03#a79d36"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch liegt im Arbeitszimmer auf dem Schreibtisch unterm Fenster, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf die Treppe gelegt."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Früher bekam die junge Marie für eine Stunde Unkraut ein Stück Streuselkuchen, jeden Dienstag und Freitag; sie selbst hat darüber Buch geführt, auf der Rückseite vom Kalender."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Sie hat Jonas das Mittagessen ohne ein Wort hingestellt."
        from: ch03/s03
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Die Einzelheiten der Absprache zwischen Jonas und Marie (Budget, Zwischenstände mit Fotos, freie Hand bei den Rosen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' erst entsorgen wollte und ihnen nun Punktfundamente gibt."
      - "Dass Jonas den Hauptweg Ende Juni frei haben will, vom Tor bis zur Pforte."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt und der Makler Ende Juli einen Fotografen schicken will."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels angerufen hat und am übernächsten Montag das Gut besichtigen will."
      - "Dass Hannes Jonas gefragt hat, ob das Erntefest auf dem Gut bleibt, und keine Zusage bekam."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg im Rosengarten ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Rings um die Sonnenuhr sitzen alte Holunderstubben unter dem Kies, an der Westseite ein Brombeerwurzelstock, dem Marie seit drei Tagen mit der Hacke nicht beikommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will langsam ziehen, nach Norden zum Tor hin, damit der Ballen die Rose nicht mitreißt."
        from: ch03/s02
      - text: "Mit derselben Kette hat er für Hedwig den Fliederbusch an der Remise herausgeholt."
        from: ch03/s02
      - text: "Er hat Jonas gefragt, ob das Erntefest auf dem Gut bleibt; Jonas sagte, das könne er noch nicht sagen, es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen, die er selbst noch nicht kenne."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Er bringt Sonnabend um halb acht den Trecker, um den Stubben herauszuziehen."
        from: ch03/s02
      - text: "Jonas hat ihm einen Becher Kaffee gebracht, schwarz, und Marie einen mit Milch."
        from: ch03/s02
    believes:
      - text: "Im Garten läuft es (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Mit dem Spaten wird das nichts; mit Kette und Trecker ist der Stubben schnell heraus."
        from: ch03/s02
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt und Ralf Steinhagen von Weidenkamp Hotels am übernächsten Montag das Gut besichtigen will."
      - "Ob das Erntefest auf dem Gut bleiben kann."
  jonas-behrendt:
    knows:
      - text: "Die Gärtnerin im Rosengarten heißt Marie Albers."
        from: ch01/s01
      - text: "Marie hält die Kletterrose am Hauptweg für eine 'New Dawn', kein Gestrüpp, und lehnt Bagger und Splitt auf dem Weg ab."
        from: ch01/s01
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite; für das Dach steht ein Angebot vom Dachdecker bis Ende Juni aus."
        from: ch01/s02
      - text: "Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen, über die Wege wird noch geredet; ihr Stundensatz steht nicht zur Verhandlung."
        from: ch01/s02
      - text: "Neue Absprache mit Marie: Die Rankbögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief); er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg Ende Juni frei zu haben, vom Tor bis zur Pforte, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Donnerstag um neun Uhr ist in Hamburg die Abnahme des Parkdecks; das Büro braucht ihn dort."
        from: ch02/s02
      - text: "Für die Partnerschaft im Büro ist seine Einlage fällig."
        from: ch02/s02
      - text: "Laut Makler gibt es einen Kaufinteressenten aus der Hotelbranche."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben (gute Wege, Blüten mit Blick vom Haus, keine Ecke, die nach Arbeit aussieht), dann gehe es um andere Zahlen; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Am letzten Freitag im Juli soll ein Fotograf des Maklers den Garten fotografieren."
        from: ch02/s02
      - text: "Erinnerung aus der Kindheit: ein Floß aus Brettern am Gutssee, und Hedwig rief ihn zum Kuchen."
        from: ch02/s02
      - text: "Die Rankbögen der 'Ghislaine' sitzen seit einer Woche fest im Beton und halten; er hat nachgerechnet, was die Fundamente tragen müssen."
        from: ch03/s01
      - text: "Seit dem Gewitter unter den Bögen sagen er und Marie Du zueinander."
        from: ch03/s01
      - text: "Laut Marie hat Hedwig ihr mit zehn den ersten Rosenschnitt beigebracht (über dem Auge, schräg) und ihr ihre alte Schere mit dem roten Griff geschenkt, die Marie noch heute benutzt."
        from: ch03/s01
      - text: "Laut Marie bekam sie als Kind von Grete für eine Stunde Unkraut ein Stück Streuselkuchen, dienstags und freitags, und kam im ersten Sommer jeden Tag mit dem Rad."
        from: ch03/s01
      - text: "Laut Marie redete Hedwig laut mit den Rosen, schimpfte mit der 'Rosa Mundi' und lobte die 'Ghislaine' jeden Juni; Marie redet ebenfalls mit den Rosen."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat Grete ihm gesagt."
        from: ch03/s02
      - text: "Hannes Kröger hat gefragt, ob das Erntefest auf dem Gut bleibt; er hat keine Zusage gegeben, Hannes hat nur genickt."
        from: ch03/s02
      - text: "Das Erntefest ist laut Hannes am ersten Samstag im September; Hannes bringt Sonnabend um halb acht den Trecker."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; die Nummer hat er vom Makler. Steinhagen kennt Zimmerzahl, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Weidenkamp denkt an Zimmer im Haupthaus, Spa und Seminarraum in Kuhstall und Scheune; über eine Stellplatzlösung will Steinhagen vor Ort reden."
        from: ch03/s03
      - text: "Steinhagen besichtigt das Gut am übernächsten Montag, Mitte Juli; er hat zugesagt und den Termin eingetragen, Steinhagen schickt eine Bestätigung."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen, verrutschte Pfannen und faulendes Laub in der Rinne."
        from: ch03/s03
    believes:
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Sein Plan geht auf: ein Käufer bis zum Herbst und die Einlage zum Jahresende."
        from: ch02/s02
      - text: "Das Haupthaus ist schlimmer dran als das Scheunendach."
        from: ch03/s03
      - text: "Steinhagen ist der Käufer, den er wollte: einer, der rechnen kann, in Flächen und Fristen denkt und sich nicht lange bitten lässt."
        from: ch03/s03
      - text: "Ob das, was zwischen ihm und Marie unter den Bögen angefangen hat, eine Last verträgt, weiß er nicht; die richtige Entscheidung fühlt sich an wie ein Riss im Fundament."
        from: ch03/s03
    does_not_know:
      - "Dass hinter dem Laubengang unter den Brombeeren der letzte Stock der Lindenhof-Rose steht."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten, und was Hedwig ihr im letzten Herbst auf der Bank gesagt hat."
      - "Dass Grete Marie von Hedwigs Gartenbuch im Arbeitszimmer erzählt und es ihr gegeben hat."
      - "Dass Marie mit Lena über ihn gesprochen hat und Lena meint, Marie habe Gefühle für ihn."
      - "Wo genau Weidenkamp die Stellplätze anlegen will."
  lena-hansen:
    knows:
      - text: "Laut Marie stand in Jonas' Tabelle beim Laubengang 'Entsorgung' für beide Rankbögen der 'Ghislaine', die zweiundfünfzig Jahre alt sind."
        from: ch02/s03
      - text: "Laut Marie kniete Jonas in heller Hose ins nasse Gras vor den Bogen, rüttelte am Eisen, stellte fehlendes Fundament fest und skizzierte eins auf die Rückseite seiner Tabelle: vierzig mal vierzig, achtzig tief wegen Frost."
        from: ch02/s03
      - text: "Laut Marie kam Jonas in geputzten Lederschuhen, seine Hose ist an beiden Knien grün und hin, und am ersten Tag ließ er sie samt Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Marie sagt, sie habe Jonas dazu gebracht, die Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Marie hat zehn Eier für den nächsten Morgen gekauft und zwei Stück Butterkuchen von ihr bekommen; sie sehen sich am Freitag wieder."
        from: ch02/s03
    believes:
      - text: "Marie hat Gefühle für Jonas; dass sie seit zwanzig Minuten über seine Schuhe redet, ist kein gutes oder ein sehr gutes Zeichen."
        from: ch02/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt und Ralf Steinhagen von Weidenkamp Hotels am übernächsten Montag das Gut besichtigen will."
      - "Dass Jonas den Hauptweg Ende Juni frei haben wollte."
      - "Dass Marie und Jonas seit dem Gewitter unter den Bögen Du zueinander sagen."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe aus Hamburg."
        from: ch01/s01
      - text: "Jonas will den Rosengarten bis zum Erntefest am 5. September hergerichtet haben: Wege begehbar, Beete sauber, alles, was man vom Haus aus sieht."
        from: ch01/s02
      - text: "Jonas will das Gut verkaufen."
        from: ch01/s02
      - text: "Absprache mit Jonas: freie Hand bei den Rosen, über die Wege wird noch geredet; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hinter dem Laubengang steht unter den Brombeeren ein Stock der Lindenhof-Rose, die Hedwig selbst gezogen hat."
        from: ch01/s03
      - text: "Grete hat ihr zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt; sie hat es jetzt."
        from: ch02/s01
      - text: "Laut Hedwigs Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Neue Absprache: Die Rankbögen bleiben und bekommen Punktfundamente, Jonas bestellt Beton, sie bindet die Rose selbst wieder an; dafür muss der Hauptweg Ende Juni frei sein, vom Tor bis zur Pforte, mit Fotos."
        from: ch02/s01
      - text: "Die Bögen sitzen fest im Beton; Jonas hat daran gerüttelt, nichts gab nach. Sie bindet die 'Ghislaine' wieder an, danach kommt der achte Bogen dran."
        from: ch03/s01
      - text: "Seit dem Gewitter unter den Bögen sagen sie und Jonas Du zueinander; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Hedwig hat ihr mit zehn den ersten Rosenschnitt beigebracht, über dem Auge, schräg, und ihr die alte Schere mit dem roten Griff geschenkt, die sie heute noch hat."
        from: ch03/s01
      - text: "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu ihr gesagt hat; sie trägt es seither mit sich und hat es niemandem erzählt."
        from: ch03/s01
      - text: "Der Hauptweg ist frei; Hannes hat den Garten gelobt (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker, um die Stubben an der Sonnenuhr zu ziehen, nach Norden zum Tor hin, weg von der 'Rosa Mundi'."
        from: ch03/s02
      - text: "Auf Hannes' Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas keine Zusage gegeben: es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Jonas hat ihr Kaffee mit Milch gebracht; dass sie Milch nimmt, hat er von Grete."
        from: ch03/s02
    believes:
      - text: "Splitt auf dem Hauptweg würde den alten Kies zerstören."
        from: ch01/s01
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Den Winkel hinter dem Laubengang sieht man von der Terrasse nicht, und in Jonas' Tabelle kommt er nicht vor."
        from: ch01/s03
      - text: "Für Giersch und den Stock unter den Brombeeren bleibt ihr kaum Zeit."
        from: ch02/s01
      - text: "Sie hat Jonas dazu gebracht, Hedwigs Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Ihr Herzklopfen neben Jonas kommt vom Gewitter."
        from: ch03/s01
      - text: "Jonas schuldet ihr ein Wort zu dem, was Hannes nicht zu hören bekam; sie hofft, dass das Erntefest auf dem Gut bleibt."
        from: ch03/s02
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor so still werden ließ."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Dass Jonas fest damit rechnet, bis zum Herbst einen Käufer zu haben."
      - "Wie schlimm es um Fenster und Dach des Gutshauses steht und was die Sanierung kostet."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt und am letzten Freitag im Juli ein Fotograf den Garten fotografieren soll."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels angerufen hat, Zimmer, Spa und Seminarraum plant und am übernächsten Montag das Gut besichtigt."
      - "Dass Jonas am Donnerstag zur Abnahme des Parkdecks nach Hamburg muss und eine Einlage für die Partnerschaft fällig ist."
      - "Dass Jonas sie vom Hügel aus bei der Arbeit beobachtet hat, am Laubengang und am Rondell."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zahl der Zimmer im Gutshaus, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Jonas hat der Besichtigung am übernächsten Montag, Mitte Juli, zugestimmt."
        from: ch03/s03
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste von Weidenkamp heute suchen."
        from: ch03/s03
    does_not_know:
      - "Dass Hedwig sich gewünscht hat, der Rosengarten möge zum Erntefest wieder blühen."
      - "Dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht."
