based_on: ["ch02#0a55c5", "ch03/s01#8e6e2f", "ch03/s02#4f7a40", "ch03/s03#26e365"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch lag im Arbeitszimmer, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf der Treppe liegen lassen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Marie hat den Auftrag, den Garten bis zum Fest fertig zu machen, und sagt, Jonas wolle verkaufen."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag morgens Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Marie hat als Kind jeden Dienstag und Freitag im Garten gearbeitet, eine Stunde Unkraut für ein Stück Streuselkuchen; sie selbst hat auf der Rückseite vom Kalender Buch geführt."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Sie hat Jonas am Tag von Hannes' Besuch das Mittagessen hingestellt, ohne ein Wort."
        from: ch03/s03
    believes:
      - text: "Hedwigs Wunsch im Testament gilt Marie, auch wenn ihr Name nicht drinsteht."
        from: ch01/s03
      - text: "Der Verkauf ist Jonas' Sache, der Garten ist Maries."
        from: ch01/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Welche Bedingungen Marie und Jonas auf der Terrasse ausgehandelt haben (freie Hand bei den Rosen, Budgetrahmen, Fotos alle zwei Wochen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' entsorgen wollte und sie nun mit Punktfundamenten stehen bleiben sollen."
      - "Dass Marie den Hauptweg bis Ende Juni freihalten muss."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt und der Makler Ende Juli Fotos vom Garten will."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels angerufen hat und das Gut am übernächsten Montag besichtigen will."
  hannes-kroeger:
    knows:
      - text: "Jonas Behrendt ist auf dem Gut; er hat ihm einen Becher schwarzen Kaffee gebracht."
        from: ch03/s02
      - text: "Der Hauptweg ist frei, und die 'Ghislaine' hängt im Laubengang wieder an ihren Bögen."
        from: ch03/s02
      - text: "Um die Sonnenuhr heben alte Holunderstubben den Kies, an der Westseite sitzt ein Brombeerwurzelstock; mit dem Spaten wird das nichts."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will langsam ziehen, nach Norden zum Tor hin."
        from: ch03/s02
      - text: "Er hat Hedwig den Fliederbusch an der Remise mit derselben Kette herausgeholt."
        from: ch03/s02
      - text: "Jonas sagt nicht zu, dass das Erntefest auf dem Gut bleibt: Gutachten für Dach und Fenster, Kosten und Fristen, die er selbst noch nicht kennt."
        from: ch03/s02
      - text: "Das Fest ist wie immer am ersten Samstag im September."
        from: ch03/s02
      - text: "Er bringt Sonnabend um halb acht den Trecker."
        from: ch03/s02
    believes:
      - text: "Im Garten läuft es (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Jonas das Gut verkaufen will."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt (Ralf Steinhagen, Weidenkamp Hotels)."
      - "Dass Weidenkamp das Gut am übernächsten Montag besichtigen will."
  jonas-behrendt:
    knows:
      - text: "Die Frau im Garten heißt Marie Albers."
        from: ch01/s01
      - text: "Die Rose am Hauptweg ist eine 'New Dawn', kein Gestrüpp."
        from: ch01/s01
      - text: "Das Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Sieben Fenster im Erdgeschoss zur Gartenseite sind undicht, zwei Flügel verzogen; für das Dach fehlt noch ein Angebot."
        from: ch01/s02
      - text: "Marie hat den Auftrag angenommen: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Marie rechnet nach ihrem eigenen, nicht verhandelbaren Stundensatz ab."
        from: ch01/s02
      - text: "An den Rankbögen an der Ostmauer hängt seit zweiundfünfzig Jahren eine Rose."
        from: ch02/s01
      - text: "Abmachung mit Marie: Die Bögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief), er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg vom Tor bis zur Pforte bis Ende Juni freizumachen, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Seine Einlage für die Partnerschaft im Büro steht an."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben, dann seien andere Zahlen drin; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Der Makler will am letzten Freitag im Juli einen Fotografen für Fotos vom Garten schicken."
        from: ch02/s02
      - text: "Der Hügel hinter der Scheune ist der einzige Platz am Gut mit Netz."
        from: ch02/s02
      - text: "Er erinnert sich an ein Floß am Gutssee und an Hedwig, die ihn zum Kuchen rief."
        from: ch02/s02
      - text: "Der Bogenfuß sitzt seit einer Woche im Beton und hält: Er hat gerüttelt, nichts gab nach."
        from: ch03/s01
      - text: "Er und Marie sagen inzwischen Du zueinander."
        from: ch03/s01
      - text: "Marie hat mit zehn im Garten ihren ersten Rosenschnitt gemacht, Hedwig hat ihr die Hand geführt; sie kam als Kind dienstags und freitags gegen Gretes Streuselkuchen zum Arbeiten, im ersten Sommer jeden Tag mit dem Rad."
        from: ch03/s01
      - text: "Marie hat Hedwigs alte Schere mit dem roten Griff, ein Geschenk von Hedwig."
        from: ch03/s01
      - text: "Hedwig hat laut mit den Rosen geredet, und Marie tut es auch."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt den Kaffee mit Milch; Grete hat es ihm gesagt."
        from: ch03/s02
      - text: "Hannes Kröger will wissen, ob das Erntefest auf dem Gut bleibt; das Fest ist wie immer am ersten Samstag im September."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker, um die Stubben an der Sonnenuhr herauszuziehen."
        from: ch03/s02
      - text: "Der Kaufinteressent ist Ralf Steinhagen von Weidenkamp Hotels; er hat seine Nummer vom Makler."
        from: ch03/s03
      - text: "Steinhagen kennt Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Weidenkamp denkt an Zimmer im Haupthaus und in der Scheune und an ein kleines Spa; für die Zufahrt gibt es eine Stellplatzlösung, die Steinhagen vor Ort besprechen will."
        from: ch03/s03
      - text: "Er hat die Besichtigung durch Weidenkamp für den übernächsten Montag, Mitte Juli, zugesagt und eingetragen; Steinhagen schickt eine Bestätigung."
        from: ch03/s03
      - text: "Auf dem Scheunendach ist Moos in den Fugen, Pfannen sind verrutscht, in der Rinne fault Laub."
        from: ch03/s03
    believes:
      - text: "Marie ist die Gärtnerin."
        from: ch01/s01
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Marie kennt den Garten; eine Firma aus der Kreisstadt wäre zu langsam."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Ende Juni ist der Hauptweg frei, bis zum Herbst gibt es einen Käufer, und die Einlage leistet er zum Jahresende."
        from: ch02/s02
      - text: "Das Haupthaus ist schlimmer dran als das Scheunendach."
        from: ch03/s03
      - text: "Steinhagen ist der Käufer, den er wollte: einer, der rechnen kann und sich nicht lange bitten lässt; die Zusage zur Besichtigung ist richtig."
        from: ch03/s03
      - text: "Ob das, was unter den Rosen mit Marie angefangen hat, eine Last verträgt, weiß er nicht."
        from: ch03/s03
    does_not_know:
      - "Dass hinter dem Laubengang unter Brombeeren der letzte Stock der Lindenhof-Rose steht."
      - "Dass das Buch, in dem Marie liest, Hedwigs Gartenbuch mit Plänen zu jeder Rose ist."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Was Hedwig im letzten Herbst auf der Bank zu Marie gesagt hat."
      - "Was Marie bei Lena im Hofladen über ihn erzählt hat."
      - "Welche Fristen für den Ort des Erntefests gelten."
  lena-hansen:
    knows:
      - text: "Marie arbeitet am Laubengang im Garten von Hedwig."
        from: ch02/s03
      - text: "Der Mann, über den Marie spricht (Jonas), hatte in seiner Tabelle mit Budget und Meilensteinen die Entsorgung beider Rankbögen der 'Ghislaine' vorgesehen."
        from: ch02/s03
      - text: "Er hat am Bogen ein fehlendes Fundament festgestellt und eins skizziert, 40 × 40, 80 tief wegen Frost; dabei hat er sich die helle Hose an beiden Knien grün gemacht."
        from: ch02/s03
      - text: "Am ersten Tag ließ er Schuhe und Socken auf der Freitreppe trocknen."
        from: ch02/s03
    believes:
      - text: "Marie hat Gefühle für Jonas."
        from: ch02/s03
      - text: "Die Bögen werden nicht verschrottet, weil Marie ihn dazu gebracht hat (nach Maries Erzählung)."
        from: ch02/s03
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Jonas das Gut verkaufen will."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt."
      - "Dass Marie und Jonas sich seit dem Gewitter duzen."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe."
        from: ch01/s01
      - text: "Auftrag von Jonas: den Rosengarten bis zum Erntefest am 5. September herrichten, Wege begehbar, Beete sauber."
        from: ch01/s02
      - text: "Jonas will das Gut verkaufen; ein gepflegtes Gut soll einen besseren Preis bringen."
        from: ch01/s02
      - text: "Abmachung: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Arbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hinter dem Laubengang unter den Brombeeren steht ein Stock der Lindenhof-Rose mit einer Knospe."
        from: ch01/s03
      - text: "Sie hat Hedwigs Gartenbuch; Grete hat es ihr zwei Tage nach dem Auftrag aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Laut Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas' Tabelle: Hauptweg frei bis Ende Juni; beim Laubengang Entsorgung, Ersatz verzinkt; er hatte schon ein Angebot."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Die Bögen haben Punktfundamente bekommen; sie bindet die 'Ghislaine' selbst wieder an, der achte Bogen steht noch aus."
        from: ch03/s01
      - text: "Dafür musste sie den Hauptweg vom Tor bis zur Pforte bis Ende Juni freimachen; er ist frei."
        from: ch03/s02
      - text: "Lena meint, dass Marie seit zwanzig Minuten über Jonas' Schuhe redet, sei kein gutes Zeichen – oder ein sehr gutes."
        from: ch02/s03
      - text: "Frieda nennt sie Tante Rosen und hat gefragt, ob sie verliebt ist."
        from: ch02/s03
      - text: "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu ihr gesagt hat."
        from: ch03/s01
      - text: "Rosenschnitt hat sie mit zehn von Hedwig gelernt: über dem Auge, schräg, damit das Wasser abläuft."
        from: ch03/s01
      - text: "Sie hat Hedwigs alte Schere mit dem roten Griff."
        from: ch03/s01
      - text: "Sie und Jonas sagen seit dem Gewitter unter dem Laubengang Du zueinander; wer angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Um die Sonnenuhr heben alte Holunderstubben den Kies, an der Westseite sitzt ein Brombeerwurzelstock, der sich seit drei Tagen der Hacke widersetzt."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker; gezogen wird nach Norden, zum Tor hin, weg von der 'Rosa Mundi'."
        from: ch03/s02
      - text: "Hannes hat Jonas gefragt, ob das Erntefest auf dem Gut bleibt; Jonas konnte es nicht sagen (Gutachten für Dach und Fenster, Kosten, Fristen)."
        from: ch03/s02
      - text: "Das Fest ist wie immer am ersten Samstag im September."
        from: ch03/s02
    believes:
      - text: "Splitt würde den alten Kies des Hauptwegs zerstören."
        from: ch01/s01
      - text: "Jonas will das Gut verkaufsfertig machen."
        from: ch01/s03
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Jonas kennt den Winkel hinter dem Laubengang nicht; er kommt in seiner Tabelle nicht vor."
        from: ch01/s03
      - text: "Für Hauptweg, Giersch und den Stock unter den Brombeeren bleibt ihr kaum Zeit."
        from: ch02/s01
      - text: "Vielleicht hat Lena recht und sie empfindet mehr als Ärger für Jonas."
        from: ch02/s03
      - text: "Ihr Herzklopfen neben Jonas kommt vom Gewitter."
        from: ch03/s01
      - text: "Jonas hat Hannes etwas verschwiegen; sie wartet auf ein Wort von ihm, das es ihr erklärt."
        from: ch03/s02
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor gesehen hat."
      - "Wie hoch Hedwigs Geldvermächtnis für die Gartenarbeit ist."
      - "Dass Jonas mit einem Käufer bis zum Herbst rechnet."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt (Ralf Steinhagen, Weidenkamp Hotels) und der Makler am letzten Freitag im Juli Fotos vom Garten machen lassen will."
      - "Dass Jonas die Besichtigung durch Weidenkamp für den übernächsten Montag zugesagt hat."
      - "Dass Weidenkamp Zimmer in Haupthaus und Scheune, ein Spa und eine Stellplatzlösung plant."
      - "Dass Jonas am Donnerstag zur Abnahme eines Parkdecks nach Hamburg musste und eine Einlage für die Partnerschaft im Büro ansteht."
      - "Dass Jonas sie vom Hügel hinter der Scheune bei der Arbeit beobachtet hat."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendt ist der Ansprechpartner für das Gut; seine Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune auf den Quadratmeter und Baujahr."
        from: ch03/s03
      - text: "Jonas hat einer unverbindlichen Besichtigung am übernächsten Montag, Mitte Juli, zugestimmt."
        from: ch03/s03
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was Weidenkamps Gäste heute suchen."
        from: ch03/s03
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass auf dem Gut jedes Jahr am ersten Samstag im September das Erntefest stattfindet."
