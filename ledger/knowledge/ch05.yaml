based_on: ["ch04#e08f3e", "ch05/s01#75ad58", "ch05/s02#9a6ade", "ch05/s03#90c2a3"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch liegt im Arbeitszimmer auf dem Schreibtisch unterm Fenster, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf die Treppe gelegt."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Früher bekam die junge Marie für eine Stunde Unkraut ein Stück Streuselkuchen, jeden Dienstag und Freitag; sie selbst hat darüber Buch geführt, auf der Rückseite vom Kalender."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Sie hat Jonas das Mittagessen ohne ein Wort hingestellt."
        from: ch03/s03
      - text: "Mitte Juli kam Ralf Steinhagen zu Jonas aufs Gut; er sprach sie mit Namen an und sagte, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Steinhagen und Jonas auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen, obwohl am Morgen Butterkuchenduft über dem Hof lag; dann ist sie ohne sich umzusehen ins Haus gegangen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli arbeiten Helfer aus dem Dorf im Rosengarten (Landfrauen, Feuerwehr, Nachbarn), Hannes mit dem Trecker, Lena mit dem Klemmbrett; Jonas kam in geliehenen Gummistiefeln aus der Remise."
        from: ch05/s01
      - text: "Sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt, damit diesmal keiner mit leerem Teller dastand, und eine zweite Kanne Kaffee gebracht."
        from: ch05/s01
      - text: "Jonas hat gefragt, ob er zu den Helfern zählt; sie hat ihm zwei Bier aus der Helferkiste gegeben, die Kronkorken gleich mit abgemacht, und ihm Quark für den Nacken angeboten."
        from: ch05/s03
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Die Einzelheiten der Absprache zwischen Jonas und Marie (Budget, Zwischenstände mit Fotos, freie Hand bei den Rosen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' erst entsorgen wollte und ihnen nun Punktfundamente gibt."
      - "Dass Jonas den Hauptweg Ende Juni frei haben will, vom Tor bis zur Pforte."
      - "Dass der Makler am letzten Freitag im Juli einen Fotografen schicken will."
      - "Was Steinhagens Unterlagen enthalten: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg und ein Parkplatz auf dem Rosengarten."
      - "Dass Weidenkamp ihr lebenslanges Wohnrecht bestehen lässt, für ihren freiwilligen Auszug aber eine großzügige Abfindung vorsieht und Jonas sie darauf ansprechen soll."
      - "Dass Hannes Steinhagen nach dem Erntefest gefragt hat und Steinhagen eine Veranstaltungsfläche gegen Gebühr anbot."
      - "Dass Jonas an der Südmauer einen alten Stock der 'Ghislaine de Féligonde' freigelegt hat."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg im Rosengarten ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Rings um die Sonnenuhr sitzen alte Holunderstubben unter dem Kies, an der Westseite ein Brombeerwurzelstock, dem Marie seit drei Tagen mit der Hacke nicht beikommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will langsam ziehen, nach Norden zum Tor hin, damit der Ballen die Rose nicht mitreißt."
        from: ch03/s02
      - text: "Mit derselben Kette hat er für Hedwig den Fliederbusch an der Remise herausgeholt."
        from: ch03/s02
      - text: "Er hat Jonas gefragt, ob das Erntefest auf dem Gut bleibt; Jonas sagte, das könne er noch nicht sagen, es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen, die er selbst noch nicht kenne."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Er bringt Sonnabend um halb acht den Trecker, um den Stubben herauszuziehen."
        from: ch03/s02
      - text: "Jonas hat ihm einen Becher Kaffee gebracht, schwarz, und Marie einen mit Milch."
        from: ch03/s02
      - text: "Mitte Juli schaufelt er mit Marie Kies vom Hänger auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht und Jonas getroffen; er kannte seinen Namen."
        from: ch04/s01
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund; Marie hielt dagegen, das sei ein Garten aus den Dreißigerjahren."
        from: ch04/s01
      - text: "Auf seine Frage, wo das Erntefest dann hin solle, sagte Steinhagen, es fände sich eine Lösung: eine Veranstaltungsfläche gegen Gebühr, für Vereine zu sehr fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kam er kurz nach sechs mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine; Timo brachte das zweite Gespann mit Kies für die Seitenwege."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln, eine Nummer zu groß, und sagte, er sei hier, um anzufassen; er hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Er hat mit einem Pfiff über den Garten klargestellt: Im Garten ist Marie die Chefin, wer das nicht weiß, fragt sie."
        from: ch05/s01
      - text: "Jonas ist als Kind, der Lütte von Hedwig, bei ihm auf dem Hänger über die Stoppeln mitgefahren, barfuß; Hedwig musste ihn mit Kuchen vom Hänger locken. Jonas sagt, an den Diesel erinnere er sich noch."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen frei; er hat Jonas die Hand gegeben, ihn Jonas genannt und Du zu ihm gesagt."
        from: ch05/s02
    believes:
      - text: "Im Garten läuft es (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Mit dem Spaten wird das nichts; mit Kette und Trecker ist der Stubben schnell heraus."
        from: ch03/s02
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Jonas hat gut gearbeitet; morgen tut ihm alles weh."
        from: ch05/s02
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Steinhagens Lageplan den Parkplatz genau auf den Rosengarten legt."
      - "Was Steinhagen und Jonas im Salon besprochen haben und ob Jonas an Weidenkamp verkauft."
      - "Ob das Erntefest auf dem Gut bleiben kann."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
  jonas-behrendt:
    knows:
      - text: "Die Gärtnerin im Rosengarten heißt Marie Albers."
        from: ch01/s01
      - text: "Marie hält die Kletterrose am Hauptweg für eine 'New Dawn', kein Gestrüpp, und lehnt Bagger und Splitt auf dem Weg ab."
        from: ch01/s01
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite; für das Dach steht ein Angebot vom Dachdecker bis Ende Juni aus."
        from: ch01/s02
      - text: "Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen, über die Wege wird noch geredet; ihr Stundensatz steht nicht zur Verhandlung."
        from: ch01/s02
      - text: "Neue Absprache mit Marie: Die Rankbögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief); er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg Ende Juni frei zu haben, vom Tor bis zur Pforte, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Donnerstag um neun Uhr ist in Hamburg die Abnahme des Parkdecks; das Büro braucht ihn dort."
        from: ch02/s02
      - text: "Für die Partnerschaft im Büro ist seine Einlage fällig."
        from: ch02/s02
      - text: "Laut Makler gibt es einen Kaufinteressenten aus der Hotelbranche."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben (gute Wege, Blüten mit Blick vom Haus, keine Ecke, die nach Arbeit aussieht), dann gehe es um andere Zahlen; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Am letzten Freitag im Juli soll ein Fotograf des Maklers den Garten fotografieren."
        from: ch02/s02
      - text: "Erinnerung aus der Kindheit: ein Floß aus Brettern am Gutssee, und Hedwig rief ihn zum Kuchen."
        from: ch02/s02
      - text: "Die Rankbögen der 'Ghislaine' sitzen seit einer Woche fest im Beton und halten; er hat nachgerechnet, was die Fundamente tragen müssen."
        from: ch03/s01
      - text: "Seit dem Gewitter unter den Bögen sagen er und Marie Du zueinander."
        from: ch03/s01
      - text: "Laut Marie hat Hedwig ihr mit zehn den ersten Rosenschnitt beigebracht (über dem Auge, schräg) und ihr ihre alte Schere mit dem roten Griff geschenkt, die Marie noch heute benutzt."
        from: ch03/s01
      - text: "Laut Marie bekam sie als Kind von Grete für eine Stunde Unkraut ein Stück Streuselkuchen, dienstags und freitags, und kam im ersten Sommer jeden Tag mit dem Rad."
        from: ch03/s01
      - text: "Laut Marie redete Hedwig laut mit den Rosen, schimpfte mit der 'Rosa Mundi' und lobte die 'Ghislaine' jeden Juni; Marie redet ebenfalls mit den Rosen."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat Grete ihm gesagt."
        from: ch03/s02
      - text: "Hannes Kröger hat gefragt, ob das Erntefest auf dem Gut bleibt; er hat keine Zusage gegeben, Hannes hat nur genickt."
        from: ch03/s02
      - text: "Das Erntefest ist laut Hannes am ersten Samstag im September; Hannes bringt Sonnabend um halb acht den Trecker."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; die Nummer hat er vom Makler. Steinhagen kennt Zimmerzahl, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Steinhagen besichtigt das Gut am übernächsten Montag, Mitte Juli; er hat zugesagt und den Termin eingetragen, Steinhagen schickt eine Bestätigung."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen, verrutschte Pfannen und faulendes Laub in der Rinne."
        from: ch03/s03
      - text: "Grete hat ihm und Steinhagen auf der Terrasse Kaffee ohne Kuchen hingestellt; in all den Kindersommern hatte sie ihm keine Tasse ohne Kuchen hingestellt, bis zu diesem Morgen."
        from: ch04/s02
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund; Marie sagte, das sei keine Fläche, sondern ein Garten aus den Dreißigerjahren, und die 'Rosa Mundi' sei älter als sie und Steinhagen zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; er selbst hat dazu geschwiegen."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz unten am Steg; er hat Grundrisse, Schnitte und eine Kostenschätzung nach Gewerken durchgesehen, die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Laut Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit einer Zufahrt durch das Tor; ein paar Rosen will Weidenkamp als Akzent in Kübeln behalten."
        from: ch04/s02
      - text: "Grete behält ihr lebenslanges Wohnrecht; zieht sie freiwillig aus, sieht Weidenkamp eine großzügige Abfindung vor. Steinhagen bat ihn, das bei Gelegenheit bei ihr anzusprechen."
        from: ch04/s02
      - text: "Steinhagen erzählte von einem Herrenhaus weiter im Süden, dessen alter Park für den Anbau weichen musste; das Haus läuft gut, aber seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Steinhagen meldet sich; er hat nichts zugesagt und nichts abgesagt. Eine dünne Mappe mit einer Kopie des Plans liegt auf Hedwigs Tisch im Salon, er hat sie unter den Laptop geschoben."
        from: ch04/s02
      - text: "Auf Maries Frage, was Steinhagen wollte, hat er nur gesagt: ein Interessent."
        from: ch04/s02
      - text: "Am Samstag Mitte Juli helfen Leute aus dem Dorf im Rosengarten; Hannes hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Lena hat ihn den ganzen Tag gesiezt, das Klemmbrett vor der Brust; um fünf fragte sie, ob er nächsten Samstag Zeit habe, und er hat Ja gesagt, bevor er nachdenken konnte."
        from: ch05/s03
      - text: "Die nummerierten Stellplätze des Lageplans reihen sich genau dort, wo er an der Südmauer gräbt."
        from: ch05/s02
      - text: "Laut Hannes ist er als Kind barfuß auf Hannes' Hänger über die Stoppeln mitgefahren, nach der Gerste, und Hedwig musste ihn mit Kuchen herunterlocken; er erinnert sich an Diesel und Stroh, Hannes' Gesicht hat er nicht behalten."
        from: ch05/s02
      - text: "In der Mitte der Südmauer, nahe der Pforte, wächst unter den Ranken ein alter Rosenstock; Marie sagt, es ist eine 'Ghislaine de Féligonde', die seit Jahren keiner mehr gesehen hat. Er hat nur aufgehört zu ziehen."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte bis zum Geräteschuppen frei; Hannes hat ihm die Hand gegeben, ihn Jonas genannt und Du zu ihm gesagt."
        from: ch05/s02
      - text: "Grete hat ihm auf seine Frage, ob er zu den Helfern zählt, zwei Bier gegeben und Quark für seinen Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "Er hat Marie am Steg von seinen Flößen erzählt: drei, das größte mit Zeichnung geplant, mitten auf dem See abgesoffen; Hedwig lachte am Ufer und sagte, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Er und Marie haben sich bei Sonnenuntergang am Steg geküsst; er hat gesagt, das wollte er seit dem Gewitter, und Marie sagte: Ich auch."
        from: ch05/s03
      - text: "Auf Maries Frage, ob er im Herbst noch hier ist, hat er geantwortet: Ich weiß es nicht."
        from: ch05/s03
    believes:
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Sein Plan geht auf: ein Käufer bis zum Herbst und die Einlage zum Jahresende."
        from: ch02/s02
      - text: "Das Haupthaus ist schlimmer dran als das Scheunendach."
        from: ch03/s03
      - text: "Steinhagen ist der Käufer, den er wollte: einer, der rechnen kann, in Flächen und Fristen denkt und sich nicht lange bitten lässt."
        from: ch03/s03
      - text: "Ob das, was zwischen ihm und Marie unter den Bögen angefangen hat, eine Last verträgt, weiß er nicht; die richtige Entscheidung fühlt sich an wie ein Riss im Fundament."
        from: ch03/s03
      - text: "Mit einem Parkplatz hat er seit dem Wort Stellplatzlösung gerechnet, mit der Zeile über Gretes Abfindung nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "'Ein Interessent' war nicht gelogen, aber so wenig, dass es kaum noch Gewicht hatte; warum er Marie nicht mehr gesagt hat, weiß er selbst nicht."
        from: ch04/s02
      - text: "Die jungen Triebe an der Südmauer haben dieselben kleinen, glänzenden Blätter wie die Rose an den Bögen, die er im Juni verschrotten wollte."
        from: ch05/s02
      - text: "Er hat das fremde, warme Gefühl, auf dem Gut mitgerechnet zu werden."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
    does_not_know:
      - "Dass hinter dem Laubengang unter den Brombeeren der letzte Stock der Lindenhof-Rose steht und Marie die Mauerecke dort freigeschnitten und mit einem leeren Schild markiert hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten, und was Hedwig ihr im letzten Herbst auf der Bank gesagt hat."
      - "Dass Grete Marie von Hedwigs Gartenbuch im Arbeitszimmer erzählt und es ihr gegeben hat."
      - "Dass Marie mit Lena über ihn gesprochen hat und Lena meint, Marie habe Gefühle für ihn."
      - "Dass Marie ihn vielleicht als Jungen oben auf der Gartenmauer gesehen hat."
  lena-hansen:
    knows:
      - text: "Laut Marie stand in Jonas' Tabelle beim Laubengang 'Entsorgung' für beide Rankbögen der 'Ghislaine', die zweiundfünfzig Jahre alt sind."
        from: ch02/s03
      - text: "Laut Marie kniete Jonas in heller Hose ins nasse Gras vor den Bogen, rüttelte am Eisen, stellte fehlendes Fundament fest und skizzierte eins auf die Rückseite seiner Tabelle: vierzig mal vierzig, achtzig tief wegen Frost."
        from: ch02/s03
      - text: "Laut Marie kam Jonas in geputzten Lederschuhen, seine Hose ist an beiden Knien grün und hin, und am ersten Tag ließ er sie samt Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Marie sagt, sie habe Jonas dazu gebracht, die Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Marie hat zehn Eier für den nächsten Morgen gekauft und zwei Stück Butterkuchen von ihr bekommen; sie sehen sich am Freitag wieder."
        from: ch02/s03
      - text: "Am Samstag Mitte Juli hat sie am Tor die Helfer abgehakt (drei Landfrauen mit Hacken, vier Mann von der Feuerwehr, die Nachbarn vom Dorfteich mit Schubkarren) und die Arbeit verteilt: Wege harken, Giersch an der Westmauer, Kies schaufeln."
        from: ch05/s01
      - text: "Marie hat ihren Rosen Namensschilder gemacht, damit keiner was rausreißt."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln; sie hat ihn gesiezt und eingetragen."
        from: ch05/s01
      - text: "Um fünf hat sie Jonas gefragt, ob er nächsten Samstag Zeit hat, und er hat Ja gesagt."
        from: ch05/s03
    believes:
      - text: "Marie hat Gefühle für Jonas; dass sie seit zwanzig Minuten über seine Schuhe redet, ist kein gutes oder ein sehr gutes Zeichen."
        from: ch02/s03
      - text: "Die Landfrauen stechen Giersch, seit Marie laufen kann; Namensschilder brauchen sie nicht."
        from: ch05/s01
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt und Ralf Steinhagen von Weidenkamp Hotels das Gut Mitte Juli besichtigt hat."
      - "Dass Weidenkamp auf dem Rosengarten einen Parkplatz plant."
      - "Dass Jonas den Hauptweg Ende Juni frei haben wollte."
      - "Dass Marie und Jonas seit dem Gewitter unter den Bögen Du zueinander sagen."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe aus Hamburg."
        from: ch01/s01
      - text: "Jonas will den Rosengarten bis zum Erntefest am 5. September hergerichtet haben: Wege begehbar, Beete sauber, alles, was man vom Haus aus sieht."
        from: ch01/s02
      - text: "Jonas will das Gut verkaufen."
        from: ch01/s02
      - text: "Absprache mit Jonas: freie Hand bei den Rosen, über die Wege wird noch geredet; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hinter dem Laubengang steht unter den Brombeeren ein Stock der Lindenhof-Rose, die Hedwig selbst gezogen hat."
        from: ch01/s03
      - text: "Grete hat ihr zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt; sie hat es jetzt."
        from: ch02/s01
      - text: "Laut Hedwigs Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Neue Absprache: Die Rankbögen bleiben und bekommen Punktfundamente, Jonas bestellt Beton, sie bindet die Rose selbst wieder an; dafür muss der Hauptweg Ende Juni frei sein, vom Tor bis zur Pforte, mit Fotos."
        from: ch02/s01
      - text: "Die Bögen sitzen fest im Beton; Jonas hat daran gerüttelt, nichts gab nach. Sie bindet die 'Ghislaine' wieder an, danach kommt der achte Bogen dran."
        from: ch03/s01
      - text: "Seit dem Gewitter unter den Bögen sagen sie und Jonas Du zueinander; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Hedwig hat ihr mit zehn den ersten Rosenschnitt beigebracht, über dem Auge, schräg, und ihr die alte Schere mit dem roten Griff geschenkt, die sie heute noch hat."
        from: ch03/s01
      - text: "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu ihr gesagt hat; sie trägt es seither mit sich und hat es niemandem erzählt."
        from: ch03/s01
      - text: "Der Hauptweg ist frei; Hannes hat den Garten gelobt (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker, um die Stubben an der Sonnenuhr zu ziehen, nach Norden zum Tor hin, weg von der 'Rosa Mundi'."
        from: ch03/s02
      - text: "Auf Hannes' Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas keine Zusage gegeben: es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Jonas hat ihr Kaffee mit Milch gebracht; dass sie Milch nimmt, hat er von Grete."
        from: ch03/s02
      - text: "Mitte Juli schaufelt sie mit Hannes Kies auf die Hauptachse."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht und mit Jonas auf der Terrasse gesessen; worüber sie sprachen, hat sie nicht gehört."
        from: ch04/s01
      - text: "Grete hat den beiden Kaffee ohne Kuchen gebracht, obwohl am Morgen Butterkuchenduft über dem Hof lag."
        from: ch04/s01
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund und sagte, der Garten werde auf den Fotos sehr schön; von welchen Fotos er sprach, weiß sie nicht."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; Jonas schwieg."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, sagte Jonas nur: ein Interessent."
        from: ch04/s02
      - text: "Für den Helfersamstag Mitte Juli hat sie an jeden Stock, der stehen bleiben muss, ein Pappschild mit der Sorte gehängt, vom Tor bis zur Pforte; die Mauerecke hinter dem Südende des Laubengangs hat sie im Dunkeln selbst freigeschnitten und nur mit einem leeren Schild an einem Pfahl markiert."
        from: ch05/s01
      - text: "Hannes hat Jonas an die Brombeeren an der Südmauer westlich der Pforte geschickt, fort von der Ecke am Laubengang."
        from: ch05/s01
      - text: "Hannes hat über den Garten gerufen, im Garten sei sie die Chefin."
        from: ch05/s01
      - text: "Ole von der Feuerwehr hat an der 'Maiden's Blush' einen langen Trieb abgeknickt; sie hat ihn mit Hedwigs Schere eine Handbreit tiefer abgeschnitten. Die Rose lebt, aber daran hätten im nächsten Juni Blüten gesessen."
        from: ch05/s01
      - text: "Jonas hat an der Südmauer nahe der Pforte einen alten Stock der 'Ghislaine de Féligonde' freigelegt, den seit Jahren keiner gesehen hat; sie hat die jungen Triebe lose mit Bast angebunden."
        from: ch05/s02
      - text: "Grete hat Jonas zwei Bier aus der Helferkiste gegeben und ihm Quark für den Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "Lena hat Jonas den ganzen Tag gesiezt und ihn um fünf gefragt, ob er nächsten Samstag Zeit hat; er hat Ja gesagt."
        from: ch05/s03
      - text: "Jonas hat als Junge am See Flöße gebaut, aus Brettern aus der Remise mit Wäscheleine; das größte soff mitten auf dem See ab, Hedwig lachte und sagte, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Sie und Jonas haben sich bei Sonnenuntergang am Steg geküsst; er sagte, das wollte er seit dem Gewitter, sie sagte: Ich auch."
        from: ch05/s03
      - text: "Mats hat die Bank im Garten gerichtet, die Latten neu verschraubt und das Holz glatt geschliffen."
        from: ch05/s03
      - text: "Auf ihre Frage, ob er im Herbst noch hier ist, hat Jonas gesagt: Ich weiß es nicht."
        from: ch05/s03
    believes:
      - text: "Splitt auf dem Hauptweg würde den alten Kies zerstören."
        from: ch01/s01
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Den Winkel hinter dem Laubengang sieht man von der Terrasse nicht, und in Jonas' Tabelle kommt er nicht vor."
        from: ch01/s03
      - text: "Für Giersch und den Stock unter den Brombeeren bleibt ihr kaum Zeit."
        from: ch02/s01
      - text: "Sie hat Jonas dazu gebracht, Hedwigs Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Jonas schuldet ihr ein Wort zu dem, was Hannes nicht zu hören bekam; sie hofft, dass das Erntefest auf dem Gut bleibt."
        from: ch03/s02
      - text: "Das hinter dem Haus ist keine Fläche, sondern ein Garten, angelegt in den Dreißigerjahren; die 'Rosa Mundi' ist älter als sie und Steinhagen zusammen und treibt jedes Frühjahr wieder aus."
        from: ch04/s01
      - text: "Von Jonas hätte ein Wort kommen müssen, das nach Nein klingt; sie wartet noch darauf, dass er mehr sagt als 'ein Interessent'."
        from: ch04/s02
      - text: "Lenas Ton gegenüber Jonas ist ihr Vertreterton aus dem Hofladen."
        from: ch05/s01
      - text: "Ihr Herzklopfen damals beim Gewitter kam nicht vom Wetter."
        from: ch05/s03
      - text: "Der dünne barfüßige Junge, den sie einmal oben auf der Gartenmauer gesehen hat, war vielleicht Jonas."
        from: ch05/s03
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor so still werden ließ."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Dass Jonas fest damit rechnet, bis zum Herbst einen Käufer zu haben."
      - "Wie schlimm es um Fenster und Dach des Gutshauses steht und was die Sanierung kostet."
      - "Dass am letzten Freitag im Juli ein Fotograf des Maklers den Garten fotografieren soll."
      - "Was Weidenkamp plant: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg."
      - "Dass Steinhagens Lageplan den Parkplatz genau auf den Rosengarten legt und nur ein paar Rosen in Kübeln bleiben sollen."
      - "Dass Weidenkamp Grete für einen freiwilligen Auszug eine Abfindung anbieten will."
      - "Dass eine Kopie des Lageplans im Salon unter Jonas' Laptop liegt."
      - "Dass Jonas am Donnerstag zur Abnahme des Parkdecks nach Hamburg muss und eine Einlage für die Partnerschaft fällig ist."
      - "Dass Jonas sie vom Hügel aus bei der Arbeit beobachtet hat, am Laubengang und am Rondell."
      - "Dass Jonas als Kind auf Hannes' Hänger mitgefahren ist und Hannes ihn nicht vergessen hat."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zahl der Zimmer im Gutshaus, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Jonas hat der Besichtigung am übernächsten Montag, Mitte Juli, zugestimmt."
        from: ch03/s03
      - text: "Die Namen von Marie Albers, Hannes Kröger und Grete Paulsen."
        from: ch04/s01
      - text: "Laut Marie ist der Garten in den Dreißigerjahren angelegt, mit diesen Wegen und dieser Mauer, und die 'Rosa Mundi' ist älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes Kröger fragt, wo das Erntefest hin soll, wenn das Gut ein Hotel wird."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht."
        from: ch04/s02
      - text: "Jonas hat die Unterlagen durchgesehen, nichts zugesagt und nichts abgesagt; er nannte die Abfindung großzügig und widersprach nicht."
        from: ch04/s02
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste von Weidenkamp heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, nah am Haus, kurze Wege, die Mauer gibt Sichtschutz gratis."
        from: ch04/s02
      - text: "Für das Erntefest findet sich eine Lösung: eine Veranstaltungsfläche gegen Gebühr, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Seinem Herrenhaus im Süden fehlt etwas, seit der alte Park für den Anbau weichen musste; was, könnte er nicht sagen."
        from: ch04/s02
    does_not_know:
      - "Dass Hedwig sich gewünscht hat, der Rosengarten möge zum Erntefest wieder blühen."
      - "Dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht."
      - "Ob Jonas an Weidenkamp verkauft."
      - "Dass Helfer aus dem Dorf den Rosengarten am Samstag Mitte Juli gemeinsam hergerichtet haben und Jonas mit angepackt hat."
      - "Dass an der Südmauer ein alter Stock der 'Ghislaine de Féligonde' freigelegt wurde."
      - "Dass Jonas und Marie sich am Steg geküsst haben."
