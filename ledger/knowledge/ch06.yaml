based_on: ["ch05#6fda5c", "ch06/s01#52ef43", "ch06/s02#762d59", "ch06/s03#6b1ec3"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch lag im Arbeitszimmer, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf der Treppe liegen lassen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Marie hat den Auftrag, den Garten bis zum Fest fertig zu machen, und sagt, Jonas wolle verkaufen."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag morgens Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Als Kind hat Marie jeden Dienstag und Freitag im Garten gearbeitet, eine Stunde Unkraut für ein Stück Streuselkuchen; sie selbst hat auf der Rückseite vom Kalender Buch geführt."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Mitte Juli kam ein Gast im silbernen Firmenwagen aufs Gut; er sprach sie als Frau Paulsen an und sagte, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat dem Gast und Jonas auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen, und ist ohne sich umzusehen ins Haus zurückgegangen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kamen Helfer aus dem Dorf zum Arbeitseinsatz in den Garten; sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt, damit diesmal keiner mit leerem Teller dastand."
        from: ch05/s01
      - text: "Sie hat im Lauf des Vormittags eine zweite Kanne Kaffee über die Terrasse getragen und gerufen, wer jetzt keinen Kuchen esse, kriege nachher den Rand."
        from: ch05/s01
      - text: "Jonas hat am Abend gefragt, ob er für die Helferkiste Bier zählt; sie hat ihm zwei Flaschen gegeben und die Kronkorken gleich mit abgemacht."
        from: ch05/s03
      - text: "Jonas hat einen Sonnenbrand im Nacken; sie hat ihm Quark angeboten."
        from: ch05/s03
      - text: "An einem Dienstag Ende Juli hat sie mittags einen Krug Buttermilch und ein Blech Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, lange von Marie zu Jonas und zurück gesehen und ist ohne ein Wort zum Haus zurückgegangen."
        from: ch06/s01
      - text: "Die 'New Dawn' schiebt schon wieder feste kleine Knospen."
        from: ch06/s01
      - text: "An einem Donnerstag spät am Abend hat Jonas im Arbeitszimmer im Dunkeln nach den Rechnungen fürs Dach gesucht; sie hat ihm das Gartenbuch auf dem Tisch gezeigt, das Marie dort gelassen hat, und gesagt, er könne ruhig mal reinsehen, Hedwig hätte das gewollt."
        from: ch06/s02
      - text: "Auf ihre Frage, ob er was gefunden habe, hat Jonas nur gesagt: \"Die Dachrechnungen.\""
        from: ch06/s02
      - text: "Jonas hat sich angeboten, am Montag Anfang August ihre Einkaufskiste im Hofladen der Hansens zu holen; sie hat ihm den Zettel geschrieben (zehn Eier, ein Glas Rosengelee, Kartoffeln und Rindfleisch für Mittwoch, doppelt unterstrichen: Nicht vergessen zu bezahlen)."
        from: ch06/s03
      - text: "Lena macht für sie montags den Hofladen auf, seit Jahren; sie fährt die Strecke seit Jahrzehnten (fünf Minuten mit dem Auto, mit dem Rad zwanzig)."
        from: ch06/s03
    believes:
      - text: "Hedwigs Wunsch im Testament gilt Marie, auch wenn ihr Name nicht drinsteht."
        from: ch01/s03
      - text: "Der Verkauf ist Jonas' Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Jonas gehört an diesem Tag zu den Helfern (sie gibt ihm Bier aus der Helferkiste)."
        from: ch05/s03
      - text: "Hedwig hätte gewollt, dass Jonas in ihr Gartenbuch sieht."
        from: ch06/s02
    does_not_know:
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie in Klein Lindau heimlich Stecklinge der Lindenhof-Rose zieht."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Welche Bedingungen Marie und Jonas auf der Terrasse ausgehandelt haben (freie Hand bei den Rosen, Budgetrahmen, Fotos alle zwei Wochen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' entsorgen wollte und sie nun mit Punktfundamenten stehen bleiben sollen."
      - "Dass Marie den Hauptweg bis Ende Juni freihalten muss."
      - "Dass der Makler Ende Juli Fotos vom Garten will."
      - "Dass Marie und Jonas sich seit dem Gewitter duzen."
      - "Was Steinhagen im Garten und im Salon gesagt hat (Fläche hinter dem Haus ein Pfund, Erntefest gegen Gebühr, Hotelplan)."
      - "Dass Weidenkamps Lageplan den Parkplatz auf den Rosengarten legt."
      - "Dass Weidenkamp ihr Wohnrecht bestehen lassen will und bei freiwilligem Auszug eine Abfindung vorsieht."
      - "Dass Jonas an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt hat."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
      - "Dass Jonas Lena für den nächsten Samstag zugesagt hat."
      - "Dass Jonas im Gartenbuch Hedwigs Notiz über seinen ersten Steckling der Lindenhof-Rose gelesen hat und sich wieder daran erinnert."
      - "Dass nächste Woche ein Gutachter zur Wertermittlung kommt."
      - "Dass der Erntefest-Ausschuss von Jonas bis Freitag, den 14., eine Zusage verlangt."
      - "Dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg wegen seiner Einlage sprechen wollen."
      - "Was Lena im Hofladen zu Jonas über Marie gesagt hat."
  hannes-kroeger:
    knows:
      - text: "Jonas Behrendt ist auf dem Gut; er hat ihm Kaffee gebracht und ihn mit Herr Kröger angeredet."
        from: ch03/s02
      - text: "Der Hauptweg ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Um die Sonnenuhr haben die alten Holunderstubben den Kies gehoben; an der Westseite sitzt ein Brombeerwurzelstock, dem Marie seit drei Tagen mit der Hacke kommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will, dass langsam gezogen wird, nach Norden zum Tor hin."
        from: ch03/s02
      - text: "Er hat Marie zugesagt, Sonnabend um halb acht den Trecker zu bringen."
        from: ch03/s02
      - text: "Er hat für Hedwig den Fliederbusch an der Remise mit derselben Kette rausgeholt."
        from: ch03/s02
      - text: "Auf seine Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas nicht zugesagt: Gutachten fürs Dach und für die Fenster, Kosten und Fristen hingen daran."
        from: ch03/s02
      - text: "Das Erntefest ist wie immer am ersten Samstag im September."
        from: ch03/s02
      - text: "Mitte Juli hat er mit dem Hänger Kies ans schmiedeeiserne Tor gebracht und Marie zugeschaufelt; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Der Besucher ist Ralf Steinhagen von Weidenkamp Hotels; er kennt seinen Namen."
        from: ch04/s01
      - text: "Steinhagen hat im Garten zu Jonas gesagt, die Fläche hinter dem Haus sei ein Pfund."
        from: ch04/s01
      - text: "Auf seine Frage nach dem Erntefest hat Steinhagen gesagt, man hätte eine Veranstaltungsfläche gegen Gebühr, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli war Arbeitseinsatz im Garten: Landfrauen, Feuerwehr, Nachbarn; er kam mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine, Timo mit dem zweiten Gespann voll Kies für die Seitenwege."
        from: ch05/s01
      - text: "Jonas kam in den geliehenen Gummistiefeln, eine Nummer zu groß, und wollte anfassen; er hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Als Ole an einem Rosenbusch zerrte, hat er gepfiffen und allen gesagt: Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "Jonas ist als Junge, der Lütte von Hedwig, bei ihm auf dem Hänger über die Stoppeln nach der Gerste mitgefahren, barfuß; Hedwig musste ihn mit Kuchen herunterlocken und hat geschimpft. Er hat den Jungen all die Jahre nicht vergessen."
        from: ch05/s02
      - text: "Jonas weiß von der Hängerfahrt noch den Diesel."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen frei; er hat die letzte Fuhre abgefahren."
        from: ch05/s02
      - text: "Er hat Jonas die Hand gegeben, \"Gut gemacht, Jonas\" gesagt und ihn dabei geduzt."
        from: ch05/s02
      - text: "Der Ausschuss fürs Erntefest hat am Sonntagabend gesessen: Bis Freitag, den vierzehnten, braucht er von Jonas eine Zusage, auf die man bauen kann; sonst wird im schon reservierten Zelt hinter dem Feuerwehrhaus gefeiert."
        from: ch06/s03
      - text: "Er hat Jonas das am Montag Anfang August am Hoftor der Hansens gesagt, als Jonas Gretes Kiste in den Kofferraum trug; Jonas hat ihm zugesagt: \"Bis dahin kriegst du eine Antwort.\""
        from: ch06/s03
    believes:
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Mit Maries Arbeit im Garten läuft es (\"Dat löppt\")."
        from: ch03/s02
      - text: "Mit dem Spaten kommen die Stubben nicht raus, nur mit Kette und Trecker."
        from: ch03/s02
      - text: "Kommt Weidenkamp aufs Gut, hat das Erntefest dort keinen Platz mehr wie bisher (\"Wo soll das dann hin?\")."
        from: ch04/s01
      - text: "Im Garten hat Marie das Sagen."
        from: ch05/s01
      - text: "Jonas hat an der Südmauer gute Arbeit gemacht; morgen tut ihm alles weh."
        from: ch05/s02
      - text: "Die Frist ist keine Drohung; die Leute wollen wissen, wo sie ihre Bänke hinstellen."
        from: ch06/s03
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Ob Jonas das Gut an Weidenkamp verkaufen will."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Weidenkamps Lageplan den Parkplatz auf den Rosengarten legt."
      - "Was Steinhagen und Jonas im Salon besprochen haben (Hotelplan, Abfindung für Grete)."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
      - "Dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg wegen seiner Einlage sprechen wollen, einen Tag vor der Frist des Ausschusses."
      - "Dass nächste Woche ein Gutachter zur Wertermittlung aufs Gut kommt."
  jonas-behrendt:
    knows:
      - text: "Die Frau im Garten heißt Marie Albers."
        from: ch01/s01
      - text: "Die Rose am Hauptweg ist eine 'New Dawn', kein Gestrüpp."
        from: ch01/s01
      - text: "Das Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Sieben Fenster im Erdgeschoss zur Gartenseite sind undicht, zwei Flügel verzogen; für das Dach fehlt noch ein Angebot."
        from: ch01/s02
      - text: "Marie hat den Auftrag angenommen: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Marie rechnet nach ihrem eigenen, nicht verhandelbaren Stundensatz ab."
        from: ch01/s02
      - text: "An den Rankbögen an der Ostmauer hängt seit zweiundfünfzig Jahren eine Rose."
        from: ch02/s01
      - text: "Abmachung mit Marie: Die Bögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief), er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg vom Tor bis zur Pforte bis Ende Juni freizumachen, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Donnerstag um neun Uhr ist die Abnahme des Parkdecks in Hamburg, dort wird er gebraucht."
        from: ch02/s02
      - text: "Seine Einlage für die Partnerschaft im Büro steht an."
        from: ch02/s02
      - text: "Es gibt einen Kaufinteressenten aus der Hotelbranche."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben, dann seien andere Zahlen drin; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Der Makler will am letzten Freitag im Juli einen Fotografen für Fotos vom Garten schicken."
        from: ch02/s02
      - text: "Der Hügel hinter der Scheune ist der einzige Platz am Gut mit Netz."
        from: ch02/s02
      - text: "Er erinnert sich an ein Floß am Gutssee und an Hedwig, die ihn zum Kuchen rief."
        from: ch02/s02
      - text: "Der Fuß des Rankbogens sitzt seit einer Woche fest im Beton; beim Rütteln gibt nichts nach."
        from: ch03/s01
      - text: "Marie und er sagen seit dem Gewitter unter dem Laubengang Du zueinander."
        from: ch03/s01
      - text: "Marie hat mit zehn im Garten ihren ersten Rosenschnitt gemacht; Hedwig hat ihr die Hand geführt (über dem Auge, schräg)."
        from: ch03/s01
      - text: "Als Kind hat Marie jeden Dienstag und Freitag bei Hedwig im Garten gearbeitet, eine Stunde Unkraut für ein Stück von Gretes Streuselkuchen; im ersten Sommer kam sie jeden Tag mit dem Rad."
        from: ch03/s01
      - text: "Marie hat Hedwigs alte Schere mit dem roten Griff und benutzt sie bis heute."
        from: ch03/s01
      - text: "Hedwig hat laut mit den Rosen geredet; Marie tut es auch."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch (von Grete)."
        from: ch03/s02
      - text: "Hannes Kröger hat gefragt, ob das Erntefest auf dem Gut bleibt; er hat es offengelassen."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker, um die Stubben an der Sonnenuhr zu ziehen."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; seine Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Steinhagen kennt die Zimmerzahl des Gutshauses, die Grundfläche der Scheune und das Baujahr."
        from: ch03/s03
      - text: "Weidenkamp denkt an Zimmer im Haupthaus, Spa und Seminarraum in Kuhstall und Scheune; eine Stellplatzlösung will Steinhagen vor Ort besprechen."
        from: ch03/s03
      - text: "Er hat Steinhagen eine Besichtigung am übernächsten Montag, Mitte Juli, zugesagt und eingetragen; eine Bestätigung soll noch heute kommen."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen und verrutschte Pfannen, in der Rinne fault Laub."
        from: ch03/s03
      - text: "Er hat nachgerechnet, was die Fundamente der Bögen tragen müssen; die zwei Bögen der 'Ghislaine' halten."
        from: ch03/s03
      - text: "Ralf Steinhagen von Weidenkamp Hotels war Mitte Juli zur Besichtigung auf dem Gut."
        from: ch04/s01
      - text: "Grete hat ihm und Steinhagen auf der Terrasse Kaffee ohne Kuchen hingestellt; in all seinen Kindersommern gab es bei ihr keine Tasse ohne Kuchen, bis heute Morgen."
        from: ch04/s02
      - text: "Im Garten hat Steinhagen die Fläche hinter dem Haus ein Pfund genannt; Marie hat geantwortet, das sei ein Garten aus den Dreißigerjahren, die 'Rosa Mundi' älter als sie beide zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest hat Steinhagen eine Veranstaltungsfläche gegen Gebühr angeboten; er selbst hat geschwiegen."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz unten am Steg."
        from: ch04/s02
      - text: "Er hat Grundrisse, Schnitte und eine Kostenschätzung nach Gewerken durchgesehen; Lasten und Fristen stimmen, zwei Balken sind eingeplant, die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Im Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit einer Zufahrt durch das Tor; Steinhagen begründet es mit ebenem Grund, kurzen Wegen und der Mauer als Sichtschutz."
        from: ch04/s02
      - text: "Ein paar Rosen will Weidenkamp als Akzent in Kübeln behalten."
        from: ch04/s02
      - text: "Grete hat ein lebenslanges Wohnrecht, das bestehen bleiben soll; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor, und Steinhagen bittet ihn, das bei Gelegenheit anzusprechen."
        from: ch04/s02
      - text: "Steinhagen hat erzählt, bei einem Herrenhaus weiter im Süden habe für den Anbau ein alter Park weichen müssen; das Haus laufe gut, aber seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Steinhagen lässt ihm Zeit und meldet sich; er hat weder zu- noch abgesagt."
        from: ch04/s02
      - text: "In der dünnen Mappe auf Hedwigs Tisch steckt eine Kopie des Lageplans; er hat sie unter den Laptop geschoben, bis keine Ecke mehr hervorsah."
        from: ch04/s02
      - text: "Auf Maries Frage, was Steinhagen wollte, hat er nur gesagt: \"Ein Interessent.\""
        from: ch04/s02
      - text: "Beim Arbeitseinsatz am Samstag Mitte Juli hat Lena ihn eingetragen und ihn den ganzen Tag gesiezt, das Klemmbrett vor der Brust."
        from: ch05/s01
      - text: "Hannes hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt; zwanzig Meter Mauer, davor ein schulterhoher Wall aus Ranken."
        from: ch05/s01
      - text: "Der Laptop liegt auf Hedwigs Tisch, darunter der Lageplan; dessen nummerierte Parkplatz-Kästchen reihen sich genau dort, wo er gräbt."
        from: ch05/s02
      - text: "Im Salon liegt der Laptop auf dem ovalen Tisch, darunter der Lageplan mit seinen nummerierten Kästchen über dem ganzen Garten."
        from: ch06/s02
      - text: "Laut Hannes ist er als Junge bei ihm auf dem Hänger über die Stoppeln nach der Gerste mitgefahren, barfuß; Hedwig musste ihn mit Kuchen herunterlocken und hat geschimpft."
        from: ch05/s02
      - text: "Von der Hängerfahrt ist ihm der Geruch zurückgekommen, Diesel und staubendes Stroh; Hannes' Gesicht hat er nicht behalten, Hannes ihn aber nicht vergessen."
        from: ch05/s02
      - text: "In der Mitte der Südmauer, nahe der Pforte, wachsen unter den Ranken Triebe mit den kleinen glänzenden Blättern der Rose von den Bögen im Laubengang; er hat aufgehört zu ziehen."
        from: ch05/s02
      - text: "Laut Marie ist es eine 'Ghislaine de Féligonde' mit altem, handgelenkdickem Stamm, die seit Jahren keiner mehr gesehen hat; Marie hat die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte bis zum alten Geräteschuppen frei."
        from: ch05/s02
      - text: "Hannes hat ihm die Hand gegeben, ihn Jonas genannt und geduzt: \"Gut gemacht, Jonas.\""
        from: ch05/s02
      - text: "Grete hat ihm zwei Bier aus der Helferkiste gegeben, die Kronkorken gleich abgemacht, und ihm Quark gegen den Sonnenbrand angeboten."
        from: ch05/s03
      - text: "Er hat Marie von seinen drei Flößen aus Remisenbrettern und Gretes Wäscheleine erzählt; das letzte, eine Woche mit Zeichnung geplant, ist mitten im See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Er und Marie haben sich bei Sonnenuntergang auf dem Steg geküsst; er hat gesagt, das wollte er seit dem Gewitter, und Marie: \"Ich auch.\""
        from: ch05/s03
      - text: "Marie hat ihn gefragt, ob er im Herbst noch hier ist; er hat geantwortet: \"Ich weiß es nicht.\""
        from: ch05/s03
      - text: "Ende Juli schneidet Marie die Gallica und die Damaszener am Tor zurück; sie blühen nur einmal im Jahr. Die Büsche am Rondell bleiben, wie sie sind, und setzen Hagebutten an, im September rot wie kleine Laternen."
        from: ch06/s01
      - text: "Laut Marie kommt das Junibild nicht wieder; Glanz im September heißt: Die 'New Dawn' blüht nach, davor Lavendel und Katzenminze, Frauenmantel an den Kanten, Astern, am Laubengang Dahlien in Reihen."
        from: ch06/s01
      - text: "Grete hat mittags Buttermilch und Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, ihn und Marie lange angesehen und ist ohne ein Wort gegangen, jede Stufe einzeln."
        from: ch06/s01
      - text: "Marie sagt über Grete: \"Das meldet sich nur bei Regen. Sagt sie.\" Heute sei Grete bloß müde vom Backen."
        from: ch06/s01
      - text: "Lena hat ihn für Samstag schon eingetragen, mit zwei Uhrzeiten, Ankunft und Abfahrt."
        from: ch06/s01
      - text: "Auf seine Nachricht \"Kommst du morgen wieder?\" hat Marie geantwortet: \"Die Rosen fragen das nicht. Die wissen das.\""
        from: ch06/s01
      - text: "Der Gutachter kommt nächste Woche zur Wertermittlung und will jede Rechnung in der Hand haben, am liebsten mit Datum und Firmenstempel; er braucht die Rechnungen für Dach und Fenster."
        from: ch06/s02
      - text: "Die Fensterflügel im Arbeitszimmer bleiben nach einer Handbreit stecken."
        from: ch06/s02
      - text: "Er hat die Dachrechnung gefunden: Umdeckung Nordseite, mit Stempel."
        from: ch06/s02
      - text: "Laut Grete hat Marie das Gartenbuch im Arbeitszimmer gelassen; Grete meint, er könne ruhig reinsehen, Hedwig hätte das gewollt."
        from: ch06/s02
      - text: "Im Gartenbuch stehen in Hedwigs Handschrift schraffierte Beete, jeder Kreis mit Namen und Bemerkung ('Rosa Mundi', Läuse, Brennnesseljauche); die 'Ghislaine' hat ein Ausrufezeichen."
        from: ch06/s02
      - text: "Unter der Überschrift Lindenhof-Rose steht mit einem Datum aus einem Juli vor sechsundzwanzig Jahren: \"Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen.\""
        from: ch06/s02
      - text: "Er erinnert sich wieder: Er hat mit Hedwig, ihre Hand über seiner, den Steckling aus einem Erdbeer-Joghurtbecher gepflanzt (\"Nicht drücken\", \"Größer als du, wenn du ihr Zeit lässt\"), ist danach jeden Morgen barfuß mit dem Lineal hingelaufen und am fünften Tag bei dreieinhalb brüllend zur Küche gerannt."
        from: ch06/s02
      - text: "Wo genau im Garten er das Loch gegraben hat, weiß er nicht mehr."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet; zu Weihnachten ein Anruf, zehn Minuten, dann bis zum nächsten Dezember nichts."
        from: ch06/s02
      - text: "Grete hat er auf ihre Frage nur gesagt, er habe die Dachrechnungen gefunden; von der Notiz hat er weder ihr noch Marie erzählt."
        from: ch06/s02
      - text: "Gretes Einkaufszettel: zehn Eier, ein Glas Rosengelee, Kartoffeln und Rindfleisch für Mittwoch, doppelt unterstrichen: Nicht vergessen zu bezahlen."
        from: ch06/s03
      - text: "Lena macht für Grete montags den Hofladen auf, seit Jahren, und packt die Kiste, ohne auf den Zettel zu sehen."
        from: ch06/s03
      - text: "Auf der Helferliste für den Rosengarten am schwarzen Brett im Hofladen steht sein Name, mit Ankunft und Abfahrt in Lenas runder Schrift; welcher Samstag, hat er nicht nachgelesen."
        from: ch06/s03
      - text: "Laut Frieda hat Tante Rosen ihr eine Dahlie geschenkt, die im Glas steht."
        from: ch06/s03
      - text: "Lena hat ihn gewarnt: \"Marie ist keine, mit der man einen Sommer spielt, Herr Behrendt, und wenn Sie es doch tun, nehm ich Ihnen das übel, und das ganze Dorf mit mir.\" Auf seine Frage, ob Marie ihr etwas gesagt habe: \"Das müssen Sie Marie schon selbst fragen.\""
        from: ch06/s03
      - text: "Laut Hannes hat der Ausschuss gestern Abend gesessen und braucht bis Freitag, den vierzehnten, eine Zusage, auf die man bauen kann; sonst wird im schon reservierten Zelt hinter dem Feuerwehrhaus gefeiert. Er hat Hannes bis dahin eine Antwort versprochen."
        from: ch06/s03
      - text: "Die Partner wollen in Hamburg persönlich über seine Einlage sprechen, am Donnerstag, dem dreizehnten, um neun; er hat beide Termine auf einen Briefumschlag geschrieben, ohne zuzusagen."
        from: ch06/s03
    believes:
      - text: "Marie ist die Gärtnerin."
        from: ch01/s01
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Marie kennt den Garten; eine Firma aus der Kreisstadt wäre zu langsam."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Bis zum Herbst gibt es einen Käufer, und die Einlage leistet er zum Jahresende."
        from: ch02/s02
      - text: "Das Haupthaus ist in schlimmerem Zustand als das Scheunendach, dessen Kosten er ungefähr kennt."
        from: ch03/s03
      - text: "Steinhagen ist der Käufer, den er seit dem Brief vom Nachlassgericht wollte: einer, der rechnen kann und sich nicht lange bitten lässt."
        from: ch03/s03
      - text: "Die Zusage zur Besichtigung ist eine richtige Entscheidung, auch wenn sie sich wie ein Riss im Fundament anfühlt."
        from: ch03/s03
      - text: "Mit einem Parkplatz auf dem Gelände hat er seit dem Wort Stellplatzlösung gerechnet, mit der Zeile über Gretes Abfindung nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "Er wird auf dem Gut mitgerechnet, gehört an diesem Ort dazu – ein fremdes, warmes Gefühl."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Eines der nummerierten Parkplatz-Kästchen im Lageplan liegt über dem Loch, das er für den Steckling gegraben hat; welches, rechnet er nicht aus."
        from: ch06/s02
      - text: "In Hedwigs letzten Jahren war er zweimal hier, vielleicht dreimal."
        from: ch06/s02
      - text: "Die Notiz im Gartenbuch ist vielleicht das Einzige hier, das ihm allein gehört; ob er sich schämt, weiß er nicht."
        from: ch06/s02
      - text: "Zwei Fristen in derselben Woche (Donnerstag, der 13., in Hamburg, Freitag, der 14., für den Ausschuss) – welche er halten wird, weiß er nicht."
        from: ch06/s03
    does_not_know:
      - "Dass hinter dem Laubengang in der Mauerecke der letzte alte Stock der Lindenhof-Rose steht."
      - "Dass Marie die Mauerecke hinter dem Südende des Laubengangs nachts selbst freigeschnitten und mit einem leeren Schild markiert hat."
      - "Dass Marie in Klein Lindau heimlich Stecklinge der Lindenhof-Rose zieht."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Was Hedwig im letzten Herbst auf der Bank zu Marie gesagt hat."
      - "Was Marie bei Lena im Hofladen über ihn erzählt hat."
      - "Dass Marie in ihm vielleicht den dünnen Jungen von damals auf der Gartenmauer erkennt."
      - "Ob Marie die Notiz über seinen ersten Steckling im Gartenbuch gelesen hat."
  lena-hansen:
    knows:
      - text: "Marie arbeitet am Laubengang im Garten von Hedwig."
        from: ch02/s03
      - text: "Der Mann, über den Marie spricht (Jonas), hatte in seiner Tabelle mit Budget und Meilensteinen die Entsorgung beider Rankbögen der 'Ghislaine' vorgesehen."
        from: ch02/s03
      - text: "Er hat am Bogen ein fehlendes Fundament festgestellt und eins skizziert, 40 × 40, 80 tief wegen Frost; dabei hat er sich die helle Hose an beiden Knien grün gemacht."
        from: ch02/s03
      - text: "Am ersten Tag ließ er Schuhe und Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Am Samstag Mitte Juli hat sie am Tor die Helfer für den Garten abgehakt und eingeteilt: drei Landfrauen mit Hacken, vier Mann von der Feuerwehr, die Nachbarn vom Dorfteich mit Schubkarren; Hannes und Timo kamen mit Trecker und Kies."
        from: ch05/s01
      - text: "Marie hat an jedem Stock, der stehen bleiben muss, ein Namensschild aufgehängt, damit keiner was rausreißt."
        from: ch05/s01
      - text: "Jonas kam zum Arbeitseinsatz; sie hat ihn eingetragen und gesiezt."
        from: ch05/s01
      - text: "Um fünf hat sie Jonas gefragt, ob er nächsten Samstag Zeit hat; er hat Ja gesagt."
        from: ch05/s03
      - text: "Auf ihrer Helferliste für den Rosengarten am schwarzen Brett im Hofladen steht Jonas mit Ankunft und Abfahrt."
        from: ch06/s03
      - text: "Für Grete macht sie montags den Hofladen auf, seit Jahren; am Montag Anfang August hat Jonas Gretes Kiste abgeholt, die sie ohne Blick auf den Zettel gepackt hat."
        from: ch06/s03
      - text: "Frieda hat von Marie eine Dahlie geschenkt bekommen; sie steht im Glas."
        from: ch06/s03
      - text: "Sie hat Jonas beim Kaffee gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie und das ganze Dorf ihm das übel; auf seine Frage, ob Marie ihr etwas gesagt habe, hat sie ihn an Marie verwiesen."
        from: ch06/s03
    believes:
      - text: "Marie hat Gefühle für Jonas."
        from: ch02/s03
      - text: "Die Bögen werden nicht verschrottet, weil Marie ihn dazu gebracht hat (nach Maries Erzählung)."
        from: ch02/s03
      - text: "Maries Namensschilder sind unnötig: Die Landfrauen stechen Giersch, seit Marie laufen kann."
        from: ch05/s01
      - text: "Marie ist keine, mit der man einen Sommer spielt; spielt Jonas doch mit ihr, steht das Dorf hinter ihr."
        from: ch06/s03
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Jonas das Gut verkaufen will."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie in Klein Lindau heimlich Stecklinge der Lindenhof-Rose zieht."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt."
      - "Dass Marie und Jonas sich seit dem Gewitter duzen."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels das Gut Mitte Juli besichtigt hat."
      - "Dass Weidenkamps Lageplan den Parkplatz auf den Rosengarten legt."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
      - "Dass Jonas Hannes bis Freitag, den 14., eine Antwort zum Erntefest zugesagt hat."
      - "Dass die Partner Jonas am Donnerstag, dem 13., in Hamburg sprechen wollen."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe."
        from: ch01/s01
      - text: "Auftrag von Jonas: den Rosengarten bis zum Erntefest am 5. September herrichten, Wege begehbar, Beete sauber."
        from: ch01/s02
      - text: "Jonas will das Gut verkaufen; ein gepflegtes Gut soll einen besseren Preis bringen."
        from: ch01/s02
      - text: "Abmachung: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Arbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hinter dem Laubengang unter den Brombeeren steht ein Stock der Lindenhof-Rose mit einer Knospe."
        from: ch01/s03
      - text: "Sie hat Hedwigs Gartenbuch; Grete hat es ihr zwei Tage nach dem Auftrag aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Laut Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas' Tabelle: Hauptweg frei bis Ende Juni; beim Laubengang Entsorgung, Ersatz verzinkt; er hatte schon ein Angebot."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Die Bögen haben Punktfundamente bekommen; sie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Dafür musste sie den Hauptweg vom Tor bis zur Pforte bis Ende Juni freimachen, kein Tag später."
        from: ch02/s01
      - text: "Lena meint, dass Marie seit zwanzig Minuten über Jonas' Schuhe redet, sei kein gutes Zeichen – oder ein sehr gutes."
        from: ch02/s03
      - text: "Frieda nennt sie Tante Rosen und hat gefragt, ob sie verliebt ist."
        from: ch02/s03
      - text: "Der Bogenfuß sitzt seit einer Woche fest im Beton; Jonas hat gerüttelt, nichts gab nach (\"Wie eine Eins\")."
        from: ch03/s01
      - text: "Jonas trägt seit ein paar Tagen grüne Gummistiefel aus der Remise, eine Nummer zu groß."
        from: ch03/s01
      - text: "Seit dem Gewitter unter dem Laubengang sagen Jonas und sie Du zueinander; wer angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Sie hat Jonas von ihrer Kindheit im Garten erzählt: erster Rosenschnitt mit zehn, Hedwigs Schere mit dem roten Griff, Hedwig, die mit den Rosen redete."
        from: ch03/s01
      - text: "Jonas weiß, dass sie mit den Rosen spricht."
        from: ch03/s01
      - text: "Sie trägt mit sich, was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu ihr gesagt hat (der Wortlaut bleibt im Text offen)."
        from: ch03/s01
      - text: "Sie will nicht von Jonas' Seite gehen."
        from: ch03/s01
      - text: "Hannes findet, im Garten läuft es (\"Dat löppt, Deern\") – von ihm so gut wie ein Orden."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker; die Stubben an der Sonnenuhr werden mit der Kette langsam nach Norden zum Tor hin gezogen, weg von der 'Rosa Mundi'."
        from: ch03/s02
      - text: "Jonas hat ihr Kaffee mit Milch gebracht; Grete hat ihm gesagt, dass sie Milch nimmt."
        from: ch03/s02
      - text: "Auf Hannes' Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas nicht zugesagt: Gutachten für Dach und Fenster, Kosten und Fristen hingen daran."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Mitte Juli schüttet sie mit Hannes neuen Kies auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war auf dem Gut; er hat mit Jonas auf der Terrasse gesessen und ist mit ihm in den Salon gegangen, um Unterlagen durchzugehen."
        from: ch04/s01
      - text: "Steinhagen hat die Fläche hinter dem Haus ein Pfund genannt und zu ihr gesagt, das werde auf den Fotos sehr schön; von welchen Fotos er sprach, weiß sie nicht."
        from: ch04/s01
      - text: "Sie hat Steinhagen widersprochen: Das sei keine Fläche, sondern ein Garten aus den Dreißigerjahren, die 'Rosa Mundi' älter als sie beide zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest hat Steinhagen eine Veranstaltungsfläche gegen Gebühr angeboten; Jonas hat geschwiegen."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, hat Jonas gesagt: \"Ein Interessent.\""
        from: ch04/s02
      - text: "Vor dem Arbeitseinsatz am Samstag Mitte Juli hat sie ab vier Uhr früh Pappschilder geschrieben und an jeden Stock gehängt, der stehen bleiben muss, vom Tor bis zur Pforte."
        from: ch05/s01
      - text: "Nur die Mauerecke hinter dem Südende des Laubengangs trägt keinen Namen; dort hat sie im Dunkeln selbst die Brombeeren zurückgeschnitten und einen Pfahl mit leerem Schild davorgesetzt."
        from: ch05/s01
      - text: "Hannes hat Jonas an die Brombeeren an der Südmauer westlich der Pforte geschickt, fort von der Ecke am Laubengang."
        from: ch05/s01
      - text: "Ole von der Feuerwehr hat an der 'Maiden's Blush' einen langen Trieb abgeknickt; sie hat ihn mit Hedwigs Schere eine Handbreit tiefer abgeschnitten. Die Rose lebt, aber ihr fehlt ein Arm."
        from: ch05/s01
      - text: "Hannes hat über den Garten gerufen: Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "Bis gegen elf waren die neuen Kieswege bis an die Mauer geharkt; Landfrauen, Feuerwehr und Nachbarn haben mitgearbeitet, wo sie seit Juni allein gekniet hat."
        from: ch05/s01
      - text: "An der Südmauer, nahe der Pforte, hat Jonas eine alte 'Ghislaine de Féligonde' freigelegt, die seit Jahren keiner gesehen hat; sie hat die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Jonas hat zerkratzte Unterarme und Sonnenbrand im Nacken; Grete hat ihm Quark angeboten."
        from: ch05/s03
      - text: "Lena hat Jonas den ganzen Tag gesiezt und ihn um fünf für nächsten Samstag gefragt; er hat Ja gesagt."
        from: ch05/s03
      - text: "Jonas hat als Junge am See drei Flöße gebaut, aus Remisenbrettern und Gretes Wäscheleine; das letzte ist mitten im See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer; seitdem rechnet er alles zweimal."
        from: ch05/s03
      - text: "Sie und Jonas haben sich bei Sonnenuntergang auf dem Steg geküsst; Jonas wollte das seit dem Gewitter, sie auch."
        from: ch05/s03
      - text: "Auf ihre Frage, ob er im Herbst noch hier ist, hat Jonas gesagt: \"Ich weiß es nicht.\""
        from: ch05/s03
      - text: "Ende Juli schneidet sie die verblühten Gallica und Damaszener zurück; die Büsche am Rondell lässt sie Hagebutten ansetzen. Zum Fest plant sie Nachblüte der 'New Dawn', Lavendel, Katzenminze, Frauenmantel, Astern und Dahlien am Laubengang; das Junibild kommt nicht wieder."
        from: ch06/s01
      - text: "Seit dem Steg lässt sie Jonas mit dem Zollstock messen, statt ihm das Ding aus der Hand zu nehmen."
        from: ch06/s01
      - text: "Grete hat mittags Buttermilch und Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, lange von ihr zu Jonas und zurück gesehen und ist ohne ein Wort gegangen, jede Stufe einzeln."
        from: ch06/s01
      - text: "Laut Jonas hat Lena ihn für Samstag schon eingetragen, mit Ankunft und Abfahrt."
        from: ch06/s01
      - text: "In der Mauerecke am Südende des Laubengangs steht der alte Stock der Lindenhof-Rose, kniehoch und krumm, frei von Brombeeren; dicht über der Erde schieben sich zwei neue rötliche Triebe, kaum fingerlang."
        from: ch06/s01
      - text: "Im Hinterhof der alten Schmiede in Klein Lindau stehen hinten im Schatten drei Töpfe mit Stecklingen der Lindenhof-Rose unter Folie: zwei grün, an einem dehnt sich ein Auge; der dritte war schwarz, sie hat ihn auf den Kompost gelegt."
        from: ch06/s01
      - text: "Von den Stecklingen weiß niemand außer ihr: nicht Lena, nicht Grete, Jonas erst recht nicht."
        from: ch06/s01
      - text: "Aus Haus und Garten des Guts kommt keine Nachricht durch."
        from: ch06/s01
      - text: "Jonas hat ihr abends geschrieben \"Kommst du morgen wieder?\"; sie hat geantwortet, die Rosen fragten das nicht, die wüssten das, und er: \"Ich bin nicht so klug wie deine Rosen.\""
        from: ch06/s01
    believes:
      - text: "Splitt würde den alten Kies des Hauptwegs zerstören."
        from: ch01/s01
      - text: "Jonas will das Gut verkaufsfertig machen."
        from: ch01/s03
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Jonas kennt den Winkel hinter dem Laubengang nicht; er kommt in seiner Tabelle nicht vor."
        from: ch01/s03
      - text: "Jonas hat Hannes beim Erntefest etwas nicht gesagt, das er ihr erklären müsste."
        from: ch03/s02
      - text: "Grete hat Steinhagen mit Absicht keinen Kuchen hingestellt."
        from: ch04/s01
      - text: "Jonas hätte Steinhagen etwas entgegnen müssen, das nach Nein klang."
        from: ch04/s01
      - text: "Nach \"Ein Interessent\" müsste von Jonas noch etwas kommen."
        from: ch04/s02
      - text: "Lenas Ton gegenüber Jonas ist ihr Vertreterton aus dem Hofladen; so hat sie auch Mats gekriegt."
        from: ch05/s01
      - text: "Ihr Herzklopfen neben Jonas kam nicht vom Gewitter (heute war der Himmel klar)."
        from: ch05/s03
      - text: "Jonas war vielleicht der dünne, barfüßige Junge, den sie einmal oben auf der Gartenmauer sah."
        from: ch05/s03
      - text: "Grete ist heute bloß müde vom Backen; das, was sie plagt, meldet sich laut Grete nur bei Regen."
        from: ch06/s01
      - text: "Lena misstraut jedem ohne Klemmbrett."
        from: ch06/s01
      - text: "Jonas schreibt ihr vom Hügel hinter der Scheune, unter der Eiche, weil nur dort Netz ist."
        from: ch06/s01
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor gesehen hat."
      - "Wie hoch Hedwigs Geldvermächtnis für die Gartenarbeit ist."
      - "Dass Jonas mit einem Käufer bis zum Herbst rechnet."
      - "Dass der Makler am letzten Freitag im Juli Fotos vom Garten machen lassen will."
      - "Dass Jonas am Donnerstag zur Abnahme eines Parkdecks nach Hamburg musste und eine Einlage für die Partnerschaft im Büro ansteht."
      - "Dass Jonas sie vom Hügel hinter der Scheune bei der Arbeit beobachtet hat."
      - "Was Jonas und Steinhagen auf der Terrasse und im Salon besprochen haben."
      - "Dass Weidenkamp rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune und ein Saunahaus am Steg plant."
      - "Dass Weidenkamps Lageplan den Parkplatz auf den Rosengarten legt und nur ein paar Rosen in Kübeln bleiben sollen."
      - "Dass Weidenkamp für Gretes freiwilligen Auszug eine Abfindung vorsieht."
      - "Dass Jonas eine Mappe mit einer Kopie des Lageplans unter seinem Laptop liegen hat."
      - "Dass Hannes sich an Jonas als Jungen auf seinem Hänger erinnert."
      - "Dass Jonas im Gartenbuch Hedwigs Notiz über seinen ersten Steckling der Lindenhof-Rose gelesen hat und sich wieder daran erinnert, ihn mit Hedwig gepflanzt zu haben."
      - "Dass nächste Woche ein Gutachter zur Wertermittlung kommt."
      - "Dass Lena Jonas im Hofladen gewarnt hat, mit ihr keinen Sommer zu spielen."
      - "Dass der Erntefest-Ausschuss von Jonas bis Freitag, den 14., eine Zusage verlangt und sonst im Zelt hinter dem Feuerwehrhaus feiert."
      - "Dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg wegen seiner Einlage sprechen wollen."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendt ist der Eigentümer des Guts; seine Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Jonas hat einer Besichtigung am übernächsten Montag, Mitte Juli, zugestimmt."
        from: ch03/s03
      - text: "Marie Albers, Hannes Kröger und Grete Paulsen kennt er seit seinem Besuch Mitte Juli mit Namen."
        from: ch04/s01
      - text: "Laut Marie ist der Garten in den Dreißigerjahren angelegt, mit diesen Wegen und dieser Mauer; die 'Rosa Mundi' sei älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes Kröger fragt, wo das Erntefest hin soll, wenn Weidenkamp kommt."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht."
        from: ch04/s02
      - text: "Jonas hat zu seinem Plan weder zu- noch abgesagt; die Unterlagen hat er ihm dagelassen."
        from: ch04/s02
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste von Weidenkamp heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, kurze Wege für die Gäste, die Mauer als Sichtschutz – der richtige Platz für den Parkplatz."
        from: ch04/s02
      - text: "Ein paar Rosen in Kübeln reichen als Akzent."
        from: ch04/s02
      - text: "Für das Erntefest findet sich eine Lösung: eine Veranstaltungsfläche gegen Gebühr zu fairen Konditionen für Vereine."
        from: ch04/s01
      - text: "Seinem Herrenhaus im Süden fehlt etwas, seit der alte Park für den Anbau weichen musste; was, könnte er nicht sagen."
        from: ch04/s02
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie Stecklinge der Lindenhof-Rose zieht."
      - "Dass Grete ihm den Kuchen vorenthalten hat."
      - "Dass das Dorf am Samstag Mitte Juli beim Arbeitseinsatz im Garten geholfen hat und Jonas mitgearbeitet hat."
      - "Dass an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt wurde."
      - "Dass Marie und Jonas sich geküsst haben."
