based_on: ["ch06#ab383e", "ch07/s01#0a3d63", "ch07/s02#3f30b8"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch liegt im Arbeitszimmer auf dem Schreibtisch unterm Fenster, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf die Treppe gelegt."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Als Marie Kind war, gab es bei ihr jeden Dienstag und Freitag für eine Stunde Unkraut ein Stück Streuselkuchen; sie hat auf der Rückseite vom Kalender Buch geführt."
        from: ch03/s01
      - text: "Marie nimmt Milch in den Kaffee; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Sie hat Jonas das Mittagessen ohne ein Wort hingestellt."
        from: ch03/s03
      - text: "Mitte Juli ist ein Besucher im silbernen Firmenwagen gekommen, Ralf Steinhagen; er hat sie mit Namen begrüßt und gesagt, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Jonas und Steinhagen auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt und keinen Kuchen dazugestellt, obwohl sie am Morgen Butterkuchen gebacken hat."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli arbeiten Helfer aus dem Dorf im Garten; sie hat drei Bleche Butterkuchen auf die Terrasse gestellt, damit diesmal keiner mit leerem Teller dasteht, und eine zweite Kanne Kaffee gebracht."
        from: ch05/s01
      - text: "Jonas hat beim Helfersamstag mitgearbeitet; abends hat er gefragt, ob er als Helfer zählt, und sie hat ihm zwei Flaschen Bier aus der Helferkiste gegeben, die Kronkorken gleich abgemacht."
        from: ch05/s03
      - text: "Jonas hat einen Sonnenbrand; sie hat ihm Quark angeboten."
        from: ch05/s03
      - text: "Ende Juli hat sie Marie und Jonas mittags Buttermilch und Johannisbeerkuchen auf die Bank unter der 'New Dawn' gebracht und lange von Marie zu Jonas und zurück gesehen."
        from: ch06/s01
      - text: "Marie hat das Gartenbuch im Arbeitszimmer gelassen; es liegt neben der Lampe auf dem Schreibtisch."
        from: ch06/s02
      - text: "Jonas sucht an einem Donnerstagabend im Arbeitszimmer die Rechnungen fürs Dach und für die Fenster; die fürs Dach hat er gefunden, nach den Fenstern sucht er am nächsten Tag weiter."
        from: ch06/s02
      - text: "Sie hat Jonas gesagt, er könne ruhig ins Gartenbuch sehen, Hedwig hätte das gewollt."
        from: ch06/s02
      - text: "Jonas hat sich angeboten, am Montag Anfang August ihre Kiste im Hofladen der Hansens zu holen; sie hat ihm einen Zettel geschrieben (zehn Eier, ein Glas Rosengelee, Kartoffeln, Rindfleisch für Mittwoch) mit der doppelt unterstrichenen Zeile: Nicht vergessen zu bezahlen."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet, ob der wiedergekommen ist."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, hat sie Jonas Bratkartoffeln mit Spiegelei hingestellt und ihn nach dem Herrn mit dem silbernen Auto gefragt; Jonas hat gesagt: \"Hier war er nicht.\" und: \"Ich hatte Termine in der Stadt. Nichts Besonderes.\""
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank gebracht, Maries mit Milch."
        from: ch07/s02
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat und er wieder eine Knospe trägt."
      - "Dass Marie in Klein Lindau Stecklinge der Lindenhof-Rose zieht."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Die Einzelheiten der Absprache zwischen Jonas und Marie (Budget, Zwischenstände mit Fotos, freie Hand bei den Rosen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' erst entsorgen wollte und ihnen nun Punktfundamente gibt."
      - "Dass Jonas den Hauptweg Ende Juni frei haben will, vom Tor bis zur Pforte."
      - "Dass der Makler Ende Juli einen Fotografen schicken wollte."
      - "Was Weidenkamp plant: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg, den Parkplatz auf dem Rosengarten."
      - "Dass Weidenkamp ihr bei freiwilligem Auszug eine großzügige Abfindung vorsieht und Steinhagen Jonas gebeten hat, das bei ihr anzusprechen."
      - "Dass der Gutachter die Rechnungen für eine Wertermittlung braucht."
      - "Dass Jonas im Gartenbuch Hedwigs Notiz zum ersten Steckling der Lindenhof-Rose gelesen hat, bei dem er als Junge geholfen hat."
      - "Dass Marie und Jonas sich seit dem Gewitter unter dem Laubengang duzen."
      - "Dass Hannes gefragt hat, ob das Erntefest auf dem Gut bleibt, und dass Jonas ihm am 14. August zugesagt hat, das Fest finde dieses Jahr auf dem Gut statt."
      - "Dass der Festausschuss bis Freitag, den 14., eine Zusage von Jonas brauchte."
      - "Dass Jonas' Partner ihn am Donnerstag, dem 13., um neun in Hamburg sprechen wollten und die Einlage jetzt bis Monatsende fällig ist."
      - "Dass Jonas am 13. August in der Kreisstadt beim Notar mit Steinhagen einen Vorvertrag über das Gut unterschrieben hat, mit Rücktrittsrecht bis zum 10. September."
      - "Dass Jonas die Mappe mit Vorvertrag und Lageplan im untersten Fach von Hedwigs Schreibtisch unter den Dachrechnungen liegen hat."
      - "Dass Jonas an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt hat."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg ist frei, die Buchskanten stehen, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Um die Sonnenuhr sitzen alte Holunderstubben unter dem Kies, an der Westseite ein Brombeerwurzelstock, dem Marie seit drei Tagen mit der Hacke nicht beikommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will langsam ziehen, nicht ruckzuck, damit der Ballen die Rose nicht mitreißt; gezogen wird nach Norden, zum Tor hin."
        from: ch03/s02
      - text: "Mit derselben Kette hat er Hedwig den Fliederbusch an der Remise rausgeholt."
        from: ch03/s02
      - text: "Jonas konnte im Juni noch nicht sagen, ob das Erntefest auf dem Gut bleibt; es hänge an Gutachten fürs Dach und für die Fenster, an den Kosten und an Fristen, die er selbst noch nicht kennt."
        from: ch03/s02
      - text: "Das Erntefest ist wie immer am ersten Samstag im September."
        from: ch03/s02
      - text: "Er bringt am Sonnabend um halb acht den Trecker für die Stubben."
        from: ch03/s02
      - text: "Marie und Jonas duzen sich; Marie hat ihm gegenüber das 'Ihnen' heruntergeschluckt."
        from: ch03/s02
      - text: "Mitte Juli schaufelt er mit Marie Kies vom Hänger auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war auf dem Gut, hat mit Jonas auf der Terrasse gesessen und den Garten besichtigt."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus ein Pfund und sagte, den Fotografen des Maklers brauche man Ende Juli nicht mehr, die Bilder mache man selbst."
        from: ch04/s01
      - text: "Auf seine Frage nach dem Erntefest sagte Steinhagen, beim Hotel gäbe es eine Veranstaltungsfläche gegen Gebühr, für Vereine zu sehr fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kam er kurz nach sechs mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine; Timo brachte das zweite Gespann voll Kies für die Seitenwege."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln, eine Nummer zu groß; er wollte anfassen, und er hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Er hat vor allen gesagt: Im Garten ist Marie die Chefin; wer das nicht weiß, fragt sie."
        from: ch05/s01
      - text: "Jonas ist als Junge, Hedwigs Lütten, barfuß bei ihm auf dem Hänger über die Stoppeln nach der Gerste mitgefahren; Hedwig hat geschimpft und musste ihn mit Kuchen vom Hänger locken."
        from: ch05/s02
      - text: "Jonas sagt, an den Diesel erinnere er sich noch."
        from: ch05/s02
      - text: "Bis zum späten Nachmittag ist die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen freigelegt; er hat die letzte Fuhre abgefahren."
        from: ch05/s02
      - text: "Er hat Jonas die Hand gegeben, ihn Jonas genannt und geduzt: \"Gut gemacht, Jonas. Morgen tut dir alles weh.\""
        from: ch05/s02
      - text: "Der Festausschuss hat am Sonntagabend Anfang August gesessen; bis Freitag, den 14., braucht er eine Zusage für das Erntefest auf dem Gut, eine, auf die man bauen kann, sonst wird im schon reservierten Zelt hinter dem Feuerwehrhaus gefeiert. Das hat er Jonas am Hoftor der Hansens gesagt."
        from: ch06/s03
      - text: "Jonas hat ihm zugesagt: \"Bis dahin kriegst du eine Antwort.\""
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, nachmittags, hat er Jonas am schmiedeeisernen Tor die Antwort abverlangt; Jonas hat gesagt: Das Fest findet dieses Jahr auf dem Gut statt."
        from: ch07/s02
      - text: "Marie ist Jonas daraufhin um den Hals gefallen, so heftig, dass er einen Schritt zurück gegen das Tor machen musste."
        from: ch07/s02
    believes:
      - text: "Die Arbeit im Garten läuft gut (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Mit dem Spaten wird das nix; Kette und Trecker holen den Stubben raus."
        from: ch03/s02
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Jonas hat an der Südmauer gute Arbeit gemacht."
        from: ch05/s02
      - text: "Die Frist ist keine Drohung; die Leute wollen wissen, wo sie ihre Bänke hinstellen."
        from: ch06/s03
      - text: "Das Erntefest bleibt auf dem Gut; nun kann er den Weizen in Ruhe dreschen."
        from: ch07/s02
    does_not_know:
      - "Dass Jonas das Gut verkaufen will und ein Käufer bis zum Herbst sein Plan ist."
      - "Dass Jonas am 13. August beim Notar mit Steinhagen einen Vorvertrag über das Gut unterschrieben hat, mit Rücktrittsrecht bis zum 10. September, fünf Tage nach dem Fest."
      - "Dass Weidenkamp den Parkplatz genau auf den Rosengarten legen will."
      - "Dass Weidenkamp Grete bei freiwilligem Auszug eine Abfindung vorsieht."
      - "Dass Jonas' Partner ihn am Donnerstag, dem 13., wegen seiner Einlage sprechen wollten und die Einlage bis Monatsende fällig ist."
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Jonas sich an sein Gesicht nicht erinnert hat."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
  jonas-behrendt:
    knows:
      - text: "Die Gärtnerin im Rosengarten heißt Marie Albers."
        from: ch01/s01
      - text: "Marie hält die Kletterrose am Hauptweg für eine 'New Dawn', kein Gestrüpp, und lehnt Bagger und Splitt auf dem Weg ab."
        from: ch01/s01
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite; für das Dach stand ein Angebot vom Dachdecker bis Ende Juni aus."
        from: ch01/s02
      - text: "Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen, über die Wege wird noch geredet; ihr Stundensatz steht nicht zur Verhandlung."
        from: ch01/s02
      - text: "Die zwei Rankbögen an der Ostmauer stecken ohne Fundament im Boden; laut Marie hängt seit zweiundfünfzig Jahren eine Rose daran, die um das Gestell herumgewachsen ist."
        from: ch02/s01
      - text: "Neue Absprache mit Marie: Die Rankbögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief); er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg Ende Juni frei zu haben, vom Tor bis zur Pforte, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Donnerstag um neun Uhr ist in Hamburg die Abnahme des Parkdecks; das Büro braucht ihn dort."
        from: ch02/s02
      - text: "Für die Partnerschaft im Büro ist seine Einlage fällig."
        from: ch02/s02
      - text: "Laut Makler gibt es einen Kaufinteressenten aus der Hotelbranche, noch ohne Namen."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben (gute Wege, Blüten mit Blick vom Haus, keine Ecke, die nach Arbeit aussieht), dann gehe es um andere Zahlen; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Am letzten Freitag im Juli soll ein Fotograf des Maklers den Garten fotografieren."
        from: ch02/s02
      - text: "Erinnerung aus der Kindheit: ein Floß aus Brettern am Gutssee, und Hedwig rief ihn zum Kuchen."
        from: ch02/s02
      - text: "Die Bögen der 'Ghislaine' stehen seit einer Woche im Beton und halten; er hat am Eisen gerüttelt, nichts gab nach. Was die Fundamente tragen müssen, hat er nachgerechnet."
        from: ch03/s01
      - text: "Marie und er duzen sich seit dem Gewitter unter dem Laubengang."
        from: ch03/s01
      - text: "Marie ist als Kind im Garten herumgestromert und hat mit zehn ihren ersten richtigen Rosenschnitt gemacht; Hedwig hat ihr die Hand geführt (über dem Auge, schräg)."
        from: ch03/s01
      - text: "Als Kind bekam Marie bei Grete jeden Dienstag und Freitag für eine Stunde Unkraut ein Stück Streuselkuchen; Grete führte auf der Rückseite vom Kalender Buch."
        from: ch03/s01
      - text: "Hedwig hat Marie ihre alte Schere mit dem roten Griff geschenkt; Marie hat sie heute noch."
        from: ch03/s01
      - text: "Hedwig hat laut und mit tiefer, rauer Stimme mit den Rosen geredet, mit der 'Rosa Mundi' geschimpft und die 'Ghislaine' jeden Juni gelobt; Marie redet auch mit den Rosen."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Laut Grete nimmt Marie Milch in den Kaffee."
        from: ch03/s02
      - text: "Das Erntefest ist wie immer am ersten Samstag im September."
        from: ch03/s02
      - text: "Hannes bringt am Sonnabend um halb acht den Trecker, um mit Kette die Stubben an der Sonnenuhr zu ziehen."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; die Nummer hat er vom Makler. Steinhagen kennt Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Er hat der Besichtigung durch Weidenkamp am übernächsten Montag (Mitte Juli) zugesagt und sie eingetragen; Steinhagen schickt eine Bestätigung."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen und eine Reihe verrutschter Pfannen, in der Rinne fault Laub."
        from: ch03/s03
      - text: "Grete hat Steinhagen und ihm Kaffee aus der guten Kanne eingeschenkt, ohne Kuchen; in all seinen Kindersommern hat sie ihm nie eine Tasse ohne Kuchen hingestellt, bis zu diesem Morgen."
        from: ch04/s02
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund und sagte zu Marie, den Fotografen des Maklers brauche man Ende Juli nicht mehr, die Bilder mache Weidenkamp selbst."
        from: ch04/s01
      - text: "Marie hat Steinhagen widersprochen: Das sei keine Fläche, sondern ein Garten, angelegt in den Dreißigerjahren; die 'Rosa Mundi' sei älter als sie beide zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Hotelplan von Weidenkamp: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, unten am Steg ein kleines Saunahaus aus Holz; Grundrisse, Schnitte und eine Kostenschätzung nach Gewerken, zwei Balken eingeplant (Seite vier, unten)."
        from: ch04/s02
      - text: "Steinhagens Lasten und Fristen halten jeder Prüfung stand; die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Im Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit Zufahrt durch das Tor; Steinhagen begründet es mit ebenem Grund, kurzen Wegen und der Mauer als Sichtschutz. Ein paar Rosen sollen als Akzent in Kübeln bleiben."
        from: ch04/s02
      - text: "Laut Steinhagen hat Grete ein lebenslanges Wohnrecht, das bestehen bleibt; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor, und Steinhagen bittet ihn, das bei Grete anzusprechen."
        from: ch04/s02
      - text: "Steinhagen hatte vor ein paar Jahren ein Herrenhaus weiter im Süden, dessen alter Park für den Anbau weichen musste; das Haus läuft gut, aber seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Auf Maries Frage, was Steinhagen wollte, hat er nur gesagt: \"Ein Interessent.\""
        from: ch04/s02
      - text: "Beim Helfersamstag Mitte Juli hat er in geliehenen Gummistiefeln aus der Remise mitgearbeitet; Lena hat ihn eingetragen, Hannes hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Laut Hannes ist er als Junge barfuß bei ihm auf dem Hänger über die Stoppeln nach der Gerste mitgefahren; Hedwig hat geschimpft und ihn mit Kuchen vom Hänger gelockt. Er selbst erinnert sich an den Geruch von Diesel und Stroh, nicht an Hannes' Gesicht."
        from: ch05/s02
      - text: "An der Mitte der Südmauer, nicht weit von der Pforte, wachsen unter den Brombeeren Triebe mit denselben kleinen, glänzenden Blättern wie an den Bögen im Laubengang; er hat aufgehört zu ziehen."
        from: ch05/s02
      - text: "Laut Marie ist es eine 'Ghislaine de Féligonde', die seit Jahren keiner mehr gesehen hat; der alte Stamm ist dick wie ein Handgelenk. Marie hat die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Die Südmauer liegt von der Pforte nach Westen bis zum alten Geräteschuppen frei."
        from: ch05/s02
      - text: "Hannes hat ihm die Hand gegeben, ihn Jonas genannt und geduzt: \"Gut gemacht, Jonas. Morgen tut dir alles weh.\""
        from: ch05/s02
      - text: "Grete hat ihm zwei Bier aus der Helferkiste gegeben und ihm Quark für den Sonnenbrand angeboten."
        from: ch05/s03
      - text: "Lena hat ihn den ganzen Tag gesiezt; um fünf hat sie gefragt, ob er nächsten Samstag Zeit hat, und er hat Ja gesagt."
        from: ch05/s03
      - text: "Als Junge hat er am See drei Flöße aus Brettern der Remise gebaut, mit Wäscheleine verschnürt; das letzte ist mitten auf dem See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Er und Marie haben sich am Abend auf dem Steg geküsst; er hat gesagt, das wollte er seit dem Gewitter, und Marie: \"Ich auch.\""
        from: ch05/s03
      - text: "Auf Maries Frage, ob er im Herbst noch hier ist, hat er geantwortet: \"Ich weiß es nicht.\""
        from: ch05/s03
      - text: "Laut Marie sind die Gallica und die Damaszener einmalblühend; sie werden nach der Blüte zurückgeschnitten, damit sie Luft kriegen. Die Büsche am Rondell bleiben, wie sie sind, und setzen Hagebutten an, im September rot wie kleine Laternen."
        from: ch06/s01
      - text: "Das Junibild kommt zum Fest nicht wieder; Glanz im September heißt laut Marie: Nachblüte der 'New Dawn', davor Lavendel und Katzenminze, Frauenmantel an den Kanten, Astern, am Laubengang Dahlien in Reihen."
        from: ch06/s01
      - text: "Laut Marie meldet sich Gretes Leiden, so sagt Grete, nur bei Regen; Marie hält sie heute bloß für müde vom Backen."
        from: ch06/s01
      - text: "Lena hat ihn für den Samstag schon auf der Helferliste eingetragen, mit zwei Uhrzeiten, Ankunft und Abfahrt; die Liste hängt ganz oben am schwarzen Brett im Hofladen."
        from: ch06/s03
      - text: "Der Gutachter will für die Wertermittlung jede Rechnung in der Hand haben, am liebsten mit Datum und Firmenstempel; er braucht die für Dach und Fenster."
        from: ch06/s02
      - text: "Im Arbeitszimmer hat er die Rechnung fürs Dach gefunden, Umdeckung Nordseite, mit Stempel; nach den Fensterrechnungen will er am nächsten Tag weitersuchen. Die Fensterflügel im Arbeitszimmer bleiben nach einer Handbreit stecken."
        from: ch06/s02
      - text: "Laut Grete hat Marie das Gartenbuch im Arbeitszimmer gelassen; es liegt neben der Lampe auf dem Schreibtisch, und Grete meint, Hedwig hätte gewollt, dass er reinsieht."
        from: ch06/s02
      - text: "Im Gartenbuch steht unter der Überschrift Lindenhof-Rose, mit einem Datum aus einem Juli vor sechsundzwanzig Jahren: Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen."
        from: ch06/s02
      - text: "Er erinnert sich wieder: Hedwig hat ihm beim Pflanzen die Hand geführt (\"Nicht drücken\"); der Steckling stand in einem Erdbeer-Joghurtbecher; er ist jeden Morgen barfuß mit dem Lineal hingelaufen, am fünften Tag waren es dreieinhalb, und er ist brüllend zur Küche gerannt."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet; zu Weihnachten ein Anruf von zehn Minuten. In ihren letzten Jahren war er zwei-, vielleicht dreimal hier."
        from: ch06/s02
      - text: "Lena öffnet den Hofladen montags für Grete, seit Jahren, und packt Gretes Kiste, ohne auf den Zettel zu sehen."
        from: ch06/s03
      - text: "Laut Frieda hat Tante Rosen ihr eine Dahlie geschenkt, die im Glas steht."
        from: ch06/s03
      - text: "Lena hat ihn gewarnt: Marie sei keine, mit der man einen Sommer spielt; tue er es doch, nehme sie ihm das übel, und das ganze Dorf mit ihr. Auf seine Frage, ob Marie ihr etwas gesagt habe: \"Das müssen Sie Marie schon selbst fragen.\""
        from: ch06/s03
      - text: "Laut Hannes braucht der Festausschuss bis Freitag, den 14., eine Zusage, auf die man bauen kann; sonst wird im reservierten Zelt hinter dem Feuerwehrhaus gefeiert. Er hat Hannes eine Antwort bis dahin zugesagt."
        from: ch06/s03
      - text: "Die Partner wollten in Hamburg persönlich über seine Einlage sprechen, am Donnerstag, dem 13., um neun; er hat den Termin und den Freitag des Ausschusses auf einen Briefumschlag geschrieben."
        from: ch06/s03
      - text: "Am Donnerstag, dem 13. August, kurz nach sieben, hat er vom Hügel hinter der Scheune mit einem Partner telefoniert, statt nach Hamburg zu fahren; der Partner nahm hin, dass er heute nicht kommt: \"dann eben so\"."
        from: ch07/s01
      - text: "Die Einlage ist bis Monatsende fällig, nicht erst zum Jahresende; ihm bleiben achtzehn Tage."
        from: ch07/s01
      - text: "Der Dachdecker hat zehn Minuten später zurückgerufen und eine Summe für den Herbst genannt; er hat sie unter die durchgestrichene Hamburger Uhrzeit auf den Briefumschlag geschrieben."
        from: ch07/s01
      - text: "Den Notartermin hatte er schon am Montag zugesagt, als Steinhagen anbot, ihm Bedenkzeit in den Vertrag zu schreiben."
        from: ch07/s01
      - text: "Am 13. August hat er im Notariat in der Kreisstadt, eine halbe Stunde vom Gut, in Steinhagens Beisein den Vorvertrag unterschrieben, den der Notar Seite um Seite vorgelesen hat."
        from: ch07/s01
      - text: "Der Vorvertrag gibt ihm ein Rücktrittsrecht bis zum 10. September, fünf Tage nach dem Fest; der Preis eines Rücktritts frisst fast alles, was er für die Einlage gespart hat."
        from: ch07/s01
      - text: "Steinhagen sagte zum Rücktrittsrecht: \"Gezogen hat so etwas bei uns noch nie jemand.\""
        from: ch07/s01
      - text: "Im Lageplan der Mappe reicht die graue Fläche der Stellplätze bis an die Mauer, bis in die Ecke hinter dem Laubengang."
        from: ch07/s01
      - text: "Die Mappe mit Vorvertrag und Lageplan liegt im untersten Fach von Hedwigs Schreibtisch unter den Dachrechnungen."
        from: ch07/s01
      - text: "Laut Grete redet das Dorf über den Herrn mit dem silbernen Auto, ob der wiedergekommen ist; er hat ihr gesagt: \"Hier war er nicht.\" und: \"Ich hatte Termine in der Stadt. Nichts Besonderes.\""
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat Marie ihm in der Mauerecke hinter dem letzten Bogen des Laubengangs den alten Stock der Lindenhof-Rose gezeigt: Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock, und er trägt eine Knospe; Marie hat ihn im Juni unter den Brombeeren gefunden."
        from: ch07/s02
      - text: "Am Laubengang haben die ersten Dahlien aufgemacht; Marie setzt Astern in die Lücken am Rondell, er sticht die Kanten an den Kieswegen an einer Schnur ab."
        from: ch07/s02
      - text: "Er hat Hannes am Tor geantwortet: Das Fest findet dieses Jahr auf dem Gut statt. Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
    believes:
      - text: "Marie ist die Gärtnerin."
        from: ch01/s01
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Marie kennt den Garten; das ist ein Vorteil gegenüber einer Firma aus der Kreisstadt, die zu spät anfangen würde."
        from: ch01/s02
      - text: "Das Haupthaus ist in schlimmerem Zustand als das Scheunendach, dessen Kosten er ungefähr kennt."
        from: ch03/s03
      - text: "Steinhagen ist der Käufer, den er seit dem Brief vom Nachlassgericht will: einer, der rechnen kann und sich nicht lange bitten lässt."
        from: ch03/s03
      - text: "Mit dem Parkplatz hat er seit dem Wort Stellplatzlösung gerechnet, mit der Zeile über Gretes Abfindung nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "\"Ein Interessent\" war nicht gelogen, aber so wenig, dass es kaum Gewicht hatte; warum er Marie nicht mehr gesagt hat, weiß er selbst nicht."
        from: ch04/s02
      - text: "Er wird auf dem Gut mitgerechnet, gehört an diesem Ort dazu."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Eines der nummerierten Kästchen im Lageplan liegt über dem Loch, das er für den ersten Steckling gegraben hat; ausgerechnet hat er es nicht, auch nicht beim Notar."
        from: ch07/s01
      - text: "Den Fund im Gartenbuch erzählt er weder Grete noch Marie, morgen nicht und später nicht; ob das Scham ist oder ob er etwas festhält, das hier als Einziges ihm allein gehört, weiß er nicht."
        from: ch06/s02
      - text: "Der Partner hat recht; er hätte es selbst so gesagt."
        from: ch07/s01
      - text: "Das Geld für Dachdecker und Einlage besitzt er nur, wenn er das Gut verkauft."
        from: ch07/s01
      - text: "Unterschreibt er, zahlt Weidenkamp eine Anzahlung, und die reicht den Partnern als Sicherheit."
        from: ch07/s01
      - text: "Von der Unterschrift muss vorerst keiner wissen, Marie nicht und Grete nicht."
        from: ch07/s01
    does_not_know:
      - "Dass Marie die Ecke mit der Lindenhof-Rose vor dem Helfersamstag im Dunkeln selbst freigeschnitten und mit einem leeren Schild markiert hat."
      - "Dass Marie in Klein Lindau Stecklinge der Lindenhof-Rose unter Folie zieht."
      - "Wo genau im Garten er damals den ersten Steckling gepflanzt hat."
      - "Ob Marie die Seite mit Hedwigs Notiz zum ersten Steckling kennt."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu Marie gesagt hat."
      - "Ob Marie mit Lena über ihn gesprochen hat und dass Lena meint, Marie habe Gefühle für ihn."
      - "Dass Marie nicht wusste, von welchem Fototermin Steinhagen sprach."
      - "Dass Marie sich an einen Jungen auf der Gartenmauer erinnert und überlegt, ob er das war."
      - "Ob die Partner Weidenkamps Anzahlung als Sicherheit annehmen."
      - "Ob Grete ihm \"Hier war er nicht.\" und die Termine in der Stadt glaubt."
  lena-hansen:
    knows:
      - text: "Laut Marie stand in Jonas' Tabelle beim Laubengang 'Entsorgung' für beide Rankbögen der 'Ghislaine', die zweiundfünfzig Jahre alt sind."
        from: ch02/s03
      - text: "Laut Marie kniete Jonas in heller Hose ins nasse Gras vor den Bogen, rüttelte am Eisen, stellte fehlendes Fundament fest und skizzierte eins auf die Rückseite seiner Tabelle: vierzig mal vierzig, achtzig tief wegen Frost."
        from: ch02/s03
      - text: "Laut Marie kam Jonas in geputzten Lederschuhen, seine Hose ist an beiden Knien grün und hin, und am ersten Tag ließ er sie samt Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Marie sagt, sie habe Jonas dazu gebracht, die Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Marie hat zehn Eier für den nächsten Morgen gekauft und zwei Stück Butterkuchen von ihr bekommen; sie sehen sich am Freitag wieder."
        from: ch02/s03
      - text: "Beim Helfersamstag Mitte Juli hat sie am Tor die Leute auf dem Klemmbrett abgehakt (drei Landfrauen mit Hacken, vier Mann von der Feuerwehr, die Nachbarn vom Dorfteich mit Schubkarren) und die Arbeit verteilt: Wege harken, Giersch an der Westmauer, Kies schaufeln."
        from: ch05/s01
      - text: "Marie hat ihren Rosen Namensschilder gemacht, damit keiner was rausreißt."
        from: ch05/s01
      - text: "Jonas ist zum Helfen gekommen; sie hat ihn gesiezt und eingetragen."
        from: ch05/s01
      - text: "Um fünf hat sie Jonas gefragt, ob er nächsten Samstag Zeit hat, und er hat Ja gesagt."
        from: ch05/s03
      - text: "Jonas steht auf ihrer Helferliste für den Rosengarten am schwarzen Brett, mit Ankunft und Abfahrt."
        from: ch06/s03
      - text: "Für Grete macht sie den Hofladen montags auf, seit Jahren; am Montag Anfang August hat Jonas Gretes Kiste abgeholt."
        from: ch06/s03
      - text: "Marie hat Frieda eine Dahlie geschenkt; sie steht im Glas und hält eine Woche."
        from: ch06/s03
      - text: "Sie hat Jonas gesagt: Marie sei keine, mit der man einen Sommer spielt; tue er es doch, nehme sie ihm das übel, und das ganze Dorf mit ihr. Auf seine Frage, ob Marie etwas gesagt habe, hat sie ihn an Marie verwiesen."
        from: ch06/s03
    believes:
      - text: "Marie hat Gefühle für Jonas; dass sie seit zwanzig Minuten über seine Schuhe redet, ist kein gutes oder ein sehr gutes Zeichen."
        from: ch02/s03
      - text: "Die Namensschilder sind unnötig: Die Landfrauen stechen Giersch, seit Marie laufen kann."
        from: ch05/s01
      - text: "Marie ist keine, mit der man einen Sommer spielt; was Marie ihr gesagt hat, muss Jonas Marie selbst fragen."
        from: ch06/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie in Klein Lindau Stecklinge der Lindenhof-Rose zieht."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt und der Makler Ende Juli einen Fotografen schicken wollte."
      - "Dass Jonas den Hauptweg Ende Juni frei haben will."
      - "Dass Marie und Jonas sich seit dem Gewitter unter dem Laubengang duzen."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels Mitte Juli das Gut besichtigt hat."
      - "Dass Weidenkamp den Parkplatz auf den Rosengarten legen will."
      - "Dass Jonas' Partner ihn am Donnerstag, dem 13., in Hamburg wegen seiner Einlage sprechen wollten."
      - "Dass Jonas am 13. August beim Notar mit Steinhagen einen Vorvertrag über das Gut unterschrieben hat."
      - "Dass Jonas Hannes am 14. August zugesagt hat, das Fest finde dieses Jahr auf dem Gut statt."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
  marie-albers:
    knows:
      - text: "Der Erbe aus Hamburg kommt an diesem Tag auf das Gut."
        from: ch01/s01
      - text: "Jonas Behrendt ist der Erbe."
        from: ch01/s01
      - text: "Jonas will den Rosengarten bis zum Erntefest am 5. September hergerichtet haben: Wege begehbar, Beete sauber, alles, was man vom Haus aus sieht."
        from: ch01/s02
      - text: "Jonas will das Gut verkaufen."
        from: ch01/s02
      - text: "Absprache mit Jonas: freie Hand bei den Rosen, über die Wege wird noch geredet; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hinter dem Laubengang steht unter den Brombeeren ein Stock der Lindenhof-Rose, die Hedwig selbst gezogen hat."
        from: ch01/s03
      - text: "Grete hat ihr zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Laut Hedwigs Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas' Tabelle sah 'Hauptweg frei bis Ende Juni' und beim Laubengang 'Entsorgung, Ersatz verzinkt' für beide Rankbögen der 'Ghislaine' vor."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Die Rankbögen stecken ohne Fundament im Boden, seit zweiundfünfzig Jahren."
        from: ch02/s01
      - text: "Neue Absprache: Die Rankbögen bleiben und bekommen Punktfundamente, Jonas bestellt Beton, sie bindet die Rose selbst wieder an; dafür muss der Hauptweg Ende Juni frei sein, vom Tor bis zur Pforte, mit Fotos."
        from: ch02/s01
      - text: "Die Bögen stehen seit einer Woche im Beton und halten; Jonas hat gerüttelt, nichts gab nach (\"Wie eine Eins\")."
        from: ch03/s01
      - text: "Seit dem Gewitter unter dem Laubengang duzen Jonas und sie sich; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu ihr gesagt hat, trägt sie seither mit sich."
        from: ch03/s01
      - text: "Den Rosenschnitt hat sie mit zehn von Hedwig gelernt (über dem Auge, schräg); Hedwigs alte Schere mit dem roten Griff hat sie heute noch."
        from: ch03/s01
      - text: "Jonas hat bemerkt, dass sie mit den Rosen redet wie Hedwig."
        from: ch03/s01
      - text: "Hannes findet, die Arbeit läuft (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Hannes will die Holunderstubben und den Brombeerwurzelstock an der Sonnenuhr mit Kette und Trecker ziehen, nach Norden zum Tor hin, und bringt den Trecker am Sonnabend um halb acht."
        from: ch03/s02
      - text: "Auf Hannes' Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas im Juni nicht zugesagt: Es hänge an Gutachten fürs Dach und für die Fenster, an den Kosten und an Fristen, die er selbst noch nicht kennt."
        from: ch03/s02
      - text: "Jonas weiß von Grete, dass sie Milch in den Kaffee nimmt."
        from: ch03/s02
      - text: "Mitte Juli schüttet sie mit Hannes Kies auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war auf dem Gut; ein Hotelmann."
        from: ch04/s01
      - text: "Grete hat Jonas und Steinhagen auf der Terrasse Kaffee aus der guten Kanne eingeschenkt, sonst stand nichts auf dem Tablett, obwohl am Morgen Butterkuchenduft über dem Hof lag."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus ein Pfund und sagte zu ihr, das werde auf den Fotos sehr schön; den Fotografen des Maklers brauche man Ende Juli nicht mehr, die Bilder mache man selbst."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; Jonas schwieg dazu."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, hat Jonas gesagt: \"Ein Interessent.\""
        from: ch04/s02
      - text: "Für den Helfersamstag hat sie an jeden Stock, der stehen bleiben muss, vom Tor bis zur Pforte ein Pappschild mit der Sorte gehängt; nur die Mauerecke hinter dem Südende des Laubengangs trägt keinen Namen. Dort hat sie im Dunkeln die Brombeeren selbst zurückgeschnitten und einen Pfahl mit leerem Schild davorgesetzt."
        from: ch05/s01
      - text: "Hannes hat Jonas an die Brombeeren an der Südmauer westlich der Pforte geschickt, fort von der Ecke am Laubengang."
        from: ch05/s01
      - text: "Ole von der Feuerwehr hat an der 'Maiden's Blush' einen langen Trieb abgeknickt; sie hat ihn mit Hedwigs Schere eine Handbreit tiefer abgeschnitten. Die Rose lebt, aber ihr fehlt ein Arm."
        from: ch05/s01
      - text: "Hannes hat vor allen gesagt: Im Garten ist Marie die Chefin; wer das nicht weiß, fragt sie."
        from: ch05/s01
      - text: "An der Südmauer, nicht weit von der Pforte, hat Jonas aufgehört zu ziehen und eine 'Ghislaine de Féligonde' mit altem Stamm freigelegt; sie hat die jungen Triebe lose mit Bast angebunden."
        from: ch05/s02
      - text: "Jonas hat Sonnenbrand im Nacken und zerkratzte Unterarme; Grete hat ihm Quark angeboten und zwei Bier aus der Helferkiste gegeben."
        from: ch05/s03
      - text: "Lena hat Jonas den ganzen Tag gesiezt und ihn um fünf gefragt, ob er nächsten Samstag Zeit hat; er hat Ja gesagt."
        from: ch05/s03
      - text: "Jonas hat als Junge am See Flöße aus Brettern der Remise gebaut, mit Wäscheleine verschnürt; das letzte ist mitten auf dem See abgesoffen, und Hedwig hat gesagt, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Sie und Jonas haben sich am Abend auf dem Steg geküsst; er wollte das seit dem Gewitter, sie auch."
        from: ch05/s03
      - text: "Mats hat die Bank gerichtet, die Latten neu verschraubt, das Holz glatt geschliffen."
        from: ch05/s03
      - text: "Jonas weiß nicht, ob er im Herbst noch hier ist."
        from: ch05/s03
      - text: "Ende Juli schneidet sie die verblühten Gallica und die Damaszener am Tor zurück; die Büsche am Rondell bleiben und setzen Hagebutten an. Jonas hat gedacht, zum Fest sehe alles aus wie im Juni; sie hat ihm den Septemberglanz erklärt: Nachblüte der 'New Dawn', Lavendel, Katzenminze, Frauenmantel, Astern, Dahlien am Laubengang."
        from: ch06/s01
      - text: "Lena hat Jonas für Samstag auf der Helferliste eingetragen, mit Ankunft und Abfahrt."
        from: ch06/s01
      - text: "Im Hinterhof der alten Schmiede in Klein Lindau zieht sie unter Folie Stecklinge der Lindenhof-Rose: zwei sind grün, an einem dehnt sich ein Auge; der dritte war schwarz, sie hat ihn auf den Kompost gelegt."
        from: ch06/s01
      - text: "Von den Stecklingen weiß niemand außer ihr, weder Lena noch Grete noch Jonas."
        from: ch06/s01
      - text: "Jonas hat ihr abends geschrieben: \"Kommst du morgen wieder?\" Sie hat geantwortet, die Rosen fragten das nicht, die wüssten das; er: \"Ich bin nicht so klug wie deine Rosen.\""
        from: ch06/s01
      - text: "Am Freitag, dem 14. August, trägt die 'New Dawn' über der Bank drei schmale Knospen, die oberste mit einem Hauch Rosa; am Laubengang haben die ersten Dahlien aufgemacht, und sie hat blaue und weiße Astern in die Lücken am Rondell gesetzt."
        from: ch07/s02
      - text: "Der alte Stock der Lindenhof-Rose in der Mauerecke trägt am längeren Trieb eine einzelne Knospe, kaum größer als eine Erbse, grün mit rosa Saum."
        from: ch07/s02
      - text: "Sie hat Jonas an diesem Tag die Ecke mit der Lindenhof-Rose gezeigt und ihm gesagt, dass Hedwig sie selbst gezogen hat, dass es nur noch diesen einen Stock gibt und dass sie ihn im Juni unter den Brombeeren gefunden hat; Jonas blieb stumm."
        from: ch07/s02
      - text: "Jonas hat ihre Hand umgedreht und ihre zerkratzten Finger geküsst, einen nach dem anderen."
        from: ch07/s02
      - text: "Laut Hannes war an diesem Freitag Jonas' Antwort zum Erntefest fällig; Jonas hat gesagt: Das Fest findet dieses Jahr auf dem Gut statt."
        from: ch07/s02
    believes:
      - text: "Splitt auf dem Hauptweg würde den alten Kies zerstören."
        from: ch01/s01
      - text: "Jonas will das Gut verkaufsfertig machen."
        from: ch01/s03
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Den Winkel hinter dem Laubengang sieht man von der Terrasse nicht, und in Jonas' Tabelle kommt er nicht vor."
        from: ch01/s03
      - text: "Sie hat Jonas dazu gebracht, Hedwigs Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Mit einem Ruck würde der Ballen des Stubbens die 'Rosa Mundi' mitreißen; Rosen zieht man nicht ruckzuck."
        from: ch03/s02
      - text: "Das ist keine Fläche, sondern ein Garten, angelegt in den Dreißigerjahren; die 'Rosa Mundi' ist älter als sie und Steinhagen zusammen."
        from: ch04/s01
      - text: "Sie hat auf ein Wort von Jonas gewartet, das nach Nein klang, und keins bekommen."
        from: ch04/s01
      - text: "Lena spricht mit Jonas in ihrem Vertreterton, wie mit einem Vertreter vor der Theke."
        from: ch05/s01
      - text: "Die 'Ghislaine' an der Südmauer hat seit Jahren keiner mehr gesehen."
        from: ch05/s02
      - text: "Der dünne barfüßige Junge, den sie einmal oben auf der Gartenmauer gesehen hat, war vielleicht Jonas."
        from: ch05/s03
      - text: "Ihr Herzklopfen neben Jonas kam nicht vom Wetter; sie empfindet mehr für ihn als Ärger."
        from: ch05/s03
      - text: "Lena misstraut jedem ohne Klemmbrett."
        from: ch06/s01
      - text: "Jonas schreibt ihr vom Hügel hinter der Scheune, weil aus Haus und Garten keine Nachricht durchkommt."
        from: ch06/s01
      - text: "Die Lindenhof-Rose blüht wieder."
        from: ch07/s02
      - text: "Gretes zu langer Blick auf Jonas gilt nur seinem Appetit; Grete mustert jeden so, der zu wenig isst."
        from: ch07/s02
      - text: "Der Garten ist gerettet, das Fest bleibt auf dem Gut; die Rosen wussten das schon."
        from: ch07/s02
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor so still werden ließ."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Dass Jonas fest damit rechnete, bis zum Herbst einen Käufer zu haben."
      - "Wie schlimm es um Fenster und Dach des Gutshauses steht (sieben undichte Fenster, Dachdecker-Summe für den Herbst)."
      - "Dass Jonas für einen Gutachter die Rechnungen für Dach und Fenster zur Wertermittlung zusammensucht."
      - "Von welchem Fototermin Steinhagen sprach: dass der Makler am letzten Freitag im Juli einen Fotografen schicken wollte."
      - "Dass für die Partnerschaft in Jonas' Büro eine Einlage fällig ist, jetzt bis Monatsende."
      - "Dass Jonas' Partner ihn am Donnerstag, dem 13., um neun in Hamburg sprechen wollten und er stattdessen vom Hügel aus telefoniert hat."
      - "Dass Jonas am 13. August im Notariat in der Kreisstadt mit Steinhagen einen Vorvertrag über das Gut unterschrieben hat."
      - "Dass der Vorvertrag ein Rücktrittsrecht bis zum 10. September hat, fünf Tage nach dem Fest, und ein Rücktritt Jonas fast alles kostet, was er für die Einlage gespart hat."
      - "Dass Jonas die Mappe mit Vorvertrag und Lageplan im untersten Fach von Hedwigs Schreibtisch unter den Dachrechnungen versteckt hat."
      - "Dass der Festausschuss eine Zusage brauchte, auf die man bauen kann, sonst im Zelt hinter dem Feuerwehrhaus gefeiert würde."
      - "Dass Jonas im Gartenbuch Hedwigs Notiz gelesen hat, nach der er als Junge beim ersten Steckling der Lindenhof-Rose das Loch gegraben und gegossen hat, und dass er sich wieder daran erinnert."
      - "Dass Lena Jonas gewarnt hat, mit ihr keinen Sommer zu spielen."
      - "Dass Jonas sie vom Hügel aus bei der Arbeit beobachtet hat."
      - "Was Weidenkamp plant: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg."
      - "Dass im Lageplan der Parkplatz genau auf dem Rosengarten liegt, die Stellplätze bis in die Ecke hinter dem Laubengang reichen und nur ein paar Rosen in Kübeln bleiben sollen."
      - "Dass Weidenkamp Grete bei freiwilligem Auszug eine Abfindung vorsieht."
      - "Dass Hannes sich an Jonas als Jungen auf seinem Hänger erinnert und ihm nach der Arbeit das Du angeboten hat."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr des Guts."
        from: ch03/s03
      - text: "Die Namen von Marie Albers, Hannes Kröger und Grete Paulsen."
        from: ch04/s01
      - text: "Der Makler wollte Ende Juli einen Fotografen für den Garten schicken."
        from: ch04/s01
      - text: "Laut Marie ist der Garten in den Dreißigerjahren angelegt, mit diesen Wegen und dieser Mauer; die 'Rosa Mundi' ist älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes hat gefragt, wohin das Erntefest dann soll."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg, der Parkplatz auf dem Rosengarten; ein paar Rosen bleiben in Kübeln."
        from: ch04/s02
      - text: "Grete hat ein lebenslanges Wohnrecht; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor."
        from: ch04/s02
      - text: "Für den Anbau an seinem Herrenhaus weiter im Süden musste der alte Park weichen; das Haus läuft gut, aber seitdem fehlt ihm etwas."
        from: ch04/s02
      - text: "Er hat angeboten, Jonas Bedenkzeit in den Vertrag zu schreiben; Jonas hat den Notartermin am Montag zugesagt."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, hat Jonas im Notariat in der Kreisstadt in seinem Beisein den Vorvertrag über das Gut unterschrieben, mit Rücktrittsrecht bis zum 10. September."
        from: ch07/s01
      - text: "Jonas hat seinen Kugelschreiber mit dem Firmenlogo nach der Unterschrift zu ihm zurückgeschoben."
        from: ch07/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste von Weidenkamp heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, nah am Haus, und die Mauer gibt den Sichtschutz gratis."
        from: ch04/s02
      - text: "Für das Erntefest findet sich immer eine Lösung, eine Veranstaltungsfläche gegen Gebühr zu fairen Konditionen."
        from: ch04/s01
      - text: "Grete hat ihm mit Kaffee aus der guten Kanne nichts vorenthalten; er vermisste nichts."
        from: ch04/s01
      - text: "Der Kaffee im Notariat ist nicht so gut wie der von Frau Paulsen."
        from: ch07/s01
      - text: "Das Rücktrittsrecht ist eine Formalie: \"Gezogen hat so etwas bei uns noch nie jemand.\""
        from: ch07/s01
    does_not_know:
      - "Dass Jonas Hannes am 14. August zugesagt hat, das Erntefest finde dieses Jahr auf dem Gut statt."
      - "Dass der Festausschuss bis Freitag, den 14., eine Zusage von Jonas brauchte und sonst im Zelt hinter dem Feuerwehrhaus gefeiert hätte."
      - "Dass Jonas' Einlage bis Monatsende fällig ist und er auf Weidenkamps Anzahlung als Sicherheit für die Partner rechnet."
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat, der wieder eine Knospe trägt, und Stecklinge davon zieht."
      - "Dass Jonas als Junge mit Hedwig den ersten Steckling der Lindenhof-Rose im Garten gepflanzt hat."
      - "Dass Grete sonst nie Kaffee ohne Kuchen hinstellt."
      - "Dass Jonas Marie nur \"Ein Interessent\" gesagt hat und weder Marie noch Grete von der Unterschrift wissen."
      - "Dass das Dorf am Samstag Mitte Juli den Garten mit freigeräumt hat und Jonas mitgearbeitet hat."
      - "Dass an der Südmauer, wo die Stellplätze liegen sollen, eine alte 'Ghislaine de Féligonde' freigelegt wurde."
      - "Dass Marie und Jonas sich geküsst haben."
