based_on: ["ch06#b6bee4", "ch07/s01#9a76a7", "ch07/s02#3f30b8"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf die Treppe gelegt."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Früher bekam die junge Marie für eine Stunde Unkraut ein Stück Streuselkuchen, jeden Dienstag und Freitag; sie selbst hat darüber Buch geführt, auf der Rückseite vom Kalender."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Sie hat Jonas das Mittagessen ohne ein Wort hingestellt."
        from: ch03/s03
      - text: "Mitte Juli kam Ralf Steinhagen zu Jonas aufs Gut; er sprach sie mit Namen an und sagte, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Steinhagen und Jonas auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen, obwohl am Morgen Butterkuchenduft über dem Hof lag; dann ist sie ohne sich umzusehen ins Haus gegangen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli arbeiten Helfer aus dem Dorf im Rosengarten (Landfrauen, Feuerwehr, Nachbarn), Hannes mit dem Trecker, Lena mit dem Klemmbrett; Jonas kam in geliehenen Gummistiefeln aus der Remise."
        from: ch05/s01
      - text: "Sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt, damit diesmal keiner mit leerem Teller dastand, und eine zweite Kanne Kaffee gebracht."
        from: ch05/s01
      - text: "Jonas hat gefragt, ob er zu den Helfern zählt; sie hat ihm zwei Bier aus der Helferkiste gegeben, die Kronkorken gleich mit abgemacht, und ihm Quark für den Nacken angeboten."
        from: ch05/s03
      - text: "Dienstag Ende Juli hat sie mittags Buttermilch und ein Blech Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, wo Marie und Jonas Rosen zurückschnitten, und lange von Marie zu Jonas und zurück gesehen; dann ging sie ohne ein Wort zum Haus und nahm auf der Treppe jede Stufe einzeln."
        from: ch06/s01
      - text: "Marie hat Hedwigs Gartenbuch im Arbeitszimmer hiergelassen; es liegt dort auf dem Tisch neben der Lampe."
        from: ch06/s02
      - text: "Jonas hat an einem Donnerstag spät am Abend im Arbeitszimmer in den Ordnern Rechnungen fürs Dach gesucht und die fürs Dach gefunden; nach den Fenstern will er morgen weitersuchen."
        from: ch06/s02
      - text: "Jonas hat sich angeboten, ihren Einkauf (zehn Eier, ein Glas Rosengelee, Kartoffeln und Rindfleisch für Mittwoch) am Montag Anfang August auf dem Hansen-Hof zu holen; auf ihren Zettel hat sie doppelt unterstrichen geschrieben: Nicht vergessen zu bezahlen."
        from: ch06/s03
      - text: "Lena macht für sie montags den Hofladen auf, seit Jahren; die Strecke fährt sie seit Jahrzehnten."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet, ob der wiedergekommen ist; das hat sie Jonas am Donnerstag, dem 13. August, beim Essen gesagt."
        from: ch07/s01
      - text: "Jonas war am 13. August fort; auf ihre Frage sagte er, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes. Sie hat ihm Bratkartoffeln mit Spiegelei hingestellt und gesagt: Na, denn, Jung."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank im Garten gebracht, Marie ihren mit Milch, ihr Blick hing einen Augenblick zu lange an Jonas; dann ging sie wieder hinauf."
        from: ch07/s02
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Das Gartenbuch gehört ins Arbeitszimmer, und Hedwig hätte gewollt, dass Jonas hineinsieht."
        from: ch06/s02
    does_not_know:
      - "Dass Jonas am Donnerstag, dem 13. August, im Notariat in der Kreisstadt einen Vorvertrag mit Weidenkamp unterschrieben hat, mit Rücktrittsrecht bis zum 10. September."
      - "Dass die Mappe mit Vorvertrag und Lageplan im untersten Fach von Hedwigs Schreibtisch unter den Dachrechnungen liegt."
      - "Ob Jonas' Termine in der Stadt wirklich Büro waren (die Szene lässt offen, ob sie ihm glaubt)."
      - "Dass Jonas Hannes am 14. August zugesagt hat, dass das Erntefest dieses Jahr auf dem Gut stattfindet."
      - "Dass hinter dem Südende des Laubengangs der letzte Stock der Lindenhof-Rose steht, wieder austreibt und eine Knospe angesetzt hat."
      - "Dass Marie im Hinterhof der alten Schmiede in Klein Lindau Stecklinge der Lindenhof-Rose zieht."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Dass Jonas im Gartenbuch die Notiz über den ersten Steckling der Lindenhof-Rose gefunden hat, bei dem er als Kind das Loch gegraben hat."
      - "Die Einzelheiten der Absprache zwischen Jonas und Marie (Budget, Zwischenstände mit Fotos, freie Hand bei den Rosen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' erst entsorgen wollte und ihnen nun Punktfundamente gibt."
      - "Dass der Makler am letzten Freitag im Juli einen Fotografen schicken will."
      - "Dass Jonas die Rechnungen für einen Gutachter braucht, der den Wert des Guts ermittelt."
      - "Was Steinhagens Unterlagen enthalten: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg und ein Parkplatz auf dem Rosengarten."
      - "Dass Weidenkamp ihr lebenslanges Wohnrecht bestehen lässt, für ihren freiwilligen Auszug aber eine großzügige Abfindung vorsieht und Jonas sie darauf ansprechen soll."
      - "Dass Hannes Steinhagen nach dem Erntefest gefragt hat und Steinhagen eine Veranstaltungsfläche gegen Gebühr anbot."
      - "Dass der Festausschuss bis Freitag, den 14., eine Zusage von Jonas brauchte, sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert."
      - "Dass Jonas' Einlage fürs Büro bis Monatsende fällig ist."
      - "Dass Lena Jonas gewarnt hat, mit Marie keinen Sommer zu spielen."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg im Rosengarten ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Rings um die Sonnenuhr sitzen alte Holunderstubben unter dem Kies, an der Westseite ein Brombeerwurzelstock, dem Marie seit drei Tagen mit der Hacke nicht beikommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will langsam ziehen, nach Norden zum Tor hin, damit der Ballen die Rose nicht mitreißt."
        from: ch03/s02
      - text: "Mit derselben Kette hat er für Hedwig den Fliederbusch an der Remise herausgeholt."
        from: ch03/s02
      - text: "Er hat Jonas gefragt, ob das Erntefest auf dem Gut bleibt; Jonas sagte, das könne er noch nicht sagen, es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen, die er selbst noch nicht kenne."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Er bringt Sonnabend um halb acht den Trecker, um den Stubben herauszuziehen."
        from: ch03/s02
      - text: "Jonas hat ihm einen Becher Kaffee gebracht, schwarz, und Marie einen mit Milch."
        from: ch03/s02
      - text: "Mitte Juli schaufelt er mit Marie Kies vom Hänger auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht und Jonas getroffen; er kannte seinen Namen."
        from: ch04/s01
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund; Marie hielt dagegen, das sei ein Garten aus den Dreißigerjahren."
        from: ch04/s01
      - text: "Auf seine Frage, wo das Erntefest dann hin solle, sagte Steinhagen, es fände sich eine Lösung: eine Veranstaltungsfläche gegen Gebühr, für Vereine zu sehr fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kam er kurz nach sechs mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine; Timo brachte das zweite Gespann mit Kies für die Seitenwege."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln, eine Nummer zu groß, und sagte, er sei hier, um anzufassen; er hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Er hat mit einem Pfiff über den Garten klargestellt: Im Garten ist Marie die Chefin, wer das nicht weiß, fragt sie."
        from: ch05/s01
      - text: "Jonas ist als Kind, der Lütte von Hedwig, bei ihm auf dem Hänger über die Stoppeln mitgefahren, barfuß; Hedwig musste ihn mit Kuchen vom Hänger locken. Jonas sagt, an den Diesel erinnere er sich noch."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen frei; er hat Jonas die Hand gegeben, ihn Jonas genannt und Du zu ihm gesagt."
        from: ch05/s02
      - text: "Der Festausschuss hat am Sonntagabend Anfang August gesessen und braucht bis Freitag, den 14., eine Zusage von Jonas, auf die man bauen kann; sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert, das schon reserviert ist."
        from: ch06/s03
      - text: "Er hat Jonas das am Montag Anfang August am Hoftor des Hansen-Hofs gesagt, als Jonas Gretes Einkaufskiste in den Kofferraum trug; Jonas hat geantwortet: Bis dahin kriegst du eine Antwort."
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, nachmittags, hat er am schmiedeeisernen Tor die Antwort eingefordert; Jonas hat gesagt: Das Fest findet dieses Jahr auf dem Gut statt."
        from: ch07/s02
      - text: "Nach Jonas' Antwort ist Marie Jonas um den Hals gefallen, so heftig, dass er einen Schritt zurück gegen das Tor machen musste."
        from: ch07/s02
    believes:
      - text: "Im Garten läuft es (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Mit dem Spaten wird das nichts; mit Kette und Trecker ist der Stubben schnell heraus."
        from: ch03/s02
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Jonas hat gut gearbeitet; morgen tut ihm alles weh."
        from: ch05/s02
      - text: "Die Frist ist keine Drohung; die Leute wollen wissen, wo sie ihre Bänke hinstellen."
        from: ch06/s03
      - text: "Das Erntefest bleibt dieses Jahr auf dem Gut; nun kann er den Weizen in Ruhe dreschen."
        from: ch07/s02
    does_not_know:
      - "Dass Jonas am Donnerstag, dem 13. August, einen Vorvertrag mit Weidenkamp unterschrieben hat, mit Rücktrittsrecht bis zum 10. September, fünf Tage nach dem Fest."
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat und Stecklinge davon zieht."
      - "Dass Steinhagens Lageplan den Parkplatz genau auf den Rosengarten legt."
      - "Was Steinhagen und Jonas im Salon besprochen haben."
      - "Dass Jonas' Einlage fürs Büro bis Monatsende fällig ist und er den Termin der Partner am 13. nicht wahrgenommen hat."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
  jonas-behrendt:
    knows:
      - text: "Die Gärtnerin im Rosengarten heißt Marie Albers."
        from: ch01/s01
      - text: "Marie hält die Kletterrose am Hauptweg für eine 'New Dawn', kein Gestrüpp, und lehnt Bagger und Splitt auf dem Weg ab."
        from: ch01/s01
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite; für das Dach stand ein Angebot vom Dachdecker bis Ende Juni aus."
        from: ch01/s02
      - text: "Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen, über die Wege wird noch geredet; ihr Stundensatz steht nicht zur Verhandlung."
        from: ch01/s02
      - text: "Neue Absprache mit Marie: Die Rankbögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief); er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg Ende Juni frei zu haben, vom Tor bis zur Pforte, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Für die Partnerschaft im Büro ist seine Einlage fällig."
        from: ch02/s02
      - text: "Laut Makler gibt es einen Kaufinteressenten aus der Hotelbranche."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben (gute Wege, Blüten mit Blick vom Haus, keine Ecke, die nach Arbeit aussieht), dann gehe es um andere Zahlen; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Am letzten Freitag im Juli soll ein Fotograf des Maklers den Garten fotografieren."
        from: ch02/s02
      - text: "Erinnerung aus der Kindheit: ein Floß aus Brettern am Gutssee, und Hedwig rief ihn zum Kuchen."
        from: ch02/s02
      - text: "Die Rankbögen der 'Ghislaine' sitzen fest im Beton und halten; er hat nachgerechnet, was die Fundamente tragen müssen."
        from: ch03/s01
      - text: "Seit dem Gewitter unter den Bögen sagen er und Marie Du zueinander."
        from: ch03/s01
      - text: "Laut Marie hat Hedwig ihr mit zehn den ersten Rosenschnitt beigebracht (über dem Auge, schräg) und ihr ihre alte Schere mit dem roten Griff geschenkt, die Marie noch heute benutzt."
        from: ch03/s01
      - text: "Laut Marie bekam sie als Kind von Grete für eine Stunde Unkraut ein Stück Streuselkuchen, dienstags und freitags, und kam im ersten Sommer jeden Tag mit dem Rad."
        from: ch03/s01
      - text: "Laut Marie redete Hedwig laut mit den Rosen, schimpfte mit der 'Rosa Mundi' und lobte die 'Ghislaine' jeden Juni; Marie redet ebenfalls mit den Rosen."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat Grete ihm gesagt."
        from: ch03/s02
      - text: "Hannes Kröger hat im Juni gefragt, ob das Erntefest auf dem Gut bleibt; damals hat er keine Zusage gegeben, Hannes hat nur genickt."
        from: ch03/s02
      - text: "Das Erntefest ist laut Hannes am ersten Samstag im September."
        from: ch03/s02
      - text: "Am Samstag Mitte Juli helfen Leute aus dem Dorf im Rosengarten; Hannes hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Die nummerierten Stellplätze des Lageplans reihen sich genau dort, wo er an der Südmauer gräbt."
        from: ch05/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; die Nummer hat er vom Makler. Steinhagen kennt Zimmerzahl, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen, verrutschte Pfannen und faulendes Laub in der Rinne."
        from: ch03/s03
      - text: "Grete hat ihm und Steinhagen auf der Terrasse Kaffee ohne Kuchen hingestellt; in all den Kindersommern hatte sie ihm keine Tasse ohne Kuchen hingestellt, bis zu diesem Morgen."
        from: ch04/s02
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund; Marie sagte, das sei keine Fläche, sondern ein Garten aus den Dreißigerjahren, und die 'Rosa Mundi' sei älter als sie und Steinhagen zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; er selbst hat dazu geschwiegen."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz unten am Steg; er hat Grundrisse, Schnitte und eine Kostenschätzung nach Gewerken durchgesehen, die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Laut Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit einer Zufahrt durch das Tor; ein paar Rosen will Weidenkamp als Akzent in Kübeln behalten."
        from: ch04/s02
      - text: "Grete behält ihr lebenslanges Wohnrecht; zieht sie freiwillig aus, sieht Weidenkamp eine großzügige Abfindung vor. Steinhagen bat ihn, das bei Gelegenheit bei ihr anzusprechen."
        from: ch04/s02
      - text: "Steinhagen erzählte von einem Herrenhaus weiter im Süden, dessen alter Park für den Anbau weichen musste; das Haus läuft gut, aber seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Die Kopie des Lageplans mit den nummerierten Kästchen über dem ganzen Garten liegt im Salon unter seinem Laptop auf dem ovalen Tisch."
        from: ch06/s02
      - text: "Auf Maries Frage, was Steinhagen wollte, hat er nur gesagt: ein Interessent."
        from: ch04/s02
      - text: "Lena hat ihn beim Helfersamstag den ganzen Tag gesiezt, das Klemmbrett vor der Brust; um fünf fragte sie, ob er nächsten Samstag Zeit habe, und er hat Ja gesagt."
        from: ch05/s03
      - text: "Laut Hannes ist er als Kind barfuß auf Hannes' Hänger über die Stoppeln mitgefahren, nach der Gerste, und Hedwig musste ihn mit Kuchen herunterlocken; er erinnert sich an Diesel und Stroh, Hannes' Gesicht hat er nicht behalten."
        from: ch05/s02
      - text: "In der Mitte der Südmauer, nahe der Pforte, wächst unter den Ranken ein alter Rosenstock; Marie sagt, es ist eine 'Ghislaine de Féligonde', die seit Jahren keiner mehr gesehen hat."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte bis zum Geräteschuppen frei; Hannes hat ihm die Hand gegeben, ihn Jonas genannt und Du zu ihm gesagt."
        from: ch05/s02
      - text: "Grete hat ihm auf seine Frage, ob er zu den Helfern zählt, zwei Bier gegeben und Quark für seinen Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "Er hat Marie am Steg von seinen Flößen erzählt: drei, das größte mit Zeichnung geplant, mitten auf dem See abgesoffen; Hedwig lachte am Ufer und sagte, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Er und Marie haben sich bei Sonnenuntergang am Steg geküsst; er hat gesagt, das wollte er seit dem Gewitter, und Marie sagte: Ich auch."
        from: ch05/s03
      - text: "Auf Maries Frage, ob er im Herbst noch hier ist, hat er geantwortet: Ich weiß es nicht."
        from: ch05/s03
      - text: "Laut Marie sind Ende Juli die Gallica und die Damaszener am Tor zum Rückschnitt dran, weil sie nur einmal im Jahr blühen; die Büsche am Rondell bleiben, wie sie sind, und hängen im September voller roter Hagebutten."
        from: ch06/s01
      - text: "Das Junibild kommt laut Marie nicht wieder; Glanz im September heißt: die 'New Dawn' blüht nach, davor Lavendel und Katzenminze, Frauenmantel an den Kanten, Astern, am Laubengang Dahlien in Reihen."
        from: ch06/s01
      - text: "Grete hat mittags Buttermilch und Johannisbeerkuchen auf die Bank gestellt, lange von Marie zu ihm gesehen und auf der Treppe jede Stufe einzeln genommen; laut Marie meldet sich das bei Grete nur bei Regen, sagt Grete."
        from: ch06/s01
      - text: "Lena hat ihn für den Samstag schon eingetragen, mit Ankunft und Abfahrt; sein Name steht auf der Helferliste am schwarzen Brett im Hofladen. Welchen Samstag, hat er nicht nachgelesen."
        from: ch06/s03
      - text: "Auf seine Nachricht, ob sie morgen wiederkommt, schrieb Marie: Die Rosen fragen das nicht. Die wissen das."
        from: ch06/s01
      - text: "Der Gutachter will für die Wertermittlung jede Rechnung für Dach und Fenster in der Hand haben; die Rechnung fürs Dach (Umdeckung Nordseite, mit Stempel) hat er gefunden, nach den Fenstern sucht er weiter."
        from: ch06/s02
      - text: "Die Fensterflügel im Arbeitszimmer bleiben nach einer Handbreit stecken."
        from: ch06/s02
      - text: "Marie hat Hedwigs Gartenbuch im Arbeitszimmer hiergelassen; laut Grete gehört es dahin, und Hedwig hätte gewollt, dass er hineinsieht."
        from: ch06/s02
      - text: "Im Gartenbuch steht unter der Überschrift Lindenhof-Rose, datiert auf einen Juli vor sechsundzwanzig Jahren: Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen."
        from: ch06/s02
      - text: "Er erinnert sich wieder: Er hat als Kind mit Hedwig den Steckling aus einem Erdbeer-Joghurtbecher gepflanzt, sie sagte 'Nicht drücken', und er hat ihn danach jeden Morgen barfuß mit dem Lineal gemessen; am fünften Tag waren es dreieinhalb."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet; zu Weihnachten ein Anruf von zehn Minuten."
        from: ch06/s02
      - text: "Lena macht für Grete montags den Hofladen auf, seit Jahren; Frieda hat von 'Tante Rosen' eine Dahlie geschenkt bekommen."
        from: ch06/s03
      - text: "Lena hat ihm im Hofladen gesagt: Marie ist keine, mit der man einen Sommer spielt; tut er es doch, nimmt sie es ihm übel, und das ganze Dorf mit ihr. Auf seine Frage, ob Marie ihr etwas gesagt habe, sagte Lena, das müsse er Marie selbst fragen."
        from: ch06/s03
      - text: "Der Festausschuss brauchte laut Hannes bis Freitag, den 14., eine Zusage, auf die man bauen kann, sonst wird im reservierten Zelt hinter dem Feuerwehrhaus gefeiert."
        from: ch06/s03
      - text: "Nur oben auf dem Hügel hinter der Scheune kommt das Gespräch aus dem Büro durch."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, kurz nach sieben, hat er dort mit einem Partner telefoniert; der akzeptiert, dass er heute nicht nach Hamburg kommt. Die Hamburger Uhrzeit auf dem Briefumschlag ist durchgestrichen."
        from: ch07/s01
      - text: "Die Einlage fürs Büro ist bis Monatsende fällig, nicht erst zum Jahresende; ihm bleiben achtzehn Tage."
        from: ch07/s01
      - text: "Zehn Minuten nach dem Anruf hat der Dachdecker zurückgerufen und eine Summe für den Herbst genannt; er hat sie unter die durchgestrichene Hamburger Uhrzeit auf den Briefumschlag geschrieben."
        from: ch07/s01
      - text: "Am Morgen des 13. August hielt Marie mit ihrem weißen Kastenwagen am Tor und hob eine Kiste mit Töpfen heraus, ohne zum Hügel heraufzusehen; er ist auf der anderen Seite zum Kombi hinuntergegangen."
        from: ch07/s01
      - text: "Er hat am 13. August im Notariat in der Kreisstadt, eine halbe Stunde vom Gut, im Beisein von Steinhagen den Vorvertrag mit Weidenkamp unterschrieben, ohne abzusetzen."
        from: ch07/s01
      - text: "Der Vorvertrag hat ein Rücktrittsrecht bis zum zehnten September, fünf Tage nach dem Fest; laut Steinhagen hat so etwas bei ihnen noch nie jemand gezogen."
        from: ch07/s01
      - text: "Laut Lageplan in der Vertragsmappe reicht die graue Fläche der Stellplätze bis an die Mauer, bis in die Ecke hinter dem Laubengang."
        from: ch07/s01
      - text: "Die Mappe mit Vorvertrag und Lageplan liegt im untersten Fach von Hedwigs Schreibtisch unter den Dachrechnungen, Kante auf Kante; das Gartenbuch liegt daneben auf dem Tisch."
        from: ch07/s01
      - text: "Laut Grete redet das Dorf über den Herrn mit dem silbernen Auto, ob der wiedergekommen ist; er hat ihr gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat Marie ihn in den Winkel hinter dem letzten Bogen des Laubengangs geführt: Dort steht die Lindenhof-Rose, von Hedwig selbst gezogen, der einzige noch lebende Stock, kniehoch und krumm, mit einer Knospe; Marie sagt, er blüht wieder."
        from: ch07/s02
      - text: "Marie hat den alten Stock im Juni unter den Brombeeren gefunden und die Ecke seither vor allen versteckt."
        from: ch07/s02
      - text: "Er hat Hannes am 14. August nachmittags am Tor geantwortet: Das Fest findet dieses Jahr auf dem Gut statt. Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Die Gummistiefel aus der Remise sind ihm noch immer eine Nummer zu groß; sie gehören ihm nicht mal."
        from: ch07/s02
    believes:
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Das Haupthaus ist schlimmer dran als das Scheunendach."
        from: ch03/s03
      - text: "Steinhagen ist der Käufer, den er wollte: einer, der rechnen kann, in Flächen und Fristen denkt und sich nicht lange bitten lässt."
        from: ch03/s03
      - text: "Mit einem Parkplatz hat er seit dem Wort Stellplatzlösung gerechnet, mit der Zeile über Gretes Abfindung nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "'Ein Interessent' war nicht gelogen, aber so wenig, dass es kaum noch Gewicht hatte; warum er Marie nicht mehr gesagt hat, weiß er selbst nicht."
        from: ch04/s02
      - text: "Die jungen Triebe an der Südmauer haben dieselben kleinen, glänzenden Blätter wie die Rose an den Bögen, die er im Juni verschrotten wollte."
        from: ch05/s02
      - text: "Er hat das fremde, warme Gefühl, auf dem Gut mitgerechnet zu werden."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Er ist nicht so klug wie Maries Rosen."
        from: ch06/s01
      - text: "Einer der nummerierten Stellplätze des Lageplans liegt über dem Loch, das er als Kind für den Steckling gegraben hat; welches Kästchen, hat er nie ausgerechnet und tut es auch jetzt nicht."
        from: ch07/s01
      - text: "Den Fund im Gartenbuch erzählt er weder Grete noch Marie; ob es Scham ist oder ob er nur etwas festhält, das hier als Einziges ihm allein gehört, weiß er nicht."
        from: ch06/s02
      - text: "Er versteht den Partner wirklich; er hätte es selbst so gesagt."
        from: ch07/s01
      - text: "Das Geld für Einlage und Dach besitzt er nur, wenn er das Gut verkauft."
        from: ch07/s01
      - text: "Mit der Unterschrift zahlt Weidenkamp eine Anzahlung, und die reicht den Partnern als Sicherheit."
        from: ch07/s01
      - text: "Vor Ablauf der Frist muss es keiner wissen, Marie nicht und Grete nicht."
        from: ch07/s01
    does_not_know:
      - "Ob die Partner die Anzahlung von Weidenkamp als Sicherheit annehmen."
      - "Wo genau im Garten er den Steckling damals gepflanzt hat."
      - "Dass Marie im Hinterhof der alten Schmiede in Klein Lindau zwei lebende Stecklinge der Lindenhof-Rose zieht."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten, und was Hedwig ihr im letzten Herbst auf der Bank gesagt hat."
      - "Dass Marie mit Lena über ihn gesprochen hat und Lena meint, Marie habe Gefühle für ihn."
      - "Dass Marie ihn vielleicht als Jungen oben auf der Gartenmauer gesehen hat."
      - "Ob Grete ihm die Ausrede mit den Terminen in der Stadt glaubt."
  lena-hansen:
    knows:
      - text: "Laut Marie stand in Jonas' Tabelle beim Laubengang 'Entsorgung' für beide Rankbögen der 'Ghislaine', die zweiundfünfzig Jahre alt sind."
        from: ch02/s03
      - text: "Laut Marie kniete Jonas in heller Hose ins nasse Gras vor den Bogen, rüttelte am Eisen, stellte fehlendes Fundament fest und skizzierte eins auf die Rückseite seiner Tabelle: vierzig mal vierzig, achtzig tief wegen Frost."
        from: ch02/s03
      - text: "Laut Marie kam Jonas in geputzten Lederschuhen, seine Hose ist an beiden Knien grün und hin, und am ersten Tag ließ er sie samt Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Marie sagt, sie habe Jonas dazu gebracht, die Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Marie hat zehn Eier für den nächsten Morgen gekauft und zwei Stück Butterkuchen von ihr bekommen; sie sehen sich am Freitag wieder."
        from: ch02/s03
      - text: "Am Samstag Mitte Juli hat sie am Tor die Helfer abgehakt (drei Landfrauen mit Hacken, vier Mann von der Feuerwehr, die Nachbarn vom Dorfteich mit Schubkarren) und die Arbeit verteilt: Wege harken, Giersch an der Westmauer, Kies schaufeln."
        from: ch05/s01
      - text: "Marie hat ihren Rosen Namensschilder gemacht, damit keiner was rausreißt."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln; sie hat ihn gesiezt und eingetragen."
        from: ch05/s01
      - text: "Um fünf hat sie Jonas gefragt, ob er nächsten Samstag Zeit hat, und er hat Ja gesagt; auf der Helferliste am schwarzen Brett im Hofladen steht er mit Ankunft und Abfahrt."
        from: ch06/s03
      - text: "Für Grete macht sie montags den Hofladen auf, seit Jahren; am Montag Anfang August hat Jonas Gretes Einkauf geholt, und sie hat die Kiste gepackt, ohne auf den Zettel zu sehen."
        from: ch06/s03
      - text: "Sie hat Jonas gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie es ihm übel, und das ganze Dorf mit ihr; auf seine Frage, ob Marie ihr etwas gesagt habe, hat sie ihn an Marie verwiesen."
        from: ch06/s03
      - text: "Laut Frieda hat Tante Rosen ihr eine Dahlie geschenkt."
        from: ch06/s03
    believes:
      - text: "Marie hat Gefühle für Jonas; dass sie seit zwanzig Minuten über seine Schuhe redet, ist kein gutes oder ein sehr gutes Zeichen."
        from: ch02/s03
      - text: "Die Landfrauen stechen Giersch, seit Marie laufen kann; Namensschilder brauchen sie nicht."
        from: ch05/s01
      - text: "Die Dahlie im Glas hält eine Woche."
        from: ch06/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat und Stecklinge davon zieht."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt und Ralf Steinhagen von Weidenkamp Hotels das Gut Mitte Juli besichtigt hat."
      - "Dass Jonas am 13. August einen Vorvertrag mit Weidenkamp unterschrieben hat."
      - "Dass Weidenkamp auf dem Rosengarten einen Parkplatz plant."
      - "Dass Jonas Hannes am 14. August zugesagt hat, dass das Erntefest dieses Jahr auf dem Gut stattfindet."
      - "Dass Jonas den Hauptweg Ende Juni frei haben wollte."
      - "Dass Marie und Jonas seit dem Gewitter unter den Bögen Du zueinander sagen."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
      - "Dass Jonas' Einlage fürs Büro bis Monatsende fällig ist."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe aus Hamburg."
        from: ch01/s01
      - text: "Jonas will den Rosengarten bis zum Erntefest am 5. September hergerichtet haben: Wege begehbar, Beete sauber, alles, was man vom Haus aus sieht."
        from: ch01/s02
      - text: "Jonas will das Gut verkaufen."
        from: ch01/s02
      - text: "Absprache mit Jonas: freie Hand bei den Rosen, über die Wege wird noch geredet; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Grete hat ihr zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Laut Hedwigs Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Neue Absprache: Die Rankbögen bleiben und bekommen Punktfundamente, Jonas bestellt Beton, sie bindet die Rose selbst wieder an; dafür muss der Hauptweg Ende Juni frei sein, vom Tor bis zur Pforte, mit Fotos."
        from: ch02/s01
      - text: "Die Bögen sitzen fest im Beton; Jonas hat daran gerüttelt, nichts gab nach. Sie bindet die 'Ghislaine' wieder an, danach kommt der achte Bogen dran."
        from: ch03/s01
      - text: "Seit dem Gewitter unter den Bögen sagen sie und Jonas Du zueinander; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Hedwig hat ihr mit zehn den ersten Rosenschnitt beigebracht, über dem Auge, schräg, und ihr die alte Schere mit dem roten Griff geschenkt, die sie heute noch hat und benutzt."
        from: ch03/s01
      - text: "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu ihr gesagt hat; sie trägt es seither mit sich und hat es niemandem erzählt."
        from: ch03/s01
      - text: "Der Hauptweg ist frei; Hannes hat den Garten gelobt (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Auf Hannes' Frage im Juni, ob das Erntefest auf dem Gut bleibt, hat Jonas damals keine Zusage gegeben: es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker, um die Stubben an der Sonnenuhr zu ziehen, nach Norden zum Tor hin, weg von der 'Rosa Mundi'."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Jonas hat ihr Kaffee mit Milch gebracht; dass sie Milch nimmt, hat er von Grete."
        from: ch03/s02
      - text: "Mitte Juli schaufelt sie mit Hannes Kies auf die Hauptachse."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht und mit Jonas auf der Terrasse gesessen; worüber sie sprachen, hat sie nicht gehört."
        from: ch04/s01
      - text: "Grete hat den beiden Kaffee ohne Kuchen gebracht, obwohl am Morgen Butterkuchenduft über dem Hof lag."
        from: ch04/s01
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund und sagte, der Garten werde auf den Fotos sehr schön; von welchen Fotos er sprach, weiß sie nicht."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; Jonas schwieg."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, sagte Jonas nur: ein Interessent."
        from: ch04/s02
      - text: "Für den Helfersamstag Mitte Juli hat sie an jeden Stock, der stehen bleiben muss, ein Pappschild mit der Sorte gehängt, vom Tor bis zur Pforte; die Mauerecke hinter dem Südende des Laubengangs hat sie im Dunkeln selbst freigeschnitten und nur mit einem leeren Schild an einem Pfahl markiert."
        from: ch05/s01
      - text: "Hannes hat Jonas an die Brombeeren an der Südmauer westlich der Pforte geschickt, fort von der Ecke am Laubengang."
        from: ch05/s01
      - text: "Hannes hat über den Garten gerufen, im Garten sei sie die Chefin."
        from: ch05/s01
      - text: "Ole von der Feuerwehr hat an der 'Maiden's Blush' einen langen Trieb abgeknickt; sie hat ihn mit Hedwigs Schere eine Handbreit tiefer abgeschnitten. Die Rose lebt, aber daran hätten im nächsten Juni Blüten gesessen."
        from: ch05/s01
      - text: "Jonas hat an der Südmauer nahe der Pforte einen alten Stock der 'Ghislaine de Féligonde' freigelegt, den seit Jahren keiner gesehen hat; sie hat die jungen Triebe lose mit Bast angebunden."
        from: ch05/s02
      - text: "Grete hat Jonas zwei Bier aus der Helferkiste gegeben und ihm Quark für den Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "Lena hat Jonas den ganzen Tag gesiezt und ihn um fünf gefragt, ob er nächsten Samstag Zeit hat; laut Jonas hat Lena ihn schon eingetragen, mit Ankunft und Abfahrt."
        from: ch06/s01
      - text: "Jonas hat als Junge am See Flöße gebaut, aus Brettern aus der Remise mit Wäscheleine; das größte soff mitten auf dem See ab, Hedwig lachte und sagte, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Sie und Jonas haben sich bei Sonnenuntergang am Steg geküsst; er sagte, das wollte er seit dem Gewitter, sie sagte: Ich auch."
        from: ch05/s03
      - text: "Mats hat die Bank im Garten gerichtet, die Latten neu verschraubt und das Holz glatt geschliffen."
        from: ch05/s03
      - text: "Auf ihre Frage, ob er im Herbst noch hier ist, hat Jonas gesagt: Ich weiß es nicht."
        from: ch05/s03
      - text: "Dienstag Ende Juli schneidet sie mit Jonas die einmalblühenden Gallica und Damaszener zurück; sie hat ihm erklärt, dass das Junibild nicht wiederkommt und Glanz im September Nachblüte der 'New Dawn', Stauden, Astern und Dahlien am Laubengang heißt."
        from: ch06/s01
      - text: "Grete hat mittags Buttermilch und Johannisbeerkuchen auf die Bank gestellt, lange von ihr zu Jonas und zurück gesehen und ist ohne ein Wort zum Haus gegangen, jede Stufe einzeln; laut Grete meldet sich das nur bei Regen."
        from: ch06/s01
      - text: "In der Mauerecke hinter dem Südende des Laubengangs steht der alte Stock der Lindenhof-Rose frei von Brombeeren, mit Licht bis an den Boden; unten schieben sich zwei neue rötliche Triebe aus dem Holz."
        from: ch06/s01
      - text: "Im Hinterhof der alten Schmiede in Klein Lindau zieht sie unter Folie Stecklinge der Lindenhof-Rose: zwei leben, an einem dehnt sich ein Auge; der dritte ist schwarz geworden, sie hat ihn auf den Kompost gelegt. Niemand weiß davon."
        from: ch06/s01
      - text: "Jonas hat ihr abends geschrieben: Kommst du morgen wieder? Auf ihre Antwort, die Rosen fragten das nicht, schrieb er: Ich bin nicht so klug wie deine Rosen."
        from: ch06/s01
      - text: "Am Freitag, dem 14. August, sitzen an der Spitze eines Triebs der 'New Dawn' über der Bank drei schmale Knospen, die oberste schon mit einem Hauch Rosa; am Laubengang haben die ersten Dahlien aufgemacht."
        from: ch07/s02
      - text: "Der alte Stock der Lindenhof-Rose in der Mauerecke hinter dem letzten Bogen ist kniehoch und krumm; am längeren der neuen Triebe sitzt eine einzelne Knospe, kaum größer als eine Erbse, grün, mit einem rosa Saum."
        from: ch07/s02
      - text: "Sie hat Jonas am 14. August die Ecke gezeigt, die sie seit Juni vor allen versteckt hatte, und ihm gesagt: Die Lindenhof-Rose, Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock, und der blüht wieder. Jonas blieb stumm, das Gesicht so still wie an ihrem ersten Tag am Tor."
        from: ch07/s02
      - text: "Mittags hat Grete Butterkuchen und Kaffee auf die Bank gebracht, ihren mit Milch; Gretes Blick hing einen Augenblick zu lange an Jonas."
        from: ch07/s02
      - text: "Jonas hat ihre Hand umgedreht und ihre Finger geküsst, einen nach dem anderen, dort, wo die Dornen rote Striche gezogen hatten."
        from: ch07/s02
      - text: "Jonas sagt, die Gummistiefel aus der Remise gehören ihm nicht mal; sein Lachen hörte zu früh auf, und er griff nach einem zweiten Stück Kuchen, obwohl das erste noch halb auf dem Teller lag."
        from: ch07/s02
      - text: "Hannes kam am 14. August nachmittags ans Tor: Heute ist Freitag, heute ist die Antwort fällig; davon hatte ihr niemand etwas erzählt. Jonas antwortete: Das Fest findet dieses Jahr auf dem Gut statt."
        from: ch07/s02
      - text: "Sie ist Jonas um den Hals gefallen; seine Arme kamen einen Atemzug später als sonst, dann hielten sie sie fester als nötig."
        from: ch07/s02
    believes:
      - text: "Splitt auf dem Hauptweg würde den alten Kies zerstören."
        from: ch01/s01
      - text: "Den Winkel hinter dem Laubengang sieht man von der Terrasse nicht, und in Jonas' Tabelle kommt er nicht vor."
        from: ch01/s03
      - text: "Sie hat Jonas dazu gebracht, Hedwigs Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Das hinter dem Haus ist keine Fläche, sondern ein Garten, angelegt in den Dreißigerjahren; die 'Rosa Mundi' ist älter als sie und Steinhagen zusammen und treibt jedes Frühjahr wieder aus."
        from: ch04/s01
      - text: "Lenas Ton gegenüber Jonas ist ihr Vertreterton aus dem Hofladen; Lena misstraut jedem ohne Klemmbrett."
        from: ch06/s01
      - text: "Ihr Herzklopfen damals beim Gewitter kam nicht vom Wetter."
        from: ch05/s03
      - text: "Der dünne barfüßige Junge, den sie einmal oben auf der Gartenmauer gesehen hat, war vielleicht Jonas."
        from: ch05/s03
      - text: "Weil aus Haus und Garten keine Nachricht durchkommt, schreibt Jonas ihr vom Hügel hinter der Scheune."
        from: ch06/s01
      - text: "Der Garten ist gerettet; das Fest bleibt auf dem Gut."
        from: ch07/s02
      - text: "Grete mustert jeden so, der zu wenig isst; ihr Blick galt nur Jonas' Appetit."
        from: ch07/s02
      - text: "Die Rosen wussten das schon."
        from: ch07/s02
    does_not_know:
      - "Dass Jonas am Donnerstag, dem 13. August, im Notariat in der Kreisstadt einen Vorvertrag mit Weidenkamp unterschrieben hat, mit Rücktrittsrecht bis zum 10. September, fünf Tage nach dem Fest."
      - "Dass die Stellplätze laut Lageplan bis in die Ecke hinter dem Laubengang reichen, wo die Lindenhof-Rose steht."
      - "Dass die Mappe mit Vorvertrag und Lageplan im untersten Fach von Hedwigs Schreibtisch unter den Dachrechnungen liegt."
      - "Dass Jonas am Morgen des 13. August auf dem Hügel stand, als sie am Tor hielt, und auf der anderen Seite zum Kombi hinunterging."
      - "Dass Jonas eine Einlage für die Partnerschaft schuldet, die bis Monatsende fällig ist, und das Geld dafür nur aus dem Verkauf des Guts hat."
      - "Was der Dachdecker für den Herbst verlangt und wie schlimm es um Fenster und Dach des Gutshauses steht."
      - "Dass Jonas als Kind mit Hedwig den ersten Steckling der Lindenhof-Rose gepflanzt hat und das im Gartenbuch gelesen hat."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Dass ein Gutachter den Wert des Guts ermittelt."
      - "Dass am letzten Freitag im Juli ein Fotograf des Maklers den Garten fotografieren sollte."
      - "Was Weidenkamp plant: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg."
      - "Dass Steinhagens Lageplan den Parkplatz genau auf den Rosengarten legt und nur ein paar Rosen in Kübeln bleiben sollen."
      - "Dass Weidenkamp Grete für einen freiwilligen Auszug eine Abfindung anbieten will."
      - "Dass eine Kopie des Lageplans im Salon unter Jonas' Laptop liegt."
      - "Dass Lena Jonas im Hofladen gewarnt hat, mit ihr keinen Sommer zu spielen."
      - "Dass Jonas sie vom Hügel aus bei der Arbeit beobachtet hat, am Laubengang und am Rondell."
      - "Dass Jonas als Kind auf Hannes' Hänger mitgefahren ist und Hannes ihn nicht vergessen hat."
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor so still werden ließ."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zahl der Zimmer im Gutshaus, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Die Namen von Marie Albers, Hannes Kröger und Grete Paulsen."
        from: ch04/s01
      - text: "Laut Marie ist der Garten in den Dreißigerjahren angelegt, mit diesen Wegen und dieser Mauer, und die 'Rosa Mundi' ist älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes Kröger fragt, wo das Erntefest hin soll, wenn das Gut ein Hotel wird."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht."
        from: ch04/s02
      - text: "Jonas hat Mitte Juli die Unterlagen durchgesehen und damals nichts zugesagt und nichts abgesagt; er nannte die Abfindung großzügig und widersprach nicht."
        from: ch04/s02
      - text: "Jonas hat am Donnerstag, dem 13. August, im Notariat in der Kreisstadt den Vorvertrag mit Weidenkamp unterschrieben, ohne abzusetzen, mit seinem Kugelschreiber mit Firmenlogo; Jonas hat ihm den Kugelschreiber zurückgeschoben."
        from: ch07/s01
      - text: "Der Vorvertrag hat ein Rücktrittsrecht für Jonas bis zum zehnten September."
        from: ch07/s01
      - text: "Auf der Kreisstraße hat er drei Mähdrescher gezählt; Jonas wollte im Notariat nur Wasser."
        from: ch07/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste von Weidenkamp heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, nah am Haus, kurze Wege, die Mauer gibt Sichtschutz gratis."
        from: ch04/s02
      - text: "Für das Erntefest findet sich eine Lösung: eine Veranstaltungsfläche gegen Gebühr, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Seinem Herrenhaus im Süden fehlt etwas, seit der alte Park für den Anbau weichen musste; was, könnte er nicht sagen."
        from: ch04/s02
      - text: "Das Rücktrittsrecht ist eine Formalie; gezogen hat so etwas bei ihnen noch nie jemand."
        from: ch07/s01
      - text: "Der Kaffee im Notariat ist nicht so gut wie der von Frau Paulsen."
        from: ch07/s01
    does_not_know:
      - "Dass Jonas Hannes am 14. August zugesagt hat, dass das Erntefest dieses Jahr auf dem Gut stattfindet."
      - "Dass Hedwig sich gewünscht hat, der Rosengarten möge zum Erntefest wieder blühen."
      - "Dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht, wieder eine Knospe hat und Jonas als Kind beim ersten Steckling geholfen hat."
      - "Dass Helfer aus dem Dorf den Rosengarten am Samstag Mitte Juli gemeinsam hergerichtet haben und Jonas mit angepackt hat."
      - "Dass an der Südmauer ein alter Stock der 'Ghislaine de Féligonde' freigelegt wurde."
      - "Dass der Festausschuss bis Freitag, den 14., eine Zusage von Jonas verlangt hat, sonst feiert das Dorf im Zelt hinter dem Feuerwehrhaus."
      - "Dass Jonas Marie und Grete nichts von der Unterschrift gesagt hat."
      - "Dass Jonas und Marie sich am Steg geküsst haben."
