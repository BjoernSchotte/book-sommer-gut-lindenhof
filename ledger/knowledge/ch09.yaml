based_on: ["ch08#5a55c3", "ch09/s01#75d690", "ch09/s02#0dccc9"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Früher bekam die junge Marie für eine Stunde Unkraut ein Stück Streuselkuchen, jeden Dienstag und Freitag; sie selbst hat darüber Buch geführt, auf der Rückseite vom Kalender."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Mitte Juli kam Ralf Steinhagen zu Jonas aufs Gut; sie hat den beiden auf der Terrasse Kaffee aus der guten Kanne eingeschenkt, ohne Kuchen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli arbeiten Helfer aus dem Dorf im Rosengarten (Landfrauen, Feuerwehr, Nachbarn), Hannes mit dem Trecker, Lena mit dem Klemmbrett; Jonas kam in geliehenen Gummistiefeln aus der Remise."
        from: ch05/s01
      - text: "Jonas hat gefragt, ob er zu den Helfern zählt; sie hat ihm zwei Bier aus der Helferkiste gegeben und ihm Quark für den Nacken angeboten."
        from: ch05/s03
      - text: "Dienstag Ende Juli hat sie Buttermilch und Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, wo Marie und Jonas Rosen zurückschnitten, und lange von Marie zu Jonas und zurück gesehen."
        from: ch06/s01
      - text: "Marie hat Hedwigs Gartenbuch im Arbeitszimmer hiergelassen; es liegt dort auf dem Tisch neben der Lampe."
        from: ch06/s02
      - text: "Jonas hat an einem Donnerstag spät am Abend im Arbeitszimmer in den Ordnern Rechnungen fürs Dach gesucht und die fürs Dach gefunden."
        from: ch06/s02
      - text: "Lena macht für sie montags den Hofladen auf, seit Jahren."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet und ob der wiedergekommen ist."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, hat sie Jonas nach dem Herrn mit dem silbernen Auto gefragt; Jonas sagte: Hier war er nicht. Ich hatte Termine in der Stadt. Nichts Besonderes."
        from: ch07/s01
      - text: "Freitag, den 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank gebracht, Maries mit Milch, und ihr Blick hing einen Augenblick zu lange an Jonas."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, backt sie einen Probe-Butterkuchen fürs Erntefest, diesmal mit mehr Mandeln, weil Hannes sagt, letztes Jahr sei er zu trocken gewesen."
        from: ch08/s02
      - text: "Marie kam an diesem Abend aufgewühlt in die Küche und sagte ihr nur ein Wort: Parkplatz."
        from: ch08/s02
      - text: "Sie hat Marie um Verzeihung gebeten, dass sie geschwiegen hat; sie hatte gedacht, Jonas sage es Marie selbst."
        from: ch08/s02
      - text: "Hedwig hat auch ihr gesagt, wen sie sich für den Garten wünscht; Marie hat genickt, als sie sie darauf ansprach, und weiß es also auch."
        from: ch08/s02
      - text: "Marie hat an ihrem Küchentisch geweint; sie hat ihr eine Ecke vom heißen Butterkuchen mitgegeben und sie gebeten, morgen zu sagen, ob er zu süß ist, und die Astern am Rondell zu gießen."
        from: ch08/s02
      - text: "Seit Donnerstag, dem 27. August, stand Maries weißer Kastenwagen nicht mehr am Tor."
        from: ch09/s01
      - text: "Am Montag, dem 31. August, abends in der Küche hat Jonas ihr gesagt: Ich fahr morgen früh nach Hamburg."
        from: ch09/s01
      - text: "Sie hat Jonas an diesem Abend Hedwigs alte blaue Keksdose aus dem Fach unter der Fensterbank hingeschoben: Hedwig hat alles aufgehoben. Lies das, Jung. Was du dann machst, ist deine Sache. Über Marie hat sie kein Wort gesagt."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, gegen sieben stand Maries Wagen früh am Tor; sie hat Marie einen Becher Kaffee mit Milch und einen Teller Butterkuchen auf die Bank unter der Kletterrose gestellt und nichts gefragt."
        from: ch09/s02
      - text: "Marie hat ihr gesagt, der Butterkuchen sei nicht zu süß und die Mandeln saftig, da habe Hannes nichts zu meckern; das habe sie ihr schon am Freitag sagen wollen."
        from: ch09/s02
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Das Gartenbuch gehört ins Arbeitszimmer, und Hedwig hätte gewollt, dass Jonas hineinsieht."
        from: ch06/s02
      - text: "Jonas hat beim Essen am 13. August geschwindelt; seit er klein war, sieht sie ihm an, wenn er schwindelt."
        from: ch08/s02
      - text: "Sie hat so was wie einen Parkplatz geahnt, das Wort nicht, aber so was; diesmal wollte sie es nicht wissen."
        from: ch08/s02
      - text: "Was Jonas mit dem macht, was in Hedwigs Dose liegt, ist seine Sache."
        from: ch09/s01
      - text: "Die Deern hat mehr Ausdauer als der Giersch."
        from: ch09/s02
    does_not_know:
      - "Dass Jonas am Dienstag, dem 1. September, vom Vorvertrag mit Weidenkamp zurückgetreten ist und die 38.000 Euro für Notar und Planung selbst trägt."
      - "Dass Jonas in Hamburg die Partnerschaft im Büro persönlich absagen will."
      - "Dass Jonas Hannes gesagt hat, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, und dass Hannes das Zelt abbestellt."
      - "Was genau in der Keksdose liegt (Jonas' Kinderbriefe, die Zeichnung vom Mädchen auf der Mauer, die Postkarten) und was Jonas nachts darin gelesen hat."
      - "Dass hinter dem Südende des Laubengangs der letzte Stock der Lindenhof-Rose steht und nun blüht."
      - "Dass Marie in Klein Lindau Stecklinge der Lindenhof-Rose gezogen und einen davon am 2. September neben den alten Stock gepflanzt hat."
      - "Wo Marie seit Donnerstag gewesen ist."
      - "Dass Jonas im Gartenbuch die Notiz über den ersten Steckling der Lindenhof-Rose gefunden hat, bei dem er als Kind das Loch gegraben hat."
      - "Was Steinhagens Unterlagen genau enthalten: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg und den Parkplatz genau auf dem Rosengarten."
      - "Dass Weidenkamp ihr lebenslanges Wohnrecht bestehen lässt, für ihren freiwilligen Auszug aber eine großzügige Abfindung vorsah."
      - "Dass Jonas' 'Termine in der Stadt' am 13. August die Unterschrift unter einen Vorvertrag mit Weidenkamp beim Notar waren, mit Rücktrittsrecht bis zum 10. September."
      - "Dass Marie die Mappe mit Vorvertrag und Lageplan in Hedwigs Schreibtisch gefunden und Jonas im Arbeitszimmer zur Rede gestellt hat."
      - "Dass Lena Jonas gewarnt hat, mit Marie keinen Sommer zu spielen."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
      - "Dass Marie in der Nacht zu Lena auf den Hansen-Hof gegangen ist und ihr alles erzählt hat."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg im Rosengarten ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Er hat Jonas im Juni gefragt, ob das Erntefest auf dem Gut bleibt; Jonas sagte, das könne er noch nicht sagen, es hänge an Gutachten, Kosten und Fristen."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht und Jonas getroffen; beim Rundgang nannte er die Fläche hinter dem Haus ein Pfund."
        from: ch04/s01
      - text: "Auf seine Frage, wo das Erntefest dann hin solle, bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an; Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli hat Jonas in geliehenen Gummistiefeln mit angepackt; er hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt und über den Garten gerufen, im Garten sei Marie die Chefin."
        from: ch05/s01
      - text: "Jonas ist als Kind, der Lütte von Hedwig, bei ihm auf dem Hänger über die Stoppeln mitgefahren, barfuß; Hedwig musste ihn mit Kuchen vom Hänger locken."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer frei; er hat Jonas die Hand gegeben, ihn Jonas genannt und Du zu ihm gesagt."
        from: ch05/s02
      - text: "Der Festausschuss brauchte bis Freitag, den 14. August, eine Zusage von Jonas; sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert, das schon reserviert ist."
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, hat Jonas ihm am Tor gesagt: Das Fest findet dieses Jahr auf dem Gut statt; Marie ist Jonas daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Am Dienstag, dem 1. September, früh im Nebel kam Jonas am Fuß des Hügels auf den Feldweg, als er mit dem Trecker vorbeikam, Kalle in der Kabine."
        from: ch09/s01
      - text: "Jonas hat ihm gesagt: Das Fest bleibt auf dem Gut, nicht nur dieses Jahr, nächstes auch und danach; er bestellt daraufhin das Zelt ab."
        from: ch09/s01
      - text: "Samstag soll Jonas beim Fest vorn fahren, mit Hedwigs altem Trecker, den er im Frühjahr gemacht hat; Jonas ist noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Jonas hat ihn gebeten, Marie nichts zu sagen; das müsse er selbst tun."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, nachmittags hat er hellen Kies fürs Rondell gebracht und mit Marie geschaufelt."
        from: ch09/s02
      - text: "Im Winkel hinter dem letzten Bogen des Laubengangs hat Marie neben einem alten Rosenstock mit offener Blüte einen Steckling in frische Erde gepflanzt."
        from: ch09/s02
      - text: "Marie hat ihm gesagt: Samstag ist Fest, und was danach mit dem Garten wird, sagt ihr keiner, Jonas am wenigsten."
        from: ch09/s02
    believes:
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Die Frist ist keine Drohung; die Leute wollen wissen, wo sie ihre Bänke hinstellen."
        from: ch06/s03
      - text: "Das Erntefest bleibt auf dem Gut, auf Dauer; er sagt, er habe nie daran gezweifelt."
        from: ch09/s01
      - text: "Man redet nicht für andere; Jonas soll Marie aber nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Marie soll weitermachen und den Steckling jeden Morgen gießen; was mit dem Garten wird, weiß man eben."
        from: ch09/s02
    does_not_know:
      - "Dass der alte Stock hinter dem Laubengang der letzte Stock der Lindenhof-Rose ist und Marie in Klein Lindau einen zweiten Steckling davon zieht."
      - "Dass Steinhagens Lageplan den Parkplatz genau auf den Rosengarten legt."
      - "Dass Jonas am 13. August beim Notar einen Vorvertrag mit Weidenkamp unterschrieben hat und am 1. September davon zurückgetreten ist."
      - "Dass Jonas für eine Partnerschaft in Hamburg eine Einlage bringen sollte und diese Partnerschaft absagen will."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
      - "Dass Marie am 27. August den Vorvertrag gefunden hat und Grete und Lena nun vom Parkplatz wissen."
      - "Dass Lena ihn anrufen und das Dorf zusammentrommeln wollte und Marie das abgelehnt hat."
  jonas-behrendt:
    knows:
      - text: "Die Gärtnerin im Rosengarten heißt Marie Albers."
        from: ch01/s01
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite."
        from: ch01/s02
      - text: "Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen."
        from: ch01/s02
      - text: "Die Rankbögen der 'Ghislaine' sitzen fest im Beton und halten."
        from: ch03/s01
      - text: "Seit dem Gewitter unter den Bögen sagen er und Marie Du zueinander."
        from: ch03/s01
      - text: "Laut Marie hat Hedwig ihr mit zehn den ersten Rosenschnitt beigebracht und ihr ihre alte Schere mit dem roten Griff geschenkt."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat Grete ihm gesagt."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; die Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus am Steg."
        from: ch04/s02
      - text: "Laut Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit einer Zufahrt durch das Tor; die graue Fläche reicht bis in die Ecke hinter dem Laubengang."
        from: ch07/s01
      - text: "Grete behält ihr lebenslanges Wohnrecht; für ihren freiwilligen Auszug sah Weidenkamp eine großzügige Abfindung vor."
        from: ch04/s02
      - text: "Steinhagen erzählte von einem Herrenhaus weiter im Süden, dessen alter Park für den Anbau weichen musste; seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Laut Hannes ist er als Kind barfuß auf Hannes' Hänger über die Stoppeln mitgefahren, und Hedwig musste ihn mit Kuchen herunterlocken."
        from: ch05/s02
      - text: "In der Mitte der Südmauer wächst ein alter Stock der 'Ghislaine de Féligonde', den er freigelegt hat."
        from: ch05/s02
      - text: "Hannes hat ihm die Hand gegeben, ihn Jonas genannt und Du zu ihm gesagt."
        from: ch05/s02
      - text: "Er und Marie haben sich bei Sonnenuntergang am Steg geküsst; auf ihre Frage, ob er im Herbst noch hier ist, hat er geantwortet: Ich weiß es nicht."
        from: ch05/s03
      - text: "Im Gartenbuch steht unter der Überschrift Lindenhof-Rose, datiert auf einen Juli vor sechsundzwanzig Jahren: Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen."
        from: ch06/s02
      - text: "Er hat als Kind mit Hedwig den Steckling gepflanzt und ihn danach jeden Morgen barfuß mit dem Lineal gemessen."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet."
        from: ch06/s02
      - text: "Lena hat ihm im Hofladen gesagt: Marie ist keine, mit der man einen Sommer spielt; tut er es doch, nimmt sie es ihm übel, und das ganze Dorf mit ihr."
        from: ch06/s03
      - text: "Nur oben auf dem Hügel hinter der Scheune kommt das Gespräch aus dem Büro durch."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, hat er im Notariat in Steinhagens Beisein den Vorvertrag mit Weidenkamp unterschrieben; Marie hatte er unten am Tor gesehen und war auf der anderen Seite des Hügels zum Kombi gegangen."
        from: ch07/s01
      - text: "Der Vorvertrag gibt ihm ein Rücktrittsrecht bis zum 10. September; der Preis eines Rücktritts frisst fast alles, was er für die Einlage gespart hat."
        from: ch07/s01
      - text: "Grete hat ihn beim Essen nach dem Herrn mit dem silbernen Auto gefragt; er hat geantwortet: Hier war er nicht. Ich hatte Termine in der Stadt. Nichts Besonderes."
        from: ch07/s01
      - text: "Marie hat ihm hinter dem letzten Bogen des Laubengangs die Lindenhof-Rose gezeigt, die Hedwig selbst gezogen hat, den einzigen Stock, den es noch gibt, mit einer Knospe; laut Marie blüht er wieder."
        from: ch07/s02
      - text: "Er hat Hannes am 14. August gesagt: Das Fest findet dieses Jahr auf dem Gut statt; Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Am 27. August hat Marie im Arbeitszimmer die Weidenkamp-Mappe mit Lageplan und seinem unterschriebenen Vorvertrag gefunden; er hat ihr von Partnerschaft, Einlage und Rücktrittsrecht erzählt."
        from: ch08/s01
      - text: "Marie hat ihm gesagt: Den Garten hätte sie ihm notfalls hergegeben, aber nicht hinter ihrem Rücken, nicht nach dem Steg; er habe sich jede Rose erklären lassen und den Parkplatz nicht erklärt. Dann ist sie gegangen."
        from: ch08/s01
      - text: "Seit Donnerstag, dem 27. August, steht Maries weißer Kastenwagen nicht mehr am Tor; auf keine seiner vier Nachrichten vom Hügel kam eine Antwort."
        from: ch09/s01
      - text: "Am Montag, dem 31. August, hat Grete ihm Hedwigs blaue Keksdose aus den Kindersommern gegeben: Hedwig hat alles aufgehoben. Lies das, Jung. Was du dann machst, ist deine Sache. Über Marie sagte sie kein Wort."
        from: ch09/s01
      - text: "In der Dose liegen seine Kinderbriefe in Druckschrift (LIEBE TANTE HEDWIG), mit der Frage, wie viele Zentimeter der Steckling gewachsen sei, bitte mit Lineal messen."
        from: ch09/s01
      - text: "In der Dose liegt seine Zeichnung eines Mädchens mit Zopf auf einer Mauer, die Fäuste in die Seiten gestemmt, daneben in seiner Kinderschrift: Die hat mit mir geschimpft. Er war damals zwölf, die Kleine kaum fünf."
        from: ch09/s01
      - text: "Darunter liegen seine Postkarten aus Zeltlager und Klassenfahrt, jedes Jahr mit weniger Text; die letzte aus dem Studium: Nächsten Sommer komm ich bestimmt. Im Sommer darauf kam er nicht, später nur zwei-, dreimal für ein Wochenende; Hedwig hat die Karte glattgestrichen aufbewahrt."
        from: ch09/s01
      - text: "Die Partner haben ihm die Einlage bis nach dem Fest gestundet, weil Weidenkamps Anzahlung noch aussteht."
        from: ch09/s01
      - text: "Sein Plan auf dem Briefumschlag: Nordseite Herbst, Südseite nächstes Jahr, Rinnen selbst; Büro zwei Tage, drei hier; Notar und Planung, 38.000, aus dem Ersparten, das für die Einlage gedacht war."
        from: ch09/s01
      - text: "Am Dienstag, dem 1. September, hat er Steinhagen vom Hügel aus gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt, 38.000 Euro."
        from: ch09/s01
      - text: "Steinhagen sagte, er habe es fast geahnt, seit dem Notar, weil er nur Wasser wollte; die Gruppe habe noch ein zweites Gut im Blick; er wünschte ihm Glück mit dem Haus: Dann fehle ihm wenigstens nichts."
        from: ch09/s01
      - text: "Er fährt am 1. September nach Hamburg, um die Partnerschaft persönlich abzusagen."
        from: ch09/s01
      - text: "Er hat Hannes am Fuß des Hügels gesagt: Das Fest bleibt auf dem Gut, nicht nur dieses Jahr, nächstes auch und danach; Hannes bestellt das Zelt ab."
        from: ch09/s01
      - text: "Laut Hannes fährt er am Samstag beim Fest vorn, mit Hedwigs altem Trecker, den Hannes im Frühjahr gemacht hat; er ist noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Er hat Hannes gebeten, Marie nichts zu sagen; Hannes sagte, man rede nicht für andere, aber er solle sie nicht zu lange warten lassen."
        from: ch09/s01
    believes:
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Das Haupthaus ist schlimmer dran als das Scheunendach."
        from: ch03/s03
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "Er hat das fremde, warme Gefühl, auf dem Gut mitgerechnet zu werden."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Einer der nummerierten Stellplätze des Lageplans liegt über dem Loch, das er als Kind für den Steckling gegraben hat."
        from: ch07/s01
      - text: "Er rechnet nicht mehr aus, was sich lohnt, sondern was trägt."
        from: ch09/s01
      - text: "Hannes hat sehr wohl gezweifelt, dass das Fest auf dem Gut bleibt; er glaubt ihm kein Wort, und es ist trotzdem gut."
        from: ch09/s01
      - text: "Mit Marie muss er selbst reden."
        from: ch09/s01
    does_not_know:
      - "Ob Marie seine vier Nachrichten gelesen hat und wo sie seit Donnerstag gewesen ist."
      - "Dass Marie in Klein Lindau zwei Stecklinge der Lindenhof-Rose gezogen hat, die beide angewachsen sind, und den kräftigeren am 2. September neben den alten Stock gepflanzt hat."
      - "Dass die Lindenhof-Rose am 2. September ihre erste Blüte geöffnet hat."
      - "Wo genau im Garten er den Steckling damals gepflanzt hat und ob der Stock hinter dem Laubengang aus diesem Steckling stammt."
      - "Dass Grete ihm die Antwort über die Termine in der Stadt nicht geglaubt hat."
      - "Dass Hedwig sich gewünscht hat, Marie möge den Garten einmal weiterführen, und es ihr im letzten Herbst auf der Bank gesagt hat."
      - "Dass Marie mit Lena über ihn gesprochen hat und Lena meint, Marie habe Gefühle für ihn."
      - "Dass Marie ihn vielleicht als Jungen oben auf der Gartenmauer gesehen hat."
      - "Dass Marie nach dem Streit Grete das Wort Parkplatz gesagt und in der Nacht Lena alles erzählt hat, auch vom Steg."
  lena-hansen:
    knows:
      - text: "Laut Marie stand in Jonas' Tabelle beim Laubengang 'Entsorgung' für beide Rankbögen der 'Ghislaine'; Marie sagt, sie habe Jonas dazu gebracht, die Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Laut Marie kam Jonas in geputzten Lederschuhen, seine Hose ist an beiden Knien grün und hin."
        from: ch02/s03
      - text: "Am Samstag Mitte Juli hat sie am Tor die Helfer abgehakt und die Arbeit verteilt; Jonas kam in geliehenen Gummistiefeln, sie hat ihn gesiezt und eingetragen."
        from: ch05/s01
      - text: "Marie hat ihren Rosen Namensschilder gemacht, damit keiner was rausreißt."
        from: ch05/s01
      - text: "Um fünf hat sie Jonas gefragt, ob er nächsten Samstag Zeit hat, und er hat Ja gesagt; auf der Helferliste am schwarzen Brett im Hofladen steht er mit Ankunft und Abfahrt."
        from: ch06/s03
      - text: "Für Grete macht sie montags den Hofladen auf, seit Jahren; am Montag Anfang August hat Jonas Gretes Einkauf geholt."
        from: ch06/s03
      - text: "Sie hat Jonas gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie es ihm übel, und das ganze Dorf mit ihr."
        from: ch06/s03
      - text: "In der Nacht vom 27. August, um Viertel vor zwölf, kam Marie an ihre Küchentür; die alten Fotos auf dem Küchentisch hat sie vor Marie mit einem Geschirrtuch zugedeckt."
        from: ch08/s03
      - text: "Laut Marie gibt es einen Lageplan mit grauen Kästchen über dem Rosengarten bis an die Mauer, und Jonas hat heimlich beim Notar einen Vorvertrag unterschrieben, gerade und ohne Zögern."
        from: ch08/s03
      - text: "Laut Marie haben sie und Jonas sich am Abend am Steg geküsst."
        from: ch08/s03
      - text: "Laut Marie hat Jonas Hannes vor zwei Wochen am Tor gesagt, das Fest finde dieses Jahr auf dem Gut statt, und Marie hielt das für ein Versprechen."
        from: ch08/s03
      - text: "Laut Marie hat Hedwig ihr letzten Herbst auf der Bank unter der Kletterrose gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführt; aufgeschrieben ist das nirgends."
        from: ch08/s03
      - text: "Marie hat das nie erzählt, weil es nach Erbschleicherei klingt."
        from: ch08/s03
      - text: "Sie hat Marie angeboten, Hannes anzurufen; Marie sagte: Das ist meine Sache, Lena. Nicht die vom Dorf."
        from: ch08/s03
    believes:
      - text: "Marie hat Gefühle für Jonas; das ist mindestens ein Liebeskummer mit zwei Stück Kuchen."
        from: ch08/s03
      - text: "Jonas ist ein Hamburger Dösbaddel mit geputzten Schuhen, der Brombeeren rausreißt, sich auf die Schulter klopfen lässt und hinterher heimlich beim Notar unterschreibt."
        from: ch08/s03
      - text: "Marie hat Hedwig seit ihrem zehnten Jahr den Giersch gestochen; wer ihr Erbschleicherei nachsagt, kriegt es mit ihr zu tun."
        from: ch08/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden, Stecklinge davon gezogen und einen davon neben den alten Stock gepflanzt hat."
      - "Wer der Käufer ist (Weidenkamp Hotels, Ralf Steinhagen) und was er außer dem Parkplatz plant."
      - "Dass Jonas für eine Partnerschaft im Büro eine Einlage braucht und ein Rücktrittsrecht bis nach dem Fest hat."
      - "Dass Jonas am 1. September vom Vorvertrag zurückgetreten ist und Hannes gesagt hat, das Fest bleibe dauerhaft auf dem Gut."
      - "Dass Grete etwas geahnt, geschwiegen und Marie um Verzeihung gebeten hat."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe aus Hamburg."
        from: ch01/s01
      - text: "Jonas will das Gut verkaufen."
        from: ch01/s02
      - text: "Absprache mit Jonas: freie Hand bei den Rosen; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Seit dem Gewitter unter den Bögen sagen sie und Jonas Du zueinander."
        from: ch03/s01
      - text: "Hedwig hat ihr mit zehn den ersten Rosenschnitt beigebracht und ihr die alte Schere mit dem roten Griff geschenkt."
        from: ch03/s01
      - text: "Hedwig hat ihr im letzten Herbst auf der Bank unter der 'New Dawn' gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführt; aufgeschrieben ist das nirgends."
        from: ch08/s03
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht; beim Rundgang nannte er die Fläche hinter dem Haus ein Pfund und bot Hannes für das Erntefest eine Veranstaltungsfläche gegen Gebühr an; Jonas schwieg."
        from: ch04/s01
      - text: "Die Mauerecke hinter dem Südende des Laubengangs hat sie für den Helfersamstag selbst freigeschnitten und nur mit einem leeren Schild markiert."
        from: ch05/s01
      - text: "Sie und Jonas haben sich bei Sonnenuntergang am Steg geküsst; auf ihre Frage, ob er im Herbst noch hier ist, hat Jonas gesagt: Ich weiß es nicht."
        from: ch05/s03
      - text: "Sie hat Jonas Ende Juli erklärt, dass das Junibild nicht wiederkommt und Glanz im September Nachblüte der 'New Dawn', Stauden, Astern und Dahlien am Laubengang heißt; an den Damaszenern am Rondell hängen im September Hagebutten."
        from: ch06/s01
      - text: "Sie hat Jonas die Lindenhof-Rose gezeigt und ihm gesagt, dass Hedwig sie selbst gezogen hat, dass es nur noch diesen einen Stock gibt und dass er wieder blüht; Jonas blieb stumm."
        from: ch07/s02
      - text: "Jonas hat Hannes am 14. August gesagt: Das Fest findet dieses Jahr auf dem Gut statt."
        from: ch07/s02
      - text: "In der untersten Schublade von Hedwigs Schreibtisch lag eine Mappe von Weidenkamp Hotels; auf dem Lageplan liegen graue Stellplätze über dem Rosengarten, bis in den Winkel hinter dem letzten Bogen, genau über der Lindenhof-Rose; auch über der Sonnenuhr."
        from: ch08/s01
      - text: "Jonas hat den Vorvertrag am Donnerstag, dem 13. August, unterschrieben, gerade und ohne Zögern, einen Tag bevor er Hannes die Zusage fürs Fest gab."
        from: ch08/s01
      - text: "Laut Jonas bietet man ihm im Büro eine Partnerschaft an, für die er bis Monatsende eine Einlage bringen muss, und er habe ein Rücktrittsrecht bis nach dem Fest."
        from: ch08/s01
      - text: "Grete hat geahnt, dass so etwas wie ein Parkplatz kommt, hat geschwiegen, weil sie dachte, Jonas sage es ihr selbst, und sie um Verzeihung gebeten; Hedwig hat auch Grete gesagt, wen sie sich für den Garten wünscht."
        from: ch08/s02
      - text: "Sie hat Lena in der Nacht vom 27. August alles erzählt; Lena wollte Hannes anrufen, sie hat abgelehnt."
        from: ch08/s03
      - text: "Lena hatte alte Fotos auf dem Küchentisch und hat sie zugedeckt, als sie kam."
        from: ch08/s03
      - text: "Am Mittwoch, dem 2. September, kurz nach fünf im Hinterhof der alten Schmiede: Beide Stecklinge der Lindenhof-Rose haben getrieben, feine weiße Wurzeln halten den Ballen bis an den Rand zusammen."
        from: ch09/s02
      - text: "Den kräftigeren Steckling hat sie mitgenommen; der andere steht weiter unter Folie im Hinterhof der Schmiede."
        from: ch09/s02
      - text: "Am 2. September fehlte Jonas' Kombi auf dem Gutshof."
        from: ch09/s02
      - text: "An den Damaszenerrosen am Rondell leuchten die Hagebutten, wie sie es im Juli versprochen hatte; die 'New Dawn' über der Bank steht in zweiter Blüte."
        from: ch09/s02
      - text: "Grete hat ihr gegen sieben Kaffee mit Milch und Butterkuchen auf die Bank gestellt, nichts gefragt und ihr über den Zopf gestrichen; sie hat Grete gesagt, der Kuchen sei nicht zu süß und die Mandeln saftig."
        from: ch09/s02
      - text: "Am alten Stock der Lindenhof-Rose hat sich die Knospe aus dem August geöffnet: eine einzige Blüte, zartrosa und gefüllt."
        from: ch09/s02
      - text: "Sie hat den Steckling eine Handbreit neben dem alten Stock in den Winkel hinter dem letzten Bogen gepflanzt und angegossen; auf dem Lageplan liegt über diesem Winkel ein graues Kästchen."
        from: ch09/s02
      - text: "Hannes hat am Nachmittag hellen Kies fürs Rondell gebracht, mit ihr geschaufelt und den Steckling neben dem alten Stock gesehen; er sagte: Mach man weiter, Deern, und den solle sie jeden Morgen gießen."
        from: ch09/s02
    believes:
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Das hinter dem Haus ist keine Fläche, sondern ein Garten, angelegt in den Dreißigerjahren."
        from: ch04/s01
      - text: "Der dünne barfüßige Junge, den sie einmal oben auf der Gartenmauer gesehen hat, war vielleicht Jonas."
        from: ch05/s03
      - text: "Jonas' Zusage an Hannes galt nur für dieses Jahr."
        from: ch08/s01
      - text: "Jonas' Schweigen vor der Lindenhof-Rose war keine Rührung."
        from: ch08/s01
      - text: "Sie ist Grete nicht böse, sondern sich selbst: Auch sie hat geschwiegen und Jonas Hedwigs Satz nie gesagt."
        from: ch08/s02
      - text: "Hedwigs Wunsch zu erzählen klingt nach Erbschleicherei."
        from: ch08/s03
      - text: "Den Garten will sie, seit Hedwig ihre Hand genommen hat; was sie mit Jonas will und ob das eine ohne das andere zu haben ist, weiß sie nicht."
        from: ch08/s03
      - text: "Dass Jonas' Kombi fehlt, erleichtert sie; dahinter sitzt ein kleiner Stich, den sie nicht haben will."
        from: ch09/s02
      - text: "Ob in einem Jahr im Winkel der Lindenhof-Rose ein Auto parkt, weiß sie nicht; Gewähr gibt einem keiner, sie pflanzt trotzdem."
        from: ch09/s02
      - text: "Was nach dem Fest mit dem Garten wird, sagt ihr keiner, Jonas am wenigsten."
        from: ch09/s02
      - text: "Hannes verschweigt ihr etwas: Sonst hält er den Blick, wenn er redet, heute hat er den Dahlien geantwortet."
        from: ch09/s02
    does_not_know:
      - "Dass Jonas am 1. September vom Vorvertrag mit Weidenkamp zurückgetreten ist und die 38.000 Euro für Notar und Planung selbst trägt."
      - "Dass Jonas Hannes gesagt hat, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, und dass Hannes das Zelt abbestellt."
      - "Dass Jonas nach Hamburg gefahren ist, um die Partnerschaft persönlich abzusagen, und dass die Partner die Einlage bis nach dem Fest gestundet hatten."
      - "Dass Jonas Hannes gebeten hat, ihr nichts zu sagen, und dass Jonas am Samstag beim Fest mit Hedwigs altem Trecker vorn fahren soll."
      - "Dass Grete Jonas Hedwigs Keksdose mit seinen Kinderbriefen, der Zeichnung vom Mädchen auf der Mauer und seinen Postkarten gegeben hat."
      - "Was Jonas an der Gartenmauer und vor der Lindenhof-Rose wirklich so still werden ließ."
      - "Dass Jonas als Kind mit Hedwig den ersten Steckling der Lindenhof-Rose gepflanzt hat und das im Gartenbuch gelesen hat."
      - "Wer das Gartenbuch aufgeschlagen in den Ledersessel gelegt hat."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Was Weidenkamp außer dem Parkplatz plant: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg."
      - "Dass Weidenkamp Grete für einen freiwilligen Auszug eine Abfindung anbieten wollte."
      - "Dass Lena Jonas im Hofladen gewarnt hat, mit ihr keinen Sommer zu spielen."
      - "Dass Jonas sie vom Hügel aus beobachtet hat und am 13. August auf der anderen Seite des Hügels hinuntergegangen ist, statt zu ihr."
      - "Was auf Lenas alten Fotos zu sehen ist."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zahl der Zimmer im Gutshaus, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Die Namen von Marie Albers, Hannes Kröger und Grete Paulsen."
        from: ch04/s01
      - text: "Laut Marie ist der Garten in den Dreißigerjahren angelegt, und die 'Rosa Mundi' ist älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes Kröger fragt, wo das Erntefest hin soll, wenn das Gut ein Hotel wird."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht."
        from: ch04/s02
      - text: "Am Donnerstag, dem 13. August, hat Jonas im Notariat in seinem Beisein den Vorvertrag unterschrieben; den Kaffee lehnte Jonas ab, Wasser reiche."
        from: ch07/s01
      - text: "Am Dienstag, dem 1. September, früh hat Jonas ihm gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt, 38.000 Euro."
        from: ch09/s01
      - text: "Die Gruppe hat noch ein zweites Gut im Blick."
        from: ch09/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste von Weidenkamp heute suchen."
        from: ch03/s03
      - text: "Seinem Herrenhaus im Süden fehlt etwas, seit der alte Park für den Anbau weichen musste."
        from: ch04/s02
      - text: "Er hat Jonas' Rücktritt fast geahnt, seit dem Notar, weil Jonas dort nur Wasser wollte."
        from: ch09/s01
      - text: "Behält Jonas das Haus mit seinem Garten, fehlt ihm wenigstens nichts."
        from: ch09/s01
    does_not_know:
      - "Dass Hedwig sich gewünscht hat, der Rosengarten möge zum Erntefest wieder blühen."
      - "Dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht und Jonas als Kind beim ersten Steckling geholfen hat."
      - "Dass Jonas Hannes zugesagt hat, das Erntefest bleibe auf dem Gut, nicht nur dieses Jahr."
      - "Dass Jonas das Geld für eine Einlage im Büro brauchte und dass der Rücktritt ihn fast alles kostet, was er dafür gespart hat."
      - "Dass Jonas und Marie sich am Steg geküsst haben."
      - "Dass Marie am 27. August die Mappe mit Lageplan und Vorvertrag gefunden hat und Grete und Lena nun vom Parkplatz wissen."
