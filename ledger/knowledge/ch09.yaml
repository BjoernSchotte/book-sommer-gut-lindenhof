based_on: ["ch08#cfc603", "ch09/s01#540e01", "ch09/s02#247592"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlegt, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Jonas will, dass der Garten bis zum Fest fertig ist; das ist sein Wort, nicht Hedwigs."
        from: ch01/s03
      - text: "Marie sagt, Jonas will das Gut verkaufen."
        from: ch01/s03
      - text: "Jonas hat nach dem Gespräch noch eine Weile auf der Terrasse gestanden und Marie nachgesehen."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag morgens Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Jonas' Schuhe standen am ersten Tag zum Trocknen auf der Freitreppe, die Socken daneben."
        from: ch02/s03
      - text: "Marie nimmt Milch in den Kaffee; das hat sie Jonas gesagt, als er zwei Becher in den Garten trug."
        from: ch03/s02
      - text: "Mitte Juli war Ralf Steinhagen zu Besuch auf dem Gut; er hat sie mit Namen angesprochen und gesagt, Jonas habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Steinhagen und Jonas Kaffee in der guten Kanne mit dem Goldrand auf die Terrasse gebracht, ohne Kuchen, obwohl sie am Morgen Butterkuchen gebacken hatte."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kommen Helfer aus dem Dorf in den Rosengarten; sie hat drei Bleche Butterkuchen und die große Kanne auf den Terrassentisch gestellt, damit diesmal keiner mit leerem Teller dasteht."
        from: ch05/s01
      - text: "Jonas hat am Helfertag mitgearbeitet; er hat gefragt, ob er zu den Helfern zählt, und sie hat ihm zwei Bier aus der Helferkiste gegeben, die Kronkorken gleich mit abgemacht."
        from: ch05/s03
      - text: "Jonas hat Sonnenbrand im Nacken; sie hat ihm Quark angeboten."
        from: ch05/s03
      - text: "Dienstag Ende Juli hat sie Marie und Jonas mittags einen Krug Buttermilch und ein Blech Johannisbeerkuchen auf die Bank unter der 'New Dawn' gebracht und ist ohne ein Wort zurück zum Haus gegangen."
        from: ch06/s01
      - text: "Marie hat das Gartenbuch im Arbeitszimmer gelassen; es liegt dort neben der grünen Lampe."
        from: ch06/s02
      - text: "Donnerstag spät am Abend hat Jonas im Arbeitszimmer nach den Rechnungen fürs Dach gesucht; auf ihre Frage hat er gesagt, er habe die Dachrechnungen gefunden."
        from: ch06/s02
      - text: "Jonas hat sich angeboten, am Montag Anfang August ihren Einkauf im Hofladen der Hansens zu holen; sie hat ihm einen Zettel mitgegeben: zehn Eier, ein Glas Rosengelee, Kartoffeln und Rindfleisch für Mittwoch, darunter 'Nicht vergessen zu bezahlen'."
        from: ch06/s03
      - text: "Lena macht für sie montags den Hofladen auf, seit Jahren."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet, ob der wiedergekommen ist."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, hat sie Jonas Bratkartoffeln mit Spiegelei hingestellt; auf ihre Frage hat er gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes. Dabei hat er die ganze Zeit sein Spiegelei angeguckt."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank gebracht, Maries mit Milch."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, backt sie Probe-Butterkuchen fürs Erntefest; Hannes sagt, letztes Jahr waren sie zu trocken."
        from: ch08/s02
      - text: "Am späten Nachmittag des 27. August ist Marie ohne die Stiefel abzutreten in die Küche gekommen und hat nur ein Wort gesagt: 'Parkplatz.'"
        from: ch08/s02
      - text: "Sie hat so was geahnt, das Wort nicht, aber so was; wissen wollte sie es diesmal nicht, und sie hat gedacht, Jonas sagt es Marie selbst."
        from: ch08/s02
      - text: "Sie hat Marie um Verzeihung gebeten, ohne Aber und ohne Weil."
        from: ch08/s02
      - text: "Hedwig hat auch ihr gesagt, wen sie sich für den Garten wünscht; Marie hat genickt, als sie sagte, das wisse Marie wohl."
        from: ch08/s02
      - text: "Marie hat an ihrem Küchentisch geweint; sie hat Marie die Hand auf die Faust gelegt, bis Marie Hedwigs Schere mit dem roten Griff losließ."
        from: ch08/s02
      - text: "Sie hat Marie eine heiße Ecke Butterkuchen in Papier mitgegeben; ob er zu süß ist, soll Marie ihr morgen sagen, und die Astern am Rondell gießt sonst keiner."
        from: ch08/s02
      - text: "Seit Donnerstag, dem 27. August, stand Maries weißer Kastenwagen nicht mehr am Tor."
        from: ch09/s01
      - text: "Am Montag, dem 31. August, hat Jonas ihr in der Küche gesagt: 'Ich fahr morgen früh nach Hamburg.'"
        from: ch09/s01
      - text: "Sie hat Jonas Hedwigs alte blaue Keksdose mit seinen Kinderbriefen hingeschoben: Hedwig hat alles aufgehoben. Sie hat gesagt: 'Lies das, Jung. Was du dann machst, ist deine Sache.' Über Marie hat sie kein Wort gesagt."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, gegen sieben ist Marie wieder im Rosengarten; sie hat ihr einen Becher Kaffee und einen Teller Butterkuchen auf die Bank unter der Kletterrose gestellt, nichts gefragt und ihr einmal über den Zopf gestrichen."
        from: ch09/s02
    believes:
      - text: "Der Verkauf ist Jonas' Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Hedwig hätte gewollt, dass Jonas ins Gartenbuch sieht."
        from: ch06/s02
      - text: "Jonas hat beim Abendessen am 13. August über die Termine in der Stadt geschwindelt; seit er so klein war, sieht sie ihm an, wenn er schwindelt."
        from: ch08/s02
      - text: "Das Erntefest findet statt; sie backt, als gäbe es kein Wenn."
        from: ch08/s02
      - text: "Die Deern hat mehr Ausdauer als der Giersch."
        from: ch09/s02
    does_not_know:
      - "dass in der Mauerecke hinter dem Südende des Laubengangs der letzte Stock der Lindenhof-Rose steht"
      - "dass Marie im Hinterhof der alten Schmiede in Klein Lindau Stecklinge der Lindenhof-Rose zieht und am 2. September einen davon neben den alten Stock gepflanzt hat"
      - "dass Marie Hedwig versprochen hat, den Garten zu retten"
      - "dass Jonas die Rankbögen der 'Ghislaine' entsorgen wollte und sie nun auf Punktfundamente stellen lässt"
      - "dass Marie und Jonas sich seit dem Gewitter unter dem Laubengang duzen"
      - "dass Weidenkamp im Gutshaus rund zwanzig Zimmer, in Kuhstall und Scheune Spa und Seminarraum und am Steg ein Saunahaus plant"
      - "dass im Lageplan von Weidenkamp der Parkplatz genau auf dem Rosengarten liegt, bis in die Ecke hinter dem Laubengang"
      - "dass Weidenkamp ihr für einen freiwilligen Auszug eine großzügige Abfindung vorsieht und Jonas sie darauf ansprechen soll"
      - "dass Jonas an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt hat"
      - "dass Marie und Jonas sich am Abend am Steg geküsst haben"
      - "dass Jonas im Gartenbuch die Notiz über den ersten Steckling der Lindenhof-Rose gelesen hat, für den er als Kind das Loch gegraben hat"
      - "dass nächste Woche ein Gutachter zur Wertermittlung kommt"
      - "dass der Festausschuss bis Freitag, den 14., eine Zusage von Jonas brauchte"
      - "dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg sprechen wollten"
      - "dass Jonas am 13. August im Notariat in der Kreisstadt mit Steinhagen einen Vorvertrag über das Gut unterschrieben hat"
      - "dass der Vorvertrag ein Rücktrittsrecht bis zum 10. September hat"
      - "dass Jonas am 1. September vom Vorvertrag zurückgetreten ist und die vereinbarte Summe selbst trägt"
      - "dass Jonas in Hamburg die Partnerschaft absagen will"
      - "dass Jonas Hannes zugesagt hat, das Fest bleibe für immer auf dem Gut"
      - "dass Marie die Mappe mit Vorvertrag und Lageplan in Hedwigs Schreibtisch gefunden und Jonas im Arbeitszimmer zur Rede gestellt hat"
      - "dass das Gartenbuch nicht mehr auf seinem Platz am Fenster im Arbeitszimmer liegt"
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Rings um die Sonnenuhr sitzen alte Holunderstubben und an der Westseite ein Brombeerwurzelstock, der sich mit der Hacke nicht rührt; keinen Meter davon steht die 'Rosa Mundi'."
        from: ch03/s02
      - text: "Marie will den Wurzelstock nur langsam und nicht zur 'Rosa Mundi' hin herausziehen; er zieht nach Norden, zum Tor hin."
        from: ch03/s02
      - text: "Mit derselben Kette hat er Hedwig den Fliederbusch an der Remise herausgeholt."
        from: ch03/s02
      - text: "Sonnabend um halb acht bringt er den Trecker für den Wurzelstock."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Auf seine Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas nicht zugesagt: Es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen, die er selbst noch nicht kenne."
        from: ch03/s02
      - text: "Mitte Juli schaufelt er mit Marie vom Hänger Kies auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war auf dem Gut, hat mit Jonas auf der Terrasse gesessen und ist durch den Rosengarten gegangen."
        from: ch04/s01
      - text: "Steinhagen nennt die Fläche hinter dem Haus ein Pfund: ebener Grund, kurze Wege, und die Mauer schirmt alles ab."
        from: ch04/s01
      - text: "Auf seine Frage, wo das Erntefest dann hin soll, sagt Steinhagen: Das Hotel hätte eine Veranstaltungsfläche gegen Gebühr, für Vereine zu sehr fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat zu Steinhagens Antwort geschwiegen."
        from: ch04/s01
      - text: "Am Helfersamstag Mitte Juli ist er mit dem großen grünen Trecker und leerem Hänger gekommen, Kalle in der Kabine; Timo brachte mit dem zweiten Gespann Kies für die Seitenwege."
        from: ch05/s01
      - text: "Jonas wollte mit anfassen; er hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Er hat allen Helfern gesagt: Im Garten ist Marie die Chefin, wer das nicht weiß, fragt sie."
        from: ch05/s01
      - text: "Jonas ist als Kind, Hedwigs Lütter, einmal nach der Gerste barfuß auf seinem Hänger über die Stoppeln mitgefahren; Hedwig musste ihn mit Kuchen herunterlocken und hat geschimpft."
        from: ch05/s02
      - text: "Jonas sagt, an den Diesel erinnert er sich noch."
        from: ch05/s02
      - text: "Von der Pforte nach Westen bis zum alten Geräteschuppen liegt die Südmauer frei; er hat die letzte Fuhre Brombeeren am späten Nachmittag abgefahren."
        from: ch05/s02
      - text: "Er hat Jonas die Hand gegeben, 'Gut gemacht, Jonas' gesagt und ihn dabei geduzt."
        from: ch05/s02
      - text: "Der Festausschuss hat am Abend vor dem Montag Anfang August gesessen: Bis Freitag, den vierzehnten, braucht er von Jonas eine Zusage, auf die man bauen kann; sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert, das Zelt ist schon reserviert."
        from: ch06/s03
      - text: "Er hat Jonas am Montag Anfang August am Hoftor des Hansen-Hofs die Frist genannt; Jonas hat gesagt: 'Bis dahin kriegst du eine Antwort.'"
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, nachmittags hat er am Gartentor die Antwort eingefordert; Jonas hat gesagt: 'Das Fest findet dieses Jahr auf dem Gut statt.'"
        from: ch07/s02
      - text: "Am Dienstag, dem 1. September, früh morgens hat Jonas ihm am Weg unter dem Hügel gesagt: 'Das Fest bleibt auf dem Gut, Hannes. Nicht nur dieses Jahr. Nächstes auch, und danach.' Daraufhin bestellt er das Zelt ab."
        from: ch09/s01
      - text: "Samstag fährt Jonas beim Erntefest vorn, mit Hedwigs altem Trecker, den er im Frühjahr gemacht hat; Jonas sagt, er sei noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Jonas hat ihn gebeten, Marie nichts zu sagen; das müsse er selbst."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, hat er hellen Kies fürs Rondell gebracht und mit Marie geschaufelt; der neue Kies liegt um die Sonnenuhr."
        from: ch09/s02
      - text: "In der Mauerecke hat Marie einen Steckling neben einen alten Rosenstock gepflanzt, in frische dunkle Erde; darüber steht eine offene Blüte."
        from: ch09/s02
    believes:
      - text: "Im Garten läuft es; Marie macht ihre Sache gut."
        from: ch03/s02
      - text: "Mit dem Spaten wird das nichts; mit Kette und Trecker ist der Wurzelstock schnell draußen."
        from: ch03/s02
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Das Erntefest bleibt auf dem Gut, auch in den nächsten Jahren."
        from: ch09/s01
      - text: "Man redet nicht für andere; Jonas soll Marie aber nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Jonas lernt bis Samstag Trecker fahren."
        from: ch09/s01
    does_not_know:
      - "dass Jonas mit einem Käufer bis zum Herbst rechnet"
      - "dass der alte Stock in der Mauerecke hinter dem Südende des Laubengangs der letzte Stock der Lindenhof-Rose ist"
      - "dass der neu gepflanzte Steckling aus Maries Zucht im Hinterhof der alten Schmiede stammt"
      - "dass im Lageplan von Weidenkamp der Parkplatz genau auf dem Rosengarten liegt"
      - "dass Weidenkamp für Gretes freiwilligen Auszug eine Abfindung vorsieht"
      - "dass Jonas sein Gesicht von der Hängerfahrt nicht behalten hat"
      - "dass Marie und Jonas sich am Abend am Steg geküsst haben"
      - "dass nächste Woche ein Gutachter zur Wertermittlung aufs Gut kommt"
      - "dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg wegen seiner Einlage sprechen wollten"
      - "dass Jonas am 13. August im Notariat in der Kreisstadt mit Steinhagen einen Vorvertrag über das Gut unterschrieben hat"
      - "dass der Vorvertrag ein Rücktrittsrecht bis zum 10. September hat, fünf Tage nach dem Fest"
      - "dass Jonas am 1. September vom Vorvertrag zurückgetreten ist"
      - "dass Jonas in Hamburg die Partnerschaft absagen will"
      - "dass Marie am 27. August den Vorvertrag und den Lageplan gefunden und Jonas zur Rede gestellt hat"
      - "dass Lena ihn anrufen und das Dorf über die Helferliste zusammentrommeln will"
  jonas-behrendt:
    knows:
      - text: "Marie Albers ist die Gärtnerin; er hat sie beauftragt, den Rosengarten herzurichten."
        from: ch01/s02
      - text: "Das Geldvermächtnis reicht für einen Sommer Gartenpflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Die sieben Fenster im Erdgeschoss zur Gartenseite sind undicht, zwei Flügel verzogen, das Holz gibt nach; für das Dach steht ein Angebot vom Dachdecker bis Ende Juni aus."
        from: ch01/s02
      - text: "Abmachung mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen, über die Wege wird geredet, Zwischenstände alle zwei Wochen mit Fotos, Budget bleibt fest."
        from: ch01/s02
      - text: "Neue Abmachung: Die Bögen bleiben und bekommen je Fuß ein Punktfundament; Marie bindet die Rose selbst wieder an und macht den Hauptweg bis Ende Juni frei."
        from: ch02/s01
      - text: "Der Fuß des Bogens sitzt seit einer Woche im Beton; als er am Eisen rüttelt, gibt nichts nach."
        from: ch03/s01
      - text: "Für die Partnerschaft im Büro ist seine Einlage fällig."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar: Wege für gute Schuhe, Blüten in Sicht vom Haus, keine Ecke, die nach Arbeit aussieht."
        from: ch02/s02
      - text: "Am letzten Freitag im Juli kommt ein Fotograf des Maklers für Gartenfotos; er hat zugesagt, aber den Termin nicht notiert."
        from: ch02/s02
      - text: "Kindheitserinnerung: ein Floß aus Brettern auf dem Gutssee, und Hedwig, die ihn zum Kuchen hereinruft."
        from: ch02/s02
      - text: "Marie hat mit zehn im Rosengarten ihren ersten Rosenschnitt gemacht; Hedwig hat ihr die Hand geführt."
        from: ch03/s01
      - text: "Als Kind hat Marie bei Hedwig dienstags und freitags Unkraut gejätet, eine Stunde für ein Stück von Gretes Streuselkuchen; Grete hat auf der Kalenderrückseite Buch geführt."
        from: ch03/s01
      - text: "Hedwig hat Marie ihre alte Schere mit dem roten Griff geschenkt; Marie hat sie heute noch."
        from: ch03/s01
      - text: "Hedwig hat laut mit den Rosen geredet, mit der 'Rosa Mundi' geschimpft und die 'Ghislaine' jeden Juni gelobt; Marie redet auch mit den Rosen."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Seit dem Gewitter unter dem Laubengang sagen Marie und er Du zueinander."
        from: ch03/s01
      - text: "Grete sagt, Marie nimmt Milch in den Kaffee."
        from: ch03/s02
      - text: "Hannes Kröger fragt, ob das Erntefest auf dem Gut bleibt; das Fest ist am ersten Samstag im September. Er hat Hannes damals keine Zusage gegeben."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker, um den Wurzelstock an der Sonnenuhr herauszuziehen."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; seine Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Steinhagen kennt die Zimmerzahl des Gutshauses, die Grundfläche der Scheune auf den Quadratmeter und das Baujahr."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen und eine Reihe verrutschter Pfannen; in der Rinne fault Laub."
        from: ch03/s03
      - text: "Mitte Juli war Steinhagen zur Besichtigung da: Kaffee auf der Terrasse, dann ein Gang durchs Haus und durch den Rosengarten."
        from: ch04/s01
      - text: "Grete hat Steinhagen und ihm Kaffee ohne Kuchen hingestellt; in all seinen Kindersommern hat sie ihm nie eine Tasse ohne Kuchen hingestellt, bis zu diesem Morgen."
        from: ch04/s02
      - text: "Im Garten nennt Steinhagen die Fläche hinter dem Haus ein Pfund; Marie hält dagegen, das sei ein Garten aus den Dreißigerjahren, und die 'Rosa Mundi' sei älter als sie beide zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bietet Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; er selbst hat dazu geschwiegen."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, am Steg ein kleines Saunahaus aus Holz; dazu Grundrisse, Schnitte und eine Kostenschätzung nach Gewerken, zwei Balken eingeplant."
        from: ch04/s02
      - text: "Steinhagens Lasten und Fristen halten seiner Prüfung stand; die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Im Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit einer Zufahrt durch das Tor; ein paar Rosen sollen als Akzent in Kübeln bleiben."
        from: ch04/s02
      - text: "Grete hat ein lebenslanges Wohnrecht, das bestehen bleibt; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor, und Steinhagen bittet ihn, das bei Gelegenheit bei Grete anzusprechen."
        from: ch04/s02
      - text: "Steinhagen hatte ein Herrenhaus weiter im Süden, dessen alter Park für den Anbau weichen musste; seitdem fehle dem Haus etwas, sagt er."
        from: ch04/s02
      - text: "Auf Maries Frage, was Steinhagen wollte, hat er nur gesagt: 'Ein Interessent.'"
        from: ch04/s02
      - text: "Am Samstag Mitte Juli hat er beim Helfereinsatz im Rosengarten mitgearbeitet; Lena hat ihn eingetragen und ihn den ganzen Tag gesiezt, das Klemmbrett vor der Brust."
        from: ch05/s01
      - text: "Hannes hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt; er hat dort den Rankenwall auf den Hänger gegabelt, bis die Mauer von der Pforte bis zum alten Geräteschuppen frei lag."
        from: ch05/s02
      - text: "Die nummerierten Stellplätze aus dem Lageplan liegen genau dort, wo er an der Südmauer gräbt."
        from: ch05/s02
      - text: "Laut Hannes ist er als Kind nach der Gerste barfuß auf Hannes' Hänger mitgefahren, und Hedwig musste ihn mit Kuchen herunterlocken; er erinnert sich an Diesel und Stroh, an Hannes' Gesicht nicht."
        from: ch05/s02
      - text: "Unter den Brombeeren an der Südmauer, nahe der Pforte, wächst ein alter Rosenstock; Marie sagt, es ist eine 'Ghislaine de Féligonde', die seit Jahren keiner mehr gesehen hat. Er hat ihn nicht herausgerissen, und Marie hat die Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Hannes hat ihm die Hand gegeben, 'Gut gemacht, Jonas' gesagt und ihn geduzt."
        from: ch05/s02
      - text: "Laut Marie hat Lena Mats auf dieselbe Art gekriegt."
        from: ch05/s03
      - text: "Als Junge hat er am Steg drei Flöße aus Remisenbrettern gebaut, mit Wäscheleine verschnürt; das letzte ist mitten auf dem See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Am Abend am Steg haben Marie und er sich geküsst; er hat gesagt, das wollte er seit dem Gewitter, und Marie hat gesagt: 'Ich auch.'"
        from: ch05/s03
      - text: "Marie hat ihn gefragt, ob er im Herbst noch hier ist; er hat gesagt, er weiß es nicht."
        from: ch05/s03
      - text: "Laut Marie kommt das Junibild nicht wieder: Glanz im September heißt Nachblüte der 'New Dawn', davor Lavendel und Katzenminze, Frauenmantel an den Kanten, Astern und am Laubengang Dahlien in Reihen; die Gallica und die Damaszener sind schon dran."
        from: ch06/s01
      - text: "Lena hat ihn für einen Samstag als Helfer eingetragen, mit Ankunft und Abfahrt; die Helferliste hängt im Hofladen am schwarzen Brett, ganz oben."
        from: ch06/s03
      - text: "Dienstag Ende Juli hat Grete Marie und ihm mittags Buttermilch und Johannisbeerkuchen auf die Bank unter der 'New Dawn' gebracht und ist ohne ein Wort gegangen."
        from: ch06/s01
      - text: "Auf seine Nachricht 'Kommst du morgen wieder?' hat Marie geantwortet: 'Die Rosen fragen das nicht. Die wissen das.'"
        from: ch06/s01
      - text: "Nächste Woche kommt der Gutachter zur Wertermittlung und will jede Rechnung in der Hand haben, am liebsten mit Datum und Firmenstempel."
        from: ch06/s02
      - text: "Die Rechnung für die Umdeckung der Nordseite des Dachs, mit Stempel, hat er Donnerstag spät am Abend im Arbeitszimmer gefunden; die Fensterflügel dort bleiben nach einer Handbreit stecken."
        from: ch06/s02
      - text: "Grete sagt, Marie hat das Gartenbuch im Arbeitszimmer gelassen, da gehöre es hin; er könne ruhig hineinsehen."
        from: ch06/s02
      - text: "Im Gartenbuch steht in Hedwigs Handschrift zu jeder Rose ein Name samt Bemerkung, etwa bei der 'Rosa Mundi' Läuse und Brennnesseljauche; die 'Ghislaine' hat ein Ausrufezeichen."
        from: ch06/s02
      - text: "Auf der Seite 'Lindenhof-Rose' steht, datiert auf einen Juli vor sechsundzwanzig Jahren: Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen."
        from: ch06/s02
      - text: "Er erinnert sich wieder: Hedwig hat ihm beim Pflanzen die Hand geführt ('Nicht drücken'), der Steckling stand in einem Erdbeer-Joghurtbecher, und er hat ihn jeden Morgen barfuß mit dem Lineal gemessen, am fünften Tag dreieinhalb. Wo genau das Loch war, weiß er nicht mehr."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, und er hat selten geantwortet; zu Weihnachten ein Anruf von zehn Minuten, dann bis zum nächsten Dezember nichts."
        from: ch06/s02
      - text: "Lena macht für Grete montags den Hofladen auf, seit Jahren; am Montag Anfang August hat er dort Gretes Kiste geholt."
        from: ch06/s03
      - text: "Lena hat ihm im Hofladen gesagt: Marie ist keine, mit der man einen Sommer spielt, und wenn er es doch tut, nimmt sie ihm das übel, und das ganze Dorf mit ihr. Ob Marie ihr etwas gesagt hat, solle er Marie selbst fragen."
        from: ch06/s03
      - text: "Laut Hannes hat der Festausschuss gesessen: Bis Freitag, den vierzehnten, braucht er eine Zusage, auf die man bauen kann; sonst wird im schon reservierten Zelt hinter dem Feuerwehrhaus gefeiert. Er hat Hannes versprochen: 'Bis dahin kriegst du eine Antwort.'"
        from: ch06/s03
      - text: "Die Partner wollten in Hamburg persönlich über seine Einlage sprechen, Donnerstag, der dreizehnte, um neun; beide Termine stehen auf einem Briefumschlag."
        from: ch06/s03
      - text: "Nur auf dem Hügel hinter der Scheune kommt das Gespräch aus dem Büro durch."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, kurz nach sieben hat er unter der Eiche auf dem Hügel mit einem Partner telefoniert; der akzeptiert, dass er heute nicht nach Hamburg kommt: Die Einlage ist bis Monatsende fällig."
        from: ch07/s01
      - text: "Zehn Minuten später hat der Dachdecker zurückgerufen und eine Summe für den Herbst genannt; auf dem Briefumschlag hat er die Zeile mit der Hamburger Uhrzeit durchgestrichen und die Summe darunter geschrieben."
        from: ch07/s01
      - text: "Am Morgen des 13. August hat Marie mit dem weißen Kastenwagen am Tor gehalten und eine Kiste mit Töpfen ausgeladen, ohne zum Hügel heraufzusehen; er ist auf der anderen Seite zum Kombi hinuntergegangen."
        from: ch07/s01
      - text: "Am 13. August hat er im Notariat in der Kreisstadt, eine halbe Stunde vom Gut, in Anwesenheit Steinhagens und des Notars den Vorvertrag über das Gut unterschrieben."
        from: ch07/s01
      - text: "Der Vorvertrag hat ein Rücktrittsrecht bis zum zehnten September, fünf Tage nach dem Fest; laut Steinhagen hat so etwas bei Weidenkamp noch nie jemand gezogen."
        from: ch07/s01
      - text: "Im Lageplan reicht die graue Fläche der Stellplätze bis an die Mauer, bis in die Ecke hinter dem Laubengang; welches Kästchen über dieser Stelle liegt, hat er nicht ausgerechnet."
        from: ch07/s01
      - text: "Grete sagt, im Dorf werde über den Herrn mit dem silbernen Auto geredet, ob der wiedergekommen ist; er hat ihr gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes. Das war gelogen."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat Marie ihm in der Mauerecke hinter dem letzten Bogen des Laubengangs die Lindenhof-Rose gezeigt: Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock, und der blüht wieder; am längeren Trieb sitzt eine erbsengroße grüne Knospe mit rosa Saum."
        from: ch07/s02
      - text: "Marie hat die alte Pflanze im Juni unter den Brombeeren gefunden."
        from: ch07/s02
      - text: "Am Freitag, dem 14. August, nachmittags hat Hannes am Tor die Antwort eingefordert; er hat gesagt: 'Das Fest findet dieses Jahr auf dem Gut statt.' Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, am späten Nachmittag hat Marie im Arbeitszimmer die Schublade von Hedwigs Schreibtisch aufgezogen und die Mappe von Weidenkamp Hotels mit Vorvertrag und Lageplan gefunden; als er vom Hügel hereinkam, lag sie offen vor ihr."
        from: ch08/s01
      - text: "Er hat Marie gesagt: Das ist ein Vorvertrag; im Büro bieten sie ihm eine Partnerschaft an, die Einlage muss bis Monatsende kommen; die Nordseite, die Rinnen, das Haupthaus ist schlimmer als die Scheune; er hat ein Rücktrittsrecht bis nach dem Fest; er wollte ihr das nicht halb sagen."
        from: ch08/s01
      - text: "Marie hat gesagt, den Garten hätte sie ihm notfalls hergegeben, aber nicht hinter ihrem Rücken, nicht nach dem Steg; und den Parkplatz habe er ihr nicht erklärt. Dann ist sie an ihm vorbei durch die Tür gegangen, und er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Marie hat den Lageplan mit der grauen Fläche nach oben auf den Schreibtisch gelegt; ihre Finger haben einen Erdrand genau über der Sonnenuhr hinterlassen."
        from: ch08/s01
      - text: "Seit Donnerstag, dem 27. August, steht Maries weißer Kastenwagen nicht mehr am Tor; vier Nachrichten hat er ihr vom Hügel aus geschickt, auf keine kam eine Antwort."
        from: ch09/s01
      - text: "Am Montag, dem 31. August, hat er Grete gesagt, er fahre morgen früh nach Hamburg."
        from: ch09/s01
      - text: "Grete hat ihm Hedwigs alte blaue Keksdose gegeben, in der früher Butterkekse lagen, die er sich auf Zehenspitzen stibitzt hat: Hedwig hat alles aufgehoben. 'Lies das, Jung. Was du dann machst, ist deine Sache.' Über Marie hat Grete kein Wort gesagt."
        from: ch09/s01
      - text: "In der Dose liegen seine Kinderbriefe in Bleistift-Druckschrift, LIEBE TANTE HEDWIG, mit der Frage, wie viele Zentimeter der Steckling gewachsen sei, bitte mit Lineal messen; dazu seine Zeichnung mit acht: ein Mädchen mit Zopf auf einer Mauer, die Fäuste in die Seiten gestemmt, daneben 'Die hat mit mir geschimpft'."
        from: ch09/s01
      - text: "Ganz unten in der Dose liegt, glattgestrichen, seine letzte Karte aus dem Studium: 'Nächsten Sommer komm ich bestimmt.' Er ist nicht gekommen; Hedwig hat sie trotzdem aufbewahrt."
        from: ch09/s01
      - text: "In der Nacht hat er auf die freie Seite des Briefumschlags mit der Dachdecker-Summe geschrieben: Nordseite Herbst. Südseite nächstes Jahr. Rinnen selbst. Darunter: Büro drei Tage, zwei hier."
        from: ch09/s01
      - text: "Am Dienstag, dem 1. September, morgens auf dem Hügel hat er Steinhagen gesagt, dass er das Rücktrittsrecht zieht; die vereinbarte Summe trägt er selbst, die Erklärung schickt er heute."
        from: ch09/s01
      - text: "Steinhagen hat über den Preis keinen Satz verloren; er sagt, er habe es seit dem Notar fast geahnt, weil Jonas nur Wasser wollte. Die Gruppe hat noch ein zweites Gut im Blick. Steinhagen hat ihm Glück mit dem Haus gewünscht: 'Dann fehlt ihm wenigstens nichts.'"
        from: ch09/s01
      - text: "Er hat dem Büro geschrieben, er komme heute nach Hamburg, um die Partnerschaft persönlich abzusagen, und auf Senden getippt, bevor er es ein zweites Mal durchrechnen konnte."
        from: ch09/s01
      - text: "Er hat Hannes gesagt: Das Fest bleibt auf dem Gut, nicht nur dieses Jahr, nächstes auch und danach. Hannes bestellt das Zelt ab."
        from: ch09/s01
      - text: "Samstag soll er laut Hannes beim Fest vorn fahren, mit Hedwigs altem Trecker, den Hannes im Frühjahr gemacht hat; er ist noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Er hat Hannes gebeten, Marie nichts zu sagen, weil er es selbst tun muss; Hannes sagt, man redet nicht für andere, aber er solle sie nicht zu lange warten lassen."
        from: ch09/s01
    believes:
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Das Haupthaus ist schlimmer dran als das Scheunendach, und er weiß ungefähr, was das kostet."
        from: ch03/s03
      - text: "Steinhagen spricht seine Sprache; einen Käufer, der rechnen kann und sich nicht lange bitten lässt, wollte er seit dem Brief vom Nachlassgericht."
        from: ch03/s03
      - text: "Mit dem Parkplatz auf dem Gelände hat er seit dem Wort Stellplatzlösung gerechnet, mit der Zeile über Gretes Abfindung nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "'Ein Interessent' war nicht gelogen, aber so wenig, dass es kaum Gewicht hatte; warum er Marie nicht mehr gesagt hat, weiß er selbst nicht."
        from: ch04/s02
      - text: "Er gehört auf dem Gut dazu; zum ersten Mal hat er das Gefühl, an einem Ort mitgerechnet zu werden."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Einer der nummerierten Stellplätze im Lageplan liegt über dem Loch, das er für den ersten Steckling gegraben hat; welcher, rechnet er nicht aus."
        from: ch06/s02
      - text: "In Hedwigs letzten Jahren war er zweimal hier, vielleicht dreimal."
        from: ch06/s02
      - text: "Den Fund im Gartenbuch erzählt er weder Grete noch Marie; ob es Scham ist oder ob er etwas festhält, das hier als Einziges ihm allein gehört, weiß er nicht."
        from: ch06/s02
      - text: "Er versteht den Partner wirklich; er hätte es selbst so gesagt."
        from: ch07/s01
      - text: "Er rechnet nicht mehr aus, was sich lohnt, sondern was trägt."
        from: ch09/s01
      - text: "Hannes hat an der Zusage gezweifelt, auch wenn er sagt, er habe nie daran gezweifelt; es war trotzdem gut."
        from: ch09/s01
    does_not_know:
      - "wo Marie seit Donnerstag, dem 27. August, ist und ob sie seine vier Nachrichten gelesen hat"
      - "dass Marie im Hinterhof der alten Schmiede in Klein Lindau Stecklinge der Lindenhof-Rose zieht und beide angewachsen sind"
      - "dass Marie am 2. September einen Steckling neben den alten Stock der Lindenhof-Rose gepflanzt hat"
      - "dass die Knospe der Lindenhof-Rose in der Mauerecke aufgeblüht ist"
      - "dass Marie Hedwig versprochen hat, den Garten zu retten"
      - "was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu Marie gesagt hat: dass sie sich wünscht, Marie führe den Garten einmal weiter"
      - "dass Hedwig auch Grete gesagt hat, wen sie sich für den Garten wünscht"
      - "dass Grete Marie Hedwigs Gartenbuch gegeben hat"
      - "dass Marie bei Lena über ihn geredet hat und Lena glaubt, Marie habe Gefühle für ihn"
      - "warum Marie die Lindenhof-Rose in der Mauerecke seit Juni vor allen versteckt und mit einem leeren Schild versehen hat"
      - "dass Grete seine Ausrede mit den Terminen in der Stadt durchschaut hat"
      - "dass Marie nach dem Streit zu Grete in die Küche gegangen ist, ihr 'Parkplatz' gesagt hat und Grete sie um Verzeihung gebeten hat"
      - "dass Marie in der Nacht Lena vom Vorvertrag, vom Lageplan und vom Kuss am Steg erzählt hat"
      - "dass Lena Hannes anrufen und das Dorf über die Helferliste zusammentrommeln will"
      - "dass Marie seine Zusage an Hannes jetzt als 'dieses Jahr' hört"
  lena-hansen:
    knows:
      - text: "Laut Marie stand in Jonas' Tabelle beim Laubengang 'Entsorgung', für beide Rankbögen der 'Ghislaine'."
        from: ch02/s03
      - text: "Laut Marie ist Jonas in geputzten Lederschuhen und heller Hose ins nasse Gras vor den Bogen gekniet, die Hose ist an beiden Knien grün."
        from: ch02/s03
      - text: "Laut Marie hat Jonas am Bogen gerüttelt, 'kein Fundament' gesagt und ein Fundament von vierzig mal vierzig, achtzig tief, auf die Rückseite seiner Tabelle gezeichnet."
        from: ch02/s03
      - text: "Marie sagt, Jonas habe die Bögen nicht entsorgt, weil sie ihn dazu gebracht habe."
        from: ch02/s03
      - text: "Marie hat zwanzig Minuten über Jonas' Schuhe geredet; sie kommt Freitag wieder."
        from: ch02/s03
      - text: "Am Samstag Mitte Juli hat sie am Tor die Helfer abgehakt und eingeteilt: drei Landfrauen mit Hacken, vier Mann von der Feuerwehr, die Nachbarn vom Dorfteich mit Schubkarren."
        from: ch05/s01
      - text: "Marie hat an jeden Rosenstock, der stehen bleiben muss, ein Namensschild gehängt, damit keiner etwas rausreißt."
        from: ch05/s01
      - text: "Jonas ist zum Helfereinsatz gekommen; sie hat ihn eingetragen."
        from: ch05/s01
      - text: "Um fünf hat sie Jonas gefragt, ob er nächsten Samstag Zeit hat, und er hat Ja gesagt."
        from: ch05/s03
      - text: "Sie hat Jonas auf die Helferliste für den Rosengarten eingetragen, mit Ankunft und Abfahrt; die Liste hängt ganz oben am schwarzen Brett im Hofladen."
        from: ch06/s03
      - text: "Für Grete macht sie montags den Hofladen auf, seit Jahren; am Montag Anfang August hat Jonas Gretes Kiste abgeholt."
        from: ch06/s03
      - text: "Sie hat Jonas gesagt: Marie ist keine, mit der man einen Sommer spielt, und wenn er es doch tut, nimmt sie ihm das übel, und das ganze Dorf mit ihr. Auf seine Frage, ob Marie ihr etwas gesagt hat, hat sie geantwortet, das müsse er Marie selbst fragen."
        from: ch06/s03
      - text: "In der Nacht zum 28. August, kurz vor Mitternacht, hat Marie an der Küchentür des Hansen-Hofs geklopft; sie hat sie im Schlafanzug hereingelassen, Mats hat Wasser aufgesetzt."
        from: ch08/s03
      - text: "Laut Marie liegen im Lageplan graue Kästchen über dem Rosengarten, bis an die Mauer, und Jonas hat unterschrieben, gerade und ohne Zögern, heimlich beim Notar."
        from: ch08/s03
      - text: "Laut Marie haben Marie und Jonas sich am Abend am Steg geküsst; davon hat sie bis heute nichts gewusst."
        from: ch08/s03
      - text: "Laut Marie galt Jonas' Zusage an Hannes vor zwei Wochen am Tor nur für 'dieses Jahr'."
        from: ch08/s03
      - text: "Marie hat ihr erzählt, was sie nicht mal ihr erzählt hatte: Letzten Herbst auf der Bank unter der Kletterrose hat Hedwig Maries Hand genommen und gesagt, sie wünscht sich, dass Marie den Garten einmal weiterführt, wenn sie nicht mehr kann. Das steht nirgends, nicht im Testament, auf keinem Zettel."
        from: ch08/s03
      - text: "Marie hat das verschwiegen, weil es nach Erbschleicherei klingt; sie hat sich geschämt, bevor überhaupt einer was gesagt hat."
        from: ch08/s03
      - text: "Marie hat gesagt, das sei ihre Sache, nicht die vom Dorf."
        from: ch08/s03
      - text: "Sie hat die Helferliste mit jeder Nummer."
        from: ch08/s03
    believes:
      - text: "Marie hat Liebeskummer wegen Jonas, mindestens einen mit zwei Stück Kuchen."
        from: ch08/s03
      - text: "Marie ist keine, mit der man einen Sommer spielt."
        from: ch06/s03
      - text: "Jonas ist ein Hamburger Dösbaddel: Er reißt am Samstag Brombeeren raus, trinkt Gretes Kaffee, lässt sich auf die Schulter klopfen und unterschreibt hinterher heimlich beim Notar."
        from: ch08/s03
      - text: "Marie hat Hedwig seit ihrem zehnten Jahr den Giersch gestochen; wer ihr Erbschleicherei nachsagt, kriegt es mit ihr zu tun."
        from: ch08/s03
      - text: "Morgen früh sollte sie Hannes anrufen."
        from: ch08/s03
    does_not_know:
      - "dass in der Mauerecke hinter dem Südende des Laubengangs der letzte Stock der Lindenhof-Rose steht"
      - "dass Marie im Hinterhof der alten Schmiede Stecklinge der Lindenhof-Rose zieht und einen davon in den Rosengarten gepflanzt hat"
      - "dass Ralf Steinhagen von Weidenkamp Hotels das Gut Mitte Juli besichtigt hat"
      - "dass Marie und Jonas im Gewitter unter dem Laubengang gestanden haben und sich seitdem duzen"
      - "dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg sprechen wollten"
      - "dass der Vorvertrag ein Rücktrittsrecht bis zum 10. September hat"
      - "dass Jonas am 1. September vom Vorvertrag zurückgetreten ist"
      - "dass Jonas Hannes zugesagt hat, das Fest bleibe auch in den nächsten Jahren auf dem Gut"
      - "dass Grete Marie um Verzeihung gebeten hat und dass Hedwig auch Grete ihren Wunsch für den Garten gesagt hat"
  marie-albers:
    knows:
      - text: "Jonas Behrendt aus Hamburg ist Hedwigs Erbe."
        from: ch01/s01
      - text: "Auftrag: Rosengarten bis zum Erntefest am 5. September herrichten, Wege begehbar, Beete sauber, alles, was man vom Haus aus sieht."
        from: ch01/s02
      - text: "Jonas will das Gut verkaufen; ein gepflegtes Gut bringe einen besseren Preis."
        from: ch01/s02
      - text: "Abmachung mit Jonas: freie Hand bei den Rosen, über die Wege wird geredet, Zwischenstände alle zwei Wochen mit Fotos, Budget bleibt fest."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "In der Mauerecke am Südende des Laubengangs steht der alte Stock der Lindenhof-Rose, kniehoch und krumm; die Brombeeren sind fort, das Licht kommt bis an den Boden, und dicht über der Erde schieben sich zwei neue Triebe aus dem Holz."
        from: ch06/s01
      - text: "Am Mittwoch, dem 2. September, kurz nach fünf haben im Hinterhof der alten Schmiede beide Stecklinge der Lindenhof-Rose getrieben; feine weiße Wurzeln halten die Erde bis an den Topfrand. Den kräftigeren hat sie in einer Kiste mit Zeitungspapier zum Gut gebracht, der andere bleibt unter der Folie, an allen vier Ecken festgesteckt. Niemandem hat sie es gezeigt, auch Jonas hat sie nicht angerufen."
        from: ch09/s02
      - text: "Grete hat ihr Hedwigs Gartenbuch zwei Tage nach dem Auftrag aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Laut Gartenbuch steht 'Ghislaine de Féligonde' an Bogen sieben und acht des Laubengangs, gepflanzt 1974; Rose und Bögen stehen seit zweiundfünfzig Jahren."
        from: ch02/s01
      - text: "Jonas' Tabelle: 'Hauptweg frei bis Ende Juni', beim Laubengang 'Entsorgung, Ersatz verzinkt'."
        from: ch02/s01
      - text: "Neue Abmachung: Die Bögen bleiben, Jonas bestellt Beton für Punktfundamente, sie bindet die Rose selbst wieder an; dafür ist der Hauptweg Ende Juni vom Tor bis zur Pforte frei, mit Fotos."
        from: ch02/s01
      - text: "Der Bogen steht seit einer Woche im Beton; Jonas hat daran gerüttelt, und er sitzt fest."
        from: ch03/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Lena hält ihr Reden über Jonas für kein gutes Zeichen – oder ein sehr gutes."
        from: ch02/s03
      - text: "Mit zehn hat sie im Rosengarten ihren ersten Rosenschnitt gemacht; Hedwig hat ihr die Hand geführt: über dem Auge, schräg, damit das Wasser abläuft."
        from: ch03/s01
      - text: "Sie hat Hedwigs alte Schere mit dem roten Griff, ein Geschenk von Hedwig; am 27. August hat sie sie von Gretes Fensterbank wieder ins Holster gesteckt."
        from: ch08/s02
      - text: "Letzten Herbst auf der Bank unter der 'New Dawn' hat Hedwig ihre Hand genommen und gesagt, sie wünscht sich, dass Marie den Garten einmal weiterführt, wenn sie nicht mehr kann; das steht nirgends, nicht im Testament, auf keinem Zettel. Jonas hat sie es nicht erzählt."
        from: ch08/s03
      - text: "Seit dem Gewitter unter dem Laubengang sagen sie und Jonas Du zueinander; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Jonas trägt seit ein paar Tagen grüne Gummistiefel aus der Remise, eine Nummer zu groß."
        from: ch03/s01
      - text: "Jonas hat ihr Kaffee mit Milch gebracht, weil Grete ihm gesagt hat, dass sie Milch nimmt."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker, um den Brombeerwurzelstock an der Sonnenuhr herauszuziehen."
        from: ch03/s02
      - text: "Auf Hannes' Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas damals nicht zugesagt: Es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen, die er selbst noch nicht kenne."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Mitte Juli schaufelt sie mit Hannes Kies auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war auf dem Gut; er hat mit Jonas auf der Terrasse gesessen, Grete hat Kaffee gebracht, und auf dem Tablett stand sonst nichts."
        from: ch04/s01
      - text: "Im Garten nennt Steinhagen die Fläche hinter dem Haus ein Pfund: ebener Grund, kurze Wege, die Mauer schirmt alles ab; zu ihr sagt er, das werde auf den Fotos sehr schön."
        from: ch04/s01
      - text: "Sie hat Steinhagen gesagt, das sei keine Fläche, sondern ein Garten aus den Dreißigerjahren, und die 'Rosa Mundi' sei älter als sie beide zusammen; er nannte das eine wertvolle Auskunft."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bietet Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, hat Jonas gesagt: 'Ein Interessent.'"
        from: ch04/s02
      - text: "Für den Helfersamstag Mitte Juli hat sie an jeden Stock, der stehen bleiben muss, vom Tor bis zur Pforte ein Namensschild gehängt; nur die Mauerecke hinter dem Südende des Laubengangs trägt keinen Namen. Dort hat sie im Dunkeln die Brombeeren selbst zurückgeschnitten und einen Pfahl mit leerem Schild davorgesetzt."
        from: ch05/s01
      - text: "Hannes hat Jonas an die Brombeeren der Südmauer westlich der Pforte geschickt, fort von der Ecke am Laubengang."
        from: ch05/s01
      - text: "Hannes hat vor allen Helfern gesagt: Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "An der Mitte der Südmauer, nahe der Pforte, hat Jonas unter den Brombeeren eine alte 'Ghislaine de Féligonde' freigelegt, die seit Jahren keiner mehr gesehen hat; er hat aufgehört zu ziehen, und sie hat die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Grete hat Jonas zwei Bier aus der Helferkiste gegeben und ihm Quark gegen den Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "Lena hat Jonas den ganzen Tag gesiezt und ihn um fünf gefragt, ob er nächsten Samstag Zeit hat; er hat Ja gesagt."
        from: ch05/s03
      - text: "Als Junge hat Jonas am Steg Flöße gebaut; das letzte ist mitten auf dem See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer, und seitdem rechnet er alles zweimal."
        from: ch05/s03
      - text: "Mats hat die Bank gerichtet: die Latten neu verschraubt, das Holz glattgeschliffen."
        from: ch05/s03
      - text: "Am Abend am Steg haben Jonas und sie sich geküsst; Jonas hat gesagt, das wollte er seit dem Gewitter, und sie hat gesagt: 'Ich auch.'"
        from: ch05/s03
      - text: "Auf ihre Frage, ob er im Herbst noch hier ist, hat Jonas gesagt: 'Ich weiß es nicht.'"
        from: ch05/s03
      - text: "Ende Juli sind die Gallica und die Damaszener verblüht; sie hat Jonas erklärt, dass das Junibild nicht wiederkommt und Glanz im September Nachblüte der 'New Dawn', Lavendel, Katzenminze, Frauenmantel, Astern und Dahlien am Laubengang heißt."
        from: ch06/s01
      - text: "Jonas hat geglaubt, zum Fest sehe der Garten aus wie im Juni."
        from: ch06/s01
      - text: "Grete hat ihnen mittags Buttermilch und Johannisbeerkuchen auf die Bank unter der 'New Dawn' gebracht, von ihr zu Jonas und zurück gesehen und ist ohne ein Wort gegangen; auf der Treppe nahm sie jede Stufe einzeln."
        from: ch06/s01
      - text: "Laut Jonas hat Lena ihn für Samstag schon eingetragen, mit Ankunft und Abfahrt."
        from: ch06/s01
      - text: "Aus Haus und Garten des Guts kommt keine Nachricht durch."
        from: ch06/s01
      - text: "Am Abend hat Jonas ihr geschrieben: 'Kommst du morgen wieder?'; sie hat geantwortet: 'Die Rosen fragen das nicht. Die wissen das.'"
        from: ch06/s01
      - text: "Am Freitag, dem 14. August, sitzen an der Spitze eines Triebs der 'New Dawn' über der Bank drei schmale Knospen, die oberste mit einem Hauch Rosa; am Laubengang haben die ersten Dahlien aufgemacht."
        from: ch07/s02
      - text: "Die Knospe der Lindenhof-Rose aus dem August hat sich geöffnet: eine einzige Blüte, zartrosa und gefüllt."
        from: ch09/s02
      - text: "Sie hat Jonas am 14. August in die Mauerecke hinter dem letzten Bogen geführt und ihm die Lindenhof-Rose gezeigt: Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock, und der blüht wieder. Jonas ist stumm geblieben."
        from: ch07/s02
      - text: "Mittags hat Grete Butterkuchen und Kaffee auf die Bank gebracht; ihr Blick hing einen Augenblick zu lange an Jonas."
        from: ch07/s02
      - text: "Jonas hat ihre Finger geküsst, einen nach dem anderen, dort, wo die Dornen rote Striche gezogen hatten."
        from: ch07/s02
      - text: "Über die zu großen Gummistiefel aus der Remise hat Jonas gesagt: 'Die gehören mir nicht mal'; sein Lachen hörte zu früh auf."
        from: ch07/s02
      - text: "Hannes hat am 14. August am Tor gesagt, heute sei die Antwort fällig; davon hatte ihr niemand etwas erzählt. Jonas hat geantwortet: 'Das Fest findet dieses Jahr auf dem Gut statt.'"
        from: ch07/s02
      - text: "Als sie Jonas um den Hals fiel, kamen seine Arme einen Atemzug später als sonst, dann hielten sie sie fester als nötig."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, haben am Rondell die ersten Astern aufgemacht, und die 'New Dawn' über der Bank steht in ihrer zweiten Blüte."
        from: ch08/s01
      - text: "Am 27. August fehlte das Gartenbuch auf seinem Platz am Fenster im Arbeitszimmer; neben der grünen Lampe lag nur die Lupe."
        from: ch08/s01
      - text: "In einer Schublade von Hedwigs Schreibtisch hat sie eine Mappe von Weidenkamp Hotels gefunden, der Firma des Mannes, der im Juli den Garten ein Pfund genannt hat."
        from: ch08/s01
      - text: "Im Lageplan der Mappe reichen die Stellplätze bis an den Backstein, bis in den Winkel hinter dem letzten Bogen, genau über der Lindenhof-Rose; ein graues Kästchen liegt über der Sonnenuhr."
        from: ch08/s01
      - text: "Jonas hat den Vorvertrag unterschrieben, gerade und ohne Zögern, am Donnerstag, dem 13. August, dem Tag vor seiner Zusage an Hannes."
        from: ch08/s01
      - text: "Laut Jonas bietet ihm das Büro eine Partnerschaft an, für die er eine Einlage bis Monatsende bringen muss; die Nordseite, die Rinnen, das Haupthaus ist schlimmer als die Scheune; er hat ein Rücktrittsrecht bis nach dem Fest; er wollte ihr das nicht halb sagen."
        from: ch08/s01
      - text: "Sie hat Jonas gesagt, den Garten hätte sie ihm notfalls hergegeben, aber nicht hinter ihrem Rücken, nicht nach dem Steg, und den Parkplatz habe er ihr nicht erklärt; dann ist sie gegangen, und er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Grete hat so was geahnt, das Wort nicht; sie wollte es diesmal nicht wissen und hat gedacht, Jonas sagt es ihr selbst. Grete hat sie um Verzeihung gebeten."
        from: ch08/s02
      - text: "Laut Grete hat Jonas beim Abendessen nach dem Gerede über den Herrn mit dem silbernen Auto die ganze Zeit sein Spiegelei angeguckt; Grete sieht ihm an, wenn er schwindelt."
        from: ch08/s02
      - text: "Hedwig hat auch Grete gesagt, wen sie sich für den Garten wünscht."
        from: ch08/s02
      - text: "Grete hat ihr eine Ecke Probe-Butterkuchen mitgegeben; ob er zu süß ist, soll sie morgen sagen, und die Astern am Rondell gießt sonst keiner."
        from: ch08/s02
      - text: "In der Nacht hat sie Lena alles erzählt: Lageplan, Unterschrift, den Abend am Steg, das 'dieses Jahr' und Hedwigs Wunsch auf der Bank."
        from: ch08/s03
      - text: "Lena will morgen früh Hannes anrufen und hat die Helferliste mit jeder Nummer; sie hat Lena gesagt, das sei ihre Sache, nicht die vom Dorf."
        from: ch08/s03
      - text: "Auf Lenas Küchentisch lagen Stapel alter Fotos, die Lena schneller als nötig mit einem Geschirrtuch zugedeckt hat."
        from: ch08/s03
      - text: "Am Mittwoch, dem 2. September, stand Jonas' Kombi nicht auf dem Gutshof."
        from: ch09/s02
      - text: "Sie hat im Rosengarten die Kanten nachgestochen und am Laubengang die verblühten Dahlien ausgeputzt; an den Damaszenerrosen am Rondell leuchten die Hagebutten, wie sie es im Juli versprochen hat."
        from: ch09/s02
      - text: "Gegen sieben hat Grete ihr Kaffee und Butterkuchen auf die Bank unter der Kletterrose gebracht, nichts gefragt, gesagt, die Deern habe mehr Ausdauer als der Giersch, und ihr über den Zopf gestrichen."
        from: ch09/s02
      - text: "Sie hat den Steckling eine Handbreit neben der Blüte der Lindenhof-Rose eingepflanzt, das Loch doppelt so tief wie der Topf, die Erde mit beiden Händen festgedrückt; im Lageplan liegt über diesem Winkel ein graues Kästchen."
        from: ch09/s02
      - text: "Hannes hat hellen Kies fürs Rondell gebracht, sie haben zusammen geschaufelt; er hat den Steckling gesehen und 'Mach man weiter, Deern' gesagt. Auf ihre Frage, woher er das wissen wolle, hat er 'Weiß man eben' gesagt und ihr dabei nicht ins Gesicht gesehen."
        from: ch09/s02
    believes:
      - text: "Splitt auf dem Hauptweg würde den alten Kies zerstören."
        from: ch01/s01
      - text: "Jonas will das Gut verkaufsfertig machen."
        from: ch01/s03
      - text: "Der Stock in der Mauerecke hinter dem Laubengang ist die letzte Lindenhof-Rose im Garten."
        from: ch01/s03
      - text: "Den Winkel hinter dem Laubengang sieht man von der Terrasse nicht, und in Jonas' Tabelle kommt er nicht vor."
        from: ch01/s03
      - text: "Ihr Herzklopfen neben Jonas im Gewitter kam nicht vom Wetter."
        from: ch05/s03
      - text: "Kippt der Ballen des Wurzelstocks zur 'Rosa Mundi' hin, reißt er sie mit; deshalb langsam, nicht ruckzuck."
        from: ch03/s02
      - text: "Lenas Ton gegenüber Jonas ist ihr Vertreterton aus dem Hofladen."
        from: ch05/s01
      - text: "Der dünne barfüßige Junge, den sie einmal oben auf der Gartenmauer gesehen hat, war vielleicht Jonas."
        from: ch05/s03
      - text: "Jonas' Zusage an Hannes galt nur für dieses Jahr."
        from: ch08/s01
      - text: "Jonas weiß selbst nicht, ob stimmt, was er sagt, dass noch nichts entschieden ist."
        from: ch08/s01
      - text: "Jonas' Schweigen vor der Knospe in der Mauerecke war keine Rührung."
        from: ch08/s01
      - text: "Böse ist sie Grete nicht, sondern sich selbst: Ihr eigenes Herz hat sie nicht so verteidigt wie einen Garten."
        from: ch08/s02
      - text: "Hedwigs Wunsch zu erzählen klingt nach Erbschleicherei."
        from: ch08/s03
      - text: "Den Garten will sie, seit Hedwig ihre Hand genommen hat; was sie mit Jonas will und ob das eine ohne das andere zu haben ist, weiß sie nicht."
        from: ch08/s03
      - text: "Was einer heute Nacht für sich behalten will, geht sie nichts an."
        from: ch08/s03
      - text: "Man setzt in die Erde, was man liebt, und Gewähr gibt einem keiner, die Rosen nicht und Hedwig auch nicht."
        from: ch09/s02
      - text: "Hannes verschweigt ihr etwas; heute hat er den Dahlien geantwortet, nicht ihr."
        from: ch09/s02
    does_not_know:
      - "dass das Geldvermächtnis nur für einen Sommer Gartenpflege reicht"
      - "dass Steinhagen vorher angerufen und Jonas ihm die Besichtigung zugesagt hat"
      - "dass Weidenkamp im Gutshaus rund zwanzig Zimmer, in Kuhstall und Scheune Spa und Seminarraum und am Steg ein Saunahaus plant"
      - "dass Weidenkamp für Gretes freiwilligen Auszug eine Abfindung vorsieht"
      - "wo das Gartenbuch geblieben ist"
      - "von welchen Fotos Steinhagen spricht"
      - "dass der Makler den Garten vorzeigbar haben will"
      - "dass am letzten Freitag im Juli ein Fotograf für Gartenfotos kommen soll"
      - "dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg sprechen wollten"
      - "dass Jonas sie vom Hügel hinter der Scheune bei der Arbeit beobachtet hat, auch am Morgen des 13. August, als sie die Kiste mit Töpfen am Tor auslud"
      - "warum Jonas an der Mauer beim Tor einen Moment still und abwesend war"
      - "dass Jonas beim Graben an der Südmauer an die Stellplätze im Lageplan gedacht hat"
      - "dass Jonas im Gartenbuch gelesen hat, dass er als Kind das Loch für den ersten Steckling der Lindenhof-Rose gegraben hat"
      - "ob Jonas wusste, dass der Parkplatz die Lindenhof-Rose trifft"
      - "dass nächste Woche ein Gutachter zur Wertermittlung kommt"
      - "dass Lena Jonas im Hofladen gewarnt hat, mit ihr keinen Sommer zu spielen"
      - "dass der Festausschuss bis Freitag, den 14., eine Zusage verlangt hat und sonst im Zelt hinter dem Feuerwehrhaus gefeiert worden wäre"
      - "dass der Dachdecker Jonas eine Summe für den Herbst genannt hat"
      - "dass das Rücktrittsrecht genau bis zum 10. September läuft, fünf Tage nach dem Fest"
      - "was auf Lenas zugedeckten Fotos zu sehen ist"
      - "dass Grete Jonas Hedwigs Keksdose mit seinen Kinderbriefen gegeben hat"
      - "dass Jonas am 1. September das Rücktrittsrecht gezogen hat und die vereinbarte Summe selbst trägt"
      - "dass Jonas dem Büro geschrieben hat, er sage die Partnerschaft in Hamburg persönlich ab"
      - "dass Jonas Hannes zugesagt hat, das Fest bleibe nicht nur dieses Jahr, sondern auch danach auf dem Gut, und dass Hannes das Zelt abbestellt"
      - "dass Jonas Hannes gebeten hat, ihr nichts zu sagen"
      - "was Hannes weiß, das sie nicht weiß"
      - "wo Jonas am 2. September ist"
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Die Zimmerzahl des Gutshauses, die Grundfläche der Scheune auf den Quadratmeter und das Baujahr."
        from: ch03/s03
      - text: "Weidenkamps Plan für das Gut: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg; der Parkplatz liegt im Lageplan auf dem Rosengarten, ein paar Rosen bleiben in Kübeln."
        from: ch04/s02
      - text: "Mitte Juli hat er das Gut besichtigt und dabei Marie Albers, Hannes Kröger und Grete Paulsen kennengelernt; jeden Namen hat er sich gemerkt."
        from: ch04/s01
      - text: "Laut Marie ist der Rosengarten in den Dreißigerjahren angelegt, und die 'Rosa Mundi' ist älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes Kröger hat gefragt, wo das Erntefest hin soll; er hat ihm eine Veranstaltungsfläche gegen Gebühr angeboten."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht auf dem Gut."
        from: ch04/s02
      - text: "Am Donnerstag, dem 13. August, hat Jonas im Notariat in der Kreisstadt in seinem Beisein den Vorvertrag über das Gut unterschrieben, mit einem Rücktrittsrecht bis zum 10. September; den Kugelschreiber mit dem Firmenlogo hat Jonas ihm zurückgeschoben."
        from: ch07/s01
      - text: "Jonas wollte nur Wasser."
        from: ch07/s01
      - text: "Am Dienstag, dem 1. September, früh morgens hat Jonas ihm am Telefon gesagt, dass er das Rücktrittsrecht zieht; die vereinbarte Summe trägt Jonas selbst, die Erklärung schickt er heute. Jonas hat gesagt, es tue ihm leid um seine Arbeit."
        from: ch09/s01
      - text: "Die Gruppe hat noch ein zweites Gut im Blick."
        from: ch09/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, kurze Wege, die Mauer gibt den Sichtschutz gratis."
        from: ch04/s01
      - text: "Seinem Herrenhaus im Süden fehlt etwas, seit der alte Park für den Anbau weg musste; was, könnte er nicht sagen."
        from: ch04/s02
      - text: "Der Kaffee im Notariat ist nicht so gut wie der von Frau Paulsen."
        from: ch07/s01
      - text: "Er hat Jonas' Rücktritt seit dem Notar fast geahnt, weil Jonas nur Wasser wollte."
        from: ch09/s01
      - text: "Behält Jonas das Haus mitsamt Garten, fehlt ihm wenigstens nichts."
        from: ch09/s01
    does_not_know:
      - "dass Hedwigs Testament den Rosengarten zum Erntefest am 5. September wieder blühen sehen will"
      - "dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht und Marie Stecklinge davon zieht"
      - "dass Jonas Marie über seinen Besuch nur 'Ein Interessent' gesagt hat"
      - "dass das Dorf an einem Helfersamstag Mitte Juli gemeinsam den Rosengarten hergerichtet hat und Jonas mitgearbeitet hat"
      - "dass an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt wurde"
      - "dass Marie und Jonas sich am Steg geküsst haben"
      - "dass Jonas als Kind den ersten Steckling der Lindenhof-Rose mit Hedwig gepflanzt hat"
      - "dass der Festausschuss bis Freitag, den 14., von Jonas eine Zusage verlangt hat und Jonas Hannes zugesagt hat, das Fest bleibe auf dem Gut, inzwischen auch für die Jahre danach"
      - "dass Marie am 27. August Vorvertrag und Lageplan in Hedwigs Schreibtisch gefunden und Jonas zur Rede gestellt hat"
      - "dass Grete und Lena inzwischen vom Parkplatz wissen"
      - "dass Hedwig sich Marie als Nachfolgerin im Garten gewünscht hat"
      - "dass Jonas in Hamburg die Partnerschaft absagen will"
      - "dass Grete Jonas Hedwigs Keksdose mit seinen Kinderbriefen gegeben hat"
