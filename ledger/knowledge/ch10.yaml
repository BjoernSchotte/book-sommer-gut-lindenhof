based_on: ["ch09#b4eae6", "ch10/s01#7366a9", "ch10/s02#b93375", "ch10/s03#b5a114"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf die Treppe gelegt."
        from: ch01/s03
      - text: "Sie hat Marie Hedwigs Gartenbuch zwei Tage nach dem Auftrag morgens aus dem Arbeitszimmer geholt und gegeben."
        from: ch02/s01
      - text: "Als Kind hat Marie dienstags und freitags im Garten Unkraut gejätet, eine Stunde für ein Stück Streuselkuchen; sie selbst hat auf der Rückseite vom Kalender Buch geführt."
        from: ch03/s01
      - text: "Marie nimmt Milch in den Kaffee; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Mitte Juli kam ein Gast im silbernen Firmenwagen, Herr Steinhagen; er sprach sie mit Namen an und sagte, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Jonas und Steinhagen auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen, obwohl sie am Morgen Butterkuchen gebacken hat."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kamen Helfer aus dem Dorf zum Arbeitseinsatz in den Garten; sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt, damit keiner mit leerem Teller dasteht, und Kaffee nachgetragen."
        from: ch05/s01
      - text: "Jonas hat beim Arbeitseinsatz mitgearbeitet, in geliehenen Gummistiefeln."
        from: ch05/s01
      - text: "Am Abend hat Jonas gefragt, ob er zu den Helfern zählt; sie hat ihm zwei Flaschen Bier aus der Helferkiste gegeben, die Kronkorken gleich abgemacht, und ihm Quark für den Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "An einem Dienstag Ende Juli arbeiten Marie und Jonas zusammen im Rosengarten; sie hat ihnen mittags einen Krug Buttermilch und ein Blech Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, beide lange angesehen und ist ohne ein Wort zurück ins Haus gegangen."
        from: ch06/s01
      - text: "Marie hat das Gartenbuch im Arbeitszimmer hiergelassen; es liegt dort neben der grünen Lampe."
        from: ch06/s02
      - text: "Jonas sucht an einem Donnerstag spät am Abend im Arbeitszimmer in Hedwigs Ordnern nach Rechnungen fürs Dach und für die Fenster; die fürs Dach hat er gefunden, nach den Fenstern will er am nächsten Tag weitersuchen."
        from: ch06/s02
      - text: "Jonas hat sich angeboten, ihren Einkauf am Montag Anfang August im Hofladen des Hansen-Hofs abzuholen; sie hat ihm einen Zettel geschrieben (zehn Eier, ein Glas Rosengelee, Kartoffeln und Rindfleisch für Mittwoch, dazu: Nicht vergessen zu bezahlen)."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet und gefragt, ob der wiedergekommen ist."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, hat sie Jonas Bratkartoffeln mit Spiegelei hingestellt; auf ihre Frage hat er gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes. Sie hat geantwortet: 'Na, denn, Jung.'"
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank im Rosengarten gebracht, Maries mit Milch; ihr Blick hing einen Augenblick zu lange an Jonas, dann ging sie wieder hinauf."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, spät am Nachmittag, backt sie Probe-Butterkuchen fürs Erntefest; Hannes sagt, letztes Jahr seien sie zu trocken gewesen."
        from: ch08/s02
      - text: "Marie kam an dem Abend ohne die Stiefel abzutreten in die Küche, riss beim Holen ihrer Jacke den Aufhänger ab und sagte nur ein Wort: 'Parkplatz.'"
        from: ch08/s02
      - text: "Hedwig hat auch ihr gesagt, wen sie sich für den Garten wünscht: Marie. Marie weiß das selbst; sie hat genickt, als sie es ansprach."
        from: ch08/s02
      - text: "Sie hat Marie um Verzeihung gebeten, ohne Aber und Weil; Marie hat am Küchentisch geweint, sie hat ihre Hand auf Maries Faust gelegt, bis Marie die Schere losließ."
        from: ch08/s02
      - text: "Sie hat Marie eine heiße Ecke vom Probe-Butterkuchen in Papier eingeschlagen mitgegeben und gesagt, ob er zu süß ist, sage Marie ihr morgen; die Astern am Rondell gieße sonst keiner."
        from: ch08/s02
      - text: "Am Montagabend, dem 31. August, hat Jonas ihr in der Küche gesagt: 'Ich fahr morgen früh nach Hamburg.'"
        from: ch09/s01
      - text: "Sie hat Jonas an dem Abend Hedwigs alte blaue Keksdose aus dem Fach unter der Fensterbank hingeschoben: 'Hedwig hat alles aufgehoben. … Lies das, Jung. Was du dann machst, ist deine Sache.' Über Marie hat sie kein Wort gesagt."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, stand Maries Wagen früh am Tor; gegen sieben hat sie Marie einen Becher Kaffee mit Milch und einen Teller Butterkuchen auf die Bank unter der Kletterrose gestellt und nichts gefragt."
        from: ch09/s02
      - text: "Marie hat ihr gesagt, der Butterkuchen sei nicht zu süß, die Mandeln saftig, da habe Hannes nichts zu meckern; das habe sie ihr schon am Freitag sagen wollen. Sie hat Marie einmal über den Zopf gestrichen und ist wieder hinaufgegangen."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie Marie im Garten Kaffee mit Milch gebracht, in der guten dunkelblauen Bluse mit Hedwigs Brosche am Kragen; Marie meinte, am Rondell fehlten noch zwei Astern. Über Jonas hat sie kein Wort gesagt, Marie hat nicht gefragt."
        from: ch10/s01
      - text: "Auf dem Fest stehen in der Scheune ihre Bleche auf Lenas Tresen, Butterkuchen mit Mandeln und Bienenstich; sie steht an der Kaffeemaschine."
        from: ch10/s02
      - text: "In der Scheune hat sie Marie und Jonas zusammen vor Lenas Fotowand stehen sehen."
        from: ch10/s02
      - text: "Am Abend hat Hannes ihr im Garten mit abgenommener Mütze die Hand hingehalten; sie hat gefragt, ob er nicht klug sei, in ihrem Alter, und dann doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch fasst man nicht mit nassen Fingern an."
        from: ch02/s01
      - text: "Das Gartenbuch gehört ins Arbeitszimmer; Hedwig hätte gewollt, dass Jonas hineinsieht."
        from: ch06/s02
      - text: "Hinter dem Herrn mit dem silbernen Auto steckt so etwas wie ein Parkplatz; das Wort hat sie nicht geahnt, aber so etwas."
        from: ch08/s02
      - text: "Jonas hat beim Abendessen über die Termine in der Stadt geschwindelt; er hat die ganze Zeit sein Spiegelei angeguckt, und seit er klein war, sieht sie ihm das an."
        from: ch08/s02
      - text: "Sie wollte es diesmal nicht wissen und hat gedacht, Jonas sage es Marie selbst; dafür schuldet sie Marie eine Entschuldigung."
        from: ch08/s02
      - text: "Was Jonas nach dem Lesen der Briefe in der Keksdose macht, ist seine Sache."
        from: ch09/s01
      - text: "Die Deern hat mehr Ausdauer als der Giersch."
        from: ch09/s02
      - text: "Der Garten ist fürs Fest bereit ('Da kann das Dorf kommen'); die zwei fehlenden Astern fehlen nur Marie."
        from: ch10/s01
    does_not_know:
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat, der eine einzige Blüte trägt."
      - "Dass Marie zu Hause in Klein Lindau Stecklinge der Lindenhof-Rose zieht und am 2. September einen davon neben den alten Stock gepflanzt hat."
      - "Dass Jonas im Gartenbuch die Notiz über den ersten Steckling der Lindenhof-Rose gelesen hat, den er als Junge mit Hedwig gepflanzt hat."
      - "Dass das Gartenbuch nicht mehr auf seinem Platz neben der grünen Lampe liegt."
      - "Dass Jonas die Rechnungen für einen Gutachter zur Wertermittlung braucht."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Die Einzelheiten der Absprache zwischen Jonas und Marie (Budget, Zwischenstände mit Fotos, freie Hand bei den Rosen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' entsorgen wollte und sie nun Punktfundamente bekommen."
      - "Dass Ende Juli ein Fotograf den Garten fotografieren sollte."
      - "Was Steinhagen im Garten gesagt hat: die Fläche hinter dem Haus sei 'ein Pfund', fürs Erntefest gäbe es nur eine Veranstaltungsfläche gegen Gebühr."
      - "Dass Weidenkamp rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune und ein Saunahaus am Steg plant und die Stellplätze im Lageplan bis in die Ecke hinter dem Laubengang reichen."
      - "Dass Weidenkamp ihr lebenslanges Wohnrecht bestehen lassen will, für einen freiwilligen Auszug aber eine großzügige Abfindung vorsieht, und Steinhagen Jonas gebeten hat, das bei ihr anzusprechen."
      - "Dass Marie und Jonas sich seit dem Gewitter unter dem Laubengang duzen."
      - "Dass Marie und Jonas sich am Abend des Arbeitseinsatzes auf dem Steg geküsst haben."
      - "Dass Jonas an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt hat."
      - "Dass der Festausschuss Jonas bis Freitag, den 14., eine Zusage abverlangt hat, sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert."
      - "Dass Jonas Hannes am Freitag, dem 14. August, zugesagt hat, das Fest finde dieses Jahr auf dem Gut statt."
      - "Dass Jonas am Donnerstag, dem 13. August, beim Notar in der Kreisstadt den Vorvertrag mit Weidenkamp unterschrieben hat (Rücktrittsrecht bis zum 10. September) und Marie die Mappe am 27. August im Arbeitszimmer gefunden hat."
      - "Dass Jonas am Dienstag, dem 1. September, vom Vorvertrag zurückgetreten ist und die 38.000 Euro für Notar und Planung selbst trägt."
      - "Dass Jonas Hannes gesagt hat, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, sondern auch nächstes und danach."
      - "Dass Jonas in Hamburg die Partnerschaft im Büro persönlich abgesagt hat und künftig drei Tage die Woche vom Gut aus arbeiten will."
      - "Dass Jonas Marie unter der Kletterrose gesagt hat, Gretes Haus bleibe Gretes Haus, er bleibe und er liebe sie."
      - "Dass Marie in der Nacht zu Lena gegangen ist und ihr alles erzählt hat."
      - "Wo Marie seit Donnerstag, dem 27. August, gewesen ist."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg im Rosengarten ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen am Laubengang."
        from: ch03/s02
      - text: "Um die Sonnenuhr hebt sich der Kies an drei Stellen; darunter sitzen alte Holunderstubben und an der Westseite ein Brombeerwurzelstock, dem Marie mit der Hacke nicht beikommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will, dass langsam und nach Norden zum Tor hin gezogen wird, damit der Ballen die Rose nicht mitreißt."
        from: ch03/s02
      - text: "Den Fliederbusch an der Remise hat er Hedwig mit derselben Kette herausgeholt."
        from: ch03/s02
      - text: "Auf seine Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas damals nicht zugesagt: Es hänge an Gutachten fürs Dach und für die Fenster, an den Kosten und an Fristen, die Jonas selbst noch nicht kenne."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Mitte Juli schaufelt er mit Marie Kies vom Hänger auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht, kannte seinen Namen und hat mit Jonas auf der Terrasse gesessen und den Garten angesehen."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus 'ein Pfund' und sagte zu Marie, das werde auf den Fotos sehr schön."
        from: ch04/s01
      - text: "Auf seine Frage, wo das Erntefest dann hin soll, sagte Steinhagen: Es gäbe eine Veranstaltungsfläche gegen Gebühr, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen; Steinhagen hat ihn danach in den Salon gebeten, um die Unterlagen durchzugehen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kam er kurz nach sechs mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine, zum Arbeitseinsatz; Timo brachte das zweite Gespann mit Kies für die Seitenwege."
        from: ch05/s01
      - text: "Er hat Jonas, der in geliehenen Gummistiefeln mit anfassen wollte, die Brombeeren an der Südmauer westlich der Pforte zugeteilt."
        from: ch05/s01
      - text: "Er hat den Helfern mit einem Pfiff klargemacht: Im Garten ist Marie die Chefin, wer das nicht weiß, fragt sie."
        from: ch05/s01
      - text: "Jonas ist als Junge, Hedwigs Lütter, barfuß nach der Gerste auf seinem Hänger über die Stoppeln mitgefahren; Hedwig musste ihn mit Kuchen herunterlocken und hat geschimpft. Jonas weiß nur noch den Diesel."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen frei; er hat die letzte Fuhre Brombeeren abgefahren."
        from: ch05/s02
      - text: "Er hat Jonas die Hand gegeben, ihn Jonas genannt und geduzt: 'Gut gemacht, Jonas. Morgen tut dir alles weh.'"
        from: ch05/s02
      - text: "Der Festausschuss hat am Sonntagabend Anfang August gesessen: Bis Freitag, den 14., braucht er von Jonas eine Zusage, auf die man bauen kann; sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert, das schon reserviert ist."
        from: ch06/s03
      - text: "Er hat Jonas das am Montag Anfang August am Hoftor des Hansen-Hofs gesagt; Jonas hat geantwortet: 'Bis dahin kriegst du eine Antwort.'"
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, nachmittags am schmiedeeisernen Tor zum Rosengarten, hat er die Antwort eingefordert; Jonas hat gesagt: 'Das Fest findet dieses Jahr auf dem Gut statt.'"
        from: ch07/s02
      - text: "Am Dienstagmorgen, dem 1. September, hat Jonas ihm am Fuß des Hügels gesagt: 'Das Fest bleibt auf dem Gut, Hannes. Nicht nur dieses Jahr. Nächstes auch, und danach.' Er will das Zelt abbestellen."
        from: ch09/s01
      - text: "Er hat Jonas gesagt, Samstag fahre er vorn, mit Hedwigs altem Trecker, den er im Frühjahr gemacht hat; Jonas ist noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Jonas hat ihn gebeten, Marie nichts zu sagen; das müsse er selbst tun."
        from: ch09/s01
      - text: "Am Mittwochnachmittag, dem 2. September, hat er hellen Kies fürs Rondell gebracht und mit Marie geschaufelt, im selben Takt wie im Juli."
        from: ch09/s02
      - text: "Neben dem alten Rosenstock in der Mauerecke hat Marie einen Steckling mit rötlichen Blättern in frische Erde gepflanzt; darüber steht eine offene Blüte."
        from: ch09/s02
      - text: "Marie hat ihm gesagt: Samstag ist Fest, und was danach mit dem Garten wird, sagt ihr keiner, Jonas am wenigsten."
        from: ch09/s02
      - text: "Am Festsamstag, dem 5. September, ist er im Umzug durch die Lindenallee in Weste, die Ehrennadel am Revers, die Mütze in der Hand, neben dem Vorderrad von Hedwigs altem Trecker gegangen; Jonas saß am Steuer, darüber die Erntekrone. Früher hat er an derselben Stelle neben Hedwig Schritt gehalten. Das Dorf hat geklatscht."
        from: ch10/s01
      - text: "Am Abend hat er Grete im Garten zum Tanz aufgefordert; sie hat gefragt, ob er nicht klug sei, in ihrem Alter, und dann doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Mit dem Spaten wird das nichts; mit Kette und Trecker ist der Stubben ruckzuck raus."
        from: ch03/s02
      - text: "Kommt das Hotel, bleibt das Erntefest nicht, wie es war, auf dem Gut."
        from: ch04/s01
      - text: "Jonas hat beim Brombeerroden gut gearbeitet."
        from: ch05/s02
      - text: "Die Frist ist keine Drohung; die Leute wollen wissen, wo sie ihre Bänke hinstellen."
        from: ch06/s03
      - text: "Das Erntefest bleibt auf dem Gut, nicht nur dieses Jahr, sondern auf Dauer."
        from: ch09/s01
      - text: "Man redet nicht für andere; Jonas soll Marie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Marie soll im Garten weitermachen ('Mach man weiter, Deern') und den Steckling jeden Morgen gießen."
        from: ch09/s02
    does_not_know:
      - "Dass Jonas am Donnerstag, dem 13. August, beim Notar den Vorvertrag mit Weidenkamp unterschrieben hat und am 1. September davon zurückgetreten ist (welche Einzelheiten er über den Verkauf weiß, zeigt keine Szene)."
      - "Dass Weidenkamp rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg und den Parkplatz auf dem Rosengarten plant."
      - "Dass Jonas die Partnerschaft in seinem Hamburger Büro abgesagt hat und künftig drei Tage die Woche vom Gut aus arbeiten will."
      - "Dass der alte Stock in der Mauerecke die letzte Lindenhof-Rose ist und der Steckling von ihr stammt."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
      - "Dass Marie am 27. August den Vorvertrag gefunden hat und Lena ihn am nächsten Morgen anrufen wollte."
      - "Dass Jonas Marie am Festnachmittag unter der Kletterrose alles gesagt hat und die beiden sich im Garten geküsst haben."
  jonas-behrendt:
    knows:
      - text: "Die Gärtnerin im Rosengarten heißt Marie Albers."
        from: ch01/s01
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite."
        from: ch01/s02
      - text: "Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen, über die Wege wird noch geredet; ihr Stundensatz steht nicht zur Verhandlung."
        from: ch01/s02
      - text: "Neue Absprache mit Marie: Die Rankbögen bleiben, er bestellt Beton für Punktfundamente (40 × 40, 80 tief wegen Frost), Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Der Makler sagt: Ein vorzeigbarer Garten (begehbare Wege, Blüten in Sichtweite des Hauses, keine Ecke, die nach Arbeit aussieht) bringt andere Zahlen."
        from: ch02/s02
      - text: "Nur auf dem Hügel hinter der Scheune hat man am Gut Netz."
        from: ch07/s01
      - text: "Marie und er sagen seit dem Gewitter unter dem Laubengang Du zueinander."
        from: ch03/s01
      - text: "Marie hat mit zehn im Garten ihren ersten Rosenschnitt gemacht, Hedwig hat ihr die Hand geführt; als Kind jätete sie dienstags und freitags für Gretes Streuselkuchen, im ersten Sommer kam sie jeden Tag mit dem Rad."
        from: ch03/s01
      - text: "Hedwig hat Marie ihre alte Schere mit dem roten Griff geschenkt; Marie benutzt sie bis heute."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt Milch in den Kaffee (von Grete)."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Der Interessent aus der Hotelbranche ist Ralf Steinhagen von Weidenkamp Hotels; er hat seine Nummer vom Makler."
        from: ch03/s03
      - text: "Grete hat Steinhagen und ihm Kaffee in der guten Kanne eingeschenkt, aber keinen Kuchen hingestellt; in all seinen Kindersommern gab es bei ihr keine Tasse ohne Kuchen, bis zu diesem Morgen."
        from: ch04/s02
      - text: "Im Garten nannte Steinhagen die Fläche hinter dem Haus 'ein Pfund'; Marie antwortete, das sei keine Fläche, sondern ein Garten aus den Dreißigerjahren."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz unten am Steg."
        from: ch04/s02
      - text: "Im Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit Zufahrt durch das Tor; die graue Fläche der Stellplätze reicht bis an die Mauer, bis in die Ecke hinter dem Laubengang."
        from: ch07/s01
      - text: "Grete hat ein lebenslanges Wohnrecht; für einen freiwilligen Auszug sah Weidenkamp eine großzügige Abfindung vor."
        from: ch04/s02
      - text: "Steinhagen erzählte von einem Herrenhaus weiter im Süden, dessen alter Park für einen Anbau weichen musste; seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Hannes erinnert sich, dass er als Junge barfuß nach der Gerste auf Hannes' Hänger über die Stoppeln mitgefahren ist; Hannes hat ihm die Hand gegeben, ihn Jonas genannt und geduzt."
        from: ch05/s02
      - text: "Unter den Brombeeren an der Mitte der Südmauer wächst ein alter Stock 'Ghislaine de Féligonde', den Marie erkannt und angebunden hat."
        from: ch05/s02
      - text: "Marie und er haben sich am Abend des Arbeitseinsatzes auf dem Steg geküsst."
        from: ch05/s03
      - text: "Marie hat ihn gefragt, ob er im Herbst noch hier ist; er hat geantwortet: 'Ich weiß es nicht.'"
        from: ch05/s03
      - text: "Glanz im September ist nicht das Junibild: Die 'New Dawn' blüht nach, davor Lavendel und Katzenminze, Frauenmantel an den Kanten, Astern, am Laubengang Dahlien."
        from: ch06/s01
      - text: "Im Gartenbuch steht auf der Seite 'Lindenhof-Rose', datiert auf einen Juli vor sechsundzwanzig Jahren: Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen."
        from: ch06/s02
      - text: "Er erinnert sich wieder: Er hat den Steckling aus einem Erdbeer-Joghurtbecher mit Hedwig gepflanzt und ihn danach jeden Morgen barfuß mit dem Lineal gemessen."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet; in ihren letzten Jahren war er zwei- oder dreimal auf dem Gut."
        from: ch06/s02
      - text: "Lena hat ihn gewarnt: Marie sei keine, mit der man einen Sommer spielt; tut er es doch, nehmen sie und das ganze Dorf es ihm übel."
        from: ch06/s03
      - text: "Am Donnerstag, dem 13. August, hat er im Notariat in der Kreisstadt im Beisein Steinhagens den Vorvertrag mit Weidenkamp unterschrieben; er hatte ein Rücktrittsrecht bis zum zehnten September."
        from: ch07/s01
      - text: "Zehn Minuten nach dem Büro hat der Dachdecker zurückgerufen und für den Herbst eine Summe genannt; er hat sie auf den Briefumschlag geschrieben."
        from: ch07/s01
      - text: "Grete gegenüber hat er am 13. August behauptet, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes. Das war gelogen."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat Marie ihm in der Mauerecke hinter dem letzten Bogen des Laubengangs den alten Stock der Lindenhof-Rose gezeigt: Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock, und er trägt eine Knospe."
        from: ch07/s02
      - text: "Er hat Hannes am 14. August am Tor gesagt: 'Das Fest findet dieses Jahr auf dem Gut statt.' Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, hat Marie im Arbeitszimmer die Weidenkamp-Mappe mit Vorvertrag, Lageplan und seiner Unterschrift gefunden."
        from: ch08/s01
      - text: "Er hat Marie gesagt: Es ist ein Vorvertrag; das Büro bietet ihm eine Partnerschaft gegen Einlage an; das Haupthaus ist schlimmer als die Scheune; er hat ein Rücktrittsrecht bis nach dem Fest."
        from: ch08/s01
      - text: "Marie hat geantwortet: Den Garten hätte sie ihm notfalls hergegeben, aber nicht hinter ihrem Rücken, nicht nach dem Steg; und den Parkplatz habe er ihr nicht erklärt. Dann ist sie gegangen, er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Seit Donnerstag, dem 27. August, stand Maries weißer Kastenwagen nicht mehr am Tor; auf keine seiner vier Nachrichten vom Hügel ist eine Antwort gekommen."
        from: ch09/s01
      - text: "Grete hat ihm am Montagabend, dem 31. August, Hedwigs blaue Keksdose gegeben, die er aus den Kindersommern kennt: 'Hedwig hat alles aufgehoben. … Lies das, Jung. Was du dann machst, ist deine Sache.' Über Marie hat sie kein Wort gesagt."
        from: ch09/s01
      - text: "In der Dose liegen seine Kinderbriefe in Druckschrift ('LIEBE TANTE HEDWIG'), mit der Frage, wie viele Zentimeter der Steckling gewachsen sei, 'Bitte mit Lineal messen'."
        from: ch09/s01
      - text: "In der Dose liegt eine Zeichnung von ihm: ein Mädchen mit Zopf auf einer Mauer, die Fäuste in die Seiten gestemmt, dazu in seiner Kinderschrift 'Die hat mit mir geschimpft'; er war damals zwölf, die Kleine kaum fünf."
        from: ch09/s01
      - text: "Darunter liegen seine Postkarten aus Zeltlager und Klassenfahrt mit jedes Jahr weniger Text; die letzte, aus dem Studium: 'Nächsten Sommer komm ich bestimmt.' Er ist im Sommer darauf nicht gekommen; Hedwig hat die Karte glattgestrichen ganz unten aufbewahrt."
        from: ch09/s01
      - text: "Die Partner hatten ihm die Einlage bis nach dem Fest gestundet, weil Weidenkamps Anzahlung noch ausstand."
        from: ch09/s01
      - text: "Sein Plan auf dem Briefumschlag: Dach Nordseite im Herbst, Südseite nächstes Jahr, Rinnen selbst; Büro zwei Tage, drei hier; Notar und Planung, 38.000, aus dem Ersparten, das für die Einlage gedacht war."
        from: ch09/s01
      - text: "Am Dienstagmorgen, dem 1. September, hat er Steinhagen vom Hügel aus gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt, achtunddreißigtausend Euro."
        from: ch09/s01
      - text: "Steinhagen hat gesagt, er habe es fast geahnt, seit dem Notar ('Sie wollten nur Wasser'); die Gruppe habe noch ein zweites Gut im Blick; er wünsche ihm Glück mit dem Haus, 'Dann fehlt ihm wenigstens nichts.' Über den Preis hat Steinhagen keinen Satz verloren."
        from: ch09/s01
      - text: "Er hat Hannes am Fuß des Hügels gesagt, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, nächstes auch und danach; Hannes bestellt das Zelt ab."
        from: ch09/s01
      - text: "Er hat Hannes gebeten, Marie nichts zu sagen; Hannes hat geantwortet, man rede nicht für andere, aber er solle sie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Am Festsamstag, dem 5. September, ist er Hedwigs alten Trecker mit der Erntekrone vorn im Umzug durch die Lindenallee gefahren, Hannes in Weste neben dem Vorderrad; das Dorf hat geklatscht. Am Rand hat er Marie gefunden und ihr ernst zugenickt."
        from: ch10/s01
      - text: "In der Scheune hängt auf Lenas Fotowand ein alter Abzug: Hedwig an der Gartenmauer, daneben er als dünner barfüßiger Junge mit zerschrammtem Knie, oben auf der Mauer Marie als Mädchen mit Zopf. Marie ist das Mädchen, das ihn beschimpft hat."
        from: ch10/s02
      - text: "Er hat Marie vor dem Foto gesagt: Er war auf einen Rosenstock getreten, sie sagte, er hätte Füße wie ein Ochse und keinen Verstand dazu; er hat es Tante Hedwig mit Zeichnung geschrieben, und den Brief in Gretes Keksdose wiedergefunden."
        from: ch10/s02
      - text: "Lena hat sich dazwischengeschoben ('Sie trauen sich was, Herr Behrendt. Nach allem?'); Marie hat sie am Arm gefasst: 'Lena. Das ist meine Sache.' Marie hat ihm fünf Minuten unter der Kletterrose zugesagt."
        from: ch10/s02
      - text: "In Hamburg hat er die Partnerschaft im Büro persönlich abgesagt."
        from: ch10/s03
      - text: "Er hat Marie am späten Nachmittag auf der Bank unter der Kletterrose gesagt: Rücktritt am Dienstag, die Kosten trägt er selbst, Partnerschaft abgesagt, drei Tage die Woche arbeitet er künftig von hier, das Dach in Abschnitten; das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus; er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Marie hat ihm gesagt: Nicht nur der Parkplatz, sein Schweigen hat wehgetan, und auch den Rücktritt hat er wieder allein beschlossen. Er hat keine Ausrede gesucht."
        from: ch10/s03
      - text: "Hedwig hat Marie im letzten Herbst auf dieser Bank die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführe."
        from: ch10/s03
      - text: "Marie will den Garten an seiner Seite führen, nicht in seinem Auftrag, und er nimmt sie in seine Entscheidungen hinein, vorher, nicht hinterher; er hat ohne Zögern Ja gesagt und als erste Frage gestellt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Marie hat ihm in der Mauerecke den Steckling neben dem alten Stock der Lindenhof-Rose gezeigt, mit neuem rötlichem Blatt: aus ihrem Hinterhof, seit Juni gezogen; der zweite steht noch unter der Folie. Die einzige Blüte am alten Stock hängt schon müde."
        from: ch10/s03
      - text: "Er hat Marie von der Notiz im Gartenbuch über den ersten Steckling erzählt und dass er ihn jeden Morgen mit dem Lineal gemessen hat."
        from: ch10/s03
      - text: "Marie hat sich neben ihn ins Gras gekniet, ihn am Kragen heruntergezogen und geküsst."
        from: ch10/s03
      - text: "Am Abend hat er mit Marie barfuß auf dem Kies getanzt und ihr zweimal auf die Zehen getreten ('Füße wie ein Ochse' – 'Und keinen Verstand dazu')."
        from: ch10/s03
      - text: "Lena hat ihm die Hand gegeben, 'Willkommen, Jonas' gesagt, ihn geduzt und 'Pass mir gut auf sie auf' gesagt; danach rief sie: 'Hab ich doch gleich gesagt.'"
        from: ch10/s03
    believes:
      - text: "Auf dem Gut wird er mitgerechnet; er gehört dazu."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Einer der nummerierten Stellplätze im Lageplan lag über dem Loch, das er für den Steckling gegraben hat."
        from: ch07/s01
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "Er rechnet nicht mehr aus, was sich lohnt, sondern was trägt."
        from: ch09/s01
      - text: "Hannes hat sehr wohl daran gezweifelt, dass das Fest auf dem Gut bleibt; es ist trotzdem gut."
        from: ch09/s01
      - text: "Marie musste es zuerst hören, vor allen anderen."
        from: ch10/s02
      - text: "Sein Steckling von damals steht irgendwo hier in der Mauerecke."
        from: ch10/s03
    does_not_know:
      - "Ob der Stock der Lindenhof-Rose in der Mauerecke der Steckling ist, den er mit Hedwig gepflanzt hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Dass Marie Lena von ihm erzählt hat und Lena glaubt, Marie habe Gefühle für ihn."
      - "Dass Marie nach dem Arbeitszimmer zu Grete in die Küche gegangen ist, 'Parkplatz' gesagt hat und Grete sein Schwindeln über die Termine in der Stadt durchschaut hatte."
      - "Dass Marie in der Nacht Lena alles erzählt hat (Vorvertrag, Lageplan, Steg, 'dieses Jahr') und Lena Hannes anrufen wollte."
      - "Wo Marie seit Donnerstag, dem 27. August, gewesen ist und ob sie seine Nachrichten gelesen hat."
      - "Dass Hannes Marie am Mittwoch, dem 2. September, beim Kiesschaufeln nichts verraten hat."
  lena-hansen:
    knows:
      - text: "Jonas' Tabelle hat Budget, Meilensteine und Daten; beim Laubengang stand 'Entsorgung' für beide Rankbögen der 'Ghislaine'."
        from: ch02/s03
      - text: "Die Rankbögen sind zweiundfünfzig Jahre alt."
        from: ch02/s03
      - text: "Jonas kam in geputzten Lederschuhen, kniete in heller Hose ins nasse Gras vor den Bogen, fand kein Fundament und zeichnete eins auf die Rückseite seiner Tabelle (40 × 40, 80 tief wegen Frost)."
        from: ch02/s03
      - text: "Jonas' Hose ist grün an beiden Knien und hin; am ersten Tag hat er sie auf der Freitreppe trocknen lassen, die Socken daneben."
        from: ch02/s03
      - text: "Marie hat Jonas davon abgebracht, Hedwigs Bögen auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Marie hat zehn Eier für den nächsten Morgen und ein Stück Butterkuchen von ihr mitgenommen."
        from: ch02/s03
      - text: "Am Samstag Mitte Juli hat sie am Tor die Helfer des Arbeitseinsatzes auf dem Klemmbrett abgehakt (drei Landfrauen, vier Mann von der Feuerwehr, die Nachbarn vom Dorfteich) und die Arbeit verteilt."
        from: ch05/s01
      - text: "Marie hat an jeden Rosenstock, der stehen bleiben muss, ein Namensschild gehängt, damit keiner etwas rausreißt."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln zum Mitarbeiten; sie hat ihn gesiezt und eingetragen."
        from: ch05/s01
      - text: "Sie hat Jonas um fünf gefragt, ob er nächsten Samstag Zeit hat, und er hat Ja gesagt."
        from: ch05/s03
      - text: "Jonas steht auf ihrer Helferliste für den Rosengarten, mit Ankunft und Abfahrt; die Liste hängt ganz oben am schwarzen Brett im Hofladen."
        from: ch06/s03
      - text: "Für Grete macht sie den Hofladen montags auf, seit Jahren; am Montag Anfang August hat Jonas Gretes Kiste abgeholt, sie hat sie gepackt, ohne auf den Zettel zu sehen."
        from: ch06/s03
      - text: "Marie hat Frieda eine Dahlie geschenkt; sie steht im Glas und hält eine Woche."
        from: ch06/s03
      - text: "Sie hat Jonas beim Kaffee gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie und das ganze Dorf es ihm übel; auf seine Frage, ob Marie ihr etwas gesagt habe, hat sie geantwortet, das müsse er Marie schon selbst fragen."
        from: ch06/s03
      - text: "Jonas hat Hannes Mitte August am Tor gesagt, das Fest finde 'dieses Jahr' auf dem Gut statt; sie hatte das für ein Versprechen gehalten."
        from: ch08/s03
      - text: "In der Nacht zum 28. August, Viertel vor zwölf, kam Marie an ihre Küchentür und hat ihr erzählt: vom Lageplan mit grauen Kästchen über dem Rosengarten bis an die Mauer, von Jonas' Unterschrift, gerade und ohne Zögern, und von dem 'dieses Jahr'."
        from: ch08/s03
      - text: "Jonas hat heimlich beim Notar einen Vorvertrag unterschrieben."
        from: ch08/s03
      - text: "Marie und Jonas waren zusammen am Abend am Steg; davon hat sie bis zu dieser Nacht nichts gewusst."
        from: ch08/s03
      - text: "Hedwig hat Marie im letzten Herbst beim Tee auf der Bank unter der Kletterrose die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführe, wenn sie nicht mehr kann; es steht nirgends, nicht im Testament, auf keinem Zettel."
        from: ch08/s03
      - text: "Marie hat das nicht einmal ihr erzählt, weil es nach Erbschleicherei klingt; sie hat sich geschämt, bevor überhaupt einer etwas gesagt hat."
        from: ch08/s03
      - text: "Marie hat Gretes Butterkuchen mitgebracht; sie hat ihn mitten durchgeschnitten."
        from: ch08/s03
      - text: "Marie will nicht, dass sie Hannes anruft: Das sei Maries Sache, nicht die vom Dorf."
        from: ch08/s03
      - text: "Für das Erntefest hat sie in der Scheune an Mats' Stelltafeln Dutzende alte Fotos aufgehängt, aus dem Album der Petersens, aus Hedwigs Schublade und aus Hannes' Ausschusskiste, jedes mit einem Zettel in ihrer Schrift; sie hat sie Marie gezeigt: 'Für dich. Und für Hedwig.'"
        from: ch10/s02
      - text: "Als sie sich zwischen Marie und Jonas geschoben und Jonas gefragt hat, ob er sich nach allem was traue, hat Marie sie am Arm gefasst: 'Lena. Das ist meine Sache.'"
        from: ch10/s02
      - text: "Jonas hat Marie gesagt, er müsse ihr etwas sagen, sie müsse es zuerst hören, vor allen anderen, und sie unter die Kletterrose gebeten; Marie hat fünf Minuten zugesagt."
        from: ch10/s02
      - text: "Am Abend hat Marie barfuß mit Jonas auf dem Kies getanzt; sie hat Jonas die Hand gegeben, ihn geduzt ('Willkommen, Jonas') und ihm gesagt, er solle gut auf Marie aufpassen."
        from: ch10/s03
    believes:
      - text: "Dass Marie seit zwanzig Minuten über Jonas' Schuhe redet, ist ein Zeichen: Marie hat Gefühle für Jonas."
        from: ch02/s03
      - text: "Die Landfrauen brauchen keine Schilder; die stechen Giersch, seit Marie laufen kann."
        from: ch05/s01
      - text: "Wer Marie Erbschleicherei nachsagt, kriegt es mit ihr zu tun; Marie hat Hedwig seit ihrem zehnten Jahr den Giersch gestochen."
        from: ch08/s03
      - text: "Marie und Jonas gehören zusammen, und sie hat es gleich gesagt ('Hab ich doch gleich gesagt'); Jonas ist willkommen."
        from: ch10/s03
    does_not_know:
      - "Dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht und blüht."
      - "Dass Marie zu Hause in Klein Lindau Stecklinge der Lindenhof-Rose zieht und einen davon neben den alten Stock gepflanzt hat."
      - "Dass Marie und Jonas beim Gewitter unter dem Laubengang beieinanderstanden und sich seitdem duzen."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels der Käufer ist und das Gut Mitte Juli besichtigt hat."
      - "Dass der Vorvertrag ein Rücktrittsrecht bis zum 10. September hatte und Jonas es am 1. September gezogen hat."
      - "Dass Jonas Hannes und Marie gesagt hat, das Fest bleibe auf Dauer auf dem Gut."
      - "Dass Jonas die Einlage für eine Partnerschaft in seinem Büro brauchte und die Partnerschaft abgesagt hat."
      - "Was Jonas Marie unter der Kletterrose gesagt hat."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe aus Hamburg."
        from: ch01/s01
      - text: "Jonas wollte den Rosengarten bis zum Erntefest am 5. September hergerichtet haben: Wege begehbar, Beete sauber, alles, was man vom Haus aus sieht."
        from: ch01/s02
      - text: "Absprache mit Jonas: freie Hand bei den Rosen, über die Wege wird noch geredet; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hinter dem Laubengang steht in der Mauerecke ein Stock der Lindenhof-Rose, die Hedwig selbst gezogen hat."
        from: ch01/s03
      - text: "Laut Gartenbuch steht an Bogen sieben und acht des Laubengangs 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Seit dem Gewitter unter dem Laubengang sagen Jonas und sie Du zueinander."
        from: ch03/s01
      - text: "Rosenschnitt hat sie mit zehn von Hedwig gelernt: über dem Auge, schräg, damit das Wasser abläuft."
        from: ch03/s01
      - text: "Sie hat Hedwigs alte Schere mit dem roten Griff, ein Geschenk von Hedwig."
        from: ch03/s01
      - text: "Im letzten Herbst hat Hedwig auf der Bank unter der 'New Dawn' ihre Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführe, wenn sie nicht mehr kann. Es steht nirgends."
        from: ch03/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut Mitte Juli besucht und die Fläche hinter dem Haus 'ein Pfund' genannt; fürs Erntefest bot er eine Veranstaltungsfläche gegen Gebühr an, Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, hat Jonas nur gesagt: 'Ein Interessent.'"
        from: ch04/s02
      - text: "An der Mitte der Südmauer hat Jonas beim Arbeitseinsatz einen alten Stock 'Ghislaine de Féligonde' freigelegt; sie hat die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Jonas und sie haben sich am Abend des Arbeitseinsatzes auf dem Steg geküsst."
        from: ch05/s03
      - text: "Auf ihre Frage, ob er im Herbst noch hier ist, hat Jonas gesagt: 'Ich weiß es nicht.'"
        from: ch05/s03
      - text: "Ende Juli hat sie Jonas erklärt, dass das Junibild nicht wiederkommt und Glanz im September Nachblüte der 'New Dawn', Stauden und Dahlien heißt; die Büsche am Rondell setzen Hagebutten an."
        from: ch06/s01
      - text: "Am Freitag, dem 14. August, hat sie Jonas die Ecke hinter dem letzten Bogen des Laubengangs gezeigt und ihm gesagt: die Lindenhof-Rose, von Hedwig gezogen, nur noch dieser eine Stock, und der blüht wieder. Jonas blieb stumm."
        from: ch07/s02
      - text: "Am Freitag, dem 14. August, hat Hannes am Tor die Antwort eingefordert; Jonas hat geantwortet: 'Das Fest findet dieses Jahr auf dem Gut statt.' Sie ist ihm um den Hals gefallen."
        from: ch07/s02
      - text: "Das Gartenbuch fehlte am 27. August auf seinem Platz am Fenster im Arbeitszimmer; neben der grünen Lampe lag nur die Lupe."
        from: ch08/s01
      - text: "Im Lageplan der Weidenkamp-Mappe reichen die grauen Kästchen der Stellplätze über den Rosengarten bis in den Winkel hinter dem letzten Bogen des Laubengangs, genau über der Lindenhof-Rose."
        from: ch08/s01
      - text: "Auf der letzten Seite des Vorvertrags steht Jonas' Unterschrift, gerade und ohne Zögern, datiert auf Donnerstag, den 13. August, den Tag vor seiner Zusage an Hannes."
        from: ch08/s01
      - text: "Jonas hat ihr gesagt: Es ist ein Vorvertrag; das Büro bietet ihm eine Partnerschaft an, dafür muss er bis Monatsende eine Einlage bringen; das Haupthaus ist schlimmer als die Scheune; er hat ein Rücktrittsrecht bis nach dem Fest."
        from: ch08/s01
      - text: "Sie hat Jonas gesagt, den Garten hätte sie ihm notfalls hergegeben, aber nicht hinter ihrem Rücken, nicht nach dem Steg; und den Parkplatz habe er ihr nicht erklärt. Dann ist sie gegangen, und er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Grete hat so etwas geahnt, das Wort Parkplatz nicht; sie hat Jonas' Schwindeln über die Termine in der Stadt erkannt und sie um Verzeihung gebeten. Hedwig hat auch Grete gesagt, wen sie sich für den Garten wünscht."
        from: ch08/s02
      - text: "Sie hat in der Nacht Lena alles erzählt: Lageplan, Unterschrift, den Abend am Steg, das 'dieses Jahr' und Hedwigs Wunsch auf der Bank."
        from: ch08/s03
      - text: "Lena wollte am Morgen Hannes anrufen und hat mit der Helferliste jede Nummer; sie hat Lena gesagt, das sei ihre Sache, nicht die vom Dorf."
        from: ch08/s03
      - text: "Am Mittwoch, dem 2. September, kurz nach fünf, hatten beide Stecklinge der Lindenhof-Rose in Klein Lindau getrieben; feine weiße Wurzeln halten den Ballen bis an den Rand zusammen."
        from: ch09/s02
      - text: "Den kräftigeren Steckling hat sie in den Garten mitgenommen und eine Handbreit neben dem alten Stock gepflanzt, das Loch doppelt so tief wie der Topf, angedrückt und angegossen; der andere steht weiter unter Folie im Hinterhof der alten Schmiede."
        from: ch09/s02
      - text: "Am Mittwoch, dem 2. September, fehlte Jonas' Kombi auf dem Gutshof."
        from: ch09/s02
      - text: "Gegen sieben hat Grete ihr Kaffee mit Milch und Butterkuchen auf die Bank unter der Kletterrose gestellt und nicht gefragt, wo sie seit Donnerstag war; sie hat Grete gesagt, der Kuchen sei nicht zu süß, die Mandeln saftig."
        from: ch09/s02
      - text: "Am Nachmittag des 2. September hat Hannes hellen Kies fürs Rondell gebracht, mit ihr geschaufelt und gesagt: 'Mach man weiter, Deern', 'Weiß man eben' und 'Den gießt du man jeden Morgen'; dabei hat er ihr nicht ins Gesicht gesehen."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie das Rondell zum letzten Mal geharkt; die Hagebutten an den Damaszenerrosen leuchten, die zweite Blüte der 'New Dawn' hängt nass über der Mauer."
        from: ch10/s01
      - text: "Die einzige Blüte der Lindenhof-Rose ist an den Rändern schon müde; der am Mittwoch gepflanzte Steckling daneben hat ein neues rötliches Blatt geschoben. Sie hat ihn gegossen, wie Hannes geraten hat."
        from: ch10/s01
      - text: "Grete hat ihr am Festmorgen Kaffee mit Milch gebracht, in der guten dunkelblauen Bluse mit Hedwigs Brosche, und über Jonas kein Wort gesagt; sie hat nicht gefragt."
        from: ch10/s01
      - text: "Anke hat ihr in der Lindenallee gesagt, laut Grete habe der Garten seit Jahren nicht so ausgesehen, und Hannes habe am Morgen schon um fünf in der Küche gestanden, mit Weste."
        from: ch10/s01
      - text: "Im Umzug fuhr Jonas im weißen Hemd Hedwigs alten Trecker mit der Erntekrone vorn durch die Lindenallee, Hannes in Weste mit Ehrennadel neben dem Vorderrad; der Motor war derselbe, den sie am Morgen in der Remise gehört hat. Jonas hat sie am Rand gefunden und ihr ernst zugenickt."
        from: ch10/s01
      - text: "Lena hat in der Scheune an Mats' Stelltafeln Dutzende alte Fotos aus Dorfalben, Hedwigs Schublade und Hannes' Ausschusskiste aufgehängt, für sie und für Hedwig; die verdeckten Fotos auf Lenas Küchentisch waren dafür."
        from: ch10/s02
      - text: "Auf einem verblichenen Abzug stehen Hedwig an der Gartenmauer, daneben Jonas als dünner barfüßiger Junge, und oben auf der Mauer sie selbst als Mädchen mit Zopf, im rot-weiß gepunkteten Kleid, das Kinn streng zu ihm gesenkt."
        from: ch10/s02
      - text: "Sie hat als Kind den Jungen beschimpft, weil er auf einen Rosenstock getreten war und einen Trieb geknickt hatte: Füße wie ein Ochse und keinen Verstand dazu. Nicht er, sondern sie stand damals oben auf der Mauer, er unten im Beet; Hedwig holte ein Pflaster."
        from: ch10/s02
      - text: "Jonas hat es damals Tante Hedwig mit Zeichnung geschrieben und den Brief in Gretes Keksdose wiedergefunden."
        from: ch10/s02
      - text: "Am späten Nachmittag hat Jonas ihr unter der Kletterrose gesagt: Er ist am Dienstag vom Vorvertrag zurückgetreten und trägt die Kosten selbst, hat die Partnerschaft in Hamburg persönlich abgesagt, arbeitet künftig drei Tage die Woche von hier und macht das Dach in Abschnitten; das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus; er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Hannes hat am Mittwoch vom Rücktritt gewusst; daher seine Antworten an die Dahlien und die Weste um fünf."
        from: ch10/s03
      - text: "Sie hat Jonas gesagt, sein Schweigen und der wieder allein beschlossene Rücktritt hätten wehgetan, und ihm Hedwigs Wunsch erzählt: Sie führt den Garten an seiner Seite, nicht in seinem Auftrag, und er nimmt sie vorher in seine Entscheidungen hinein. Er hat ohne Zögern Ja gesagt und gefragt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Laut Hedwigs Gartenbuch hat Jonas als Junge beim ersten Steckling der Lindenhof-Rose das Loch gegraben und gegossen und ihn danach jeden Morgen mit dem Lineal gemessen."
        from: ch10/s03
      - text: "Sie hat Jonas in der Mauerecke geküsst; am Abend hat sie barfuß mit ihm auf dem Kies getanzt, und Lena hat ihn mit 'Willkommen, Jonas' begrüßt und geduzt."
        from: ch10/s03
    believes:
      - text: "Splitt auf dem Hauptweg würde den alten Kies zerstören."
        from: ch01/s01
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Sie hat Gefühle für Jonas."
        from: ch05/s03
      - text: "Grete ist sie nicht böse; böse ist sie auf sich selbst: Ihr eigenes Herz hat sie nicht so verteidigt wie einen Garten."
        from: ch08/s02
      - text: "Solange die Finger zu tun haben, muss der Kopf nicht mit."
        from: ch10/s02
      - text: "Am Steg hat sie schon geahnt, dass Jonas der Junge von damals war, und es für sich behalten."
        from: ch10/s02
      - text: "Jonas meint es ernst und bleibt; sie glaubt ihm. Diesmal weiß sie, was seine Stille heißt."
        from: ch10/s03
      - text: "Sie ist angekommen."
        from: ch10/s03
    does_not_know:
      - "Wo das Gartenbuch jetzt liegt."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Dass der Makler einen vorzeigbaren Garten für einen besseren Preis wollte und Ende Juli ein Fotograf kommen sollte."
      - "Dass Weidenkamp rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune und ein Saunahaus am Steg plante und Grete eine Abfindung für einen freiwilligen Auszug anbieten wollte."
      - "Ob Jonas wusste, dass der Parkplatz die Lindenhof-Rose trifft."
      - "Ob der alte Stock in der Mauerecke der Steckling ist, den Jonas mit Hedwig gepflanzt hat."
      - "Dass Lena Jonas gewarnt hat, nicht mit ihr einen Sommer zu spielen."
      - "Dass die Kosten für Notar und Planung 38.000 Euro betragen und aus dem Ersparten stammen, das für die Einlage gedacht war."
      - "Dass Grete Jonas Hedwigs Keksdose gegeben hat und darin auch seine Postkarten liegen."
      - "Dass Jonas Hannes gebeten hat, ihr nichts zu sagen, weil er es ihr selbst sagen wollte."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr des Guts."
        from: ch03/s03
      - text: "Marie Albers, Hannes Kröger und Grete Paulsen sind ihm beim Besuch Mitte Juli vorgestellt worden; Herr Behrendt hat von Gretes Kaffee geschwärmt."
        from: ch04/s01
      - text: "Marie sagt, der Garten sei in den Dreißigerjahren angelegt, mit diesen Wegen und dieser Mauer, und die 'Rosa Mundi' älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes Kröger fragt, wo das Erntefest hin soll, wenn das Hotel kommt."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht auf dem Gut."
        from: ch04/s02
      - text: "Er hat Jonas Plan, Kostenschätzung und Lageplan (Parkplatz auf dem Rosengarten) gezeigt und die Unterlagen dagelassen."
        from: ch04/s02
      - text: "Am Donnerstag, dem 13. August, hat Jonas im Notariat in der Kreisstadt den Vorvertrag mit Weidenkamp unterschrieben; der Vorvertrag enthält ein Rücktrittsrecht bis zum zehnten September."
        from: ch07/s01
      - text: "Am Dienstagmorgen, dem 1. September, hat Jonas ihm am Telefon gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt, achtunddreißigtausend Euro."
        from: ch09/s01
      - text: "Die Gruppe hat noch ein zweites Gut im Blick."
        from: ch09/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste heute suchen."
        from: ch04/s02
      - text: "Gretes Kaffee ist ausgezeichnet, besser als der im Notariat."
        from: ch07/s01
      - text: "Seinem Herrenhaus im Süden fehlt etwas, seit der alte Park für den Anbau weichen musste; was, kann er nicht sagen."
        from: ch04/s02
      - text: "Er hat Jonas' Rücktritt fast geahnt, seit dem Notar: Jonas wollte dort nur Wasser."
        from: ch09/s01
      - text: "Bleibt das Gut bei Jonas, fehlt dem Haus wenigstens nichts; er wünscht ihm Glück damit."
        from: ch09/s01
    does_not_know:
      - "Dass Hedwig im Testament wünscht, der Rosengarten solle zum Erntefest wieder blühen."
      - "Dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht und wieder blüht."
      - "Dass Grete ihm absichtlich keinen Kuchen hingestellt hat."
      - "Dass das Dorf am Samstag Mitte Juli einen Arbeitseinsatz im Rosengarten gemacht hat."
      - "Dass Marie und Jonas sich geküsst haben und zusammen sind."
      - "Dass Jonas Hannes zugesagt hat, das Fest bleibe auf Dauer auf dem Gut."
      - "Dass Jonas Marie und Grete nichts von der Unterschrift gesagt hat und Marie den Vorvertrag am 27. August selbst gefunden hat."
      - "Dass Marie, Grete und Lena vom Parkplatz im Rosengarten wissen."
      - "Dass Jonas seine Partnerschaft im Hamburger Büro abgesagt hat."
      - "Wie das Erntefest am 5. September auf dem Gut verlaufen ist."
