based_on: ["ch09#eadce1", "ch10/s01#7366a9", "ch10/s02#b93375", "ch10/s03#b5a114"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch lag im Arbeitszimmer, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf der Treppe liegen lassen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Marie hat den Auftrag, den Garten bis zum Fest fertig zu machen, und sagt, Jonas wolle verkaufen."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag morgens Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Marie kam als Kind jeden Dienstag und Freitag in den Garten; sie selbst hat auf der Rückseite vom Kalender Buch geführt, eine Stunde Unkraut gegen ein Stück Streuselkuchen."
        from: ch03/s01
      - text: "Marie nimmt den Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Ein Gast, Herr Steinhagen, ist auf das Gut gekommen; er kennt ihren Namen und sagt, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Steinhagen und Jonas auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen; sonst stand nichts auf dem Tablett."
        from: ch04/s01
      - text: "An einem Samstag Mitte Juli kamen viele Helfer aus dem Dorf in den Garten; sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt, damit diesmal keiner mit leerem Teller dastand, und eine zweite Kanne Kaffee gebracht."
        from: ch05/s01
      - text: "Jonas hat beim Helfereinsatz mitgearbeitet; sie hat ihm aus der Helferkiste zwei Flaschen Bier gegeben, die Kronkorken gleich abgemacht, nachdem er fragte, ob er zählt."
        from: ch05/s03
      - text: "Jonas hat Sonnenbrand im Nacken; sie hat ihm Quark angeboten."
        from: ch05/s03
      - text: "An einem Dienstag Ende Juli hat sie mittags Buttermilch und Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, wo Marie und Jonas im Garten arbeiteten, und lange von Marie zu Jonas und zurück gesehen."
        from: ch06/s01
      - text: "Jonas sucht im Arbeitszimmer in Hedwigs Ordnern die Rechnungen für Dach und Fenster; die fürs Dach hat er gefunden, nach den Fenstern will er am nächsten Tag weitersuchen."
        from: ch06/s02
      - text: "Sie hat Jonas gesagt, er könne ruhig ins Gartenbuch sehen, Hedwig hätte das gewollt; er hat \"Später vielleicht\" geantwortet."
        from: ch06/s02
      - text: "Jonas hat sich angeboten, an einem Montag Anfang August ihre Einkaufskiste beim Hansen-Hof zu holen; sie hat ihm den Zettel mitgegeben (Eier, Rosengelee, Kartoffeln, Rindfleisch, \"Nicht vergessen zu bezahlen\")."
        from: ch06/s03
      - text: "Lena macht den Hofladen für sie montags auf, seit Jahren."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet, ob der wiedergekommen ist; das hat sie Jonas am Donnerstag, dem 13. August, beim Essen gesagt."
        from: ch07/s01
      - text: "Jonas hat ihr auf ihre Bemerkung geantwortet, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes, und dabei die ganze Zeit sein Spiegelei angeguckt; sie hat \"Na, denn, Jung\" gesagt."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank im Garten gebracht, Marie ihren mit Milch, und den Blick einen Augenblick zu lange an Jonas gelassen."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, gegen Abend backt sie Probe-Butterkuchen fürs Erntefest; Hannes sagt, letztes Jahr seien sie zu trocken gewesen."
        from: ch08/s02
      - text: "Marie ist an diesem Abend ohne die Stiefel abzutreten in die Küche gekommen, hat Jacke und Hedwigs Schere mit dem roten Griff geholt und ihr nur ein Wort gesagt: \"Parkplatz.\""
        from: ch08/s02
      - text: "Sie hat Marie um Verzeihung gebeten, ohne Aber und ohne Weil, weil sie es geahnt und Marie nichts gesagt hat."
        from: ch08/s02
      - text: "Hedwig hat ihr gesagt, wen sie sich für den Garten wünscht; Marie weiß das auch, sie hat genickt."
        from: ch08/s02
      - text: "Marie hat an ihrem Küchentisch geweint; sie hat ihr die Hand auf die Faust gelegt, bis Marie die Schere losließ."
        from: ch08/s02
      - text: "Sie hat Marie eine heiße Ecke Probe-Butterkuchen in Papier mitgegeben und sie gebeten, morgen zu sagen, ob er zu süß ist, und die Astern am Rondell zu gießen."
        from: ch08/s02
      - text: "Am Montag, dem 31. August, abends in der Küche hat Jonas ihr gesagt, er fahre morgen früh nach Hamburg."
        from: ch09/s01
      - text: "Hedwig hat alles aufgehoben; sie hat Jonas an diesem Abend Hedwigs alte blaue Keksdose aus dem Fach unter der Fensterbank über den Tisch geschoben und gesagt: \"Lies das, Jung. Was du dann machst, ist deine Sache.\" Über Marie hat sie kein Wort gesagt."
        from: ch09/s01
      - text: "Maries Wagen stand seit Donnerstag, dem 27. August, nicht mehr am Tor; am Mittwoch, dem 2. September, stand er früh am Tor, und Marie arbeitete im Garten."
        from: ch09/s02
      - text: "Am 2. September gegen sieben hat sie Marie einen Becher Kaffee mit Milch und einen Teller Butterkuchen auf die Bank unter der Kletterrose gestellt und nichts gefragt, nicht, wo Marie seit Donnerstag war."
        from: ch09/s02
      - text: "Marie hat ihr gesagt, der Butterkuchen sei nicht zu süß, die Mandeln saftig, da habe Hannes nichts zu meckern; das habe sie ihr schon am Freitag sagen wollen. Sie hat Marie einmal über den Zopf gestrichen."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie Marie im Garten Kaffee gebracht (\"Milch ist drin\"), in der guten dunkelblauen Bluse, am Kragen Hedwigs Brosche, blank geputzt."
        from: ch10/s01
      - text: "Marie hat ihr gesagt, am Rondell fehlten noch zwei Astern; sie hat geantwortet, die fehlten nur ihr, und Marie geraten, sich was Schönes anzuziehen. Über Jonas hat sie kein Wort gesagt, Marie hat nicht gefragt."
        from: ch10/s01
      - text: "Beim Erntefest in der Scheune stehen ihre Bleche auf Lenas Tresen, Butterkuchen mit den saftigen Mandeln und Bienenstich; sie selbst steht an der Kaffeemaschine."
        from: ch10/s02
      - text: "Sie hat Marie und Jonas zusammen an der Fotowand in der Scheune stehen sehen, den Kopf rasch zur Kanne gesenkt und in den Dampf hinein gelächelt."
        from: ch10/s02
      - text: "Am Abend hat Hannes im Garten vor ihr die Mütze abgenommen und ihr die Hand hingehalten; sie hat gefragt, ob er nicht klug sei, in ihrem Alter, und dann doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Hedwigs Wunsch im Testament gilt Marie, auch wenn ihr Name nicht drinsteht."
        from: ch01/s03
      - text: "Der Verkauf ist Jonas' Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Hedwig hätte gewollt, dass Jonas ins Gartenbuch sieht."
        from: ch06/s02
      - text: "Jonas hat bei den \"Terminen in der Stadt\" geschwindelt; seit er klein war, sieht sie ihm das an."
        from: ch08/s02
      - text: "Sie hat so etwas wie den Parkplatz geahnt, das Wort nicht; diesmal wollte sie es nicht wissen."
        from: ch08/s02
      - text: "Sie hat gedacht, Jonas sagt es Marie selbst."
        from: ch08/s02
      - text: "Was Jonas nach dem Lesen der Keksdose macht, ist seine Sache."
        from: ch09/s01
      - text: "Die Deern hat mehr Ausdauer als der Giersch."
        from: ch09/s02
      - text: "Der Garten ist fertig fürs Fest (\"Da kann das Dorf kommen\"); die zwei Astern fehlen nur Marie."
        from: ch10/s01
    does_not_know:
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden und ihn Jonas gezeigt hat."
      - "Dass Marie in Klein Lindau Stecklinge der Lindenhof-Rose zieht und am 2. September einen davon neben den alten Stock gepflanzt hat."
      - "Dass am alten Stock der Lindenhof-Rose die Knospe aufgegangen ist."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Welche Bedingungen Marie und Jonas auf der Terrasse ausgehandelt haben (freie Hand bei den Rosen, Budgetrahmen, Fotos alle zwei Wochen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' entsorgen wollte und sie nun mit Punktfundamenten stehen bleiben sollen."
      - "Dass Marie den Hauptweg bis Ende Juni freihalten muss."
      - "Dass der Makler Ende Juli Fotos vom Garten will."
      - "Dass Marie und Jonas sich beim Gewitter unter dem Laubengang nähergekommen sind und sich seitdem duzen."
      - "Dass Marie und Jonas sich am Abend nach dem Helfersamstag am Steg geküsst haben."
      - "Dass Jonas Marie gesagt hat, er wisse nicht, ob er im Herbst noch hier ist."
      - "Dass Hannes Jonas und Steinhagen nach dem Erntefest gefragt hat und Steinhagen nur eine Veranstaltungsfläche gegen Gebühr anbietet."
      - "Was Steinhagen im Salon vorgelegt hat: rund zwanzig Zimmer, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg."
      - "Wo genau der Parkplatz liegen soll: dass der Lageplan von Weidenkamp ihn auf den Rosengarten bis in den Winkel hinter dem Laubengang legt."
      - "Dass Weidenkamp ihr lebenslanges Wohnrecht bestehen lassen will und für einen freiwilligen Auszug eine großzügige Abfindung vorsieht, die Jonas bei Gelegenheit ansprechen soll."
      - "Dass Jonas die Rechnungen für einen Gutachter zur Wertermittlung braucht."
      - "Dass Jonas im Gartenbuch Hedwigs Notiz über den ersten Steckling der Lindenhof-Rose gelesen hat, für den er als Kind das Loch gegraben hat."
      - "Dass der Ausschuss bis Freitag, den 14., eine Zusage von Jonas zum Erntefest brauchte, sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert."
      - "Dass Jonas Hannes am Freitag, dem 14. August, zugesagt hat, das Fest finde dieses Jahr auf dem Gut statt."
      - "Dass Jonas im Büro eine Partnerschaft angeboten wurde und er sie in Hamburg persönlich abgesagt hat."
      - "Dass Jonas am Donnerstag, dem 13. August, im Notariat in der Kreisstadt mit Steinhagen den Vorvertrag für den Verkauf an Weidenkamp unterschrieben hat, mit Rücktrittsrecht bis zum 10. September."
      - "Dass Jonas am Dienstag, dem 1. September, früh Steinhagen angerufen und das Rücktrittsrecht gezogen hat und die 38.000 Euro für Notar und Planung selbst trägt."
      - "Dass Jonas Hannes gesagt hat, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, und dass er am Samstag mit Hedwigs altem Trecker vorn fahren soll."
      - "Dass Jonas Marie unter der Kletterrose gesagt hat, er bleibe, ihr Haus bleibe ihr Haus, und dass er Marie liebt."
      - "Was Jonas in der Nacht auf der Freitreppe in der Keksdose gelesen und auf den Briefumschlag geschrieben hat."
      - "Dass Marie die Mappe mit Vorvertrag und Lageplan in Hedwigs Schreibtisch gefunden und Jonas im Arbeitszimmer zur Rede gestellt hat."
      - "Wo Hedwigs Gartenbuch ist; auf seinem Platz im Arbeitszimmer fehlt es."
      - "Was Lena Jonas im Hofladen über Marie gesagt hat."
      - "Dass Marie in der Nacht zu Lena gegangen ist und ihr alles erzählt hat."
      - "Wo Marie seit Donnerstag, dem 27. August, gewesen ist."
  hannes-kroeger:
    knows:
      - text: "Jonas Behrendt ist auf dem Gut; er hat ihn bis zum Helfersamstag als Herrn Behrendt angesprochen."
        from: ch03/s02
      - text: "Der Hauptweg ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Marie arbeitet im Rosengarten; an der Sonnenuhr sitzen alte Holunderstubben und an der Westseite ein Brombeerwurzelstock, die mit dem Spaten nicht herauszubekommen sind."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will, dass langsam gezogen wird, damit der Ballen die Rose nicht mitreißt."
        from: ch03/s02
      - text: "Jonas konnte im Juni noch nicht sagen, ob das Erntefest auf dem Gut bleibt; es hänge an Gutachten fürs Dach und die Fenster, an den Kosten und an Fristen, die Jonas selbst noch nicht kannte."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Er hat Hedwig mit derselben Kette den Fliederbusch an der Remise herausgeholt."
        from: ch03/s02
      - text: "Er fährt mit Marie Kies auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war auf dem Gut; er kannte seinen Namen und hat mit Jonas Garten und Haus angesehen."
        from: ch04/s01
      - text: "Steinhagen nennt die Fläche hinter dem Haus ein Pfund."
        from: ch04/s01
      - text: "Auf seine Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen und ist mit Steinhagen in den Salon gegangen, die Unterlagen durchzugehen."
        from: ch04/s01
      - text: "Beim Helfersamstag Mitte Juli kam er kurz nach sechs mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine; Timo brachte das zweite Gespann mit Kies für die Seitenwege."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln, eine Nummer zu groß, und wollte anfassen; er hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Er hat mit einem Pfiff dazwischengerufen, als Ole an der 'Maiden's Blush' zog, und gesagt: Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "Jonas ist als Kind, der Lütte von Hedwig, nach der Gerste barfuß auf seinem Hänger über die Stoppeln mitgefahren; Hedwig musste ihn mit Kuchen herunterlocken und hat geschimpft."
        from: ch05/s02
      - text: "Jonas erinnert sich an den Diesel der Hängerfahrt."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen frei; er hat die letzte Fuhre abgefahren."
        from: ch05/s02
      - text: "Er hat Jonas die Hand gegeben, ihn Jonas genannt und geduzt: Gut gemacht."
        from: ch05/s02
      - text: "Der Ausschuss hat am Abend vor dem Montag Anfang August gesessen: Bis Freitag, den vierzehnten, braucht das Dorf eine Zusage, auf die man bauen kann, sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert; das Zelt ist schon reserviert."
        from: ch06/s03
      - text: "Er hat Jonas die Frist am Montag am Hoftor des Hansen-Hofs überbracht; Jonas hat ihm bis dahin eine Antwort versprochen, keine Zusage."
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, nachmittags, hat er Jonas am schmiedeeisernen Tor des Gartens an die fällige Antwort erinnert; Jonas hat gesagt, das Fest finde dieses Jahr auf dem Gut statt."
        from: ch07/s02
      - text: "Marie ist Jonas danach am Tor um den Hals gefallen."
        from: ch07/s02
      - text: "Am Dienstag, dem 1. September, morgens, hat Jonas ihm am Fuß des Hügels auf dem Feldweg gesagt: Das Fest bleibt auf dem Gut, nicht nur dieses Jahr, nächstes auch, und danach."
        from: ch09/s01
      - text: "Er hat Jonas gesagt, dann bestelle er das Zelt ab, und Jonas solle am Samstag mit Hedwigs altem Trecker vorn fahren; den Trecker hat er im Frühjahr gemacht, der springt an."
        from: ch09/s01
      - text: "Jonas ist noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Jonas hat ihn gebeten, Marie nichts zu sagen, das müsse er selbst; er hat geantwortet, man rede nicht für andere, aber Jonas solle sie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, nachmittags, hat er hellen Kies fürs Rondell ans Gartentor gefahren und mit Marie geschaufelt."
        from: ch09/s02
      - text: "Neben dem alten Rosenstock im Winkel hinter dem Laubengang steht in frischer dunkler Erde ein Steckling mit rötlichen Blättern, darüber eine offene Blüte."
        from: ch09/s02
      - text: "Marie hat ihm gesagt, Samstag sei Fest, und was danach mit dem Garten wird, sage ihr keiner, Jonas am wenigsten."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, ist er im Umzug durch die Lindenallee in Weste, die Ehrennadel am Revers, die Mütze in der Hand, neben dem Vorderrad von Hedwigs altem Trecker gegangen, den Jonas mit der Erntekrone vorn fuhr; früher hat er an derselben Stelle neben Hedwig Schritt gehalten."
        from: ch10/s01
      - text: "Das Dorf hat dem Trecker mit Jonas am Steuer geklatscht."
        from: ch10/s01
      - text: "Am Abend hat er im Garten vor Grete die Mütze abgenommen und ihr die Hand hingehalten; sie hat ihn gefragt, ob er nicht klug sei, in ihrem Alter, und dann doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Mit Kette und Trecker ist der Stubben ruckzuck raus."
        from: ch03/s02
      - text: "Kommt das Hotel, hat das Erntefest auf dem Gut keinen Platz mehr (\"Wo soll das dann hin?\")."
        from: ch04/s01
      - text: "Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "Die Frist ist keine Drohung; die Leute wollen wissen, wo sie ihre Bänke hinstellen."
        from: ch06/s03
      - text: "Man redet nicht für andere; was Jonas Marie zu sagen hat, muss er ihr selbst sagen, und zwar bald."
        from: ch09/s01
      - text: "Marie soll mit dem Garten weitermachen und den Steckling jeden Morgen gießen (\"Weiß man eben\")."
        from: ch09/s02
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Ob Jonas das Gut verkauft; Jonas hat nur gesagt, das Fest bleibe auf Dauer auf dem Gut."
      - "Dass Jonas am Donnerstag, dem 13. August, im Notariat in der Kreisstadt den Vorvertrag mit Weidenkamp unterschrieben hat, mit Rücktrittsrecht bis zum 10. September, fünf Tage nach dem Fest."
      - "Dass Jonas am 1. September Steinhagen angerufen und das Rücktrittsrecht gezogen hat."
      - "Dass Jonas es Marie am Festtag unter der Kletterrose selbst gesagt hat."
      - "Dass Marie den Vorvertrag am 27. August in Hedwigs Schreibtisch gefunden und es Grete und Lena erzählt hat."
      - "Dass der Steckling neben dem alten Stock eine Lindenhof-Rose ist und Marie in Klein Lindau einen zweiten zieht."
      - "Dass der Lageplan den Parkplatz genau dort vorsieht, wo Jonas an der Südmauer gegraben hat."
      - "Was im Salon besprochen wurde: rund zwanzig Zimmer, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg."
      - "Dass der Lageplan den Parkplatz genau auf den Rosengarten legt."
      - "Dass Weidenkamp für Gretes freiwilligen Auszug eine Abfindung vorsieht."
      - "Dass Marie und Jonas sich am Abend nach dem Helfersamstag am Steg geküsst haben."
      - "Dass Jonas sein Gesicht nicht behalten hatte."
      - "Dass Jonas im Büro eine Partnerschaft angeboten wurde und er sie persönlich abgesagt hat."
      - "Dass ein Gutachter für die Wertermittlung des Guts die Rechnungen für Dach und Fenster sehen will."
      - "Dass Hedwig sich Marie als Nachfolgerin im Garten gewünscht hat."
  jonas-behrendt:
    knows:
      - text: "Die Frau im Garten heißt Marie Albers."
        from: ch01/s01
      - text: "Die Rose am Hauptweg ist eine 'New Dawn', kein Gestrüpp."
        from: ch01/s01
      - text: "Das Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Sieben Fenster im Erdgeschoss zur Gartenseite sind undicht, zwei Flügel verzogen; für das Dach fehlt noch ein Angebot."
        from: ch01/s02
      - text: "Marie hat den Auftrag angenommen: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Marie rechnet nach ihrem eigenen, nicht verhandelbaren Stundensatz ab."
        from: ch01/s02
      - text: "An den Rankbögen an der Ostmauer hängt seit zweiundfünfzig Jahren eine Rose."
        from: ch02/s01
      - text: "Abmachung mit Marie: Die Bögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief), er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg vom Tor bis zur Pforte bis Ende Juni freizumachen, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Es gibt einen Kaufinteressenten aus der Hotelbranche."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben, dann seien andere Zahlen drin; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Der Makler will am letzten Freitag im Juli einen Fotografen für Fotos vom Garten schicken."
        from: ch02/s02
      - text: "Der Hügel hinter der Scheune ist der einzige Platz am Gut mit Netz."
        from: ch02/s02
      - text: "Er erinnert sich an ein Floß am Gutssee und an Hedwig, die ihn zum Kuchen rief."
        from: ch02/s02
      - text: "Die Bögen der 'Ghislaine' sitzen seit einer Woche fest im Beton und halten; er hat nachgerechnet, was die Fundamente tragen müssen."
        from: ch03/s01
      - text: "Marie hat mit zehn Jahren im Garten ihren ersten Rosenschnitt gemacht; Hedwig hat ihr die Hand geführt."
        from: ch03/s01
      - text: "Marie kam als Kind jeden Dienstag und Freitag; Grete hat Buch geführt, eine Stunde Unkraut gegen ein Stück Streuselkuchen."
        from: ch03/s01
      - text: "Hedwig hat Marie ihre alte Schere mit dem roten Griff geschenkt; Marie hat sie heute noch."
        from: ch03/s01
      - text: "Hedwig hat laut mit den Rosen geredet, und Marie tut es auch."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie und er sagen seit dem Gewitter unter dem Laubengang Du zueinander."
        from: ch03/s01
      - text: "Marie nimmt den Kaffee mit Milch (von Grete)."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; die Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen und verrutschte Pfannen, in der Rinne fault Laub."
        from: ch03/s03
      - text: "Steinhagen war Mitte Juli zur Besichtigung da; Grete hat beiden auf der Terrasse Kaffee eingeschenkt, ohne Kuchen, zum ersten Mal seit all den Kindersommern."
        from: ch04/s02
      - text: "Beim Rundgang hat Marie Steinhagen gesagt, das sei keine Fläche, sondern ein Garten aus den Dreißigerjahren, und die 'Rosa Mundi' sei älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes hat Steinhagen nach dem Erntefest gefragt; Steinhagen bot eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen. Er selbst hat geschwiegen."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz unten am Steg."
        from: ch04/s02
      - text: "Grundrisse, Schnitte und Kostenschätzung nach Gewerken sind solide; zwei Balken sind eingeplant (Seite vier, unten), die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Im Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit einer Zufahrt durch das Tor; ein paar Rosen sollen als Akzent in Kübeln bleiben."
        from: ch04/s02
      - text: "Die graue Fläche der Stellplätze im Lageplan reicht bis an die Mauer, bis in die Ecke hinter dem Laubengang."
        from: ch07/s01
      - text: "Grete hat ein lebenslanges Wohnrecht, das bestehen bleiben soll; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor, und er soll das bei Gelegenheit ansprechen."
        from: ch04/s02
      - text: "Steinhagen hatte ein Herrenhaus weiter im Süden, dessen alter Park für den Anbau weichen musste; seitdem fehle dem Haus etwas."
        from: ch04/s02
      - text: "Beim Helfersamstag Mitte Juli hat er in geliehenen Gummistiefeln mitgearbeitet; Hannes hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Lena hat ihn eingetragen und den ganzen Tag gesiezt, mit dem Klemmbrett vor der Brust; Marie nennt das ihren Vertreterton."
        from: ch05/s03
      - text: "Die nummerierten Kästchen des Parkplatzes im Lageplan liegen genau dort, wo er an der Südmauer gräbt."
        from: ch05/s02
      - text: "Laut Hannes ist er als Kind nach der Gerste barfuß auf Hannes' Hänger über die Stoppeln mitgefahren; Hedwig musste ihn mit Kuchen herunterlocken und hat geschimpft."
        from: ch05/s02
      - text: "Von der Hängerfahrt erinnert er sich an Diesel und Stroh, Hannes' Gesicht hatte er nicht behalten; Hannes hat ihn nicht vergessen."
        from: ch05/s02
      - text: "An der Südmauer nahe der Pforte wachsen unter den Brombeeren junge Triebe mit denselben kleinen, glänzenden Blättern wie an den Bögen im Laubengang; er hat aufgehört zu ziehen."
        from: ch05/s02
      - text: "Marie sagt, es ist eine 'Ghislaine de Féligonde' mit altem Stamm, die seit Jahren keiner mehr gesehen hat; sie hat die Triebe lose mit Bast angebunden."
        from: ch05/s02
      - text: "Die Südmauer liegt von der Pforte nach Westen bis zum alten Geräteschuppen frei."
        from: ch05/s02
      - text: "Hannes hat ihm die Hand gegeben, ihn Jonas genannt und Du zu ihm gesagt."
        from: ch05/s02
      - text: "Grete hat ihm aus der Helferkiste zwei Bier gegeben, als er fragte, ob er zählt, und ihm Quark für den Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "Lena hat ihn um fünf gefragt, ob er nächsten Samstag Zeit hat; er hat Ja gesagt."
        from: ch05/s03
      - text: "Als Junge hat er am Steg drei Flöße aus Remisenbrettern und Gretes Wäscheleine gebaut; das letzte ist mitten auf dem See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer. Seitdem rechnet er alles zweimal."
        from: ch05/s03
      - text: "Er und Marie haben sich am Steg geküsst; er wollte das seit dem Gewitter, Marie auch."
        from: ch05/s03
      - text: "Marie hat ihn gefragt, ob er im Herbst noch hier ist; er hat geantwortet, er wisse es nicht."
        from: ch05/s03
      - text: "Die Gallica und die Damaszener am Tor blühen nur einmal im Jahr und werden nach der Blüte zurückgeschnitten; die Büsche am Rondell bleiben stehen und setzen Hagebutten an, im September rot wie kleine Laternen."
        from: ch06/s01
      - text: "Das Junibild kommt nicht wieder: Glanz im September heißt Nachblüte der 'New Dawn', davor Lavendel und Katzenminze, Frauenmantel an den Kanten, Astern und am Laubengang Dahlien in Reihen."
        from: ch06/s01
      - text: "Lena hat ihn für Samstag schon auf der Helferliste eingetragen, mit Ankunft und Abfahrt; die Liste hängt ganz oben am schwarzen Brett im Hofladen."
        from: ch06/s03
      - text: "Für die Wertermittlung will der Gutachter jede Rechnung für Dach und Fenster in der Hand haben; die Rechnung fürs Dach (Umdeckung Nordseite, mit Stempel) hat er in Hedwigs Ordnern gefunden, die für die Fenster noch nicht."
        from: ch06/s02
      - text: "Im Gartenbuch stehen in Hedwigs Handschrift schraffierte Beetpläne, jeder Kreis mit Namen und Bemerkung ('Rosa Mundi': Läuse, Brennnesseljauche; die 'Ghislaine' mit Ausrufezeichen)."
        from: ch06/s02
      - text: "Unter \"Lindenhof-Rose\" hat Hedwig in einem Juli vor sechsundzwanzig Jahren notiert: Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen."
        from: ch06/s02
      - text: "Er erinnert sich wieder: Hedwigs Hand lag beim Pflanzen über seiner (\"Nicht drücken\"); der Steckling stand in einem Erdbeer-Joghurtbecher; er hat ihn jeden Morgen barfuß mit dem Lineal gemessen und ist am fünften Tag bei dreieinhalb brüllend zur Küche gerannt."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet; zu Weihnachten ein Anruf von zehn Minuten, in ihren letzten Jahren war er zwei-, vielleicht dreimal hier."
        from: ch06/s02
      - text: "Lena macht den Hofladen für Grete montags auf, seit Jahren; Marie hat Frieda eine Dahlie geschenkt."
        from: ch06/s03
      - text: "Lena hat ihm gesagt, Marie sei keine, mit der man einen Sommer spielt; wenn er es doch tue, nehme sie ihm das übel, und das ganze Dorf mit ihr. Ob Marie ihr etwas gesagt hat, müsse er Marie selbst fragen."
        from: ch06/s03
      - text: "Laut Hannes braucht der Ausschuss bis Freitag, den vierzehnten, eine Zusage, auf die man bauen kann, sonst wird im schon reservierten Zelt hinter dem Feuerwehrhaus gefeiert; er hat Hannes bis dahin eine Antwort versprochen."
        from: ch06/s03
      - text: "Am Donnerstag, dem 13. August, kurz nach sieben, hat er vom Hügel hinter der Scheune mit einem Partner telefoniert, statt um neun in Hamburg zu sein; der Partner hat das hingenommen (\"Wenn du heute nicht nach Hamburg kommen kannst, dann eben so\")."
        from: ch07/s01
      - text: "Zehn Minuten nach dem Anruf hat der Dachdecker zurückgerufen und eine Summe für den Herbst genannt; er hat sie unter die durchgestrichene Hamburger Uhrzeit auf den Briefumschlag geschrieben."
        from: ch07/s01
      - text: "Marie ist am selben Morgen mit dem weißen Kastenwagen am Tor angekommen und hat Töpfe ausgeladen, ohne zum Hügel heraufzusehen; er ist auf der anderen Seite zum Kombi hinuntergegangen."
        from: ch07/s01
      - text: "Er hat am 13. August im Notariat in der Kreisstadt in Steinhagens Beisein den Vorvertrag mit Weidenkamp unterschrieben, mit dem Kugelschreiber mit Firmenlogo, den er Steinhagen zurückgeschoben hat."
        from: ch07/s01
      - text: "Der Vorvertrag enthält ein Rücktrittsrecht bis zum 10. September, fünf Tage nach dem Fest; laut Steinhagen hat so etwas bei Weidenkamp noch nie jemand gezogen."
        from: ch07/s01
      - text: "Grete hat ihm gesagt, im Dorf werde über den Herrn mit dem silbernen Auto geredet, ob der wiedergekommen ist; er hat ihr gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes. Das war gelogen."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat Marie ihn in den Winkel hinter dem letzten Bogen des Laubengangs geführt: Dort steht der alte Stock der Lindenhof-Rose, kniehoch und krumm, mit einer erbsengroßen Knospe; Hedwig hat die Rose selbst gezogen, es gibt nur noch diesen einen Stock."
        from: ch07/s02
      - text: "Marie hat die alte Pflanze im Juni unter den Brombeeren gefunden und sagt, der Stock blüht wieder."
        from: ch07/s02
      - text: "Er hat die Kanten der Kieswege an einer gespannten Schnur abgestochen; Marie hat Astern ans Rondell gesetzt; Grete hat mittags Butterkuchen und Kaffee auf die Bank gebracht."
        from: ch07/s02
      - text: "Er hat Maries zerkratzte Finger geküsst."
        from: ch07/s02
      - text: "Am Nachmittag des 14. August hat Hannes am Tor die Antwort eingefordert; er hat gesagt, das Fest finde dieses Jahr auf dem Gut statt, und Marie ist ihm um den Hals gefallen."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, später Nachmittag, hat Marie im Arbeitszimmer die Weidenkamp-Mappe mit Vorvertrag und Lageplan aus Hedwigs Schreibtisch gezogen; er kam vom Hügel herein und sah die offene Schublade und die Mappe."
        from: ch08/s01
      - text: "Er hat Marie gesagt, es sei ein Vorvertrag, im Büro biete man ihm eine Partnerschaft an, für die er bis Monatsende eine Einlage bringen müsse, das Dach (Nordseite, Rinnen) sei schlimmer als die Scheune, und er habe ein Rücktrittsrecht bis nach dem Fest."
        from: ch08/s01
      - text: "Marie hat ihm gesagt, den Garten hätte sie ihm notfalls hergegeben, nur nicht hinter ihrem Rücken und nicht nach dem Steg; und den Parkplatz habe er ihr nicht erklärt."
        from: ch08/s01
      - text: "Marie hat die Mappe auf den Schreibtisch gelegt, den Lageplan obenauf, die graue Fläche nach oben, und ist an ihm vorbei aus dem Arbeitszimmer gegangen; er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Seit Donnerstag, dem 27. August, steht Maries weißer Kastenwagen nicht mehr am Tor; auf keine seiner vier Nachrichten vom Hügel ist eine Antwort gekommen."
        from: ch09/s01
      - text: "Die Partner haben ihm die Einlage bis nach dem Fest gestundet, weil Weidenkamps Anzahlung noch aussteht."
        from: ch09/s01
      - text: "Am Montag, dem 31. August, abends hat er Grete gesagt, er fahre morgen früh nach Hamburg; Grete hat ihm Hedwigs alte blaue Keksdose gegeben (\"Hedwig hat alles aufgehoben. Lies das, Jung.\") und über Marie kein Wort gesagt."
        from: ch09/s01
      - text: "Die Keksdose kennt er von früher; in den Kindersommern lagen Butterkekse darin, und er hat sich auf Zehenspitzen welche herausgestohlen."
        from: ch09/s01
      - text: "In der Dose liegen seine Kinderbriefe an Hedwig in Druckschrift (\"LIEBE TANTE HEDWIG\"), mit der Frage, wie viele Zentimeter der Steckling gewachsen sei (\"Bitte mit Lineal messen\")."
        from: ch09/s01
      - text: "In der Dose liegt seine Kinderzeichnung von einem Mädchen mit Zopf auf einer Mauer, die Fäuste in die Seiten gestemmt, daneben in seiner Kinderschrift: \"Die hat mit mir geschimpft.\" Er war damals zwölf, die Kleine kaum fünf."
        from: ch09/s01
      - text: "Darunter liegen seine Postkarten aus Zeltlager und Klassenfahrt, jedes Jahr mit weniger Text; die letzte, aus dem Studium, sagt nur \"Nächsten Sommer komm ich bestimmt\". Er ist im Sommer darauf nicht gekommen; Hedwig hat die Karte trotzdem glattgestrichen ganz unten aufbewahrt."
        from: ch09/s01
      - text: "Sein Plan auf dem Briefumschlag: Dach Nordseite Herbst, Südseite nächstes Jahr, Rinnen selbst; Büro zwei Tage, drei hier; Notar und Planung 38.000 aus dem Ersparten, das für die Einlage gedacht war."
        from: ch09/s01
      - text: "Am Dienstag, dem 1. September, früh hat er vom Hügel Steinhagen gesagt, er ziehe das Rücktrittsrecht und trage wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst, achtunddreißigtausend Euro."
        from: ch09/s01
      - text: "Steinhagen hat über den Preis keinen Satz verloren; er habe es fast geahnt, seit dem Notar, als Jonas nur Wasser wollte. Die Gruppe hat noch ein zweites Gut im Blick; Steinhagen hat ihm Glück mit dem Haus gewünscht."
        from: ch09/s01
      - text: "Er hat die Partnerschaft in Hamburg persönlich abgesagt."
        from: ch10/s03
      - text: "Er hat Hannes am Fuß des Hügels gesagt, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, nächstes auch, und danach; Hannes will das Zelt abbestellen."
        from: ch09/s01
      - text: "Er hat Hannes gebeten, Marie nichts zu sagen, das müsse er selbst; Hannes hat gesagt, man rede nicht für andere, aber er solle sie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Am Samstag, dem 5. September, hat er Hedwigs alten Trecker mit der Erntekrone vorn im Umzug durch die Lindenallee gefahren, sehr gerade, beide Hände am Lenkrad; Hannes ging in Weste neben dem Vorderrad, das Dorf hat geklatscht."
        from: ch10/s01
      - text: "Er hat die Leute am Rand der Allee Gesicht für Gesicht abgesucht, Marie gefunden und ihr ernst zugenickt."
        from: ch10/s01
      - text: "An Lenas Fotowand in der Scheune hängt ein verblichener Abzug: Hedwig an der Gartenmauer, neben ihr er als dünner barfüßiger Junge mit zerschrammtem Knie, oben auf den Backsteinen Marie als Mädchen mit Zopf, die Arme in die Hüften gestemmt."
        from: ch10/s02
      - text: "Marie ist das Mädchen auf der Mauer, das ihn beschimpft hat: Er war auf einen Rosenstock getreten, und sie hat gesagt, er habe Füße wie ein Ochse und keinen Verstand dazu. Er hat es Tante Hedwig mit Zeichnung geschrieben; der Brief lag in Gretes Keksdose."
        from: ch10/s02
      - text: "Lena hat sich in der Scheune zwischen ihn und Marie geschoben (\"Sie trauen sich was, Herr Behrendt. Nach allem?\"); Marie hat ihr gesagt, das sei ihre Sache."
        from: ch10/s02
      - text: "Er hat Marie gesagt, sie müsse es zuerst hören, vor allen anderen; sie ist für fünf Minuten mit ihm unter die Kletterrose gekommen."
        from: ch10/s02
      - text: "Er hat Marie auf der Bank unter der Kletterrose gesagt: Rücktritt am Dienstag, die Kosten trägt er selbst, Partnerschaft persönlich abgesagt, künftig drei Tage die Woche von hier, das Dach in Abschnitten, das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus, er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Marie hat ihm gesagt, der Parkplatz sei es nicht gewesen, nicht nur; sein Schweigen habe wehgetan, und auch den Rücktritt habe er wieder allein, ohne sie, beschlossen. Er hat genickt und keine Ausrede gesucht."
        from: ch10/s03
      - text: "Hedwig hat Marie im letzten Herbst auf dieser Bank die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführe."
        from: ch10/s03
      - text: "Marie will den Garten an seiner Seite führen, nicht in seinem Auftrag, und er soll sie in seine Entscheidungen hineinnehmen, vorher, nicht hinterher; er hat ohne Zögern Ja gesagt und als erste Frage gestellt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Am alten Stock der Lindenhof-Rose hängt eine einzige, schon müde Blüte; eine Handbreit daneben steht ein Steckling mit einem neuen rötlichen Blatt. Marie zieht die Stecklinge seit Juni in ihrem Hinterhof, der zweite steht noch unter der Folie."
        from: ch10/s03
      - text: "Er hat Marie die Notiz aus Hedwigs Gartenbuch über den ersten Steckling erzählt; sie hat sich neben ihn ins Gras gekniet, ihre Hand auf seine gelegt und ihn geküsst."
        from: ch10/s03
      - text: "Am Abend hat er mit Marie barfuß auf dem Kies getanzt und ihr zweimal auf die Zehen getreten (\"Füße wie ein Ochse\" – \"Und keinen Verstand dazu\")."
        from: ch10/s03
      - text: "Lena hat ihm beim Tanz die Hand gegeben, ihn geduzt (\"Willkommen, Jonas\") und gesagt, er solle gut auf Marie aufpassen."
        from: ch10/s03
    believes:
      - text: "Marie ist die Gärtnerin."
        from: ch01/s01
      - text: "Marie kennt den Garten; eine Firma aus der Kreisstadt wäre zu langsam."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Das Haupthaus ist sanierungsbedürftiger als das Scheunendach."
        from: ch03/s03
      - text: "Mit einem Parkplatz auf dem Gelände hat er seit dem Wort Stellplatzlösung gerechnet, mit der Abfindungszeile für Grete nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "\"Ein Interessent\" war nicht gelogen, aber so wenig, dass es kaum Gewicht hatte."
        from: ch04/s02
      - text: "Er wird auf dem Gut mitgerechnet."
        from: ch05/s02
      - text: "Eines der nummerierten Kästchen im Lageplan liegt über dem Loch, das er für den Steckling gegraben hat; er hat nicht ausgerechnet, welches."
        from: ch06/s02
      - text: "Er versteht die Partner; er hätte es selbst so gesagt."
        from: ch07/s01
      - text: "Er wollte Marie das nicht halb sagen."
        from: ch08/s01
      - text: "Er rechnet nicht mehr aus, was sich lohnt, sondern was trägt."
        from: ch09/s01
      - text: "Hannes hat daran gezweifelt, dass das Fest auf dem Gut bleibt, auch wenn er sagt, er habe nie dran gezweifelt."
        from: ch09/s01
      - text: "Der erste Steckling der Lindenhof-Rose stand irgendwo hier, im Winkel hinter dem Laubengang."
        from: ch10/s03
    does_not_know:
      - "Wo genau im Garten er den ersten Steckling der Lindenhof-Rose gepflanzt hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Was Marie bei Lena im Hofladen über ihn erzählt hat."
      - "Warum er Marie nicht mehr gesagt hat als \"Ein Interessent\"."
      - "Dass Grete ihm die Ausrede mit den Terminen im Büro nicht geglaubt hat."
      - "Dass Marie all die Jahre geglaubt hat, der dünne Junge habe oben auf der Mauer gestanden, und am Steg geahnt hat, dass er es war."
      - "Dass Marie nach dem Arbeitszimmer zu Grete in die Küche gegangen ist und Grete sie um Verzeihung gebeten hat."
      - "Dass Marie in der Nacht Lena alles erzählt hat, auch vom Steg und vom Vorvertrag, und dass Lena Hannes anrufen wollte."
      - "Ob Marie seine Nachrichten gelesen hat und wo sie seit Donnerstag gewesen ist."
  lena-hansen:
    knows:
      - text: "Marie arbeitet am Laubengang im Garten von Hedwig."
        from: ch02/s03
      - text: "Der Mann, über den Marie spricht (Jonas), hatte in seiner Tabelle mit Budget und Meilensteinen die Entsorgung beider Rankbögen der 'Ghislaine' vorgesehen."
        from: ch02/s03
      - text: "Er hat am Bogen ein fehlendes Fundament festgestellt und eins skizziert, 40 × 40, 80 tief wegen Frost; dabei hat er sich die helle Hose an beiden Knien grün gemacht."
        from: ch02/s03
      - text: "Am ersten Tag ließ er Schuhe und Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Beim Helfersamstag Mitte Juli hat sie am Tor die Helfer abgehakt (Landfrauen, Feuerwehr, Nachbarn vom Dorfteich) und die Arbeit verteilt."
        from: ch05/s01
      - text: "Marie hat ihren Rosen Namensschilder gemacht, damit keiner was rausreißt."
        from: ch05/s01
      - text: "Jonas Behrendt ist zum Helfersamstag gekommen; sie hat ihn eingetragen und gesiezt."
        from: ch05/s01
      - text: "Sie hat Jonas um fünf gefragt, ob er nächsten Samstag Zeit hat; er hat Ja gesagt."
        from: ch05/s03
      - text: "Sie hat Jonas auf der Helferliste am schwarzen Brett mit Ankunft und Abfahrt eingetragen; sie hat die Helferliste mit jeder Nummer."
        from: ch08/s03
      - text: "Sie macht den Hofladen für Grete montags auf, seit Jahren; an einem Montag Anfang August hat Jonas Gretes Kiste abgeholt."
        from: ch06/s03
      - text: "Marie hat Frieda eine Dahlie geschenkt."
        from: ch06/s03
      - text: "Jonas kommt aus Hamburg."
        from: ch06/s03
      - text: "Sie hat Jonas gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie und das ganze Dorf ihm das übel; auf seine Frage, ob Marie ihr etwas gesagt habe, hat sie ihn an Marie verwiesen."
        from: ch06/s03
      - text: "In der Nacht nach dem 27. August, um Viertel vor zwölf, hat Marie an die Küchentür des Hansen-Hofs geklopft; sie hat ihr im Schlafanzug aufgemacht, Mats hat Wasser aufgesetzt."
        from: ch08/s03
      - text: "Laut Marie hat Jonas heimlich beim Notar einen Vertrag unterschrieben, gerade und ohne Zögern; auf dem Lageplan liegen graue Kästchen über dem Rosengarten, bis an die Mauer."
        from: ch08/s03
      - text: "Marie und Jonas haben sich an einem Abend am Steg geküsst; davon hat sie bis heute nichts gewusst."
        from: ch08/s03
      - text: "Jonas hat Hannes vor zwei Wochen am Tor zugesagt, das Fest finde \"dieses Jahr\" auf dem Gut statt."
        from: ch08/s03
      - text: "Hedwig hat Marie letzten Herbst beim Tee auf der Bank unter der Kletterrose die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführe; das steht nirgends, nicht im Testament, auf keinem Zettel."
        from: ch08/s03
      - text: "Marie hat ihr das nie erzählt, weil es nach Erbschleicherei klingt und sie sich geschämt hat."
        from: ch08/s03
      - text: "Marie hat Gretes Butterkuchen mitgebracht; sie hat ihn mitten durchgeschnitten."
        from: ch08/s03
      - text: "Sie hat angekündigt, morgen früh Hannes anzurufen; Marie hat gesagt, das sei ihre Sache, nicht die vom Dorf."
        from: ch08/s03
      - text: "Beim Erntefest am 5. September steht sie in der Scheune im gelben Kleid, Friedas Kranz aus Kornblumen in den Locken, am Tresen mit Gretes Blechen; sie hat Marie das Kuchenmesser weggenommen."
        from: ch10/s02
      - text: "Sie hat an der Rückwand der Scheune auf Mats' Stelltafeln eine Fotowand aufgehängt, Dutzende Fotos aus dem Album der Petersens, aus Hedwigs Schublade und aus Hannes' Ausschusskiste, jedes mit Zettelchen; für Marie und für Hedwig. Darum lagen die Fotos auf ihrem Küchentisch."
        from: ch10/s02
      - text: "Vor einem kleinen Abzug (Hedwig an der Gartenmauer, ein dünner barfüßiger Junge, oben ein Mädchen mit Zopf) hat Jonas zu Marie gesagt: \"Du hast mich beschimpft.\""
        from: ch10/s02
      - text: "Marie hat sie am Arm gefasst und gesagt, das sei ihre Sache; Jonas hat Marie gesagt, sie müsse etwas zuerst hören, vor allen anderen, und sie unter die Kletterrose gebeten; Marie hat fünf Minuten zugesagt."
        from: ch10/s02
      - text: "Am Abend tanzt Marie mit Jonas barfuß auf dem Kies im Garten; sie hat Jonas die Hand gegeben, ihn geduzt (\"Willkommen, Jonas\") und gesagt, er solle gut auf Marie aufpassen."
        from: ch10/s03
    believes:
      - text: "Marie hat Gefühle für Jonas."
        from: ch02/s03
      - text: "Die Bögen werden nicht verschrottet, weil Marie ihn dazu gebracht hat (nach Maries Erzählung)."
        from: ch02/s03
      - text: "Wer Marie Erbschleicherei nachsagt, kriegt es mit ihr zu tun; Marie hat Hedwig seit ihrem zehnten Jahr den Giersch gestochen."
        from: ch08/s03
      - text: "Jonas gehört jetzt dazu, und er soll gut auf Marie aufpassen."
        from: ch10/s03
      - text: "Sie hat gleich gesagt, dass aus Marie und Jonas etwas wird (\"Hab ich doch gleich gesagt\")."
        from: ch10/s03
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass der Käufer Weidenkamp Hotels ist und Ralf Steinhagen das Gut besichtigt hat."
      - "Dass der Vorvertrag ein Rücktrittsrecht bis zum 10. September hat."
      - "Dass Jonas am 1. September das Rücktrittsrecht gezogen hat."
      - "Was Jonas Marie unter der Kletterrose gesagt hat."
      - "Dass Jonas Hannes am 1. September gesagt hat, das Fest bleibe auf Dauer auf dem Gut."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat und Stecklinge davon zieht."
      - "Dass Marie und Jonas sich beim Gewitter unter dem Laubengang nähergekommen sind."
      - "Dass Hannes Jonas am Hoftor die Frist des Ausschusses bis Freitag, den 14., genannt und Jonas ihm eine Antwort versprochen hat."
      - "Dass Jonas im Büro eine Partnerschaft angeboten wurde und er sie abgesagt hat."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe."
        from: ch01/s01
      - text: "Auftrag von Jonas: den Rosengarten bis zum Erntefest am 5. September herrichten, Wege begehbar, Beete sauber."
        from: ch01/s02
      - text: "Jonas wollte das Gut verkaufen; ein gepflegtes Gut sollte einen besseren Preis bringen."
        from: ch01/s02
      - text: "Abmachung: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Arbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hinter dem Laubengang unter den Brombeeren steht ein Stock der Lindenhof-Rose mit einer Knospe."
        from: ch01/s03
      - text: "Grete hat ihr zwei Tage nach dem Auftrag Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Laut Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas' Tabelle: Hauptweg frei bis Ende Juni; beim Laubengang Entsorgung, Ersatz verzinkt; er hatte schon ein Angebot."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Dafür, dass die Bögen bleiben, muss sie den Hauptweg vom Tor bis zur Pforte bis Ende Juni freimachen, kein Tag später."
        from: ch02/s01
      - text: "Lena meint, dass Marie seit zwanzig Minuten über Jonas' Schuhe redet, sei kein gutes Zeichen – oder ein sehr gutes."
        from: ch02/s03
      - text: "Frieda nennt sie Tante Rosen und hat gefragt, ob sie verliebt ist."
        from: ch02/s03
      - text: "Die Bögen der 'Ghislaine' sitzen seit einer Woche im Beton und halten; sie hat die Rose wieder angebunden, der achte Bogen war als Nächstes dran."
        from: ch03/s01
      - text: "Seit dem Gewitter unter dem Laubengang sagen Jonas und sie Du zueinander; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Jonas weiß, dass sie wie Hedwig mit den Rosen spricht."
        from: ch03/s01
      - text: "Hedwig hat ihr letzten Herbst auf der Bank unter der 'New Dawn' die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführe, wenn sie nicht mehr kann; das steht nirgends, nicht im Testament, auf keinem Zettel."
        from: ch08/s03
      - text: "Sie wollte nach dem Gewitter nicht von Jonas' Seite gehen und ist geblieben."
        from: ch03/s01
      - text: "Der Brombeerwurzelstock an der Westseite der Sonnenuhr rührt sich seit drei Tagen nicht unter der Hacke."
        from: ch03/s02
      - text: "Jonas hat Hannes im Juni nicht zugesagt, dass das Erntefest auf dem Gut bleibt; es hänge an Gutachten für Dach und Fenster, an Kosten und an Fristen."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Grete hat Jonas gesagt, dass sie den Kaffee mit Milch nimmt."
        from: ch03/s02
      - text: "Sie bringt mit Hannes Kies auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Der Besucher ist Ralf Steinhagen von Weidenkamp Hotels; er kannte ihren Namen, den von Hannes und von Grete."
        from: ch04/s01
      - text: "Grete hat Steinhagen und Jonas auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand gebracht, ohne Kuchen."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus ein Pfund und sagte, das werde auf den Fotos sehr schön; von welchen Fotos er sprach, weiß sie nicht."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an; Jonas schwieg dazu."
        from: ch04/s01
      - text: "Jonas ist mit Steinhagen in den Salon gegangen, die Unterlagen durchzugehen."
        from: ch04/s01
      - text: "Auf ihre Frage hat Jonas im Juli gesagt, Steinhagen sei ein Interessent; mehr hat er damals nicht gesagt."
        from: ch04/s02
      - text: "Zum Helfersamstag Mitte Juli hat sie an jeden Stock, der stehen bleiben muss, vom Tor bis zur Pforte ein Pappschild mit der Sorte gehängt; nur die Mauerecke hinter dem Südende des Laubengangs trägt keinen Namen."
        from: ch05/s01
      - text: "In der Mauerecke hinter dem Südende des Laubengangs hat sie im Dunkeln die Brombeeren selbst zurückgeschnitten und einen Pfahl mit leerem Schild davorgesetzt."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln, sah nicht zu ihr herüber und ging an die Südmauer, fort von der Ecke am Laubengang."
        from: ch05/s01
      - text: "Ole von der Feuerwehr hat an der 'Maiden's Blush' einen Trieb abgeknickt; sie hat ihn mit Hedwigs Schere eine Handbreit tiefer abgeschnitten. Hannes hat gesagt, im Garten sei sie die Chefin."
        from: ch05/s01
      - text: "Die neuen Kieswege sind bis an die Mauer geharkt; Landfrauen stechen den Giersch an der Westmauer."
        from: ch05/s01
      - text: "Jonas hat an der Südmauer nahe der Pforte unter den Brombeeren eine 'Ghislaine de Féligonde' mit altem Stamm freigelegt, die seit Jahren keiner mehr gesehen hat; sie hat die jungen Triebe lose mit Bast angebunden."
        from: ch05/s02
      - text: "Lena hat Jonas den ganzen Tag gesiezt und ihn um fünf gefragt, ob er nächsten Samstag Zeit hat; er hat Ja gesagt."
        from: ch05/s03
      - text: "Grete hat Jonas zwei Bier aus der Helferkiste gegeben und ihm Quark angeboten; Jonas hat Sonnenbrand im Nacken und zerkratzte Unterarme."
        from: ch05/s03
      - text: "Jonas hat als Junge am Steg Flöße gebaut; das letzte ist mitten auf dem See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer; seitdem rechnet er alles zweimal."
        from: ch05/s03
      - text: "Sie und Jonas haben sich am Steg geküsst; er wollte das seit dem Gewitter, sie auch."
        from: ch05/s03
      - text: "Auf ihre Frage, ob er im Herbst noch hier ist, hat Jonas gesagt, er wisse es nicht."
        from: ch05/s03
      - text: "Ende Juli sind die Gallica und die Damaszener am Tor verblüht und werden zurückgeschnitten; die 'New Dawn' schiebt schon wieder feste kleine Knospen, am Laubengang stehen junge Dahlien."
        from: ch06/s01
      - text: "Bis zum 2. September wusste niemand außer ihr von den Stecklingen, weder Lena noch Grete noch Jonas."
        from: ch06/s01
      - text: "Grete hat Ende Juli mittags Buttermilch und Johannisbeerkuchen auf die Bank gestellt, lange von ihr zu Jonas gesehen und ist ohne ein Wort zurückgegangen; auf der Treppe nahm sie jede Stufe einzeln."
        from: ch06/s01
      - text: "Lena hat Jonas für Samstag schon eingetragen, mit Ankunft und Abfahrt (von Jonas)."
        from: ch06/s01
      - text: "Jonas hat ihr abends geschrieben, ob sie morgen wiederkommt."
        from: ch06/s01
      - text: "Sie hat Jonas am 14. August in den Winkel hinter dem letzten Bogen geführt und ihm die Lindenhof-Rose gezeigt: Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock; Jonas ist stumm geblieben."
        from: ch07/s02
      - text: "Jonas hat ihre von den Dornen zerkratzten Finger geküsst, einen nach dem anderen."
        from: ch07/s02
      - text: "Laut Hannes war am Freitag, dem 14. August, Jonas' Antwort zum Fest fällig; davon hatte ihr niemand etwas erzählt."
        from: ch07/s02
      - text: "Jonas hat Hannes gesagt, das Fest finde dieses Jahr auf dem Gut statt; sie ist ihm um den Hals gefallen, seine Arme kamen einen Atemzug später als sonst und hielten sie fester als nötig."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, später Nachmittag, blühen die ersten Astern, und die 'New Dawn' über der Bank steht in zweiter Blüte."
        from: ch08/s01
      - text: "Hedwigs Gartenbuch fehlt auf seinem Platz am Fenster im Arbeitszimmer; neben der grünen Lampe liegt nur die Lupe."
        from: ch08/s01
      - text: "In einer Schublade von Hedwigs Schreibtisch lag unter Papieren eine Mappe von Weidenkamp Hotels, der Firma des Mannes, der im Juli den Garten ein Pfund genannt hat."
        from: ch08/s01
      - text: "Im Lageplan der Mappe reichen die grauen Stellplätze bis an den Backstein, bis in den Winkel hinter dem letzten Bogen, genau über der Lindenhof-Rose; ein Kästchen liegt über der Sonnenuhr."
        from: ch08/s01
      - text: "Jonas hat den Vorvertrag am Donnerstag, dem 13. August, unterschrieben, gerade und ohne Zögern, am Tag bevor er Hannes die Zusage gab."
        from: ch08/s01
      - text: "Laut Jonas bietet man ihm im Büro eine Partnerschaft an, für die er bis Monatsende eine Einlage bringen muss; das Dach des Haupthauses (Nordseite, Rinnen) sei schlimmer als die Scheune."
        from: ch08/s01
      - text: "Laut Jonas hat er ein Rücktrittsrecht bis nach dem Fest; er wollte ihr das nicht halb sagen."
        from: ch08/s01
      - text: "Sie hat Jonas gesagt, den Garten hätte sie ihm notfalls hergegeben, nur nicht hinter ihrem Rücken und nicht nach dem Steg, und den Parkplatz habe er ihr nicht erklärt; dann hat sie die Mappe auf den Schreibtisch gelegt und ist gegangen, er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Grete hat ihr in der Küche auf das Wort \"Parkplatz\" gesagt, sie habe so was geahnt; Jonas habe beim Abendessen über die Termine geschwindelt; sie habe gedacht, er sage es Marie selbst."
        from: ch08/s02
      - text: "Grete hat sie um Verzeihung gebeten, ohne Aber und ohne Weil."
        from: ch08/s02
      - text: "Hedwig hat auch Grete gesagt, wen sie sich für den Garten wünscht."
        from: ch08/s02
      - text: "Sie hat Hedwigs Schere mit dem roten Griff wieder im Holster; Grete hat ihr eine Ecke Probe-Butterkuchen mitgegeben und sie gebeten, die Astern am Rondell zu gießen."
        from: ch08/s02
      - text: "Sie hat Lena in der Nacht vom Lageplan, von Jonas' Unterschrift, vom Steg, vom \"dieses Jahr\" und von Hedwigs Wunsch erzählt; Lena will morgen früh Hannes anrufen, sie hat gesagt, das sei ihre Sache, nicht die vom Dorf."
        from: ch08/s03
      - text: "Am Mittwoch, dem 2. September, kurz nach fünf, haben beide Stecklinge der Lindenhof-Rose im Hinterhof der alten Schmiede in Klein Lindau getrieben; feine weiße Wurzeln halten den Ballen bis an den Rand."
        from: ch09/s02
      - text: "Den kräftigeren Steckling hat sie in einer Kiste mit Zeitungspapier im Kastenwagen zum Gut gebracht; der andere steht weiter unter Folie in Klein Lindau."
        from: ch09/s02
      - text: "Am Morgen des 2. September fehlte Jonas' Kombi auf dem Gutshof."
        from: ch09/s02
      - text: "An den Damaszenerrosen am Rondell leuchten die Hagebutten orangerot und prall; sie hat die Kanten ohne Schnur nachgestochen, am Laubengang die verblühten Dahlien ausgeputzt und das Lindenlaub vom Kies geharkt."
        from: ch09/s02
      - text: "Gegen sieben hat Grete ihr Kaffee mit Milch und Butterkuchen auf die Bank unter der Kletterrose gestellt und nichts gefragt; sie hat Grete gesagt, der Kuchen sei nicht zu süß und die Mandeln saftig, da habe Hannes nichts zu meckern."
        from: ch09/s02
      - text: "Am alten Stock der Lindenhof-Rose hat sich die Knospe aus dem August geöffnet: eine einzige Blüte, zartrosa und gefüllt, mit schwerem Duft."
        from: ch09/s02
      - text: "Sie hat den Steckling eine Handbreit neben den alten Stock gepflanzt, in ein Loch doppelt so tief wie der Topf, und angegossen; über diesem Winkel liegt im Lageplan ein graues Kästchen."
        from: ch09/s02
      - text: "Am Nachmittag hat Hannes hellen Kies fürs Rondell gebracht, sie haben zusammen geschaufelt; Hannes hat den Steckling gesehen, die Mütze abgenommen und gesagt, sie solle weitermachen und ihn jeden Morgen gießen."
        from: ch09/s02
      - text: "Auf ihre Frage, woher er das wissen wolle, hat Hannes an ihr vorbeigesehen, zur Mauer, zu den Dahlien, in den Himmel, und nur \"Weiß man eben\" gesagt."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie das Rondell ein letztes Mal geharkt; die Blüte der Lindenhof-Rose ist an den Rändern schon müde, und der Steckling vom Mittwoch treibt an der Spitze ein neues rötliches Blatt. Sie hat ihn gegossen, wie Hannes geraten hat."
        from: ch10/s01
      - text: "Grete hat ihr in der dunkelblauen Bluse mit Hedwigs Brosche Kaffee mit Milch gebracht und gesagt, die zwei Astern am Rondell fehlten nur ihr; über Jonas hat Grete kein Wort gesagt, sie hat nicht gefragt."
        from: ch10/s01
      - text: "Laut Anke sagt Grete, der Garten habe seit Jahren nicht so ausgesehen; Hannes hat am Festmorgen schon um fünf in Weste in der Küche gestanden."
        from: ch10/s01
      - text: "Im Umzug durch die Lindenallee fuhr Jonas in weißem Hemd Hedwigs alten Trecker mit der Erntekrone vorn, Hannes in Weste mit Ehrennadel neben dem Vorderrad; der Motor am Morgen in der Remise war dieser Trecker. Jonas hat sie am Rand gefunden und ihr ernst zugenickt."
        from: ch10/s01
      - text: "Lena hat für das Fest an der Rückwand der Scheune eine Fotowand aufgehängt, mit Fotos aus dem Album der Petersens, aus Hedwigs Schublade und aus Hannes' Ausschusskiste, für sie und für Hedwig; darum lagen die Fotos auf Lenas Küchentisch."
        from: ch10/s02
      - text: "Auf einem verblichenen Abzug steht Hedwig an der Gartenmauer, daneben Jonas als dünner barfüßiger Junge, oben auf den Backsteinen sie selbst als Mädchen mit Zopf im rot-weiß gepunkteten Kleid."
        from: ch10/s02
      - text: "Nicht der Junge, sondern sie selbst stand damals oben auf der Mauer, er unten im Beet; er war auf einen Rosenstock getreten, und sie hat ihn beschimpft, er habe Füße wie ein Ochse und keinen Verstand dazu. Jonas hat das Tante Hedwig mit Zeichnung geschrieben; der Brief lag in Gretes Keksdose, er hat ihn wiedergefunden."
        from: ch10/s02
      - text: "Jonas hat ihr in der Scheune gesagt, sie müsse etwas zuerst hören, vor allen anderen; sie hat Lena gesagt, das sei ihre Sache, und ist für fünf Minuten mit ihm unter die Kletterrose gegangen."
        from: ch10/s02
      - text: "Jonas ist am Dienstag vom Vorvertrag zurückgetreten und trägt die Kosten selbst; in Hamburg hat er die Partnerschaft persönlich abgesagt."
        from: ch10/s03
      - text: "Laut Jonas arbeitet er künftig drei Tage die Woche von hier, macht das Dach in Abschnitten, das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus, und er bleibt."
        from: ch10/s03
      - text: "Jonas hat ihr gesagt, dass er sie liebt."
        from: ch10/s03
      - text: "Sie hat Jonas gesagt, sein Schweigen habe wehgetan und er habe auch den Rücktritt allein beschlossen; sie will den Garten an seiner Seite führen, nicht in seinem Auftrag, und er soll sie vorher in seine Entscheidungen hineinnehmen. Er hat ohne Zögern Ja gesagt und gefragt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Sie hat Jonas von Hedwigs Wunsch auf der Bank erzählt und ihm den Steckling neben dem alten Stock gezeigt, aus ihrem Hinterhof, seit Juni; der zweite steht noch unter der Folie."
        from: ch10/s03
      - text: "In Hedwigs Gartenbuch steht laut Jonas: Erster Steckling, Jonas hat das Loch gegraben und gegossen; er hat ihn danach jeden Morgen mit dem Lineal gemessen, irgendwo hier."
        from: ch10/s03
      - text: "Sie hat Jonas im Winkel hinter dem Laubengang geküsst; am Abend hat sie mit ihm barfuß auf dem Kies getanzt, er ist ihr zweimal auf die Zehen getreten."
        from: ch10/s03
      - text: "Lena hat Jonas beim Tanz die Hand gegeben und ihn geduzt (\"Willkommen, Jonas\"); Hannes hat mit Grete getanzt."
        from: ch10/s03
    believes:
      - text: "Splitt würde den alten Kies des Hauptwegs zerstören."
        from: ch01/s01
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Ihr Herzklopfen neben Jonas kam nicht vom Wetter."
        from: ch05/s03
      - text: "Die Stubben dürfen nur langsam gezogen werden, sonst reißt der Ballen die 'Rosa Mundi' mit."
        from: ch03/s02
      - text: "Der Rosengarten ist keine Fläche, sondern ein Garten aus den Dreißigerjahren, mit diesen Wegen und dieser Mauer."
        from: ch04/s01
      - text: "Grete hat Steinhagen absichtlich keinen Kuchen hingestellt."
        from: ch04/s01
      - text: "Lena hat Jonas gegenüber ihren Vertreterton."
        from: ch05/s01
      - text: "Glanz im September ist etwas anderes als das Junibild: Nachblüte, Stauden und Dahlien."
        from: ch06/s01
      - text: "Jonas schreibt vom Hügel hinter der Scheune, weil aus Haus und Garten keine Nachricht durchkommt."
        from: ch06/s01
      - text: "Jonas' Schweigen vor der Lindenhof-Rose im August war keine Rührung; diesmal weiß sie, was seine Stille heißt."
        from: ch10/s03
      - text: "Sie ist Grete nicht böse, sondern sich selbst."
        from: ch08/s02
      - text: "Ihr eigenes Herz hat sie nicht so verteidigt wie einen Garten."
        from: ch08/s02
      - text: "Den Garten will sie, seit Hedwig ihre Hand genommen hat."
        from: ch08/s03
      - text: "Hannes hat am Mittwoch gewusst, was Jonas ihr unter der Kletterrose gesagt hat; daher die Weste um fünf."
        from: ch10/s03
      - text: "Jonas bleibt und meint es ernst."
        from: ch10/s03
      - text: "Sie ist angekommen."
        from: ch10/s03
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor gesehen hat."
      - "Wie hoch Hedwigs Geldvermächtnis für die Gartenarbeit ist."
      - "Dass der Makler am letzten Freitag im Juli einen Fotografen für Fotos vom Garten schicken wollte."
      - "Dass die Partner Jonas am 13. August um neun in Hamburg sprechen wollten und er stattdessen vom Hügel telefoniert hat."
      - "Dass Jonas sie vom Hügel hinter der Scheune beobachtet hat, zuletzt am Morgen des 13. August, als sie am Tor Töpfe auslud, und dann auf der anderen Seite zum Kombi gegangen ist."
      - "Dass das Rücktrittsrecht genau bis zum 10. September lief."
      - "Dass der Rücktritt Jonas 38.000 Euro für Notar und Planung kostet, aus dem Ersparten, das für die Einlage gedacht war."
      - "Dass die Partner Jonas die Einlage bis nach dem Fest gestundet hatten."
      - "Dass Grete Jonas Hedwigs Keksdose gegeben hat und was außer dem Brief mit der Zeichnung darin lag (Kinderbriefe, Postkarten)."
      - "Dass Jonas geglaubt hat, bis zum Ende der Rücktrittsfrist müssten sie und Grete nichts wissen."
      - "Was Steinhagen und Jonas auf der Terrasse und im Salon besprochen haben: rund zwanzig Zimmer, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg."
      - "Dass laut Plan nur ein paar Rosen als Akzent in Kübeln bleiben sollten."
      - "Dass Weidenkamp für Gretes freiwilligen Auszug eine Abfindung vorsah."
      - "Ob Jonas wusste, dass der Parkplatz die Lindenhof-Rose trifft."
      - "Wo Hedwigs Gartenbuch geblieben ist."
      - "Dass Jonas für einen Gutachter zur Wertermittlung die Rechnungen für Dach und Fenster gesucht hat."
      - "Dass Lena Jonas im Hofladen gewarnt hat, sie sei keine, mit der man einen Sommer spielt."
      - "Dass Hannes Jonas die Frist des Ausschusses schon Anfang August am Hoftor des Hansen-Hofs genannt hat."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendt ist der Eigentümer des Guts; dessen Makler hat ihm Jonas' Nummer gegeben."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Namen von Marie Albers, Hannes Kröger und Grete Paulsen."
        from: ch04/s01
      - text: "Marie sagt, der Garten sei in den Dreißigerjahren angelegt, und die 'Rosa Mundi' sei älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes sorgt sich, wo das Erntefest bleibt, wenn das Hotel kommt."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg, Parkplatz auf dem Rosengarten mit ein paar Rosen in Kübeln."
        from: ch04/s02
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht; Weidenkamp sieht für einen freiwilligen Auszug eine großzügige Abfindung vor."
        from: ch04/s02
      - text: "Jonas hat die Abfindung im Juli großzügig genannt, nicht widersprochen und damals weder zu- noch abgesagt; die Unterlagen hat er Jonas dagelassen."
        from: ch04/s02
      - text: "Jonas hat am Donnerstag, dem 13. August, im Notariat in der Kreisstadt in seinem Beisein den Vorvertrag mit Weidenkamp unterschrieben, mit dem Kugelschreiber mit Firmenlogo, den Jonas ihm zurückgeschoben hat."
        from: ch07/s01
      - text: "Der Vorvertrag enthält ein Rücktrittsrecht bis zum 10. September."
        from: ch07/s01
      - text: "Jonas wollte im Notariat nur Wasser, keinen Kaffee."
        from: ch07/s01
      - text: "Am Dienstag, dem 1. September, früh hat Jonas ihn angerufen und das Rücktrittsrecht gezogen; wie im Vorvertrag vereinbart trägt Jonas die Kosten für Notar und Planung selbst, achtunddreißigtausend Euro."
        from: ch09/s01
      - text: "Die Gruppe hat noch ein zweites Gut im Blick."
        from: ch09/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, kurze Wege, die Mauer gibt Sichtschutz gratis."
        from: ch04/s02
      - text: "Seinem Herrenhaus im Süden fehlt seit dem Verlust des alten Parks etwas, ohne dass er sagen könnte, was."
        from: ch04/s02
      - text: "Der Kaffee im Notariat ist nicht so gut wie der von Frau Paulsen."
        from: ch07/s01
      - text: "Er hat Jonas' Rücktritt fast geahnt, seit dem Notar, als Jonas nur Wasser wollte."
        from: ch09/s01
      - text: "Behält Jonas das Haus, fehlt ihm wenigstens nichts."
        from: ch09/s01
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden, ihn Jonas gezeigt hat und Stecklinge davon zieht."
      - "Hedwigs Wunsch, dass der Rosengarten zum Erntefest wieder blüht."
      - "Dass Grete ihm den Kaffee absichtlich ohne Kuchen hingestellt hat."
      - "Dass Jonas Marie nur gesagt hat, er sei ein Interessent, und ihr und Grete vom Vorvertrag nichts sagen wollte."
      - "Dass Marie den Vorvertrag am 27. August in Hedwigs Schreibtisch gefunden hat und Grete und Lena nun vom Parkplatz wissen."
      - "Dass das Dorf beim Helfersamstag den Rosengarten gemeinsam hergerichtet hat und Jonas mitgearbeitet hat."
      - "Dass an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt wurde."
      - "Dass Marie und Jonas sich am Steg geküsst haben."
      - "Dass Jonas laut Hedwigs Gartenbuch als Kind den ersten Steckling der Lindenhof-Rose mitgepflanzt hat, an einer Stelle, über der nun ein Stellplatz des Lageplans liegt."
      - "Dass Jonas Hannes zugesagt hat, das Fest finde auf dem Gut statt, und am 1. September, es bleibe dort auf Dauer."
      - "Dass Jonas die Anzahlung als Sicherheit für seine Einlage bei den Partnern im Büro brauchte und die Partnerschaft abgesagt hat."
      - "Dass Jonas beim Erntefest Hedwigs Trecker vorn im Umzug gefahren ist und auf dem Gut bleibt."
      - "Warum Jonas zurückgetreten ist."
