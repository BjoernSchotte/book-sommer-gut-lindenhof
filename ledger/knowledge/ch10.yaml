based_on: ["ch09#102b7f", "ch10/s01#7366a9", "ch10/s02#b93375", "ch10/s03#b5a114"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch lag im Arbeitszimmer, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf der Treppe liegen lassen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Marie hat den Auftrag, den Garten bis zum Fest fertig zu machen, und sagt, Jonas wolle verkaufen."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag morgens Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Marie hat als Kind jeden Dienstag und Freitag bei Hedwig im Garten gearbeitet, eine Stunde Unkraut für ein Stück Streuselkuchen; sie selbst hat auf der Rückseite vom Kalender Buch geführt."
        from: ch03/s01
      - text: "Marie nimmt Milch in den Kaffee; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Sie hat Jonas das Mittagessen ohne ein Wort hingestellt."
        from: ch03/s03
      - text: "Ein Gast, Ralf Steinhagen, kam Mitte Juli im silbernen Firmenwagen aufs Gut, sprach sie mit Namen an und sagte, Jonas habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Jonas und Steinhagen auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen, obwohl sie am Morgen Butterkuchen gebacken hatte."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kamen Helfer zum Arbeitseinsatz in den Garten; sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt, damit diesmal keiner mit leerem Teller dastand, und eine zweite Kanne Kaffee gebracht."
        from: ch05/s01
      - text: "Jonas hat beim Arbeitseinsatz mitgearbeitet; auf seine Frage, ob er als Helfer zählt, hat sie ihm zwei Flaschen Bier aus der Helferkiste gegeben und die Kronkorken gleich mit abgemacht."
        from: ch05/s03
      - text: "Jonas hat Sonnenbrand im Nacken; sie hat ihm Quark angeboten."
        from: ch05/s03
      - text: "An einem Dienstag Ende Juli hat sie mittags Buttermilch und ein Blech Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, wo Marie und Jonas arbeiteten, hat von Marie zu Jonas und zurück gesehen und ist ohne ein Wort zum Haus zurückgegangen."
        from: ch06/s01
      - text: "Marie hat das Gartenbuch im Arbeitszimmer gelassen; sie hat Jonas darauf hingewiesen und ihm gesagt, er könne ruhig hineinsehen, Hedwig hätte das gewollt."
        from: ch06/s02
      - text: "Jonas hat an einem Donnerstag spät abends im Arbeitszimmer die Rechnungen fürs Dach gesucht; auf ihre Frage hat er gesagt, er habe die Dachrechnungen gefunden."
        from: ch06/s02
      - text: "Jonas hat sich angeboten, ihren Einkauf (Eier, Rosengelee, Kartoffeln, Rindfleisch) Montag Anfang August im Hofladen der Hansens zu holen; sie hat ihm einen Zettel mit „Nicht vergessen zu bezahlen“ mitgegeben."
        from: ch06/s03
      - text: "Lena macht für sie seit Jahren montags den Hofladen auf."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet, ob der wiedergekommen ist; das hat sie Jonas gesagt, als sie ihm am Donnerstag, dem 13. August, Bratkartoffeln mit Spiegelei hinstellte."
        from: ch07/s01
      - text: "Jonas hat ihr gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes; sie hat „Na, denn, Jung“ geantwortet."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank im Garten gebracht, Maries Kaffee mit Milch, und Jonas einen Augenblick zu lange angesehen."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, gegen Abend hat sie in der Küche Probe-Butterkuchen fürs Erntefest gebacken; Hannes sagt, letztes Jahr seien sie zu trocken gewesen."
        from: ch08/s02
      - text: "Marie kam an diesem Abend aufgewühlt in die Küche und sagte ihr nur ein Wort: „Parkplatz.“ Es gibt also einen Plan mit einem Parkplatz, der mit dem Verkauf zu tun hat."
        from: ch08/s02
      - text: "Sie hat Marie um Verzeihung gebeten, weil sie Jonas' Schwindeln bemerkt und nichts gesagt hat."
        from: ch08/s02
      - text: "Hedwig hat ihr gesagt, wen sie sich für den Garten wünscht; Marie weiß das auch, sie hat genickt."
        from: ch08/s02
      - text: "Marie hat geweint; sie hat ihr eine heiße Ecke Butterkuchen in Papier mitgegeben und sie gebeten, die Astern am Rondell zu gießen."
        from: ch08/s02
      - text: "Am Montag, dem 31. August, hat Jonas ihr in der Küche gesagt: „Ich fahr morgen früh nach Hamburg.“"
        from: ch09/s01
      - text: "Sie hat Jonas an diesem Abend Hedwigs alte blaue Keksdose aus dem Fach unter der Fensterbank gegeben: „Hedwig hat alles aufgehoben. Lies das, Jung. Was du dann machst, ist deine Sache.“ Über Marie hat sie kein Wort gesagt."
        from: ch09/s01
      - text: "Maries Wagen stand seit Donnerstag nicht am Gut; am Mittwoch, dem 2. September, stand er früh am Tor, und Marie arbeitete im Garten."
        from: ch09/s02
      - text: "Sie hat Marie gegen sieben einen Becher Kaffee mit Milch und einen Teller Butterkuchen auf die Bank unter der Kletterrose gestellt; Marie sagte, der Kuchen sei nicht zu süß, die Mandeln saftig, da habe Hannes nichts zu meckern, das habe sie ihr schon am Freitag sagen wollen."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie Marie im Garten Kaffee mit Milch gebracht, in der guten dunkelblauen Bluse mit Hedwigs blank geputzter Brosche am Kragen; Marie meinte, am Rondell fehlten noch zwei Astern, und sie hat ihr gesagt, sie solle sich was Schönes anziehen. Über Jonas hat sie kein Wort gesagt."
        from: ch10/s01
      - text: "Für das Fest hat sie Bleche mit Butterkuchen mit Mandeln und Bienenstich auf Lenas Tresen in der Scheune gestellt; an der Rückwand hängen Fotos, auch von ihr mit Hedwig am Kuchentisch."
        from: ch10/s02
      - text: "Sie hat von der Kaffeemaschine aus Marie und Jonas zusammen vor den Fotos stehen sehen."
        from: ch10/s02
      - text: "Am Abend hat Hannes sie im Garten unter den Lampions zum Tanz aufgefordert, die Mütze in der Hand; sie hat mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Hedwigs Wunsch im Testament gilt Marie, auch wenn ihr Name nicht drinsteht."
        from: ch01/s03
      - text: "Der Verkauf ist Jonas' Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Hedwig hätte gewollt, dass Jonas in ihr Gartenbuch sieht."
        from: ch06/s02
      - text: "Jonas hat am 13. August über die Termine in der Stadt geschwindelt; er hat dabei die ganze Zeit sein Spiegelei angeguckt, und seit er klein war, sieht sie ihm an, wenn er schwindelt."
        from: ch08/s02
      - text: "Sie hat so etwas geahnt, das Wort nicht, aber so etwas; diesmal wollte sie es nicht wissen."
        from: ch08/s02
      - text: "Jonas hätte es Marie selbst sagen sollen; sie hat gedacht, er tut es."
        from: ch08/s02
      - text: "Was Jonas nach dem Lesen der Dose macht, ist seine Sache."
        from: ch09/s01
      - text: "Die Deern hat mehr Ausdauer als der Giersch."
        from: ch09/s02
      - text: "Der Garten ist fertig, da kann das Dorf kommen; die zwei Astern fehlen nur Marie. So hat er seit Jahren nicht ausgesehen (so gibt Anke sie wieder)."
        from: ch10/s01
      - text: "Tanzen ist in ihrem und Hannes' Alter eigentlich nicht klug."
        from: ch10/s03
    does_not_know:
      - "Dass Marie in ihrem Hinterhof in Klein Lindau seit Juni Stecklinge der Lindenhof-Rose gezogen und einen davon am 2. September neben den alten Stock in der Mauerecke gepflanzt hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Dass Hedwig Marie ihren Wunsch im letzten Herbst auf der Bank unter der 'New Dawn' selbst gesagt hat."
      - "Welche Bedingungen Marie und Jonas auf der Terrasse ausgehandelt haben (freie Hand bei den Rosen, Budgetrahmen, Fotos alle zwei Wochen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' entsorgen wollte und sie nun mit Punktfundamenten stehen bleiben sollen."
      - "Dass der Makler Ende Juli Fotos vom Garten wollte."
      - "Dass Jonas Steinhagens Besichtigung vorher am Telefon zugesagt hat."
      - "Was im Salon besprochen wurde: Hotelplan von Weidenkamp, Abfindung, falls sie freiwillig auszieht."
      - "Dass der Parkplatz im Lageplan auf dem Rosengarten liegt und die Stellplätze bis in die Ecke hinter dem Laubengang reichen."
      - "Dass Jonas an der Südmauer eine alte 'Ghislaine de Féligonde' unter den Brombeeren freigelegt hat."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
      - "Dass ein Gutachter zur Wertermittlung kommen sollte."
      - "Dass Jonas im Gartenbuch Hedwigs Notiz über seinen ersten Steckling der Lindenhof-Rose gelesen hat."
      - "Dass Lena Jonas im Hofladen gewarnt hat, mit Marie keinen Sommer zu spielen."
      - "Dass der Ausschuss bis Freitag, den 14., eine Zusage zum Erntefest auf dem Gut verlangt hatte, sonst wäre im Zelt hinter dem Feuerwehrhaus gefeiert worden."
      - "Dass Jonas' Partner ihm die Einlage für die Partnerschaft bis nach dem Fest gestundet haben."
      - "Dass Jonas am Donnerstag, dem 13. August, im Notariat in der Kreisstadt mit Steinhagen einen Vorvertrag mit Weidenkamp unterschrieben hat, mit Rücktrittsrecht bis zum 10. September."
      - "Dass die Mappe mit Vorvertrag und Lageplan in Hedwigs Schreibtisch lag und Marie sie dort gefunden hat."
      - "Dass Jonas Hannes am Freitag, dem 14. August, zugesagt hat, dass das Erntefest dieses Jahr auf dem Gut stattfindet."
      - "Dass Marie in der Nacht zu Lena gegangen ist und ihr alles erzählt hat."
      - "Wo Marie seit Donnerstag gewesen ist."
      - "Dass Jonas am Dienstag, dem 1. September, vom Hügel aus das Rücktrittsrecht gezogen hat und die Kosten für Notar und Planung selbst trägt."
      - "Dass Jonas in Hamburg die Partnerschaft im Büro persönlich abgesagt hat."
      - "Dass Jonas Hannes gesagt hat, das Fest bleibe auf dem Gut, nicht nur dieses Jahr."
      - "Dass Jonas nachts auf der Freitreppe einen Plan fürs Dach gemacht hat: Nordseite Herbst, Südseite nächstes Jahr, Rinnen selbst; Büro zwei Tage, drei hier."
      - "Was Jonas Marie auf der Bank unter der Kletterrose gesagt hat: dass er bleibt, drei Tage die Woche von hier arbeitet, das Fest jedes Jahr auf dem Gut bleibt, ihr Haus ihr Haus bleibt und dass er Marie liebt."
      - "Dass Marie Jonas ihre Bedingungen gestellt hat (an seiner Seite, nicht in seinem Auftrag; Entscheidungen vorher, nicht hinterher) und er Ja gesagt hat."
  hannes-kroeger:
    knows:
      - text: "Jonas Behrendt ist der Herr auf dem Gut; er hat ihn mit Herr Behrendt angesprochen und Kaffee von ihm bekommen."
        from: ch03/s02
      - text: "Der Hauptweg im Rosengarten ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Rings um die Sonnenuhr sitzen alte Holunderstubben und an der Westseite ein Brombeerwurzelstock, der mit dem Spaten nicht herauszubekommen ist."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben entfernt; Marie will, dass langsam und nach Norden zum Tor hin gezogen wird."
        from: ch03/s02
      - text: "Mit derselben Kette hat er für Hedwig den Fliederbusch an der Remise herausgeholt."
        from: ch03/s02
      - text: "Jonas kann nicht sagen, ob das Erntefest auf dem Gut bleibt; es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Er hat zugesagt, Sonnabend um halb acht den Trecker zu bringen."
        from: ch03/s02
      - text: "Er bringt mit dem Hänger Kies für die Hauptachse; noch zwei Fuhren, dann ist Marie an der Sonnenuhr."
        from: ch04/s01
      - text: "Der Besucher ist Ralf Steinhagen von Weidenkamp Hotels."
        from: ch04/s01
      - text: "Steinhagen hat die Fläche hinter dem Haus vor Jonas „ein Pfund“ genannt."
        from: ch04/s01
      - text: "Auf seine Frage nach dem Erntefest hat Steinhagen eine Veranstaltungsfläche gegen Gebühr angeboten, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Zum Arbeitseinsatz am Samstag Mitte Juli kam er kurz nach sechs mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine; Timo brachte mit dem zweiten Gespann Kies für die Seitenwege."
        from: ch05/s01
      - text: "Jonas kam in geliehenen, eine Nummer zu großen Gummistiefeln zum Mitarbeiten; er hat ihn zu den Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Er hat vor allen gesagt: Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "Jonas ist als Kind, der Lütte von Hedwig, barfuß auf seinem Hänger über die Stoppeln nach der Gerste mitgefahren; Hedwig hat geschimpft und ihn mit Kuchen vom Hänger gelockt."
        from: ch05/s02
      - text: "Jonas erinnert sich noch an den Diesel der Hängerfahrt."
        from: ch05/s02
      - text: "Nach der letzten Fuhre am späten Nachmittag liegt die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen frei."
        from: ch05/s02
      - text: "Er hat Jonas die Hand gegeben, ihn Jonas genannt und geduzt: „Gut gemacht, Jonas.“"
        from: ch05/s02
      - text: "Der Ausschuss hat am Abend vor dem Montag Anfang August gesessen: Bis Freitag, den vierzehnten, braucht er von Jonas eine Zusage, auf die man bauen kann, sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert; das Zelt ist schon reserviert."
        from: ch06/s03
      - text: "Er hat Jonas das Montag Anfang August am Hoftor des Hansen-Hofs gesagt, als Jonas Gretes Kiste in den Kofferraum trug; Jonas hat geantwortet: „Bis dahin kriegst du eine Antwort.“"
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, nachmittags hat er Jonas am Gartentor gesagt, heute sei die Antwort fällig; Jonas hat geantwortet: „Das Fest findet dieses Jahr auf dem Gut statt.“"
        from: ch07/s02
      - text: "Marie ist Jonas nach der Zusage am Tor um den Hals gefallen."
        from: ch07/s02
      - text: "Am Dienstag, dem 1. September, früh am Fuß des Hügels hat Jonas ihm gesagt: „Das Fest bleibt auf dem Gut, Hannes. Nicht nur dieses Jahr. Nächstes auch, und danach.“ Darauf bestellt er das Zelt ab."
        from: ch09/s01
      - text: "Er hat Jonas gesagt, Samstag fahre er vorn, mit Hedwigs altem Trecker, den er im Frühjahr gemacht hat; Jonas ist noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Jonas hat ihn gebeten, Marie nichts zu sagen, das müsse er selbst."
        from: ch09/s01
      - text: "Am Nachmittag des 2. September hat er hellen Kies fürs Rondell gebracht und mit Marie geschaufelt; neben dem alten Stock in der Mauerecke steht in frischer Erde ein Steckling mit rötlichen Blättern, die offene Blüte darüber."
        from: ch09/s02
      - text: "Marie hat ihm gesagt, was nach dem Fest mit dem Garten wird, sage ihr keiner, Jonas am wenigsten."
        from: ch09/s02
      - text: "Beim Umzug am 5. September ist Jonas in weißem Hemd Hedwigs alten Trecker mit der Erntekrone vorn durch die Lindenallee gefahren; er selbst ging in Weste mit Ehrennadel neben dem Vorderrad, die Mütze in der Hand, wie früher neben Hedwig. Das Dorf hat geklatscht."
        from: ch10/s01
      - text: "Am Abend hat er im Garten unter den Lampions Grete zum Tanz aufgefordert; sie hat gefragt, ob er nicht klug sei, in ihrem Alter, und dann doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Im Garten läuft es gut („Dat löppt, Deern“)."
        from: ch03/s02
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Die Frist ist keine Drohung; die Leute wollen wissen, wo sie ihre Bänke hinstellen."
        from: ch06/s03
      - text: "Das Erntefest bleibt dauerhaft auf dem Gut, nicht nur dieses Jahr."
        from: ch09/s01
      - text: "Man redet nicht für andere; Jonas soll Marie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Marie soll weitermachen und den Steckling jeden Morgen gießen."
        from: ch09/s02
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Jonas am Donnerstag, dem 13. August, im Notariat einen Vorvertrag mit Weidenkamp unterschrieben hat, Rücktrittsrecht bis zum 10. September."
      - "Dass Jonas am 1. September das Rücktrittsrecht gezogen hat und 38.000 Euro für Notar und Planung selbst trägt."
      - "Dass Marie den Vorvertrag am 27. August in Hedwigs Schreibtisch gefunden hat und Jonas' „dieses Jahr“ seither als Zusage nur für dieses eine Jahr hörte."
      - "Dass der alte Stock in der Mauerecke die letzte Lindenhof-Rose ist und der Steckling aus Maries Hinterhof in Klein Lindau stammt."
      - "Was im Salon besprochen wurde: Hotelplan, Parkplatz auf dem Rosengarten, Abfindung für Grete."
      - "Dass Jonas beim Graben an der Südmauer an den Lageplan dachte, dessen Parkplatz genau dort liegt."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
      - "Dass ein Gutachter zur Wertermittlung aufs Gut kommen sollte."
      - "Dass Jonas' Partner ihm die Einlage bis nach dem Fest gestundet haben und Jonas die Partnerschaft in Hamburg abgesagt hat."
      - "Dass Lena ihn am Morgen nach dem 27. August anrufen wollte."
      - "Was Jonas Marie auf der Bank unter der Kletterrose gesagt hat und dass Marie ihm ihre Bedingungen gestellt hat."
  jonas-behrendt:
    knows:
      - text: "Die Frau im Garten heißt Marie Albers."
        from: ch01/s01
      - text: "Die Rose am Hauptweg ist eine 'New Dawn', kein Gestrüpp."
        from: ch01/s01
      - text: "Das Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Sieben Fenster im Erdgeschoss zur Gartenseite sind undicht, zwei Flügel verzogen; für das Dach fehlt noch ein Angebot."
        from: ch01/s02
      - text: "Marie hat den Auftrag angenommen: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Marie rechnet nach ihrem eigenen, nicht verhandelbaren Stundensatz ab."
        from: ch01/s02
      - text: "An den Rankbögen an der Ostmauer hängt seit zweiundfünfzig Jahren eine Rose."
        from: ch02/s01
      - text: "Abmachung mit Marie: Die Bögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief), er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg vom Tor bis zur Pforte bis Ende Juni freizumachen, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Donnerstag um neun Uhr ist die Abnahme des Parkdecks in Hamburg, dort wird er gebraucht."
        from: ch02/s02
      - text: "Seine Einlage für die Partnerschaft im Büro steht an."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben, dann seien andere Zahlen drin; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Der Makler will am letzten Freitag im Juli einen Fotografen für Fotos vom Garten schicken."
        from: ch02/s02
      - text: "Der Hügel hinter der Scheune ist der einzige Platz am Gut mit Netz."
        from: ch02/s02
      - text: "Er erinnert sich an ein Floß am Gutssee und an Hedwig, die ihn zum Kuchen rief."
        from: ch02/s02
      - text: "Die Bögen der 'Ghislaine' stehen seit einer Woche mit jedem Fuß im Beton und geben beim Rütteln nicht nach."
        from: ch03/s01
      - text: "Marie und er sagen seit dem Gewitter unter dem Laubengang Du zueinander."
        from: ch03/s01
      - text: "Marie hat mit zehn ihren ersten Rosenschnitt im Garten gemacht, Hedwig hat ihr die Hand geführt; als Kind kam sie dienstags und freitags für Gretes Streuselkuchen, im ersten Sommer jeden Tag mit dem Rad."
        from: ch03/s01
      - text: "Marie hat von Hedwig eine alte Schere mit rotem Griff geschenkt bekommen und benutzt sie heute noch."
        from: ch03/s01
      - text: "Hedwig hat laut mit den Rosen geredet, und Marie tut es auch."
        from: ch03/s01
      - text: "Die verwitterte Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt Milch in den Kaffee (von Grete)."
        from: ch03/s02
      - text: "Hannes Kröger hat gefragt, ob das Erntefest auf dem Gut bleibt; er selbst hat keine Zusage gegeben."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker, um die Stubben an der Sonnenuhr herauszuziehen."
        from: ch03/s02
      - text: "Der Kaufinteressent heißt Ralf Steinhagen, Weidenkamp Hotels; er hat Jonas' Nummer vom Makler."
        from: ch03/s03
      - text: "Steinhagen kennt Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Weidenkamp denkt an Zimmer im Haupthaus und in der Scheune und einen kleinen Spa; eine Stellplatzlösung will Steinhagen vor Ort besprechen."
        from: ch03/s03
      - text: "Er hat Steinhagens Besichtigung des Guts am übernächsten Montag, Mitte Juli, zugesagt und eingetragen; Steinhagen schickt eine Bestätigung."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen, verrutschte Pfannen und faulendes Laub in der Rinne."
        from: ch03/s03
      - text: "Steinhagen hat ihn Mitte Juli auf dem Gut besucht; Grete hat beiden auf der Terrasse Kaffee ohne Kuchen eingeschenkt, was sie ihm in all den Kindersommern nie getan hatte."
        from: ch04/s02
      - text: "Steinhagen nannte die Fläche hinter dem Haus „ein Pfund“; Marie hielt dagegen, das sei ein Garten aus den Dreißigerjahren, die 'Rosa Mundi' älter als sie beide zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz am Steg."
        from: ch04/s02
      - text: "Steinhagens Grundrisse, Schnitte und Kostenschätzung nach Gewerken halten seiner Prüfung stand; zwei Balken sind eingeplant, die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Im Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit einer Zufahrt durch das Tor; begründet mit ebenem Grund, kurzen Wegen und der Mauer als Sichtschutz; ein paar Rosen sollen als Akzent in Kübeln bleiben."
        from: ch04/s02
      - text: "Grete hat ein lebenslanges Wohnrecht, das bestehen bleibt; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor, und Steinhagen bittet ihn, das bei Gelegenheit anzusprechen."
        from: ch04/s02
      - text: "Steinhagen hatte ein Herrenhaus weiter im Süden, dessen alter Park für einen Anbau weichen musste; seitdem fehle dem Haus etwas."
        from: ch04/s02
      - text: "Marie hat er auf ihre Frage nach Steinhagen nur gesagt: „Ein Interessent“."
        from: ch04/s02
      - text: "Beim Arbeitseinsatz am Samstag Mitte Juli hat Lena ihn förmlich begrüßt, gesiezt und auf ihrer Liste eingetragen."
        from: ch05/s01
      - text: "Hannes hat ihn in geliehenen Gummistiefeln zu den Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Die nummerierten Parkplatzkästchen des Lageplans liegen genau dort, wo er an der Südmauer gräbt."
        from: ch05/s02
      - text: "Hannes erinnert sich an ihn als Hedwigs Lütten, der barfuß auf seinem Hänger über die Stoppeln mitfuhr und von Hedwig mit Kuchen heruntergelockt wurde; er selbst erinnert sich nur an Diesel und Stroh, nicht an Hannes' Gesicht."
        from: ch05/s02
      - text: "An der Mitte der Südmauer nahe der Pforte wachsen unter den Brombeeren Triebe mit denselben kleinen, glänzenden Blättern wie an den Bögen im Laubengang; Marie sagt, es ist eine 'Ghislaine de Féligonde', die seit Jahren keiner gesehen hat."
        from: ch05/s02
      - text: "Die Südmauer liegt von der Pforte bis zum alten Geräteschuppen frei; Marie hat die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Hannes hat ihm die Hand gegeben, ihn Jonas genannt und geduzt."
        from: ch05/s02
      - text: "Grete hat ihm auf seine Frage, ob er als Helfer zählt, zwei Bier aus der Helferkiste gegeben und ihm Quark für den Sonnenbrand angeboten."
        from: ch05/s03
      - text: "Lena hat ihn um fünf gefragt, ob er nächsten Samstag Zeit hat; er hat Ja gesagt."
        from: ch05/s03
      - text: "Er hat Marie von seinen drei Flößen am See erzählt; das größte ist mitten auf dem See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Marie und er haben sich auf dem Steg geküsst; er hat ihr gesagt, dass er das seit dem Gewitter wollte, und sie hat gesagt: „Ich auch.“"
        from: ch05/s03
      - text: "Marie hat ihn gefragt, ob er im Herbst noch hier ist; er hat geantwortet, dass er es nicht weiß."
        from: ch05/s03
      - text: "Das Junibild kommt zum Fest nicht wieder: Gallica und Damaszener blühen nur einmal und werden jetzt geschnitten, die Büsche am Rondell setzen Hagebutten an; Glanz im September heißt Nachblüte der 'New Dawn', Lavendel, Katzenminze, Frauenmantel, Astern und Dahlien in Reihen am Laubengang (von Marie)."
        from: ch06/s01
      - text: "Lena hat ihn für Samstag schon eingetragen, mit Ankunft und Abfahrt; die Helferliste für den Rosengarten hängt am schwarzen Brett im Hofladen."
        from: ch06/s03
      - text: "Der Gutachter kommt zur Wertermittlung und will jede Rechnung in der Hand haben."
        from: ch06/s02
      - text: "Die Fensterflügel im Arbeitszimmer bleiben nach einer Handbreit stecken."
        from: ch06/s02
      - text: "Er hat im Arbeitszimmer die Dachrechnung „Umdeckung Nordseite“ mit Stempel gefunden."
        from: ch06/s02
      - text: "Grete sagt, Marie habe Hedwigs Gartenbuch im Arbeitszimmer gelassen, dort gehöre es hin, und Hedwig hätte gewollt, dass er hineinsieht."
        from: ch06/s02
      - text: "Im Gartenbuch stehen in Hedwigs Handschrift schraffierte Beete, jede Rose mit Namen und Bemerkung ('Rosa Mundi', Läuse, Brennnesseljauche; die 'Ghislaine' mit Ausrufezeichen)."
        from: ch06/s02
      - text: "Unter „Lindenhof-Rose“ steht, datiert auf einen Juli vor sechsundzwanzig Jahren: „Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen.“"
        from: ch06/s02
      - text: "Er erinnert sich wieder: Hedwig führte seine Hand beim Pflanzen, der Steckling stand im Erdbeer-Joghurtbecher, er maß jeden Morgen barfuß mit dem Lineal, am fünften Tag dreieinhalb, und rannte brüllend zur Küche."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet; zu Weihnachten ein Anruf von zehn Minuten."
        from: ch06/s02
      - text: "Lena macht für Grete seit Jahren montags den Hofladen auf; Frieda hat von Tante Rosen eine Dahlie geschenkt bekommen."
        from: ch06/s03
      - text: "Lena hat ihn gewarnt: Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie und das ganze Dorf ihm das übel; auf seine Frage, ob Marie ihr etwas gesagt habe, verwies sie ihn an Marie."
        from: ch06/s03
      - text: "Der Ausschuss brauchte bis Freitag, den vierzehnten, eine Zusage, auf die man bauen kann, ob das Erntefest auf dem Gut bleibt; sonst hätte das Dorf im schon reservierten Zelt hinter dem Feuerwehrhaus gefeiert."
        from: ch06/s03
      - text: "Am Donnerstag, dem 13. August, kurz nach sieben, hat er vom Hügel hinter der Scheune mit einem Partner telefoniert, statt nach Hamburg zu fahren; der Partner nimmt hin, dass er heute nicht kommt."
        from: ch07/s01
      - text: "Der Dachdecker hat zehn Minuten später zurückgerufen und eine Summe für den Herbst genannt; er hat sie auf den Briefumschlag unter die durchgestrichene Hamburger Uhrzeit geschrieben."
        from: ch07/s01
      - text: "Am Morgen des 13. August hat Marie mit einem weißen Kastenwagen am Tor gehalten und eine Kiste mit Töpfen ausgeladen; er ist auf der anderen Seite des Hügels zum Kombi hinuntergegangen."
        from: ch07/s01
      - text: "Er hat am 13. August im Notariat in der Kreisstadt in Steinhagens Beisein den Vorvertrag mit Weidenkamp unterschrieben; Rücktrittsrecht bis zum 10. September, fünf Tage nach dem Fest."
        from: ch07/s01
      - text: "Steinhagen sagt zum Rücktrittsrecht, gezogen habe so etwas bei ihnen noch nie jemand."
        from: ch07/s01
      - text: "Im Lageplan reicht die graue Fläche der Stellplätze bis an die Mauer, bis in die Ecke hinter dem Laubengang."
        from: ch07/s01
      - text: "Er hat die Mappe mit Vorvertrag und Lageplan unter die Dachrechnungen im untersten Fach von Hedwigs Schreibtisch gelegt, neben das Gartenbuch."
        from: ch07/s01
      - text: "Grete hat ihm gesagt, im Dorf rede man über den Herrn mit dem silbernen Auto; er hat ihr gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes – das war gelogen."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat Marie ihm in der Mauerecke hinter dem letzten Bogen des Laubengangs den alten Stock der Lindenhof-Rose gezeigt: Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock, er trägt eine Knospe, und Marie hat ihn im Juni unter den Brombeeren gefunden."
        from: ch07/s02
      - text: "Er hat Hannes am Nachmittag des 14. August am Gartentor gesagt: „Das Fest findet dieses Jahr auf dem Gut statt.“ Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, am späten Nachmittag hat er Marie im Arbeitszimmer vor der offenen Schublade mit der Weidenkamp-Mappe angetroffen, als er vom Hügel herunterkam; sie hat den Vorvertrag gefunden."
        from: ch08/s01
      - text: "Er hat Marie gesagt, dass es ein Vorvertrag ist, dass das Büro ihm eine Partnerschaft anbietet und er bis Monatsende eine Einlage bringen muss, dass das Haupthaus schlimmer ist als die Scheune und dass er ein Rücktrittsrecht bis nach dem Fest hat."
        from: ch08/s01
      - text: "Marie hat ihm gesagt, den Garten hätte sie ihm notfalls hergegeben, aber nicht hinter ihrem Rücken, nicht nach dem Steg; und den Parkplatz habe er ihr nicht erklärt."
        from: ch08/s01
      - text: "Marie hat den Lageplan mit der grauen Fläche nach oben auf den Schreibtisch gelegt und ist an ihm vorbei aus dem Zimmer gegangen; er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Seit Donnerstag, dem 27. August, stand Maries weißer Kastenwagen nicht mehr am Tor; auf keine seiner vier Nachrichten vom Hügel ist eine Antwort gekommen."
        from: ch09/s01
      - text: "Die Partner haben ihm die Einlage bis nach dem Fest gestundet, weil Weidenkamps Anzahlung noch aussteht."
        from: ch09/s01
      - text: "Grete hat ihm am Montag, dem 31. August, Hedwigs alte blaue Keksdose gegeben, aus der er sich als Kind Butterkekse gestohlen hat: Hedwig hat alles aufgehoben."
        from: ch09/s01
      - text: "In der Dose liegen seine Kinderbriefe in Druckschrift („LIEBE TANTE HEDWIG“) mit der Frage, wie viele Zentimeter der Steckling gewachsen sei, eine Zeichnung von einem Mädchen mit Zopf auf einer Mauer mit seinem Satz „Die hat mit mir geschimpft“ – er war damals zwölf, die Kleine kaum fünf –, Postkarten aus Zeltlager und Klassenfahrt und zuunterst, glattgestrichen, die Karte aus dem Studium: „Nächsten Sommer komm ich bestimmt.“"
        from: ch09/s01
      - text: "Im Sommer nach dieser Karte ist er nicht gekommen, später nur noch zwei-, dreimal für ein Wochenende."
        from: ch09/s01
      - text: "Er hat nachts auf der Freitreppe auf den Briefumschlag geschrieben: „Nordseite Herbst, Südseite nächstes Jahr, Rinnen selbst“ und „Büro zwei Tage, drei hier“."
        from: ch09/s01
      - text: "Am Dienstag, dem 1. September, morgens auf dem Hügel hat er Steinhagen gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt: achtunddreißigtausend Euro."
        from: ch09/s01
      - text: "Steinhagen hat über den Preis keinen Satz verloren; er habe es fast geahnt, seit dem Notar, Jonas habe nur Wasser gewollt. Die Gruppe hat noch ein zweites Gut im Blick; Steinhagen wünscht ihm Glück mit dem Haus, dann fehle ihm wenigstens nichts."
        from: ch09/s01
      - text: "Er hat in Hamburg die Partnerschaft im Büro persönlich abgesagt."
        from: ch10/s03
      - text: "Er hat Hannes am Fuß des Hügels gesagt, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, nächstes auch und danach; Hannes bestellt das Zelt ab und will, dass er Samstag vorn fährt, mit Hedwigs altem Trecker, den Hannes im Frühjahr gemacht hat."
        from: ch09/s01
      - text: "Er hat Hannes gebeten, Marie nichts zu sagen; Hannes sagt, man rede nicht für andere, er solle sie aber nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Beim Umzug am 5. September ist er in weißem Hemd Hedwigs alten Trecker mit der Erntekrone vorn durch die Lindenallee gefahren, Hannes neben dem Vorderrad; er hat Marie am Rand gefunden und ihr ernst zugenickt, sie hat sich weggedreht."
        from: ch10/s01
      - text: "Marie ist das Mädchen mit Zopf, das ihn damals von der Gartenmauer aus beschimpft hat, weil er auf einen Rosenstock getreten war: Füße wie ein Ochse und keinen Verstand dazu; Lena hat das Foto davon in der Scheune aufgehängt."
        from: ch10/s02
      - text: "Lena hat ihn in der Scheune angefahren: „Sie trauen sich was, Herr Behrendt. Nach allem?“ Marie hat ihr gesagt, das sei ihre Sache."
        from: ch10/s02
      - text: "Marie hat ihm auf der Bank unter der Kletterrose gesagt: Der Parkplatz war es nicht, nicht nur; sein Schweigen hat wehgetan, und auch den Rücktritt hat er wieder allein beschlossen, ohne sie."
        from: ch10/s03
      - text: "Hedwig hat Marie im letzten Herbst auf dieser Bank die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführt."
        from: ch10/s03
      - text: "Maries Bedingungen: an seiner Seite, nicht in seinem Auftrag; er nimmt sie in seine Entscheidungen hinein, vorher, nicht hinterher. Er hat ohne Zögern Ja gesagt und als erste Frage gestellt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Neben dem alten Stock der Lindenhof-Rose, deren einzige Blüte schon müde hängt, steht eine Handbreit daneben ein Steckling mit einem neuen rötlichen Blatt; Marie hat ihn seit Juni in ihrem Hinterhof gezogen, ein zweiter steht dort noch unter der Folie."
        from: ch10/s03
      - text: "Er hat Marie von Hedwigs Notiz im Gartenbuch über seinen ersten Steckling erzählt; Marie hat ihn in der Mauerecke geküsst."
        from: ch10/s03
      - text: "Am Abend hat Lena ihm beim Tanz im Garten die Hand gegeben, ihn geduzt („Willkommen, Jonas“) und ihm gesagt, er solle gut auf Marie aufpassen."
        from: ch10/s03
    believes:
      - text: "Marie ist die Gärtnerin."
        from: ch01/s01
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Marie kennt den Garten; eine Firma aus der Kreisstadt wäre zu langsam."
        from: ch01/s02
      - text: "Das Haupthaus ist in schlimmerem Zustand als das Scheunendach."
        from: ch03/s03
      - text: "Mit dem Parkplatz hat er seit dem Wort Stellplatzlösung gerechnet, mit der Abfindung für Grete nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "Er wird auf dem Gut mitgerechnet, gehört an diesem Ort dazu."
        from: ch05/s02
      - text: "Seit dem gesunkenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Er versteht die Partner; er hätte es selbst so gesagt."
        from: ch07/s01
      - text: "Er rechnet nicht mehr aus, was sich lohnt, sondern was trägt."
        from: ch09/s01
      - text: "Hannes hat entgegen seinem „Hab ja nie dran gezweifelt“ doch gezweifelt; es war trotzdem gut."
        from: ch09/s01
      - text: "Er bleibt auf dem Gut: drei Tage die Woche arbeitet er künftig von hier, das Dach macht er in Abschnitten, das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus."
        from: ch10/s03
      - text: "Er liebt Marie."
        from: ch10/s03
      - text: "Sein erster Steckling der Lindenhof-Rose stand irgendwo hier in der Mauerecke."
        from: ch10/s03
    does_not_know:
      - "Wo genau im Garten er den ersten Steckling der Lindenhof-Rose gepflanzt hat."
      - "Dass Marie den Steckling am Mittwoch, dem 2. September, gepflanzt und an diesem Tag wieder im Garten gearbeitet hat."
      - "Ob Marie seine Nachrichten gelesen hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Dass Marie am 27. August Grete das Wort „Parkplatz“ gesagt hat und Grete sein Schwindeln vom 13. August durchschaut hatte."
      - "Dass Marie in der Nacht zum 28. August Lena alles erzählt hat: Lageplan, Unterschrift, den Kuss am Steg und sein „dieses Jahr“."
      - "Dass Lena Hannes anrufen wollte und die Nummern aller Helfer hat."
      - "Dass Marie seine Zusage an Hannes zwischenzeitlich als Zusage nur für dieses Jahr hörte."
      - "Dass Marie in der Nacht vor dem Arbeitseinsatz die namenlose Mauerecke hinter dem Laubengang selbst freigeschnitten und mit einem leeren Schild markiert hat."
      - "Dass Marie aus Hannes' Schweigen am Mittwoch und seiner Weste um fünf erraten hat, dass Hannes vom Rücktritt wusste."
  lena-hansen:
    knows:
      - text: "Marie arbeitet am Laubengang im Garten von Hedwig."
        from: ch02/s03
      - text: "Der Mann, über den Marie spricht (Jonas), hatte in seiner Tabelle mit Budget und Meilensteinen die Entsorgung beider Rankbögen der 'Ghislaine' vorgesehen."
        from: ch02/s03
      - text: "Er hat am Bogen ein fehlendes Fundament festgestellt und eins skizziert, 40 × 40, 80 tief wegen Frost; dabei hat er sich die helle Hose an beiden Knien grün gemacht."
        from: ch02/s03
      - text: "Am ersten Tag ließ er Schuhe und Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Beim Arbeitseinsatz im Garten am Samstag Mitte Juli hat sie am Tor die Helfer abgehakt (drei Landfrauen, vier Mann von der Feuerwehr, die Nachbarn vom Dorfteich mit Schubkarren) und die Arbeit verteilt."
        from: ch05/s01
      - text: "Marie hat ihren Rosen Namensschilder gemacht, damit keiner was rausreißt."
        from: ch05/s01
      - text: "Jonas kam zum Arbeitseinsatz; sie hat ihn gesiezt und eingetragen."
        from: ch05/s01
      - text: "Jonas hat ihr um fünf zugesagt, nächsten Samstag Zeit zu haben."
        from: ch05/s03
      - text: "Sie hat Jonas für Samstag auf der Helferliste für den Rosengarten eingetragen, mit Ankunft und Abfahrt; die Liste hängt am schwarzen Brett im Hofladen."
        from: ch06/s03
      - text: "Für Grete macht sie seit Jahren montags den Hofladen auf; Montag Anfang August hat Jonas Gretes Einkauf abgeholt."
        from: ch06/s03
      - text: "Jonas kommt aus Hamburg."
        from: ch06/s03
      - text: "Frieda hat von Tante Rosen eine Dahlie geschenkt bekommen; sie steht im Glas."
        from: ch06/s03
      - text: "Sie hat Jonas gewarnt, mit Marie keinen Sommer zu spielen; er hat gefragt, ob Marie ihr etwas gesagt habe, und sie hat ihn an Marie verwiesen."
        from: ch06/s03
      - text: "Marie kam am Donnerstag, dem 27. August, gegen Viertel vor zwölf nachts an die Küchentür des Hansen-Hofs; sie hat sie im Schlafanzug hereingelassen, Mats hat Wasser aufgesetzt."
        from: ch08/s03
      - text: "Jonas hat heimlich beim Notar einen Vorvertrag unterschrieben, gerade und ohne Zögern; im Lageplan liegen graue Stellplatzkästchen über dem Rosengarten, bis an die Mauer (von Marie)."
        from: ch08/s03
      - text: "Marie und Jonas haben sich am Abend auf dem Steg geküsst (von Marie)."
        from: ch08/s03
      - text: "Jonas hat Hannes vor zwei Wochen am Tor gesagt, das Fest finde „dieses Jahr“ auf dem Gut statt; Marie hatte das für ein Versprechen gehalten."
        from: ch08/s03
      - text: "Hedwig hat Marie letzten Herbst beim Tee auf der Bank unter der Kletterrose die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführt; das steht nirgends, nicht im Testament, auf keinem Zettel."
        from: ch08/s03
      - text: "Marie hat ihr das nie erzählt, weil es nach Erbschleicherei klingt und sie sich geschämt hat."
        from: ch08/s03
      - text: "Marie hat Gretes Butterkuchen mitgebracht; sie hat ihn mitten durchgeschnitten."
        from: ch08/s03
      - text: "Sie hat die Helferliste mit jeder Nummer; Marie hat gesagt, das sei ihre Sache, nicht die vom Dorf."
        from: ch08/s03
      - text: "Marie und sie sind seit zwanzig Jahren befreundet, seit dem Regenwurm."
        from: ch08/s03
      - text: "Sie hat für das Fest an Mats' Stelltafeln an der Rückwand der Scheune Dutzende alte Fotos aufgehängt, mit Zettelchen zur Herkunft: aus dem Album der Petersens, aus Hedwigs Schublade, aus Hannes' Ausschusskiste; darunter Hedwig mit der Erntekrone, Hedwig und Grete am Kuchentisch, Lampions im Rosengarten in den Siebzigern und ein kleiner Abzug mit Hedwig an der Gartenmauer, einem barfüßigen Jungen und einem Mädchen mit Zopf oben auf den Backsteinen. Die Ausstellung ist für Marie und für Hedwig."
        from: ch10/s02
      - text: "Jonas hat Marie in der Scheune gesagt, er müsse ihr etwas sagen, sie müsse es zuerst hören, vor allen anderen, und sie unter die Kletterrose gebeten; Marie hat ihr wieder gesagt, das sei ihre Sache, und ist für fünf Minuten mitgegangen."
        from: ch10/s02
      - text: "Am Abend tanzt Marie mit Jonas barfuß im Garten und lehnt den Kopf an seine Schulter."
        from: ch10/s03
      - text: "Sie hat Jonas beim Tanz die Hand gegeben, ihn geduzt und ihm gesagt, er solle gut auf Marie aufpassen."
        from: ch10/s03
    believes:
      - text: "Marie hat Gefühle für Jonas."
        from: ch02/s03
      - text: "Die Bögen werden nicht verschrottet, weil Marie ihn dazu gebracht hat (nach Maries Erzählung)."
        from: ch02/s03
      - text: "Marie ist keine, mit der man einen Sommer spielt; täte Jonas es, nähmen sie und das ganze Dorf es ihm übel."
        from: ch06/s03
      - text: "Wer Marie Erbschleicherei nachsagt, kriegt es mit ihr zu tun; Marie hat Hedwig seit ihrem zehnten Jahr den Giersch gestochen."
        from: ch08/s03
      - text: "Jonas ist willkommen; Marie und er gehören zusammen, das hat sie gleich gesagt."
        from: ch10/s03
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie in ihrem Hinterhof in Klein Lindau Stecklinge der Lindenhof-Rose zieht und einen davon am 2. September im Garten gepflanzt hat."
      - "Dass der Käufer Weidenkamp Hotels ist und Ralf Steinhagen das Gut besichtigt hat."
      - "Dass Jonas ein Rücktrittsrecht bis zum 10. September hatte und es am 1. September gezogen hat."
      - "Dass Jonas' Einlage für die Partnerschaft im Büro bis nach dem Fest gestundet war und er die Partnerschaft abgesagt hat."
      - "Dass Jonas Hannes gesagt hat, das Fest bleibe auf dem Gut, nicht nur dieses Jahr."
      - "Was Jonas Marie auf der Bank unter der Kletterrose gesagt hat."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe."
        from: ch01/s01
      - text: "Auftrag von Jonas: den Rosengarten bis zum Erntefest am 5. September herrichten, Wege begehbar, Beete sauber."
        from: ch01/s02
      - text: "Abmachung: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Arbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Grete hat ihr Hedwigs Gartenbuch zwei Tage nach dem Auftrag aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Laut Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas' Tabelle: Hauptweg frei bis Ende Juni; beim Laubengang Entsorgung, Ersatz verzinkt; er hatte schon ein Angebot."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Die Bögen haben auf Jonas' Skizze Punktfundamente bekommen (40 × 40, 80 tief); sie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Dafür musste sie den Hauptweg vom Tor bis zur Pforte bis Ende Juni freimachen, kein Tag später."
        from: ch02/s01
      - text: "Lena meint, dass Marie seit zwanzig Minuten über Jonas' Schuhe redet, sei kein gutes Zeichen – oder ein sehr gutes."
        from: ch02/s03
      - text: "Frieda nennt sie Tante Rosen und hat gefragt, ob sie verliebt ist."
        from: ch02/s03
      - text: "Die Bögen der 'Ghislaine' stehen seit einer Woche fest im Beton; sie bindet die Rose daran wieder auf, der achte Bogen kommt als Nächstes."
        from: ch03/s01
      - text: "Seit dem Gewitter unter dem Laubengang sagen sie und Jonas Du zueinander; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu ihr gesagt hat: Sie wünsche sich, dass Marie den Garten einmal weiterführt, wenn sie nicht mehr kann; das steht nirgends, nicht im Testament, auf keinem Zettel."
        from: ch08/s03
      - text: "Sie besitzt Hedwigs alte Schere mit rotem Griff, ein Geschenk von Hedwig."
        from: ch03/s01
      - text: "Sie wollte nach dem Gewitter nicht von Jonas' Seite weg und ist geblieben."
        from: ch03/s01
      - text: "Grete hat Jonas gesagt, dass sie Milch in den Kaffee nimmt."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker; gezogen wird langsam nach Norden zum Tor hin, damit die 'Rosa Mundi' nicht mitgerissen wird."
        from: ch03/s02
      - text: "Der Besucher ist Ralf Steinhagen von Weidenkamp Hotels; er saß mit Jonas auf der Terrasse und ging danach mit ihm durch den Garten."
        from: ch04/s01
      - text: "Grete hat den Männern Kaffee ohne Kuchen hingestellt, obwohl morgens Butterkuchenduft über dem Hof lag."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus „ein Pfund“ und sagte, das werde auf den Fotos sehr schön; von welchen Fotos er sprach, weiß sie nicht."
        from: ch04/s01
      - text: "Für das Erntefest bot Steinhagen Hannes eine Veranstaltungsfläche gegen Gebühr an; Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Steinhagen und Jonas gingen in den Salon, um Unterlagen durchzugehen."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, sagte Jonas nur: „Ein Interessent“."
        from: ch04/s02
      - text: "Für den Arbeitseinsatz am Samstag Mitte Juli hat sie an jeden Stock, der stehen bleiben muss, vom Tor bis zur Pforte ein Pappschild mit der Sorte gehängt; nur die Mauerecke hinter dem Südende des Laubengangs trägt keinen Namen, dort hat sie im Dunkeln die Brombeeren selbst zurückgeschnitten und einen Pfahl mit leerem Schild davorgesetzt."
        from: ch05/s01
      - text: "Hannes hat vor allen gesagt, im Garten sei sie die Chefin."
        from: ch05/s01
      - text: "Ole von der Feuerwehr hat an der 'Maiden's Blush' einen langen Trieb abgeknickt; sie hat ihn mit Hedwigs Schere eine Handbreit tiefer abgeschnitten, die Rose lebt, ihr fehlt ein Arm."
        from: ch05/s01
      - text: "An der Südmauer nahe der Pforte wächst unter den Brombeeren ein alter Stock der 'Ghislaine de Féligonde', den seit Jahren keiner gesehen hat; Jonas hat beim Freilegen aufgehört zu ziehen, sie hat die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Lena hat Jonas den ganzen Tag gesiezt und ihn um fünf für nächsten Samstag gewonnen; er hat Ja gesagt."
        from: ch05/s03
      - text: "Jonas hat als Junge am See drei Flöße gebaut; das größte ist mitten auf dem See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer; seitdem rechnet er alles zweimal."
        from: ch05/s03
      - text: "Sie und Jonas haben sich auf dem Steg geküsst; Jonas wollte das seit dem Gewitter, sie auch."
        from: ch05/s03
      - text: "Ihr Herzklopfen beim Gewitter kam nicht vom Wetter."
        from: ch05/s03
      - text: "Ende Juli schneidet sie die einmalblühenden Gallica und Damaszener zurück; die Büsche am Rondell bleiben und setzen Hagebutten an. Das Junibild kommt nicht wieder; für den Glanz im September setzt sie auf die Nachblüte der 'New Dawn', Lavendel, Katzenminze, Frauenmantel, Astern und Dahlien am Laubengang."
        from: ch06/s01
      - text: "Jonas hat ihr am Abend geschrieben, ob sie morgen wiederkommt, und: „Ich bin nicht so klug wie deine Rosen.“"
        from: ch06/s01
      - text: "Am Freitag, dem 14. August, hat sie Jonas den alten Stock der Lindenhof-Rose in der Mauerecke hinter dem letzten Bogen gezeigt und ihm gesagt, dass Hedwig sie selbst gezogen hat und es nur noch diesen einen Stock gibt."
        from: ch08/s01
      - text: "Jonas hat Hannes am 14. August gesagt: „Das Fest findet dieses Jahr auf dem Gut statt.“"
        from: ch07/s02
      - text: "Am 27. August hat sie in der untersten Schublade von Hedwigs Schreibtisch die Mappe von Weidenkamp Hotels gefunden; im Lageplan liegen graue Stellplatzkästchen auf dem Rosengarten, bis in den Winkel hinter dem letzten Bogen, genau über der Lindenhof-Rose; eins liegt auch über der Sonnenuhr."
        from: ch08/s01
      - text: "Jonas hat den Vorvertrag am Donnerstag, dem 13. August, unterschrieben, gerade und ohne Zögern – einen Tag vor seiner Zusage an Hannes."
        from: ch08/s01
      - text: "Jonas hat ihr gesagt: Es ist ein Vorvertrag; das Büro bietet ihm eine Partnerschaft an, dafür muss er bis Monatsende eine Einlage bringen; die Nordseite und die Rinnen, das Haupthaus ist schlimmer als die Scheune; er hat ein Rücktrittsrecht bis nach dem Fest."
        from: ch08/s01
      - text: "Sie hat Jonas gesagt, den Garten hätte sie ihm notfalls hergegeben, nicht aber hinter ihrem Rücken und nicht nach dem Steg, und dass er ihr den Parkplatz nicht erklärt hat; dann ist sie gegangen, er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Grete hat so etwas geahnt; sie hat Jonas am 13. August nach dem Herrn mit dem silbernen Auto gefragt, er hat dabei sein Spiegelei angeguckt, und Grete sieht ihm an, wenn er schwindelt."
        from: ch08/s02
      - text: "Grete hat gedacht, Jonas sagt es ihr selbst, und hat sie um Verzeihung gebeten, ohne Aber und ohne Weil."
        from: ch08/s02
      - text: "Hedwig hat auch Grete gesagt, wen sie sich für den Garten wünscht."
        from: ch08/s02
      - text: "Jonas wollte das Gut verkaufen; ein gepflegtes Gut sollte einen besseren Preis bringen."
        from: ch01/s02
      - text: "Der Hauptweg ist frei; an der Sonnenuhr saßen Holunderstubben und ein Brombeerwurzelstock, dem sie tagelang vergeblich mit der Hacke kam."
        from: ch03/s02
      - text: "Mitte Juli hat sie mit Hannes Kies auf die Hauptachse geschüttet."
        from: ch04/s01
      - text: "Beim Arbeitseinsatz kam Jonas in geliehenen Gummistiefeln, sah nicht zu ihr herüber und bog nach Süden ab, fort von der Ecke am Laubengang."
        from: ch05/s01
      - text: "Grete hat Jonas zwei Bier aus der Helferkiste gegeben und ihm Quark gegen den Sonnenbrand angeboten."
        from: ch05/s03
      - text: "Jonas dachte, zum Fest sehe der Garten aus wie im Juni; sie hat es ihm erklärt."
        from: ch06/s01
      - text: "Grete hat Ende Juli mittags Buttermilch und Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, lange von ihr zu Jonas gesehen und ist ohne ein Wort zurück zum Haus gegangen."
        from: ch06/s01
      - text: "Grete hat mittags am 14. August Butterkuchen und Kaffee auf die Bank gebracht, ihren mit Milch, und Jonas einen Augenblick zu lange angesehen; Jonas hat ihre zerkratzten Finger geküsst, einen nach dem anderen."
        from: ch07/s02
      - text: "Hannes hat am 14. August am Tor gesagt, heute sei Jonas' Antwort fällig; davon hatte ihr niemand etwas erzählt."
        from: ch07/s02
      - text: "Am 27. August fehlte Hedwigs Gartenbuch auf seinem Platz am Fenster im Arbeitszimmer; am Laubengang hatten die ersten Dahlien aufgemacht, die 'New Dawn' stand in ihrer zweiten Blüte."
        from: ch08/s01
      - text: "Grete hat am 27. August Probe-Butterkuchen fürs Erntefest gebacken, ihr eine Ecke mitgegeben und sie gebeten, die Astern am Rondell zu gießen."
        from: ch08/s02
      - text: "Lena wollte am Morgen nach dem 27. August Hannes anrufen und hat die Helferliste mit jeder Nummer; sie hat ihr gesagt, das sei ihre Sache, nicht die vom Dorf."
        from: ch08/s03
      - text: "Am 2. September hat sich die Knospe am alten Stock geöffnet, eine einzige zartrosa, gefüllte Blüte; auf dem Lageplan liegt über dem Winkel des Stecklings ein graues Kästchen. Die Hagebutten am Rondell leuchten, wie sie es im Juli versprochen hat."
        from: ch09/s02
      - text: "Sie hat Lena in der Nacht alles erzählt: Lageplan, Unterschrift, den Abend am Steg, das „dieses Jahr“ und Hedwigs Wunsch auf der Bank."
        from: ch08/s03
      - text: "In ihrem Hinterhof der alten Schmiede in Klein Lindau hat sie seit Juni Stecklinge der Lindenhof-Rose unter Folie gezogen: zwei sind angewachsen, der dritte ist schwarz geworden; den kräftigeren hat sie am 2. September eine Handbreit neben den alten Stock gepflanzt, der andere steht weiter unter der Folie."
        from: ch09/s02
      - text: "Grete hat ihr am 2. September Kaffee mit Milch und Butterkuchen auf die Bank gestellt, nichts gefragt und gesagt, die Deern habe mehr Ausdauer als der Giersch."
        from: ch09/s02
      - text: "Hannes hat am 2. September vor dem Steckling die Mütze abgenommen und gesagt „Mach man weiter, Deern“ und „Den gießt du man jeden Morgen“, ohne ihr ins Gesicht zu sehen."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie das Rondell ein letztes Mal geharkt; die Lindenhof-Rose trägt noch ihre einzige Blüte, an den Rändern schon müde, und der Steckling vom Mittwoch hat an der Spitze ein neues rötliches Blatt. Sie hat ihn gegossen, wie Hannes geraten hat."
        from: ch10/s01
      - text: "Grete hat ihr am Festmorgen Kaffee mit Milch gebracht, in der guten dunkelblauen Bluse mit Hedwigs Brosche, kein Wort über Jonas gesagt und sie geschickt, sich was Schönes anzuziehen."
        from: ch10/s01
      - text: "Laut Anke hat Grete gesagt, so habe der Garten seit Jahren nicht ausgesehen, und Hannes hat am Festmorgen schon um fünf in Weste in der Küche gestanden."
        from: ch10/s01
      - text: "Der alte Motor, der am Morgen in der Remise ansprang, war Hedwigs Trecker: Beim Umzug durch die Lindenallee fuhr Jonas ihn in weißem Hemd vorn mit der Erntekrone, Hannes ging in Weste mit Ehrennadel neben dem Vorderrad. Jonas hat sie am Rand gefunden und ihr ernst zugenickt."
        from: ch10/s01
      - text: "Lena hat für das Fest an Mats' Stelltafeln in der Scheune alte Fotos aus dem Album der Petersens, aus Hedwigs Schublade und aus Hannes' Ausschusskiste aufgehängt, für sie und für Hedwig; darum lagen die zugedeckten Fotos auf Lenas Küchentisch."
        from: ch10/s02
      - text: "Auf einem kleinen Abzug steht Hedwig an der Gartenmauer, daneben ein dünner, barfüßiger Junge mit zerschrammtem Knie, oben auf den Backsteinen ein Mädchen mit Zopf in ihrem rot-weiß gepunkteten Kleid: Das Mädchen ist sie, der Junge ist Jonas. Nicht er stand oben auf der Mauer, sondern sie, er unten im Beet."
        from: ch10/s02
      - text: "Jonas war damals auf einen Rosenstock getreten, und sie hat ihn beschimpft: Füße wie ein Ochse und keinen Verstand dazu; er hat das Tante Hedwig mit Zeichnung geschrieben, und der Brief lag in Gretes Keksdose, wo er ihn wiedergefunden hat."
        from: ch10/s02
      - text: "Jonas hat ihr auf der Bank unter der Kletterrose gesagt: Am Dienstag ist er vom Vorvertrag zurückgetreten, die Kosten trägt er selbst; in Hamburg hat er die Partnerschaft persönlich abgesagt; drei Tage die Woche arbeitet er künftig von hier, das Dach macht er in Abschnitten; das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus; er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Das also hatte Hannes am Mittwoch gewusst, als er den Dahlien antwortete statt ihr; daher die Weste um fünf."
        from: ch10/s03
      - text: "Sie hat Jonas ihre Bedingungen gestellt: an seiner Seite, nicht in seinem Auftrag; er nimmt sie in seine Entscheidungen hinein, vorher, nicht hinterher. Er hat ohne Zögern Ja gesagt und gleich gefragt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Laut Hedwigs Gartenbuch hat Jonas als Kind beim ersten Steckling der Lindenhof-Rose das Loch gegraben und gegossen und ihn danach jeden Morgen mit dem Lineal gemessen."
        from: ch10/s03
      - text: "Sie hat Jonas in der Mauerecke geküsst und am Abend unter den Lampions barfuß mit ihm getanzt; Lena hat ihm die Hand gegeben und ihn geduzt."
        from: ch10/s03
    believes:
      - text: "Splitt würde den alten Kies des Hauptwegs zerstören."
        from: ch01/s01
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Gretes Kaffee ohne Kuchen war eine Botschaft, gemeint für Steinhagen."
        from: ch04/s01
      - text: "Lenas förmlicher Ton gegenüber Jonas ist ihr Vertreterton aus dem Hofladen."
        from: ch05/s01
      - text: "Grete ist sie nicht böse, sondern sich selbst: Ihr eigenes Herz hat sie nicht so verteidigt wie einen Garten."
        from: ch08/s02
      - text: "Hedwigs Wunsch klingt nach Erbschleicherei; darum hat sie ihn lange verschwiegen."
        from: ch08/s03
      - text: "Solange die Finger zu tun haben, muss der Kopf nicht mit."
        from: ch10/s02
      - text: "Jonas meint es ernst, er bleibt; sie glaubt ihm."
        from: ch10/s03
      - text: "Nicht nur der Parkplatz hat sie verletzt, sondern sein Schweigen; auch den Rücktritt hat er allein beschlossen."
        from: ch10/s03
      - text: "Sie ist angekommen."
        from: ch10/s03
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor gesehen hat."
      - "Wie hoch Hedwigs Geldvermächtnis für die Gartenarbeit ist."
      - "Dass Jonas mit einem Käufer bis zum Herbst rechnete."
      - "Dass der Makler am letzten Freitag im Juli Fotos vom Garten machen lassen wollte."
      - "Dass Jonas Steinhagens Besichtigung vorher am Telefon zugesagt hat."
      - "Was im Salon besprochen wurde: rund zwanzig Zimmer, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg."
      - "Dass Weidenkamp Grete eine Abfindung für einen freiwilligen Auszug anbieten wollte."
      - "Dass das Rücktrittsrecht genau bis zum 10. September lief und Steinhagen es für eine Formalie hielt."
      - "Wie hoch die Kosten des Rücktritts sind: 38.000 Euro für Notar und Planung."
      - "Dass Jonas Hannes am 1. September gebeten hat, ihr nichts zu sagen."
      - "Dass Jonas' Partner ihm die Einlage bis nach dem Fest gestundet hatten, weil Weidenkamps Anzahlung noch ausstand."
      - "Dass Jonas sie vom Hügel hinter der Scheune beobachtet hat, zuletzt am Morgen des 13. August, und auf der anderen Seite hinuntergegangen ist."
      - "Dass Jonas beim Graben an der Südmauer an die Parkplatzkästchen des Lageplans dachte."
      - "Dass ein Gutachter zur Wertermittlung kommen sollte."
      - "Dass Lena Jonas im Hofladen gewarnt hat, mit ihr keinen Sommer zu spielen."
      - "Dass das Dorf ohne Jonas' Zusage im schon reservierten Zelt hinter dem Feuerwehrhaus gefeiert hätte."
      - "Ob Jonas wusste, dass der Parkplatz die Lindenhof-Rose trifft."
  ralf-steinhagen:
    knows:
      - text: "Der Makler von Jonas Behrendt hat ihm Jonas' Telefonnummer gegeben."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune auf den Quadratmeter und das Baujahr."
        from: ch03/s03
      - text: "Jonas hat einer unverbindlichen Besichtigung am übernächsten Montag, Mitte Juli, zugestimmt."
        from: ch03/s03
      - text: "Marie Albers arbeitet im Garten, Hannes Kröger fährt den Kies, Grete Paulsen kocht den Kaffee, von dem Jonas geschwärmt hat."
        from: ch04/s01
      - text: "Marie sagt, der Garten sei in den Dreißigerjahren angelegt und die 'Rosa Mundi' älter als sie beide zusammen."
        from: ch04/s01
      - text: "Auf dem Gut wird ein Erntefest gefeiert; Hannes hat gefragt, wo es hin soll."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht auf dem Gut."
        from: ch04/s02
      - text: "Jonas hat am Donnerstag, dem 13. August, im Notariat in der Kreisstadt in seinem Beisein den Vorvertrag mit Weidenkamp unterschrieben; Rücktrittsrecht bis zum 10. September."
        from: ch07/s01
      - text: "Jonas hat seinen Kugelschreiber mit dem Firmenlogo nach der Unterschrift zu ihm zurückgeschoben."
        from: ch07/s01
      - text: "Am Dienstag, dem 1. September, früh hat Jonas ihm gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt: achtunddreißigtausend Euro."
        from: ch09/s01
      - text: "Die Gruppe hat noch ein zweites Gut im Blick."
        from: ch09/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was Hotelgäste heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, kurze Wege, die Mauer als Sichtschutz gratis – der richtige Platz für den Parkplatz."
        from: ch04/s02
      - text: "Für das Erntefest findet sich eine Lösung als Veranstaltungsfläche gegen Gebühr."
        from: ch04/s01
      - text: "Seinem Herrenhaus im Süden fehlt seit dem Verlust des Parks etwas, er könnte nicht sagen, was."
        from: ch04/s02
      - text: "Der Kaffee im Notariat ist nicht so gut wie der von Frau Paulsen."
        from: ch07/s01
      - text: "Er hat Jonas' Rücktritt fast geahnt, seit dem Notar: Jonas wollte dort nur Wasser."
        from: ch09/s01
      - text: "Wenn Jonas das Haus behält, fehlt ihm wenigstens nichts."
        from: ch09/s01
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat, in der Ecke hinter dem Laubengang, bis wohin die Stellplätze reichen."
      - "Dass Hedwigs Testament wünscht, der Rosengarten solle zum Erntefest wieder blühen."
      - "Dass Dorf und Helfer den Garten bei einem Arbeitseinsatz Mitte Juli gemeinsam hergerichtet haben und Jonas mitgearbeitet hat."
      - "Dass an der Südmauer, wo der Parkplatz liegen soll, eine alte 'Ghislaine de Féligonde' freigelegt wurde."
      - "Dass Marie und Jonas sich auf dem Steg geküsst haben."
      - "Dass laut Hedwigs Gartenbuch Jonas als Kind den ersten Steckling der Lindenhof-Rose gepflanzt hat."
      - "Dass Jonas Hannes zugesagt hat, dass das Erntefest auf dem Gut stattfindet, zuerst für dieses Jahr und am 1. September auf Dauer."
      - "Dass Jonas' Partner ihm die Einlage bis nach dem Fest gestundet hatten und Jonas die Partnerschaft in Hamburg abgesagt hat."
      - "Warum Jonas vom Vorvertrag zurücktritt."
      - "Dass Marie am 27. August die Mappe mit Vorvertrag und Lageplan gefunden hat und inzwischen Grete und Lena davon wissen."
      - "Dass Jonas beim Erntefest am 5. September Hedwigs Trecker vorn im Umzug gefahren ist und Marie gesagt hat, dass er bleibt."
