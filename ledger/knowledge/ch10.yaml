based_on: ["ch09#d20fdf", "ch10/s01#7366a9", "ch10/s02#b93375", "ch10/s03#b5a114"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf die Treppe gelegt."
        from: ch01/s03
      - text: "Sie hat Marie Hedwigs Gartenbuch zwei Tage nach dem Auftrag morgens aus dem Arbeitszimmer geholt und gegeben."
        from: ch02/s01
      - text: "Als Kind hat Marie dienstags und freitags im Garten Unkraut gejätet, eine Stunde für ein Stück Streuselkuchen; sie selbst hat auf der Rückseite vom Kalender Buch geführt."
        from: ch03/s01
      - text: "Marie nimmt Milch in den Kaffee; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Mitte Juli kam ein Gast im silbernen Firmenwagen, Herr Steinhagen; er sprach sie mit Namen an und sagte, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Jonas und Steinhagen auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen, obwohl sie am Morgen Butterkuchen gebacken hat."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kamen Helfer aus dem Dorf zum Arbeitseinsatz in den Garten; sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt, damit keiner mit leerem Teller dasteht, und Kaffee nachgetragen."
        from: ch05/s01
      - text: "Jonas hat beim Arbeitseinsatz mitgearbeitet, in geliehenen Gummistiefeln."
        from: ch05/s01
      - text: "Am Abend hat Jonas gefragt, ob er zu den Helfern zählt; sie hat ihm zwei Flaschen Bier aus der Helferkiste gegeben, die Kronkorken gleich abgemacht, und ihm Quark für den Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "An einem Dienstag Ende Juli arbeiten Marie und Jonas zusammen im Rosengarten; sie hat ihnen mittags einen Krug Buttermilch und ein Blech Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, beide lange angesehen und ist ohne ein Wort zurück ins Haus gegangen."
        from: ch06/s01
      - text: "Marie hat das Gartenbuch im Arbeitszimmer hiergelassen; es lag dort neben der grünen Lampe."
        from: ch06/s02
      - text: "Jonas sucht an einem Donnerstag spät am Abend im Arbeitszimmer in Hedwigs Ordnern nach Rechnungen fürs Dach und für die Fenster; die fürs Dach hat er gefunden, nach den Fenstern will er am nächsten Tag weitersuchen."
        from: ch06/s02
      - text: "Jonas hat sich angeboten, ihren Einkauf am Montag Anfang August im Hofladen des Hansen-Hofs abzuholen; sie hat ihm einen Zettel geschrieben (zehn Eier, ein Glas Rosengelee, Kartoffeln und Rindfleisch für Mittwoch, dazu: Nicht vergessen zu bezahlen)."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet und gefragt, ob der wiedergekommen ist."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, hat sie Jonas Bratkartoffeln mit Spiegelei hingestellt; auf ihre Frage hat er gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes. Sie hat geantwortet: 'Na, denn, Jung.'"
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank im Rosengarten gebracht, Maries mit Milch; ihr Blick hing einen Augenblick zu lange an Jonas, dann ging sie wieder hinauf."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, gegen Abend, backt sie einen Probe-Butterkuchen fürs Erntefest, diesmal mit mehr Mandeln; Hannes sagt, letztes Jahr war er zu trocken."
        from: ch08/s02
      - text: "Marie kam an dem Abend ohne die Stiefel abzutreten in die Küche, riss beim Abnehmen ihrer Jacke den Aufhänger ab und sagte nur ein Wort: 'Parkplatz.'"
        from: ch08/s02
      - text: "Sie hat Marie um Verzeihung gebeten, weil sie geahnt und nichts gesagt hat; sie hatte gedacht, Jonas sagt es Marie selbst."
        from: ch08/s02
      - text: "Hedwig hat auch ihr gesagt, wen sie sich für den Garten wünscht; Marie hat genickt, als sie sagte, das wisse Marie wohl."
        from: ch08/s02
      - text: "Marie hat an ihrem Küchentisch geweint; sie hat ihr eine Ecke vom Probe-Butterkuchen in Papier mitgegeben und gesagt, die Astern am Rondell gieße sonst keiner."
        from: ch08/s02
      - text: "Am Montag, dem 31. August, abends in der Küche hat Jonas ihr gesagt: 'Ich fahr morgen früh nach Hamburg.'"
        from: ch09/s01
      - text: "Sie hat Jonas an dem Abend Hedwigs alte blaue Keksdose aus dem Fach unter der Fensterbank hinübergeschoben und gesagt: 'Hedwig hat alles aufgehoben.' und 'Lies das, Jung. Was du dann machst, ist deine Sache.' Über Marie hat sie kein Wort gesagt."
        from: ch09/s01
      - text: "Marie war seit Donnerstag nicht auf dem Gut; am Mittwoch, dem 2. September, stand ihr Wagen früh am Tor."
        from: ch09/s02
      - text: "Gegen sieben hat sie Marie einen Becher Kaffee mit Milch und einen Teller Butterkuchen auf die Bank unter der Kletterrose gestellt und nichts gefragt; Marie hat gesagt, der Kuchen sei nicht zu süß, die Mandeln saftig, da habe Hannes nichts zu meckern, das habe sie ihr schon am Freitag sagen wollen."
        from: ch09/s02
      - text: "Am Festmorgen, Samstag, dem 5. September, trägt sie statt der Kittelschürze die gute dunkelblaue Bluse, am Kragen Hedwigs Brosche, blank geputzt."
        from: ch10/s01
      - text: "Sie hat Marie am Festmorgen Kaffee gebracht ('Milch ist drin'); Marie hat gesagt, am Rondell fehlen noch zwei Astern. Über Jonas hat sie kein Wort gesagt, und Marie hat nicht gefragt."
        from: ch10/s01
      - text: "Am Festnachmittag stand sie in der Scheune an der Kaffeemaschine und hat Marie und Jonas zusammen vor Lenas Fotowand gesehen."
        from: ch10/s02
      - text: "Am Abend hat Hannes im Garten vor ihr die Mütze abgenommen und ihr die Hand zum Tanz hingehalten; sie hat gefragt, ob er nicht klug sei in ihrem Alter, und dann doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch fasst man nicht mit nassen Fingern an."
        from: ch02/s01
      - text: "Das Gartenbuch gehört ins Arbeitszimmer; Hedwig hätte gewollt, dass Jonas hineinsieht."
        from: ch06/s02
      - text: "Jonas hat mit den 'Terminen in der Stadt' geschwindelt; er hat dabei die ganze Zeit sein Spiegelei angeguckt, und seit er klein war, sieht sie ihm an, wenn er schwindelt."
        from: ch08/s02
      - text: "Dass so etwas wie ein Parkplatz kommt, hat sie geahnt; diesmal wollte sie es nicht wissen."
        from: ch08/s02
      - text: "Was Jonas nach dem Lesen der Keksdose macht, ist seine Sache."
        from: ch09/s01
      - text: "Die Deern hat mehr Ausdauer als der Giersch."
        from: ch09/s02
      - text: "Der Garten ist fertig fürs Fest ('Da kann das Dorf kommen'); die zwei fehlenden Astern fehlen nur Marie."
        from: ch10/s01
      - text: "So wie jetzt hat der Garten seit Jahren nicht ausgesehen (so gibt Anke sie wieder)."
        from: ch10/s01
    does_not_know:
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat, der zum Fest eine einzige Blüte trägt."
      - "Dass Marie zu Hause in Klein Lindau Stecklinge der Lindenhof-Rose zieht und einen davon am 2. September neben den alten Stock gepflanzt hat."
      - "Dass Jonas im Gartenbuch die Notiz über den ersten Steckling der Lindenhof-Rose gelesen hat, den er als Junge mit Hedwig gepflanzt hat."
      - "Dass Jonas die Rechnungen für einen Gutachter zur Wertermittlung braucht."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Die Einzelheiten der Absprache zwischen Jonas und Marie (Budget, Zwischenstände mit Fotos, freie Hand bei den Rosen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' entsorgen wollte und sie nun Punktfundamente bekommen."
      - "Dass Marie den Hauptweg bis Ende Juni vom Tor bis zur Pforte frei haben muss."
      - "Dass Ende Juli ein Fotograf den Garten fotografieren soll."
      - "Was Steinhagen im Garten gesagt hat: die Fläche hinter dem Haus sei 'ein Pfund', fürs Erntefest gäbe es nur eine Veranstaltungsfläche gegen Gebühr."
      - "Dass Weidenkamp rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune und ein Saunahaus am Steg plant, und dass der Parkplatz im Lageplan genau auf dem Rosengarten liegt."
      - "Dass Weidenkamp ihr lebenslanges Wohnrecht bestehen lassen will, für einen freiwilligen Auszug aber eine großzügige Abfindung vorsieht, und Steinhagen Jonas gebeten hat, das bei ihr anzusprechen."
      - "Dass Marie und Jonas sich seit dem Gewitter unter dem Laubengang duzen."
      - "Dass Marie und Jonas sich am Abend des Arbeitseinsatzes auf dem Steg geküsst haben."
      - "Dass Jonas an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt hat."
      - "Dass der Festausschuss Jonas bis Freitag, den 14., eine Zusage abverlangt hat, sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert."
      - "Dass Jonas Hannes am Freitag, dem 14. August, zugesagt hat, das Fest finde dieses Jahr auf dem Gut statt."
      - "Dass Jonas am Donnerstag, dem 13. August, beim Notar in der Kreisstadt den Vorvertrag mit Weidenkamp unterschrieben hat (Rücktrittsrecht bis zum 10. September) und Marie die Mappe in Hedwigs Schreibtisch gefunden hat."
      - "Dass Jonas für die Partnerschaft im Büro eine Einlage bringen sollte, die ihm die Partner bis nach dem Fest gestundet haben."
      - "Dass Marie in der Nacht zu Lena gegangen ist und ihr alles erzählt hat."
      - "Dass Jonas am Dienstag, dem 1. September, morgens vom Hügel aus bei Steinhagen das Rücktrittsrecht gezogen hat und 38.000 Euro für Notar und Planung selbst trägt."
      - "Dass Jonas Hannes gesagt hat, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, sondern auch nächstes und danach."
      - "Dass Jonas in Hamburg die Partnerschaft persönlich abgesagt hat."
      - "Was Jonas Marie unter der Kletterrose gesagt hat: dass er bleibt, drei Tage die Woche von hier arbeitet, Gretes Haus Gretes Haus bleibt und er Marie liebt."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg im Rosengarten ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen am Laubengang."
        from: ch03/s02
      - text: "Um die Sonnenuhr hebt sich der Kies an drei Stellen; darunter sitzen alte Holunderstubben und an der Westseite ein Brombeerwurzelstock, dem Marie mit der Hacke nicht beikommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will, dass langsam und nach Norden zum Tor hin gezogen wird, damit der Ballen die Rose nicht mitreißt."
        from: ch03/s02
      - text: "Den Fliederbusch an der Remise hat er Hedwig mit derselben Kette herausgeholt."
        from: ch03/s02
      - text: "Auf seine Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas nicht zugesagt: Es hänge an Gutachten fürs Dach und für die Fenster, an den Kosten und an Fristen, die Jonas selbst noch nicht kenne."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Er hat Marie zugesagt, am Sonnabend um halb acht den Trecker zu bringen."
        from: ch03/s02
      - text: "Mitte Juli schaufelt er mit Marie Kies vom Hänger auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht, kannte seinen Namen und hat mit Jonas auf der Terrasse gesessen und den Garten angesehen."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus 'ein Pfund' und sagte zu Marie, das werde auf den Fotos sehr schön."
        from: ch04/s01
      - text: "Auf seine Frage, wo das Erntefest dann hin soll, sagte Steinhagen: Es gäbe eine Veranstaltungsfläche gegen Gebühr, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen; Steinhagen hat ihn danach in den Salon gebeten, um die Unterlagen durchzugehen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kam er kurz nach sechs mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine, zum Arbeitseinsatz; Timo brachte das zweite Gespann mit Kies für die Seitenwege."
        from: ch05/s01
      - text: "Er hat Jonas, der in geliehenen Gummistiefeln mit anfassen wollte, die Brombeeren an der Südmauer westlich der Pforte zugeteilt."
        from: ch05/s01
      - text: "Er hat den Helfern mit einem Pfiff klargemacht: Im Garten ist Marie die Chefin, wer das nicht weiß, fragt sie."
        from: ch05/s01
      - text: "Jonas ist als Junge, Hedwigs Lütter, barfuß nach der Gerste auf seinem Hänger über die Stoppeln mitgefahren; Hedwig musste ihn mit Kuchen herunterlocken und hat geschimpft. Jonas weiß nur noch den Diesel."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen frei; er hat die letzte Fuhre Brombeeren abgefahren."
        from: ch05/s02
      - text: "Er hat Jonas die Hand gegeben, ihn Jonas genannt und geduzt: 'Gut gemacht, Jonas. Morgen tut dir alles weh.'"
        from: ch05/s02
      - text: "Der Festausschuss hat am Sonntagabend Anfang August gesessen: Bis Freitag, den 14., braucht er von Jonas eine Zusage, auf die man bauen kann; sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert, das schon reserviert ist."
        from: ch06/s03
      - text: "Er hat Jonas das am Montag Anfang August am Hoftor des Hansen-Hofs gesagt, als Jonas Gretes Einkaufskiste in den Kofferraum trug; Jonas hat geantwortet: 'Bis dahin kriegst du eine Antwort.'"
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, nachmittags am schmiedeeisernen Tor zum Rosengarten, hat er die Antwort eingefordert; Jonas hat gesagt: 'Das Fest findet dieses Jahr auf dem Gut statt.'"
        from: ch07/s02
      - text: "Am Dienstag, dem 1. September, früh am Fuß des Hügels hinter der Scheune hat Jonas ihm gesagt: 'Das Fest bleibt auf dem Gut, Hannes. Nicht nur dieses Jahr. Nächstes auch, und danach.' Er hat geantwortet, dann bestelle er das Zelt ab."
        from: ch09/s01
      - text: "Er hat Jonas gesagt, Samstag fahre er vorn, mit Hedwigs altem Trecker, den er im Frühjahr gemacht hat; Jonas ist noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Jonas hat ihn gebeten, Marie nichts zu sagen, das müsse er selbst; er hat geantwortet, man rede nicht für andere, aber Jonas solle sie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, nachmittags hat er hellen Kies fürs Rondell gebracht und mit Marie geschaufelt, im selben Takt wie im Juli."
        from: ch09/s02
      - text: "In der Mauerecke steht ein alter Rosenstock mit einer offenen Blüte; Marie hat daneben einen Steckling mit rötlichen Blättern in frische Erde gepflanzt."
        from: ch09/s02
      - text: "Marie hat ihm gesagt: Samstag ist Fest, und was danach mit dem Garten wird, sagt ihr keiner, Jonas am wenigsten."
        from: ch09/s02
      - text: "Am Festmorgen, Samstag, dem 5. September, stand er schon um fünf in Weste in der Küche des Guts."
        from: ch10/s01
      - text: "Beim Umzug durch die Lindenallee ist er in Weste, die Ehrennadel am Revers, die Mütze in der Hand, neben dem Vorderrad von Hedwigs altem Trecker gegangen, den Jonas mit der Erntekrone vorn gefahren hat; früher ist er an derselben Stelle neben Hedwig gegangen. Das Dorf hat geklatscht."
        from: ch10/s01
      - text: "Am Abend tanzt das halbe Dorf im Rosengarten zur Blaskapelle auf dem hellen Kies; er hat Grete die Hand hingehalten, und sie hat nach einigem Zieren mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Mit dem Spaten wird das nichts; mit Kette und Trecker ist der Stubben ruckzuck raus."
        from: ch03/s02
      - text: "Im Garten läuft es ('Dat löppt, Deern')."
        from: ch03/s02
      - text: "Jonas hat beim Brombeerroden gut gearbeitet."
        from: ch05/s02
      - text: "Die Frist ist keine Drohung; die Leute wollen wissen, wo sie ihre Bänke hinstellen."
        from: ch06/s03
      - text: "Gretes Butterkuchen war letztes Jahr zu trocken (so Grete über ihn)."
        from: ch08/s02
      - text: "Man redet nicht für andere; Jonas muss es Marie selbst sagen und soll sie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Marie soll weitermachen ('Mach man weiter, Deern'); woher er das weiß: 'Weiß man eben'. Den Steckling soll sie jeden Morgen gießen."
        from: ch09/s02
    does_not_know:
      - "Dass Jonas am Donnerstag, dem 13. August, beim Notar in der Kreisstadt den Vorvertrag mit Weidenkamp unterschrieben und ihn am 1. September per Rücktrittsrecht wieder gelöst hat."
      - "Dass Jonas 38.000 Euro für Notar und Planung aus dem Ersparten trägt, das für die Einlage gedacht war."
      - "Dass Weidenkamp rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg und den Parkplatz auf dem Rosengarten plant."
      - "Dass Jonas eine Partnerschaft im Büro angeboten wurde und er sie in Hamburg persönlich abgesagt hat."
      - "Dass der alte Stock in der Mauerecke der letzte Stock der Lindenhof-Rose ist und der Steckling von ihm stammt."
      - "Dass Marie und Jonas sich am Abend auf dem Steg geküsst haben."
      - "Dass Marie am 27. August die Mappe mit Vorvertrag und Lageplan gefunden und es Grete und Lena erzählt hat."
      - "Dass Lena ihn anrufen und das Dorf zusammentrommeln wollte."
      - "Was Jonas Marie am Festnachmittag unter der Kletterrose gesagt hat und dass die beiden sich ausgesprochen haben."
  jonas-behrendt:
    knows:
      - text: "Die Gärtnerin im Rosengarten heißt Marie Albers."
        from: ch01/s01
      - text: "Marie hält die Kletterrose am Hauptweg für eine 'New Dawn', kein Gestrüpp, und lehnt Bagger und Splitt auf dem Weg ab."
        from: ch01/s01
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite; für das Dach steht ein Angebot vom Dachdecker bis Ende Juni aus."
        from: ch01/s02
      - text: "Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen, über die Wege wird noch geredet; ihr Stundensatz steht nicht zur Verhandlung."
        from: ch01/s02
      - text: "Die Rankbögen am Laubengang steckten ohne Fundament im Boden; die Rose daran ist um das Gestell herumgewachsen und steht dort seit zweiundfünfzig Jahren (so Marie)."
        from: ch02/s01
      - text: "Neue Absprache mit Marie: Die Rankbögen bleiben, er bestellt Beton für Punktfundamente (40 × 40, 80 tief wegen Frost), Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg Ende Juni vom Tor bis zur Pforte frei zu haben, mit Fotos und Zollstock als Nachweis."
        from: ch02/s01
      - text: "Donnerstag um neun Uhr ist die Abnahme des Parkdecks in Hamburg, dort wird er gebraucht."
        from: ch02/s02
      - text: "Der Makler sagt: Das Haus kennen die Interessenten von Fotos, das Dach rechnen sie ein; ein vorzeigbarer Garten (begehbare Wege, Blüten in Sichtweite des Hauses, keine Ecke, die nach Arbeit aussieht) bringt andere Zahlen."
        from: ch02/s02
      - text: "Am letzten Freitag im Juli sollen Fotos vom Garten gemacht werden; der Makler schickt einen Fotografen."
        from: ch02/s02
      - text: "Nur auf dem Hügel hinter der Scheune hat man am Gut Netz; nur dort kommt das Gespräch aus dem Büro durch."
        from: ch07/s01
      - text: "Erinnerung aus der Kindheit: ein Floß aus Brettern auf dem Gutssee, und Hedwig rief ihn zum Kuchen."
        from: ch02/s02
      - text: "Die Bögen der 'Ghislaine' stehen seit einer Woche in ihrem Beton und halten; er hat gerüttelt und nachgerechnet, was die Fundamente tragen müssen."
        from: ch03/s01
      - text: "Marie und er sagen seit dem Gewitter unter dem Laubengang Du zueinander."
        from: ch03/s01
      - text: "Marie hat mit zehn im Garten ihren ersten Rosenschnitt gemacht, Hedwig hat ihr die Hand geführt; als Kind jätete sie dienstags und freitags für Gretes Streuselkuchen, im ersten Sommer kam sie jeden Tag mit dem Rad."
        from: ch03/s01
      - text: "Hedwig hat Marie ihre alte Schere mit dem roten Griff geschenkt; Marie benutzt sie bis heute."
        from: ch03/s01
      - text: "Hedwig hat laut mit den Rosen geredet, mit der 'Rosa Mundi' geschimpft und die Rose am Laubengang jeden Juni gelobt; Marie redet auch mit den Rosen."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt Milch in den Kaffee (von Grete)."
        from: ch03/s02
      - text: "Hannes Kröger hat gefragt, ob das Erntefest auf dem Gut bleibt; er hat damals nicht zugesagt. Das Fest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Hannes bringt am Sonnabend um halb acht den Trecker für die Stubben an der Sonnenuhr."
        from: ch03/s02
      - text: "Marie hat nach Hannes' Frage auf ein Wort von ihm gewartet; ihm ist nur der Kaffee eingefallen."
        from: ch03/s03
      - text: "Der Interessent aus der Hotelbranche ist Ralf Steinhagen von Weidenkamp Hotels; er hat seine Nummer vom Makler und kennt Zimmerzahl, Scheunenfläche und Baujahr des Guts."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen, verrutschte Pfannen und faulendes Laub in der Rinne."
        from: ch03/s03
      - text: "Steinhagen hat das Gut Mitte Juli besichtigt: Kaffee auf der Terrasse, Gang durchs Haus, Rundgang durch den Rosengarten."
        from: ch04/s01
      - text: "Grete hat Steinhagen und ihm Kaffee in der guten Kanne eingeschenkt, aber keinen Kuchen hingestellt; in all seinen Kindersommern gab es bei ihr keine Tasse ohne Kuchen, bis zu diesem Morgen."
        from: ch04/s02
      - text: "Im Garten nannte Steinhagen die Fläche hinter dem Haus 'ein Pfund' und sagte Marie, das werde auf den Fotos sehr schön; Marie antwortete, das sei keine Fläche, sondern ein Garten aus den Dreißigerjahren, die 'Rosa Mundi' älter als sie beide zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; er selbst hat dazu geschwiegen, während Marie auf ein Wort von ihm wartete."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz unten am Steg; dazu Grundrisse, Schnitte und eine Kostenschätzung nach Gewerken, zwei Balken eingeplant (Seite vier unten)."
        from: ch04/s02
      - text: "Steinhagens Summe liegt kaum über seiner eigenen Schätzung; Lasten und Fristen halten seiner Prüfung stand."
        from: ch04/s02
      - text: "Im Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit Zufahrt durch das Tor; Begründung: ebener Grund, nah am Haus, kurze Wege, die Mauer als Sichtschutz. Ein paar Rosen sollen als Akzent in Kübeln bleiben."
        from: ch04/s02
      - text: "Grete hat ein lebenslanges Wohnrecht, das bestehen bleiben soll; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor. Steinhagen bat ihn, das bei Gelegenheit bei Grete anzusprechen."
        from: ch04/s02
      - text: "Steinhagen erzählte von einem Herrenhaus weiter im Süden, dessen alter Park für einen Anbau weichen musste; das Haus laufe gut, aber seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Marie hat gefragt, was Steinhagen wollte; er hat nur gesagt: 'Ein Interessent.'"
        from: ch04/s02
      - text: "Am Samstag Mitte Juli hat er beim Arbeitseinsatz mit dem Dorf mitgearbeitet, in geliehenen Gummistiefeln aus der Remise; Lena hat ihn eingetragen, Hannes hat ihm die Brombeeren an der Südmauer westlich der Pforte zugeteilt."
        from: ch05/s01
      - text: "Hannes erinnert sich, dass er als Junge barfuß nach der Gerste auf Hannes' Hänger über die Stoppeln mitgefahren ist und Hedwig ihn mit Kuchen herunterlocken musste; er selbst weiß nur noch den Diesel und den Strohgeruch, Hannes' Gesicht hatte er nicht behalten."
        from: ch05/s02
      - text: "Unter den Brombeeren an der Mitte der Südmauer, nahe der Pforte, wächst ein alter Rosenstock mit kleinen, glänzenden Blättern wie an den Bögen im Laubengang; Marie hat ihn als 'Ghislaine de Féligonde' erkannt, die seit Jahren keiner mehr gesehen hat, und die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Die Südmauer liegt von der Pforte nach Westen bis zum alten Geräteschuppen frei."
        from: ch05/s02
      - text: "Hannes hat ihm die Hand gegeben, ihn Jonas genannt und geduzt."
        from: ch05/s02
      - text: "Er hat Kratzer an den Unterarmen und Sonnenbrand im Nacken; Grete hat ihm Quark angeboten und zwei Bier aus der Helferkiste gegeben."
        from: ch05/s03
      - text: "Er hat Marie auf dem Steg von seinen Flößen erzählt: drei aus Brettern der Remise mit Gretes Wäscheleine, das letzte ist mitten auf dem See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Marie und er haben sich am Abend auf dem Steg geküsst; er hat gesagt, das wollte er seit dem Gewitter, und sie hat geantwortet: 'Ich auch.'"
        from: ch05/s03
      - text: "Marie hat ihn gefragt, ob er im Herbst noch hier ist; er hat geantwortet: 'Ich weiß es nicht.'"
        from: ch05/s03
      - text: "Ende Juli schneidet Marie die Gallica und die Damaszener am Tor zurück, weil sie nur einmal im Jahr blühen; die Büsche am Rondell bleiben stehen und setzen Hagebutten an, im September hängen sie voll davon."
        from: ch06/s01
      - text: "Glanz im September ist nicht das Junibild: Die 'New Dawn' blüht nach, davor Lavendel und Katzenminze, Frauenmantel an den Kanten, Astern, am Laubengang Dahlien in Reihen."
        from: ch06/s01
      - text: "Gretes Leiden meldet sich nach ihren eigenen Worten nur bei Regen (so Marie); sie nimmt die Treppe Stufe für Stufe."
        from: ch06/s01
      - text: "Lena hat ihn für den nächsten Samstag auf ihrer Helferliste eingetragen, mit Ankunft und Abfahrt; die Liste hängt ganz oben am schwarzen Brett im Hofladen."
        from: ch06/s03
      - text: "Der Gutachter will für die Wertermittlung jede Rechnung in der Hand haben, am liebsten mit Datum und Firmenstempel; er hat die Rechnung fürs Dach (Umdeckung Nordseite, mit Stempel) gefunden, die für die Fenster noch nicht."
        from: ch06/s02
      - text: "Marie hat Hedwigs Gartenbuch im Arbeitszimmer hiergelassen (so Grete); es lag neben der grünen Lampe."
        from: ch06/s02
      - text: "Im Gartenbuch hat Hedwig jedes Beet mit Namen und Bemerkungen verzeichnet ('Rosa Mundi', Läuse, Brennnesseljauche; die 'Ghislaine' mit Ausrufezeichen)."
        from: ch06/s02
      - text: "Im Gartenbuch steht auf der Seite 'Lindenhof-Rose', datiert auf einen Juli vor sechsundzwanzig Jahren: Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen."
        from: ch06/s02
      - text: "Er erinnert sich wieder: Er hat den Steckling aus einem Erdbeer-Joghurtbecher mit Hedwig gepflanzt, ihre Hand auf seiner ('Nicht drücken'), und ihn danach jeden Morgen barfuß mit dem Lineal aus dem Federmäppchen gemessen."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet; zu Weihnachten ein Anruf von zehn Minuten. In ihren letzten Jahren war er zwei- oder dreimal auf dem Gut."
        from: ch06/s02
      - text: "Lena öffnet ihren Hofladen montags für Grete, seit Jahren; Frieda sagt, 'Tante Rosen' habe ihr eine Dahlie geschenkt."
        from: ch06/s03
      - text: "Lena hat ihn gewarnt: Marie sei keine, mit der man einen Sommer spielt; tut er es doch, nehmen sie und das ganze Dorf es ihm übel. Ob Marie ihr etwas gesagt hat, solle er Marie selbst fragen."
        from: ch06/s03
      - text: "Der Festausschuss brauchte bis Freitag, den 14., eine Zusage, auf die man bauen kann; sonst wird im schon reservierten Zelt hinter dem Feuerwehrhaus gefeiert."
        from: ch06/s03
      - text: "Am Donnerstag, dem 13. August, kurz nach sieben, hat er vom Hügel hinter der Scheune mit einem Partner telefoniert, statt nach Hamburg zu fahren; der Partner hat akzeptiert ('Wenn du heute nicht nach Hamburg kommen kannst, dann eben so'). Die Hamburger Uhrzeit auf dem Briefumschlag ist durchgestrichen."
        from: ch07/s01
      - text: "Zehn Minuten nach dem Büro hat der Dachdecker zurückgerufen und für den Herbst eine Summe genannt; er hat sie unter die durchgestrichene Hamburger Uhrzeit auf den Briefumschlag geschrieben."
        from: ch07/s01
      - text: "Am 13. August hat er im Notariat in der Kreisstadt (eine halbe Stunde Fahrt) im Beisein des Notars und Steinhagens den Vorvertrag mit Weidenkamp unterschrieben, mit Steinhagens Kugelschreiber, den er ihm danach zurückgeschoben hat."
        from: ch07/s01
      - text: "Der Vorvertrag hat ein Rücktrittsrecht bis zum zehnten September, fünf Tage nach dem Fest; Steinhagen sagt, gezogen habe so etwas bei ihnen noch nie jemand."
        from: ch07/s01
      - text: "Im Lageplan reicht die graue Fläche der Stellplätze bis an die Mauer, bis in die Ecke hinter dem Laubengang."
        from: ch07/s01
      - text: "Die Mappe mit Vorvertrag und Lageplan hatte er im untersten Fach von Hedwigs Schreibtisch unter die Dachrechnungen gelegt, Kante auf Kante."
        from: ch07/s01
      - text: "Grete hat gefragt, ob der Herr mit dem silbernen Auto wiedergekommen ist, das Dorf rede darüber; er hat ihr gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes. Das war gelogen."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat Marie ihm in der Mauerecke hinter dem letzten Bogen des Laubengangs den alten Stock der Lindenhof-Rose gezeigt, kniehoch und krumm: Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock, und er trägt eine Knospe; Marie hat ihn im Juni unter den Brombeeren gefunden."
        from: ch07/s02
      - text: "Er hat Hannes am Tor gesagt: 'Das Fest findet dieses Jahr auf dem Gut statt.' Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Hedwigs Kanten waren fünfzig Jahre krumm, und beschwert hat sich keiner (so Marie)."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, am späten Nachmittag, hat Marie im Arbeitszimmer die unterste Schublade aufgezogen und die Weidenkamp-Mappe mit Lageplan und Vorvertrag gefunden; als er vom Hügel hereinkam, hielt sie sie in beiden Händen."
        from: ch08/s01
      - text: "Er hat Marie gesagt, es sei ein Vorvertrag; im Büro biete man ihm eine Partnerschaft an, für die er eine Einlage bringen müsse; das Haupthaus sei schlimmer als die Scheune; er habe ein Rücktrittsrecht bis nach dem Fest; er habe es ihr nicht halb sagen wollen."
        from: ch08/s01
      - text: "Marie hat gesagt, den Garten hätte sie ihm notfalls hergegeben, aber nicht hinter ihrem Rücken, nicht nach dem Steg; sie hat die Mappe mit dem Lageplan obenauf auf den Schreibtisch gelegt und ist gegangen, er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Auf der Schwelle hat Marie gesagt: Er habe sie jede Rose erklären lassen, und den Parkplatz habe er ihr nicht erklärt."
        from: ch08/s01
      - text: "Das Gartenbuch lag im Ledersessel in der Ecke des Arbeitszimmers, aufgeschlagen, mit dem Rücken nach oben, nicht auf seinem Platz am Fenster."
        from: ch08/s01
      - text: "Seit Donnerstag, dem 27. August, stand Maries weißer Kastenwagen nicht mehr am Tor; auf keine seiner vier Nachrichten vom Hügel ist eine Antwort gekommen."
        from: ch09/s01
      - text: "Am Montag, dem 31. August, hat er Grete in der Küche gesagt, er fahre morgen früh nach Hamburg."
        from: ch09/s01
      - text: "Grete hat ihm Hedwigs alte blaue Keksdose gegeben, die er aus den Kindersommern kennt, als Butterkekse darin lagen und er sich auf Zehenspitzen welche gestohlen hat; sie sagte: 'Hedwig hat alles aufgehoben.' und 'Lies das, Jung. Was du dann machst, ist deine Sache.' Über Marie sagte sie kein Wort."
        from: ch09/s01
      - text: "In der Dose liegen seine Kinderbriefe in Druckschrift mit Bleistift ('LIEBE TANTE HEDWIG'), darin die Frage, wie viele Zentimeter der Steckling gewachsen sei, 'Bitte mit Lineal messen'."
        from: ch09/s01
      - text: "In der Dose liegt eine Zeichnung von ihm: ein Mädchen mit Zopf auf einer Mauer, die Fäuste in die Seiten gestemmt, daneben in seiner Kinderschrift 'Die hat mit mir geschimpft'; er war damals zwölf, die Kleine kaum fünf."
        from: ch09/s01
      - text: "Danach kommen Postkarten aus Zeltlager und Klassenfahrt mit jedes Jahr weniger Text; die letzte, aus dem Studium: 'Nächsten Sommer komm ich bestimmt.' Im Sommer darauf kam er nicht, später nur noch zwei-, dreimal für ein Wochenende. Hedwig hat die Karte glattgestrichen ganz unten in der Dose aufbewahrt."
        from: ch09/s01
      - text: "Die Partner haben ihm die Einlage bis nach dem Fest gestundet, weil Weidenkamps Anzahlung noch aussteht."
        from: ch09/s01
      - text: "Sein Plan auf dem Briefumschlag: Dach Nordseite Herbst, Südseite nächstes Jahr, Rinnen selbst; Büro zwei Tage, drei hier; Notar und Planung 38.000 aus dem Ersparten, das für die Einlage gedacht war."
        from: ch09/s01
      - text: "Am Dienstag, dem 1. September, morgens auf dem Hügel hat er Steinhagen gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt, 38.000 Euro."
        from: ch09/s01
      - text: "Steinhagen hat es nach eigenen Worten fast geahnt, seit dem Notar ('Sie wollten nur Wasser'); über den Preis hat er keinen Satz verloren. Die Gruppe hat noch ein zweites Gut im Blick. Steinhagen wünscht ihm Glück mit dem Haus: 'Dann fehlt ihm wenigstens nichts.'"
        from: ch09/s01
      - text: "Er hat Hannes am Fuß des Hügels gesagt, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, nächstes auch und danach; Hannes will das Zelt abbestellen und sagt, er habe nie daran gezweifelt."
        from: ch09/s01
      - text: "Er hat Hannes gebeten, Marie nichts zu sagen, das müsse er selbst; Hannes: man rede nicht für andere, aber er solle sie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "In Hamburg hat er die Partnerschaft persönlich abgesagt."
        from: ch10/s03
      - text: "Am Festtag, Samstag, dem 5. September, ist er Hedwigs alten Trecker mit der Erntekrone vorn im Umzug durch die Lindenallee gefahren, im weißen Hemd, Hannes in Weste neben dem Vorderrad; er hat Marie am Rand gefunden und ihr ernst zugenickt."
        from: ch10/s01
      - text: "Marie ist das Mädchen mit Zopf auf der Mauer, das ihn als Kind beschimpft hat: Er war auf einen Rosenstock getreten, sie sagte, er habe Füße wie ein Ochse und keinen Verstand dazu. In Lenas Fotowand in der Scheune hängt ein altes Foto davon: Hedwig an der Mauer, er barfuß daneben, Marie oben."
        from: ch10/s02
      - text: "Er hat Marie gesagt, er habe das Hedwig mit Zeichnung geschrieben und den Brief in Gretes Keksdose wiedergefunden."
        from: ch10/s02
      - text: "Lena hat ihm in der Scheune vorgehalten: 'Sie trauen sich was, Herr Behrendt. Nach allem?'; Marie hat sie festgehalten: 'Lena. Das ist meine Sache.'"
        from: ch10/s02
      - text: "Unter der Kletterrose hat er Marie als Erster gesagt: Rücktritt vom Vorvertrag am Dienstag, die Kosten trägt er selbst, Partnerschaft in Hamburg persönlich abgesagt, künftig drei Tage die Woche von hier, das Dach in Abschnitten, das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus, er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Marie hat ihm gesagt: Der Parkplatz war es nicht, nicht nur; sein Schweigen hat wehgetan, und auch den Rücktritt hat er wieder allein, ohne sie beschlossen."
        from: ch10/s03
      - text: "Hedwig hat im letzten Herbst auf der Bank unter der Kletterrose Maries Hand genommen und gesagt, sie wünscht sich, dass Marie den Garten einmal weiterführt (so Marie)."
        from: ch10/s03
      - text: "Maries Bedingung: den Garten an seiner Seite weiterführen, nicht in seinem Auftrag, und er nimmt sie in seine Entscheidungen hinein, vorher, nicht hinterher. Er hat ohne Zögern Ja gesagt und als erste Frage gestellt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Die Lindenhof-Rose in der Mauerecke trägt eine einzige, schon müde Blüte; eine Handbreit daneben steht ein Steckling mit einem neuen rötlichen Blatt, den Marie seit Juni in ihrem Hinterhof gezogen hat; ein zweiter steht dort noch unter Folie."
        from: ch10/s03
      - text: "Er hat Marie von der Notiz im Gartenbuch über den ersten Steckling und vom Messen mit dem Lineal erzählt; danach haben sie sich geküsst."
        from: ch10/s03
      - text: "Am Abend hat er mit Marie barfuß auf dem Kies getanzt und ihr zweimal auf die Zehen getreten; Lena hat ihm die Hand gegeben, ihn geduzt ('Willkommen, Jonas') und gesagt: 'Pass mir gut auf sie auf.'"
        from: ch10/s03
    believes:
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Marie kennt den Garten; das ist ein Vorteil gegenüber einer Firma aus der Kreisstadt, die zu spät anfangen würde."
        from: ch01/s02
      - text: "Das Haupthaus ist schlimmer dran und teurer als das Scheunendach."
        from: ch03/s03
      - text: "Mit dem Parkplatz hat er seit dem Wort 'Stellplatzlösung' gerechnet, mit der Abfindungszeile für Grete nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "'Ein Interessent' war nicht gelogen, aber so wenig, dass es kaum Gewicht hatte; warum er Marie nicht mehr gesagt hat, weiß er selbst nicht."
        from: ch04/s02
      - text: "Auf dem Gut wird er mitgerechnet; er gehört dazu."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Einer der nummerierten Stellplätze im Lageplan liegt über dem Loch, das er für den Steckling gegraben hat; welches Kästchen, hat er nie ausgerechnet."
        from: ch07/s01
      - text: "Er rechnet nicht mehr aus, was sich lohnt, sondern was trägt."
        from: ch09/s01
      - text: "Hannes hat sehr wohl am Fest auf dem Gut gezweifelt; er glaubt ihm kein Wort, und es ist trotzdem gut."
        from: ch09/s01
      - text: "Marie musste es zuerst hören, vor allen anderen, und von ihm selbst."
        from: ch10/s02
      - text: "Den ersten Steckling der Lindenhof-Rose hat er mit Hedwig irgendwo hier in der Mauerecke gepflanzt."
        from: ch10/s03
    does_not_know:
      - "Ob der alte Stock der Lindenhof-Rose in der Mauerecke genau der Steckling ist, den er mit Hedwig gepflanzt hat."
      - "Ob Marie seine Nachrichten gelesen hat und wo sie seit Donnerstag, dem 27. August, war."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Dass Marie Lena von ihm erzählt hat und Lena schon früh glaubte, Marie habe Gefühle für ihn."
      - "Dass Marie in der Nacht vor dem Arbeitseinsatz die Mauerecke hinter dem Südende des Laubengangs freigeschnitten und dort einen Pfahl mit leerem Schild gesetzt hat."
      - "Dass Marie nach dem Fund zu Grete in die Küche gegangen ist und Grete um Verzeihung gebeten hat, weil sie geahnt und geschwiegen hat."
      - "Was genau Marie in der Nacht Lena erzählt hat (Vorvertrag, Lageplan, Kuss am Steg) und dass Lena Hannes und das Dorf anrufen wollte."
      - "Dass Marie am 2. September Hannes gesagt hat, was nach dem Fest mit dem Garten wird, sage ihr keiner, er am wenigsten."
  lena-hansen:
    knows:
      - text: "Jonas' Tabelle hat Budget, Meilensteine und Daten; beim Laubengang stand 'Entsorgung' für beide Rankbögen der 'Ghislaine'."
        from: ch02/s03
      - text: "Die Rankbögen sind zweiundfünfzig Jahre alt."
        from: ch02/s03
      - text: "Jonas kam in geputzten Lederschuhen, kniete in heller Hose ins nasse Gras vor den Bogen, fand kein Fundament und zeichnete eins auf die Rückseite seiner Tabelle (40 × 40, 80 tief wegen Frost)."
        from: ch02/s03
      - text: "Jonas' Hose ist grün an beiden Knien und hin; am ersten Tag hat er sie auf der Freitreppe trocknen lassen, die Socken daneben."
        from: ch02/s03
      - text: "Marie hat Jonas davon abgebracht, Hedwigs Bögen auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Marie hat zehn Eier für den nächsten Morgen und ein Stück Butterkuchen von ihr mitgenommen."
        from: ch02/s03
      - text: "Am Samstag Mitte Juli hat sie am Tor die Helfer des Arbeitseinsatzes auf dem Klemmbrett abgehakt (drei Landfrauen, vier Mann von der Feuerwehr, die Nachbarn vom Dorfteich) und die Arbeit verteilt."
        from: ch05/s01
      - text: "Marie hat an jeden Rosenstock, der stehen bleiben muss, ein Namensschild gehängt, damit keiner etwas rausreißt."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln zum Mitarbeiten; sie hat ihn gesiezt und eingetragen."
        from: ch05/s01
      - text: "Sie hat Jonas um fünf gefragt, ob er nächsten Samstag Zeit hat, und er hat Ja gesagt."
        from: ch05/s03
      - text: "Jonas steht auf ihrer Helferliste für den Rosengarten, mit Ankunft und Abfahrt; die Liste hängt ganz oben am schwarzen Brett im Hofladen. Sie hat jede Nummer der Helfer."
        from: ch06/s03
      - text: "Für Grete macht sie den Hofladen montags auf, seit Jahren; am Montag Anfang August hat Jonas Gretes Kiste abgeholt, sie hat sie gepackt, ohne auf den Zettel zu sehen."
        from: ch06/s03
      - text: "Marie hat Frieda eine Dahlie geschenkt; sie steht im Glas und hält eine Woche."
        from: ch06/s03
      - text: "Sie hat Jonas beim Kaffee gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie und das ganze Dorf es ihm übel; auf seine Frage, ob Marie ihr etwas gesagt habe, hat sie geantwortet, das müsse er Marie schon selbst fragen."
        from: ch06/s03
      - text: "In der Nacht zum 28. August, gegen Viertel vor zwölf, kam Marie an ihre Küchentür; Mats hat Wasser aufgesetzt, Frieda schlief oben."
        from: ch08/s03
      - text: "Von Marie: Jonas hat heimlich beim Notar einen Vorvertrag unterschrieben, gerade und ohne Zögern; auf dem Lageplan liegen graue Stellplatz-Kästchen über dem Rosengarten bis an die Mauer."
        from: ch08/s03
      - text: "Von Marie: Marie und Jonas haben sich am Abend am Steg geküsst."
        from: ch08/s03
      - text: "Von Marie: Jonas' Zusage an Hannes vor zwei Wochen am Tor lautete auf 'dieses Jahr'; Marie hatte sie für ein Versprechen gehalten."
        from: ch08/s03
      - text: "Von Marie: Letzten Herbst hat Hedwig auf der Bank unter der Kletterrose Maries Hand genommen und gesagt, sie wünscht sich, dass Marie den Garten einmal weiterführt, wenn sie nicht mehr kann; das steht nirgends, nicht im Testament, auf keinem Zettel."
        from: ch08/s03
      - text: "Marie hat das niemandem erzählt, auch ihr nicht, weil es nach Erbschleicherei klingt; sie hat sich geschämt, bevor überhaupt einer etwas gesagt hat."
        from: ch08/s03
      - text: "Marie will nicht, dass sie Hannes anruft und das Dorf einschaltet: 'Das ist meine Sache, Lena. Nicht die vom Dorf.'"
        from: ch08/s03
      - text: "Auf ihrem Küchentisch lagen Stapel alter Fotos; sie hat ein Geschirrtuch darübergezogen, bevor Marie hinsehen konnte."
        from: ch08/s03
      - text: "Beim Erntefest am 5. September hat sie in der Scheune an Mats' Stelltafeln eine Fotowand für Marie und für Hedwig aufgehängt, mit Bildern aus dem Album der Petersens, aus Hedwigs Schublade und aus Hannes' Ausschusskiste, jedes mit einem Zettelchen in ihrer Schrift; Marie hat sie dort hingeführt."
        from: ch10/s02
      - text: "Als sie Jonas in der Scheune vorhielt, er traue sich was nach allem, hat Marie sie fest am Arm gefasst: 'Lena. Das ist meine Sache.' Sie ist zur Seite getreten, gerade so weit, dass ihr kein Wort entging."
        from: ch10/s02
      - text: "Jonas hat Marie gesagt, er müsse ihr etwas sagen, das sie zuerst hören müsse, vor allen anderen; die beiden sind unter die Kletterrose gegangen."
        from: ch10/s02
      - text: "Am Abend tanzt Marie mit Jonas im Garten; sie hat Jonas die Hand gegeben, ihn geduzt und willkommen geheißen."
        from: ch10/s03
    believes:
      - text: "Dass Marie seit zwanzig Minuten über Jonas' Schuhe redet, ist ein Zeichen: Marie hat Gefühle für Jonas."
        from: ch02/s03
      - text: "Die Landfrauen brauchen keine Schilder; die stechen Giersch, seit Marie laufen kann."
        from: ch05/s01
      - text: "Marie hat Liebeskummer ('mindestens ein Liebeskummer mit zwei Stück')."
        from: ch08/s03
      - text: "Wer Marie Erbschleicherei nachsagt, kriegt es mit ihr zu tun; Marie hat Hedwig seit ihrem zehnten Jahr den Giersch gestochen."
        from: ch08/s03
      - text: "Jonas gehört jetzt dazu; er soll gut auf Marie aufpassen."
        from: ch10/s03
      - text: "Dass Marie und Jonas zusammengehören, hat sie gleich gesagt ('Hab ich doch gleich gesagt')."
        from: ch10/s03
    does_not_know:
      - "Dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht, der nun blüht."
      - "Dass Marie zu Hause in Klein Lindau Stecklinge der Lindenhof-Rose zieht und einen davon neben den alten Stock gepflanzt hat."
      - "Dass Marie den Hauptweg bis Ende Juni frei haben muss."
      - "Dass Ende Juli ein Fotograf den Garten fotografieren soll."
      - "Dass Marie und Jonas beim Gewitter unter dem Laubengang beieinanderstanden und sich seitdem duzen."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels das Gut Mitte Juli besichtigt hat und Weidenkamp rund zwanzig Zimmer, Spa, Seminarraum und ein Saunahaus am Steg plant."
      - "Dass der Vorvertrag ein Rücktrittsrecht bis zum 10. September hat und Jonas es am 1. September gezogen hat."
      - "Dass Jonas für eine Partnerschaft im Büro eine Einlage bringen sollte und die Partnerschaft abgesagt hat."
      - "Dass Jonas Hannes gesagt hat, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, sondern auch nächstes und danach."
      - "Was Jonas Marie unter der Kletterrose gesagt hat."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe aus Hamburg."
        from: ch01/s01
      - text: "Jonas wollte den Rosengarten bis zum Erntefest am 5. September hergerichtet haben: Wege begehbar, Beete sauber, alles, was man vom Haus aus sieht."
        from: ch01/s02
      - text: "Absprache mit Jonas: freie Hand bei den Rosen, über die Wege wird noch geredet; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hinter dem Laubengang steht in der Mauerecke ein Stock der Lindenhof-Rose, die Hedwig selbst gezogen hat."
        from: ch01/s03
      - text: "Der alte Stock der Lindenhof-Rose in der Mauerecke am Südende des Laubengangs ist kniehoch und krumm; die Brombeeren sind fort, das Licht kommt bis an den Boden, und dicht über der Erde schieben sich zwei neue Triebe aus dem Holz. Sie gießt ihn langsam."
        from: ch06/s01
      - text: "Am Mittwoch, dem 2. September, hat sich die Knospe aus dem August am alten Stock der Lindenhof-Rose geöffnet: eine einzige Blüte, zartrosa und gefüllt, ihr Duft hängt schwer zwischen den Backsteinen."
        from: ch09/s02
      - text: "Am 2. September kurz nach fünf, im Hinterhof der alten Schmiede in Klein Lindau: Beide verbliebenen Stecklinge der Lindenhof-Rose haben getrieben, feine weiße Wurzeln halten den Ballen bis an den Rand zusammen; der dritte war schwarz geworden und liegt auf dem Kompost."
        from: ch09/s02
      - text: "Den kräftigeren Steckling hat sie in einer Kiste mit Zeitungspapier aufs Gut gebracht und eine Handbreit neben dem alten Stock der Lindenhof-Rose eingepflanzt und angegossen; der andere steht weiter unter Folie in Klein Lindau."
        from: ch09/s02
      - text: "Auf dem Lageplan liegt über diesem Winkel von Hedwigs Garten ein graues Kästchen."
        from: ch09/s02
      - text: "Von den Stecklingen wusste niemand außer ihr; seit dem 2. September hat Hannes den gepflanzten neben dem alten Stock gesehen, seit dem 5. September weiß Jonas davon."
        from: ch10/s03
      - text: "Am Freitag, dem 14. August, hat sie Jonas die Ecke hinter dem letzten Bogen des Laubengangs gezeigt, die sie seit Juni vor allen versteckt hatte, und ihm gesagt: die Lindenhof-Rose, von Hedwig gezogen, nur noch dieser eine Stock, und der blüht wieder. Jonas blieb stumm, das Gesicht so still wie an ihrem ersten Tag am Tor."
        from: ch07/s02
      - text: "Laut Gartenbuch steht an Bogen sieben und acht des Laubengangs 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Im Gartenbuch hat Hedwig in blauer Tinte neben den schraffierten Beeten vermerkt, welche Hagebuttenrosen für den September nicht mehr geschnitten werden dürfen."
        from: ch08/s01
      - text: "Am 27. August lag das Gartenbuch nicht auf seinem Platz am Fenster im Arbeitszimmer, sondern aufgeschlagen, mit dem Rücken nach oben, im Ledersessel in der Ecke; neben der grünen Lampe lag nur die Lupe."
        from: ch08/s01
      - text: "In Jonas' Tabelle stand: Hauptweg frei bis Ende Juni; Laubengang: Entsorgung, Ersatz verzinkt; er hatte schon ein Angebot."
        from: ch02/s01
      - text: "Absprache: Die Bögen bleiben, Jonas bestellt Beton für Punktfundamente, sie bindet die Rose selbst wieder an; dafür muss der Hauptweg Ende Juni vom Tor bis zur Pforte frei sein, belegt mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Lena glaubt, dass Marie Gefühle für Jonas hat; Frieda fragt, ob 'Tante Rosen' verliebt ist."
        from: ch02/s03
      - text: "Die Bögen der 'Ghislaine' stehen seit einer Woche im Beton und halten; sie bindet die Rose wieder an, als Nächstes den achten Bogen."
        from: ch03/s01
      - text: "Seit dem Gewitter unter dem Laubengang sagen Jonas und sie Du zueinander; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Rosenschnitt hat sie mit zehn von Hedwig gelernt: über dem Auge, schräg, damit das Wasser abläuft."
        from: ch03/s01
      - text: "Sie hat Hedwigs alte Schere mit dem roten Griff, ein Geschenk von Hedwig."
        from: ch03/s01
      - text: "Letzten Herbst hat Hedwig auf der Bank unter der 'New Dawn' ihre Hand genommen und gesagt, sie wünscht sich, dass Marie den Garten einmal weiterführt, wenn sie nicht mehr kann; das steht nirgends, nicht im Testament, auf keinem Zettel."
        from: ch08/s03
      - text: "Grete weiß ebenfalls von Hedwig, wen sie sich für den Garten wünscht."
        from: ch08/s02
      - text: "Lena weiß von Hedwigs Wunsch, vom Vorvertrag, vom Lageplan, vom Kuss am Steg und von dem 'dieses Jahr'; Lena wollte Hannes anrufen, sie hat es ihr untersagt."
        from: ch08/s03
      - text: "Sie hat Jonas von ihrer Kindheit im Garten, von Hedwigs Gesprächen mit den Rosen und von Hedwigs Lieblingsbank erzählt; Hedwigs Satz von der Bank hat sie ihm erst am Festnachmittag unter der Kletterrose gesagt."
        from: ch10/s03
      - text: "Der Hauptweg ist frei; Hannes hat den Garten gelobt ('Dat löppt, Deern')."
        from: ch03/s02
      - text: "Hannes bringt am Sonnabend um halb acht den Trecker für die Holunderstubben und den Brombeerwurzelstock an der Sonnenuhr; gezogen wird nach Norden, weg von der 'Rosa Mundi'."
        from: ch03/s02
      - text: "Auf Hannes' Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas damals nicht zugesagt: Es hänge an Gutachten fürs Dach und für die Fenster, an den Kosten und an Fristen. Das Fest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Jonas hat ihr Kaffee mit Milch gebracht, weil Grete es ihm gesagt hat; für sich hatte er keinen."
        from: ch03/s02
      - text: "Mitte Juli schaufelt sie mit Hannes neuen Kies vom Hänger auf die Hauptachse; noch zwei Fuhren bis zur Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht; er kannte ihren, Hannes' und Gretes Namen."
        from: ch04/s01
      - text: "Grete hat Steinhagen und Jonas auf der Terrasse Kaffee aus der guten Kanne serviert, ohne Kuchen, obwohl morgens Butterkuchenduft über dem Hof lag."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus 'ein Pfund' und sagte ihr, das werde auf den Fotos sehr schön; von welchen Fotos er sprach, weiß sie nicht."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Steinhagen und Jonas sind in den Salon gegangen, um Unterlagen durchzugehen."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, hat Jonas nur gesagt: 'Ein Interessent.'"
        from: ch04/s02
      - text: "Für den Arbeitseinsatz am Samstag Mitte Juli hat sie an jeden Stock, der stehen bleiben muss, vom Tor bis zur Pforte ein Pappschild mit der Sorte gehängt; nur die Mauerecke hinter dem Südende des Laubengangs trägt keinen Namen. Dort hat sie im Dunkeln selbst die Brombeeren zurückgeschnitten und einen Pfahl mit leerem Schild davorgesetzt."
        from: ch05/s01
      - text: "Hannes hat Jonas die Brombeeren an der Südmauer westlich der Pforte zugeteilt; Jonas ist dorthin gegangen, fort von der Ecke am Laubengang, ohne zu ihr herüberzusehen."
        from: ch05/s01
      - text: "Hannes hat den Helfern gesagt: Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "Ole von der Feuerwehr hat an der 'Maiden's Blush' gezogen und einen langen Trieb abgeknickt; sie hat ihn mit Hedwigs Schere eine Handbreit tiefer abgeschnitten. Die Rose lebt, aber ihr fehlt ein Arm."
        from: ch05/s01
      - text: "Gegen elf sind die neuen Kieswege frisch geharkt bis an die Mauer; die Landfrauen stechen den Giersch an der Westmauer."
        from: ch05/s01
      - text: "An der Mitte der Südmauer, nahe der Pforte, hat Jonas unter den Brombeeren einen alten Stock 'Ghislaine de Féligonde' freigelegt, den keiner mehr gesehen hat seit Jahren; sie hat die jungen Triebe lose mit Bast angebunden."
        from: ch05/s02
      - text: "Jonas hat Kratzer an den Unterarmen und Sonnenbrand im Nacken; Grete hat ihm Quark angeboten und zwei Bier gegeben."
        from: ch05/s03
      - text: "Lena hat Jonas den ganzen Tag gesiezt und ihn für nächsten Samstag gewonnen; er hat Ja gesagt."
        from: ch05/s03
      - text: "Jonas hat als Junge am See Flöße gebaut; das letzte ist mitten auf dem See abgesoffen, Hedwig hat gelacht und gesagt, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Jonas und sie haben sich am Abend auf dem Steg geküsst; er wollte das seit dem Gewitter, sie auch."
        from: ch05/s03
      - text: "Mats hat die Bank im Garten gerichtet, die Latten neu verschraubt und das Holz glatt geschliffen."
        from: ch05/s03
      - text: "Auf ihre Frage, ob er im Herbst noch hier ist, hat Jonas gesagt: 'Ich weiß es nicht.'"
        from: ch05/s03
      - text: "Ende Juli schneidet sie die einmalblühenden Gallica und die Damaszener am Tor zurück; Jonas schiebt die Karre, noch in den geliehenen Gummistiefeln. Sie hat ihm erklärt, dass das Junibild nicht wiederkommt und Glanz im September Nachblüte der 'New Dawn', Stauden und Dahlien heißt."
        from: ch06/s01
      - text: "Grete hat ihnen mittags Buttermilch und Johannisbeerkuchen auf die Bank gebracht, sie beide lange angesehen und ist ohne ein Wort gegangen; auf der Treppe nahm sie jede Stufe einzeln."
        from: ch06/s01
      - text: "Lena hat Jonas für Samstag schon eingetragen, mit Ankunft und Abfahrt (so Jonas)."
        from: ch06/s01
      - text: "Am Abend hat Jonas ihr geschrieben, ob sie morgen wiederkommt; sie hat geantwortet, die Rosen fragen das nicht, die wissen das."
        from: ch06/s01
      - text: "Am Freitag, dem 14. August, haben am Laubengang die ersten Dahlien aufgemacht; an der 'New Dawn' über der Bank sitzen neue Knospen. Sie hat Astern ans Rondell gesetzt, Jonas hat die Kanten der Kieswege an der Schnur abgestochen; mittags brachte Grete Butterkuchen und Kaffee, ihren mit Milch."
        from: ch07/s02
      - text: "Jonas hat ihre Finger geküsst, dort, wo die Dornen rote Striche gezogen hatten."
        from: ch07/s02
      - text: "Am Nachmittag des 14. August hat Hannes am Tor gesagt, heute sei die Antwort fällig; davon hatte ihr niemand etwas erzählt. Jonas hat geantwortet: 'Das Fest findet dieses Jahr auf dem Gut statt.' Sie ist ihm um den Hals gefallen; seine Arme kamen einen Atemzug später als sonst, dann hielten sie sie fester als nötig."
        from: ch07/s02
      - text: "Ende August haben die ersten Astern aufgemacht; am 2. September hängt die 'New Dawn' über der Bank noch in ihrer zweiten Blüte."
        from: ch09/s02
      - text: "Am Donnerstag, dem 27. August, hat sie in der untersten Schublade von Hedwigs Schreibtisch unter den Dachrechnungen eine Mappe von Weidenkamp Hotels gefunden, Steinhagens Firma."
        from: ch08/s01
      - text: "Im Lageplan der Mappe reichen die Stellplätze über den Rosengarten bis an den Backstein, bis in den Winkel hinter dem letzten Bogen, genau über der Lindenhof-Rose; ein graues Kästchen liegt über der Sonnenuhr."
        from: ch08/s01
      - text: "Jonas hat den Vorvertrag am Donnerstag, dem 13. August, unterschrieben, gerade und ohne Zögern, am Tag bevor er Hannes am Tor zugesagt hat."
        from: ch08/s01
      - text: "Jonas hat ihr gesagt: Es sei ein Vorvertrag; das Büro biete ihm eine Partnerschaft an, für die er bis Monatsende eine Einlage bringen müsse; das Haupthaus (Nordseite, Rinnen) sei schlimmer als die Scheune; er habe ein Rücktrittsrecht bis nach dem Fest; er habe es ihr nicht halb sagen wollen."
        from: ch08/s01
      - text: "Sie hat Jonas gesagt, den Garten hätte sie ihm notfalls hergegeben, aber nicht hinter ihrem Rücken, nicht nach dem Steg, und dass er sie jede Rose habe erklären lassen, den Parkplatz aber nicht erklärt habe; er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Grete hat geahnt, dass so etwas kommt, das Wort Parkplatz nicht; sie hat Jonas angesehen, dass er über die Termine in der Stadt schwindelte, wollte es aber nicht wissen, hat gedacht, er sage es ihr selbst, und hat sie um Verzeihung gebeten."
        from: ch08/s02
      - text: "Grete hat ihr am 27. August eine Ecke vom Probe-Butterkuchen mit mehr Mandeln mitgegeben; am 2. September hat sie ihr gesagt, er sei nicht zu süß und die Mandeln saftig, da habe Hannes nichts zu meckern."
        from: ch09/s02
      - text: "Am Mittwoch, dem 2. September, früh fehlte Jonas' Kombi auf dem Gutshof."
        from: ch09/s02
      - text: "Am 2. September hat sie die Kanten nachgestochen, ohne Schnur, am Laubengang die verblühten Dahlien ausgeputzt und das Lindenlaub vom Kies geharkt; an den Damaszenerrosen am Rondell leuchten die Hagebutten orangerot und prall, wie sie es im Juli versprochen hatte."
        from: ch09/s02
      - text: "Gegen sieben hat Grete ihr Kaffee mit Milch und Butterkuchen auf die Bank unter der Kletterrose gestellt, nichts gefragt, gesagt, die Deern habe mehr Ausdauer als der Giersch, ihr über den Zopf gestrichen und ist wieder hinaufgegangen."
        from: ch09/s02
      - text: "Am Nachmittag hat Hannes hellen Kies fürs Rondell gebracht; sie haben zusammen geschaufelt, der neue Kies leuchtet hell um die Sonnenuhr."
        from: ch09/s02
      - text: "Hannes hat den Steckling neben dem alten Stock gesehen, die Mütze abgenommen und gesagt: 'Mach man weiter, Deern.' Auf ihre Frage, woher er das wissen wolle, sagte er 'Weiß man eben', ohne sie anzusehen, und dass sie den Steckling jeden Morgen gießen solle."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie das Rondell ein letztes Mal geharkt; die Lindenhof-Rose trägt noch ihre einzige Blüte, an den Rändern schon müde, und der Steckling vom Mittwoch hat an der Spitze ein neues rötliches Blatt. Sie hat ihn gegossen, wie Hannes geraten hat."
        from: ch10/s01
      - text: "Grete trug am Festmorgen die gute dunkelblaue Bluse mit Hedwigs Brosche, brachte ihr Kaffee mit Milch und sagte über Jonas kein Wort."
        from: ch10/s01
      - text: "Von Anke: Grete sagt, so habe der Garten seit Jahren nicht ausgesehen; Hannes hat am Festmorgen schon um fünf in Weste in der Küche gestanden."
        from: ch10/s01
      - text: "Der Motor, der am Morgen in der Remise ansprang, war Hedwigs alter Trecker: Jonas hat ihn im weißen Hemd mit der Erntekrone vorn im Umzug durch die Lindenallee gefahren, Hannes in Weste mit Ehrennadel neben dem Vorderrad. Jonas hat sie am Rand gefunden und ihr ernst zugenickt."
        from: ch10/s01
      - text: "Die Fotos auf Lenas Küchentisch waren für eine Fotowand in der Scheune, für sie und für Hedwig; Lena hat sie aus dem Album der Petersens, aus Hedwigs Schublade und aus Hannes' Ausschusskiste gesammelt."
        from: ch10/s02
      - text: "Auf einem alten Foto steht Hedwig an der Gartenmauer, daneben der barfüßige Jonas als Junge, und oben auf der Mauer steht sie selbst als Kind mit Zopf im rot-weiß gepunkteten Kleid: Nicht der Junge stand oben, sondern sie, und er unten im Beet."
        from: ch10/s02
      - text: "Von Jonas: Er war auf einen Rosenstock getreten, sie hat ihn beschimpft (Füße wie ein Ochse und keinen Verstand dazu); er hat es Hedwig mit Zeichnung geschrieben, der Brief lag in Gretes Keksdose, er hat ihn wiedergefunden."
        from: ch10/s02
      - text: "Am Festnachmittag unter der Kletterrose hat Jonas ihr gesagt: Am Dienstag ist er vom Vorvertrag zurückgetreten, die Kosten trägt er selbst; in Hamburg hat er die Partnerschaft persönlich abgesagt; künftig arbeitet er drei Tage die Woche von hier, das Dach macht er in Abschnitten; das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus; er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Hannes hat am Mittwoch von Jonas' Rücktritt gewusst, als er den Dahlien antwortete statt ihr."
        from: ch10/s03
      - text: "Sie hat Jonas Hedwigs Wunsch von der Bank gesagt und ihre Bedingung gestellt: den Garten an seiner Seite weiterführen, nicht in seinem Auftrag, und er nimmt sie in seine Entscheidungen hinein, vorher, nicht hinterher. Er hat ohne Zögern Ja gesagt und gleich gefragt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Von Jonas: Im Gartenbuch steht die Notiz 'Erster Steckling, Jonas hat das Loch gegraben und gegossen'; er hat den Steckling danach jeden Morgen mit dem Lineal gemessen, irgendwo hier in der Mauerecke."
        from: ch10/s03
      - text: "Sie hat Jonas an der Lindenhof-Rose geküsst; am Abend hat sie mit ihm barfuß auf dem Kies getanzt, er ist ihr zweimal auf die Zehen getreten. Lena hat Jonas die Hand gegeben und ihn geduzt; Grete hat mit Hannes getanzt."
        from: ch10/s03
    believes:
      - text: "Splitt auf dem Hauptweg würde den alten Kies zerstören."
        from: ch01/s01
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Grete hat Steinhagen mit Absicht keinen Kuchen hingestellt."
        from: ch04/s01
      - text: "Jonas hätte Steinhagen etwas entgegensetzen müssen, das nach Nein klingt; sie hat darauf gewartet, und er schwieg."
        from: ch04/s01
      - text: "Lenas Siezen ist ihr Vertreterton, wie im Hofladen, wenn ein Vertreter vor der Theke steht."
        from: ch05/s01
      - text: "Ihr Herzklopfen beim Gewitter kam nicht vom Wetter; sie hat Gefühle für Jonas."
        from: ch05/s03
      - text: "Grete ist bloß müde vom Backen; ihr Leiden meldet sich nach Gretes Worten nur bei Regen."
        from: ch06/s01
      - text: "Weil aus Haus und Garten keine Nachricht durchkommt, schreibt Jonas ihr vom Hügel hinter der Scheune."
        from: ch06/s01
      - text: "Böse ist sie nicht auf Grete, sondern auf sich selbst: Auch sie hat geschwiegen; Hedwigs Satz hat sie Jonas aus Rücksicht verschwiegen, weil er selbst nicht wusste, ob er im Herbst noch hier ist."
        from: ch08/s02
      - text: "Sie hat um jeden Stock gestritten, für sich selbst aber kein Wort eingelegt; ihr eigenes Herz hat sie nicht so verteidigt wie einen Garten."
        from: ch08/s02
      - text: "Was Lena in jener Nacht für sich behalten wollte, ging sie nichts an."
        from: ch08/s03
      - text: "Hedwigs Wunsch klingt nach Erbschleicherei; sie hat sich dafür geschämt."
        from: ch08/s03
      - text: "Die Sache mit Jonas ist ihre Sache, nicht die vom Dorf und nicht Lenas."
        from: ch10/s02
      - text: "Solange die Finger zu tun haben, muss der Kopf nicht mit."
        from: ch10/s02
      - text: "Am Steg hat sie schon geahnt, dass der Junge von damals Jonas war, und es für sich behalten."
        from: ch10/s02
      - text: "Daher stand Hannes um fünf in der Weste: Er wusste, dass Jonas den Trecker fährt und das Gut nicht verkauft."
        from: ch10/s03
      - text: "Sie glaubt Jonas: Er bleibt und meint es ernst; diesmal weiß sie, was seine Stille heißt."
        from: ch10/s03
      - text: "Sein Schweigen hat wehgetan, und den Rücktritt hat er wieder allein beschlossen; künftig muss er sie vorher in seine Entscheidungen hineinnehmen."
        from: ch10/s03
      - text: "Sie ist angekommen."
        from: ch10/s03
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor so still werden ließ."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Wie schlecht Fenster und Dach des Gutshauses genau stehen (sieben undichte Fenster, Dachdecker-Summe für den Herbst)."
      - "Dass der Makler einen vorzeigbaren Garten für einen besseren Preis wollte."
      - "Dass am letzten Freitag im Juli ein Fotograf den Garten fotografieren sollte."
      - "Dass Jonas Rechnungen für einen Gutachter zur Wertermittlung zusammengesucht hat."
      - "Dass Steinhagen vorher angerufen und Jonas die Besichtigung selbst zugesagt hat."
      - "Dass Weidenkamp rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune und ein Saunahaus am Steg plante."
      - "Dass Weidenkamp Grete für einen freiwilligen Auszug eine Abfindung anbieten wollte."
      - "Wie viel der Rücktritt kostet (38.000 Euro für Notar und Planung) und dass das Geld aus dem Ersparten kommt, das für die Einlage gedacht war."
      - "Dass Jonas Hannes am 1. September gebeten hat, ihr nichts zu sagen, und Hannes gesagt hat, das Fest bleibe auch nächstes Jahr und danach."
      - "Dass die Partner Jonas die Einlage bis nach dem Fest gestundet hatten."
      - "Was sonst in Hedwigs Keksdose liegt (seine Kinderbriefe zum Steckling, seine Postkarten) und dass Grete sie ihm gegeben hat."
      - "Wer das Gartenbuch aufgeschlagen in den Ledersessel gelegt hat."
      - "Dass Jonas sie vom Hügel aus bei der Arbeit beobachtet hat."
      - "Dass Hannes sich an Jonas als Jungen auf seinem Hänger erinnert und ihn duzt."
      - "Dass der Festausschuss die Frist schon Anfang August gesetzt hat und sonst im Zelt hinter dem Feuerwehrhaus gefeiert worden wäre."
      - "Dass Lena Jonas gewarnt hat, nicht mit ihr einen Sommer zu spielen."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr des Guts."
        from: ch03/s03
      - text: "Marie Albers, Hannes Kröger und Grete Paulsen sind ihm beim Besuch Mitte Juli vorgestellt worden; Herr Behrendt hat von Gretes Kaffee geschwärmt."
        from: ch04/s01
      - text: "Marie sagt, der Garten sei in den Dreißigerjahren angelegt, mit diesen Wegen und dieser Mauer, und die 'Rosa Mundi' älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes Kröger fragt, wo das Erntefest hin soll, wenn das Hotel kommt."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht auf dem Gut."
        from: ch04/s02
      - text: "Er hat Jonas Plan, Kostenschätzung und Lageplan (Parkplatz auf dem Rosengarten) gezeigt und die Unterlagen dagelassen; Jonas nannte die Abfindung für Grete großzügig und widersprach nicht."
        from: ch04/s02
      - text: "Am Donnerstag, dem 13. August, hat Jonas im Notariat in der Kreisstadt den Vorvertrag mit Weidenkamp unterschrieben, ohne abzusetzen, mit seinem Kugelschreiber, den Jonas ihm danach zurückgeschoben hat."
        from: ch07/s01
      - text: "Der Vorvertrag enthält ein Rücktrittsrecht bis zum zehnten September."
        from: ch07/s01
      - text: "Am Dienstag, dem 1. September, früh hat Jonas ihm gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt, 38.000 Euro; Jonas sagte, es tue ihm leid um seine Arbeit."
        from: ch09/s01
      - text: "Die Gruppe hat noch ein zweites Gut im Blick."
        from: ch09/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste heute suchen."
        from: ch04/s02
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, nah am Haus, kurze Wege, die Mauer als Sichtschutz gratis; ein paar Rosen bleiben als Akzent in Kübeln."
        from: ch04/s02
      - text: "Gretes Kaffee ist ausgezeichnet, besser als der im Notariat."
        from: ch07/s01
      - text: "Seinem Herrenhaus im Süden fehlt etwas, seit der alte Park für den Anbau weichen musste; was, kann er nicht sagen."
        from: ch04/s02
      - text: "Den Rücktritt hat er fast geahnt, seit dem Notar: Jonas wollte dort nur Wasser."
        from: ch09/s01
      - text: "Bleibt das Gut bei Jonas, fehlt dem Haus wenigstens nichts."
        from: ch09/s01
    does_not_know:
      - "Dass Hedwig im Testament wünscht, der Rosengarten solle zum Erntefest wieder blühen."
      - "Dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht und wieder blüht."
      - "Dass Grete ihm absichtlich keinen Kuchen hingestellt hat."
      - "Dass das Dorf am Samstag Mitte Juli einen Arbeitseinsatz im Rosengarten gemacht hat."
      - "Dass Marie und Jonas sich geküsst haben und zusammengefunden haben."
      - "Dass der Festausschuss Jonas bis Freitag, den 14., eine Zusage fürs Erntefest auf dem Gut abverlangt hat."
      - "Dass Jonas Hannes zugesagt hat, das Fest bleibe auf dem Gut, dieses Jahr und auch danach."
      - "Dass Marie am 27. August die Mappe mit Lageplan und Vorvertrag gefunden hat und nun auch Grete und Lena davon wissen."
      - "Dass Jonas die Partnerschaft in Hamburg abgesagt hat und künftig drei Tage die Woche vom Gut aus arbeitet."
