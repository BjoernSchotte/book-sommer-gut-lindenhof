based_on: ["ch09#8f1a50", "ch10/s01#7366a9", "ch10/s02#b93375", "ch10/s03#b585f8"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch lag im Arbeitszimmer auf dem Schreibtisch unterm Fenster, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Als Marie Kind war, gab es bei ihr jeden Dienstag und Freitag für eine Stunde Unkraut ein Stück Streuselkuchen; sie hat auf der Rückseite vom Kalender Buch geführt."
        from: ch03/s01
      - text: "Marie nimmt Milch in den Kaffee; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Mitte Juli ist ein Besucher im silbernen Firmenwagen gekommen, Ralf Steinhagen; er hat sie mit Namen begrüßt und gesagt, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Jonas und Steinhagen auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt und keinen Kuchen dazugestellt, obwohl sie am Morgen Butterkuchen gebacken hat."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli haben Helfer aus dem Dorf im Garten gearbeitet; sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt und eine zweite Kanne Kaffee gebracht."
        from: ch05/s01
      - text: "Jonas hat beim Helfereinsatz mitgearbeitet; sie hat ihm zwei Flaschen Bier gegeben und ihm gegen den Sonnenbrand im Nacken Quark angeboten."
        from: ch05/s03
      - text: "An einem Dienstag Ende Juli hat sie Marie und Jonas mittags Buttermilch und Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt und lange von einer zum anderen gesehen."
        from: ch06/s01
      - text: "Jonas sucht im Arbeitszimmer in den alten Ordnern die Rechnungen fürs Dach und für die Fenster."
        from: ch06/s02
      - text: "Marie hat das Gartenbuch im Arbeitszimmer gelassen, neben der Lampe; sie hat Jonas gesagt, er könne ruhig reinsehen, Hedwig hätte das gewollt."
        from: ch06/s02
      - text: "Jonas hat ihren Einkauf im Hofladen der Hansens geholt; Lena macht für sie seit Jahren montags den Hofladen auf."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet; das hat sie Jonas am Donnerstag, dem 13. August, beim Essen erzählt. Jonas hat gesagt: \"Hier war er nicht.\" und \"Ich hatte Termine in der Stadt. Nichts Besonderes.\" Dabei hat er die ganze Zeit sein Spiegelei angeguckt."
        from: ch08/s02
      - text: "Am Donnerstag, dem 27. August, ist Marie aufgelöst in die Küche gekommen und hat nur ein Wort gesagt: \"Parkplatz.\" Jonas will auf dem Gut einen Parkplatz."
        from: ch08/s02
      - text: "Sie hat Marie um Verzeihung gebeten, ohne Aber und ohne Weil, weil sie geschwiegen hat."
        from: ch08/s02
      - text: "Hedwig hat ihr gesagt, wen sie sich für den Garten wünscht; sie hat Marie gesagt, das wisse sie wohl, und Marie hat genickt."
        from: ch08/s02
      - text: "Am Montag, dem 31. August, abends hat Jonas gesagt: \"Ich fahr morgen früh nach Hamburg.\""
        from: ch09/s01
      - text: "Sie hat Jonas an diesem Abend Hedwigs alte blaue Keksdose gegeben: \"Hedwig hat alles aufgehoben.\" und \"Lies das, Jung. Was du dann machst, ist deine Sache.\""
        from: ch09/s01
      - text: "Seit Donnerstag, dem 27. August, war Marie nicht auf dem Gut; am Mittwoch, dem 2. September, stand ihr Wagen früh am Tor, und sie hat ihr Kaffee mit Milch und Butterkuchen auf die Bank unter der Kletterrose gestellt."
        from: ch09/s02
      - text: "Marie hat ihr gesagt, der Probe-Butterkuchen sei nicht zu süß, die Mandeln saftig."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs hat sie Marie im Garten Kaffee mit Milch gebracht (\"Milch ist drin.\"), in der guten dunkelblauen Bluse mit Hedwigs Brosche am Kragen; über Jonas hat sie kein Wort gesagt."
        from: ch10/s01
      - text: "Marie hat gesagt, am Rondell fehlten noch zwei Astern; sie hat ihr gesagt, die fehlten nur ihr, und sie solle sich was Schönes anziehen."
        from: ch10/s01
      - text: "In der Scheune hat sie beim Erntefest an der Kaffeemaschine gestanden; auf Lenas Tresen standen ihre Bleche Butterkuchen und Bienenstich. Sie hat Marie und Jonas vor Lenas Fotowand zusammen gesehen und in den Dampf hinein gelächelt."
        from: ch10/s02
      - text: "Am Abend im Garten hat Hannes sie zum Tanz aufgefordert; sie hat gefragt \"Bist du nicht klug, in unserm Alter?\" und dann doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Jonas hat ihr am 13. August beim Essen etwas vorgeschwindelt; seit er so hoch war, sieht sie ihm an, wenn er schwindelt."
        from: ch08/s02
      - text: "Was Jonas nach dem Lesen der Briefe in der Keksdose macht, ist seine Sache."
        from: ch09/s01
      - text: "Die Deern hat mehr Ausdauer als der Giersch."
        from: ch09/s02
      - text: "Der Garten ist fertig fürs Fest (\"Na. Da kann das Dorf kommen.\"); die fehlenden Astern fehlen nur Marie."
        from: ch10/s01
    does_not_know:
      - "Dass Jonas am Donnerstag, dem 13. August, beim Notar den Vorvertrag mit Weidenkamp unterschrieben hat und am Dienstag, dem 1. September, davon zurückgetreten ist (ob sie inzwischen davon weiß, sagt der Text nicht)."
      - "Dass Jonas für den Rücktritt die Kosten für Notar und Planung selbst trägt, 38.000 Euro aus dem Ersparten für die Einlage."
      - "Dass Jonas in Hamburg die Partnerschaft persönlich abgesagt hat und künftig drei Tage die Woche vom Gut aus arbeiten will."
      - "Dass Jonas Marie gesagt hat: \"Gretes Haus bleibt Gretes Haus. Ich bleibe, Marie.\""
      - "Dass Jonas Hannes am 1. September zugesagt hat, das Fest bleibe nicht nur dieses Jahr auf dem Gut, sondern auch nächstes und danach."
      - "Wie Marie vom Parkplatz erfahren hat: dass sie im untersten Fach von Hedwigs Schreibtisch die Weidenkamp-Mappe mit Lageplan und Vorvertrag gefunden hat."
      - "Dass im Lageplan der Parkplatz genau auf dem Rosengarten liegt, bis in die Ecke hinter dem Laubengang."
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden und einen in Klein Lindau gezogenen Steckling daneben gepflanzt hat."
      - "Was Jonas im Gartenbuch gelesen hat: Hedwigs Notiz, dass er beim ersten Steckling der Lindenhof-Rose das Loch gegraben und gegossen hat."
      - "Was Weidenkamp plante: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg."
      - "Dass Weidenkamp ihr bei freiwilligem Auszug eine großzügige Abfindung vorsah und Steinhagen Jonas gebeten hat, das bei ihr anzusprechen."
      - "Dass Marie und Jonas sich am Abend nach dem Helfersamstag auf dem Steg geküsst haben."
      - "Was Jonas und Marie am Nachmittag des Fests auf der Bank unter der Kletterrose besprochen haben: Rücktritt, Bleiben, Maries Bedingungen, Jonas' Liebeserklärung."
      - "Dass Marie in der Nacht zum 28. August zu Lena gegangen ist und ihr von Vorvertrag, Steg und Hedwigs Wunsch erzählt hat."
      - "Wo Marie zwischen Donnerstag, dem 27. August, und Mittwoch, dem 2. September, gewesen ist."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg ist frei, die Buchskanten stehen, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Mit derselben Kette hat er Hedwig den Fliederbusch an der Remise rausgeholt."
        from: ch03/s02
      - text: "Jonas konnte im Juni noch nicht sagen, ob das Erntefest auf dem Gut bleibt; es hänge an Gutachten fürs Dach und für die Fenster, an den Kosten und an Fristen."
        from: ch03/s02
      - text: "Das Erntefest ist wie immer am ersten Samstag im September."
        from: ch03/s02
      - text: "Marie und Jonas duzen sich."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels war Mitte Juli auf dem Gut, nannte die Fläche hinter dem Haus ein Pfund und bot fürs Erntefest eine Veranstaltungsfläche gegen Gebühr an; Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Beim Helfereinsatz am Samstag Mitte Juli hat er Jonas an die Brombeeren der Südmauer geschickt und klargestellt: Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "Jonas ist als Kind, der Lütte von Hedwig, bei ihm barfuß auf dem Hänger über die Stoppeln mitgefahren; Hedwig musste ihn mit Kuchen herunterlocken."
        from: ch05/s02
      - text: "Er hat Jonas die Hand gegeben, ihn Jonas genannt und geduzt: \"Gut gemacht, Jonas. Morgen tut dir alles weh.\""
        from: ch05/s02
      - text: "Der Ausschuss hat von Jonas bis Freitag, den vierzehnten, eine Zusage verlangt; sonst wäre im reservierten Zelt hinter dem Feuerwehrhaus gefeiert worden."
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, hat Jonas am Gartentor gesagt: \"Das Fest findet dieses Jahr auf dem Gut statt.\" Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Am Dienstag, dem 1. September, hat Jonas ihm gesagt: \"Das Fest bleibt auf dem Gut, Hannes. Nicht nur dieses Jahr. Nächstes auch, und danach.\" Er bestellt darauf das Zelt ab."
        from: ch09/s01
      - text: "Jonas hat ihn gebeten, Marie nichts zu sagen; das müsse er selbst."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, hat er mit Marie hellen Kies fürs Rondell geschaufelt; neben dem alten Stock hinter dem Laubengang hat Marie einen Steckling gepflanzt. Marie hat gesagt, was nach dem Fest mit dem Garten wird, sage ihr keiner, Jonas am wenigsten."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, ist Jonas beim Umzug vorn mit Hedwigs altem Trecker und der Erntekrone durch die Lindenallee gefahren; er ist in Weste, die Ehrennadel am Revers, die Mütze in der Hand neben dem Vorderrad gegangen, wie früher neben Hedwig. Das Dorf hat geklatscht."
        from: ch10/s01
      - text: "Am Abend im Garten hat er Grete zum Tanz aufgefordert; sie hat gefragt \"Bist du nicht klug, in unserm Alter?\" und dann doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "Das Erntefest bleibt auf dem Gut, nicht nur dieses Jahr, sondern auch die Jahre danach."
        from: ch09/s01
      - text: "Man redet nicht für andere; Jonas soll Marie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Marie soll im Garten weitermachen und den Steckling jeden Morgen gießen."
        from: ch09/s02
    does_not_know:
      - "Dass Jonas das Gut verkaufen wollte, am Donnerstag, dem 13. August, beim Notar den Vorvertrag mit Weidenkamp unterschrieben hat und am 1. September davon zurückgetreten ist."
      - "Dass Jonas der Rücktritt 38.000 Euro für Notar und Planung kostet."
      - "Dass Weidenkamp den Parkplatz genau auf den Rosengarten legen wollte."
      - "Dass Weidenkamp Grete bei freiwilligem Auszug eine Abfindung vorsah."
      - "Dass Jonas in Hamburg die Partnerschaft im Büro abgesagt hat und künftig drei Tage die Woche vom Gut aus arbeiten will."
      - "Dass der alte Stock hinter dem Laubengang der letzte Stock der Lindenhof-Rose ist und Marie den Steckling in Klein Lindau davon gezogen hat."
      - "Dass Marie und Jonas sich am Abend nach dem Helfersamstag auf dem Steg geküsst haben."
      - "Dass Marie am 27. August den Vorvertrag gefunden hat und Jonas' Zusage an ihn als bloß für dieses Jahr gemeint gehört hat."
      - "Dass Jonas Marie am Nachmittag des Fests unter der Kletterrose alles gesagt hat und dass sie ihm daraus geschlossen hat, Hannes habe am Mittwoch Bescheid gewusst."
      - "Dass Lena ihn am Morgen nach dem 27. August anrufen und das Dorf zusammentrommeln wollte und Marie das abgelehnt hat."
  jonas-behrendt:
    knows:
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite; Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen; ihr Stundensatz steht nicht zur Verhandlung."
        from: ch01/s02
      - text: "Die Rankbögen der 'Ghislaine' stehen auf Punktfundamenten und halten."
        from: ch03/s01
      - text: "Marie ist als Kind im Garten herumgestromert und hat mit zehn ihren ersten Rosenschnitt gemacht; Hedwig hat ihr die Schere mit dem roten Griff geschenkt."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Hotelplan von Weidenkamp: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg; im Lageplan liegt der Parkplatz genau auf dem Rosengarten."
        from: ch04/s02
      - text: "Laut Steinhagen hat Grete ein lebenslanges Wohnrecht; für einen freiwilligen Auszug sah Weidenkamp eine großzügige Abfindung vor."
        from: ch04/s02
      - text: "Laut Hannes ist er als Kind barfuß bei ihm auf dem Hänger über die Stoppeln mitgefahren; Hannes hat ihn nach dem Helfersamstag geduzt."
        from: ch05/s02
      - text: "Marie und er haben sich am Abend nach dem Helfersamstag auf dem Steg geküsst."
        from: ch05/s03
      - text: "Auf einer Seite 'Lindenhof-Rose' hat Hedwig vor sechsundzwanzig Jahren notiert: \"Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen.\""
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet."
        from: ch06/s02
      - text: "Lena hat ihm gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie und das ganze Dorf ihm das übel."
        from: ch06/s03
      - text: "Er hat am Donnerstag, dem 13. August, den Vorvertrag mit Weidenkamp unterschrieben (Rücktrittsrecht bis zum zehnten September) und Grete am selben Abend gesagt: \"Hier war er nicht.\""
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat Marie ihm hinter dem letzten Bogen des Laubengangs den alten Stock der Lindenhof-Rose gezeigt; Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock."
        from: ch07/s02
      - text: "Er hat Hannes am 14. August am Tor geantwortet: \"Das Fest findet dieses Jahr auf dem Gut statt.\""
        from: ch07/s02
      - text: "Am 27. August hat Marie die Weidenkamp-Mappe mit Lageplan und Vorvertrag gefunden und ist gegangen: \"Du hast mir jede Rose erklären lassen. Und den Parkplatz hast du mir nicht erklärt.\""
        from: ch08/s01
      - text: "In Hedwigs Keksdose, die Grete ihm am 31. August gegeben hat, lagen seine Kinderbriefe, die Zeichnung eines Mädchens mit Zopf auf der Mauer (\"Die hat mit mir geschimpft\") und seine Postkarten bis zum Studium."
        from: ch09/s01
      - text: "Am 1. September hat er Steinhagen gesagt, dass er das Rücktrittsrecht zieht und die Kosten für Notar und Planung selbst trägt, 38.000 Euro aus dem Ersparten für die Einlage."
        from: ch09/s01
      - text: "Er hat Hannes gesagt, das Fest bleibe auf dem Gut, auch nächstes Jahr und danach, und ihn gebeten, Marie nichts zu sagen."
        from: ch09/s01
      - text: "Am Samstag, dem 5. September, ist er mit Hedwigs altem Trecker und der Erntekrone vorn im Umzug durch die Lindenallee gefahren, Hannes neben dem Vorderrad; er hat Marie am Rand gefunden und ihr ernst zugenickt, sie hat sich weggedreht."
        from: ch10/s01
      - text: "Auf Lenas Fotowand in der Scheune hängt ein Foto: Hedwig an der Gartenmauer, daneben er als dünner barfüßiger Junge, oben auf den Backsteinen Marie als Mädchen mit Zopf. Marie hat ihn beschimpft, weil er auf einen Rosenstock getreten war: Füße wie ein Ochse und keinen Verstand dazu."
        from: ch10/s02
      - text: "Lena hat ihn vor der Fotowand angefahren (\"Sie trauen sich was, Herr Behrendt. Nach allem?\"); Marie hat sie zurückgehalten: \"Lena. Das ist meine Sache.\""
        from: ch10/s02
      - text: "Die Partnerschaft hat er in Hamburg persönlich abgesagt; er hat Marie unter der Kletterrose vom Rücktritt erzählt, dass er die Kosten selbst trägt, künftig drei Tage die Woche von hier aus arbeitet, das Dach in Abschnitten macht, dass das Erntefest jedes Jahr auf dem Gut und der Rosengarten dem Dorf bleibt, Gretes Haus Gretes Haus bleibt und er bleibt; und dass er sie liebt."
        from: ch10/s03
      - text: "Marie hat ihm gesagt: Der Parkplatz war es nicht, nicht nur; sein Schweigen hat wehgetan, und auch den Rücktritt hat er wieder ohne sie beschlossen."
        from: ch10/s03
      - text: "Hedwig hat Marie im letzten Herbst auf der Bank unter der Kletterrose die Hand genommen und sich gewünscht, dass Marie den Garten einmal weiterführt."
        from: ch10/s03
      - text: "Marie will den Garten weiterführen, mit eigenem Betrieb und eigenem Wort, an seiner Seite, nicht in seinem Auftrag; er nimmt sie in seine Entscheidungen hinein, vorher, nicht hinterher. Er hat ohne Zögern Ja gesagt; die erste Frage: was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Neben dem alten Stock der Lindenhof-Rose, die noch ihre einzige müde Blüte trägt, steht ein Steckling aus Maries Hinterhof, seit Juni gezogen, mit einem neuen rötlichen Blatt; ein zweiter steht noch unter Folie."
        from: ch10/s03
      - text: "Er hat Marie Hedwigs Notiz zum ersten Steckling erzählt; Marie hat ihn geküsst."
        from: ch10/s03
      - text: "Lena hat ihm beim Tanz im Garten die Hand gegeben, ihn geduzt (\"Willkommen, Jonas\") und gesagt: \"Pass mir gut auf sie auf.\""
        from: ch10/s03
    believes:
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "Er wird auf dem Gut mitgerechnet, gehört dazu."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Er rechnet nicht mehr aus, was sich lohnt, sondern was trägt."
        from: ch09/s01
      - text: "Den ersten Steckling der Lindenhof-Rose hat er irgendwo hier, im Winkel hinter dem Laubengang, gepflanzt."
        from: ch10/s03
    does_not_know:
      - "Ob Marie seine Nachrichten nach dem 27. August gelesen hat."
      - "Dass Marie die Zeile in Hedwigs Gartenbuch zum ersten Steckling schon kannte und nur beim Namen nie an ihn gedacht hat."
      - "Wer das Gartenbuch aufgeschlagen in den Ledersessel im Arbeitszimmer gelegt hat."
      - "Dass Grete Marie das Gartenbuch aus dem Arbeitszimmer geholt hat."
      - "Dass Grete seine Ausrede vom 13. August durchschaut, Marie das gesagt und sie um Verzeihung gebeten hat."
      - "Dass Marie nach dem Streit zu Grete in die Küche und in der Nacht zu Lena gegangen ist und beiden vom Parkplatz erzählt hat."
      - "Dass Lena Hannes und das Dorf anrufen wollte und Marie das abgelehnt hat."
      - "Dass Marie seine Zusage an Hannes vom 14. August als bloß für dieses Jahr gemeint gehört hat."
      - "Dass Marie aus Hannes' Verhalten am Mittwoch geschlossen hat, Hannes habe vom Rücktritt gewusst."
      - "Dass Marie schon am Steg geahnt hat, dass er der Junge von damals war, und es für sich behalten hat."
  lena-hansen:
    knows:
      - text: "Laut Marie stand in Jonas' Tabelle 'Entsorgung' für die Rankbögen der 'Ghislaine'; Marie hat ihn dazu gebracht, die Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Beim Helfereinsatz am Samstag Mitte Juli hat sie am Tor mit Klemmbrett die Leute abgehakt; Jonas hat mitgearbeitet, sie hat ihn eingetragen und gesiezt."
        from: ch05/s03
      - text: "Für Grete macht sie seit Jahren montags den Hofladen auf; am Montag Anfang August hat Jonas Gretes Einkauf abgeholt."
        from: ch06/s03
      - text: "Sie hat Jonas gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie und das ganze Dorf ihm das übel."
        from: ch06/s03
      - text: "Marie ist in der Nacht zum 28. August an ihre Küchentür gekommen: Es gibt einen Lageplan mit grauen Kästchen über dem Rosengarten, und Jonas hat den Vertrag heimlich beim Notar unterschrieben."
        from: ch08/s03
      - text: "Marie und Jonas haben sich an einem Abend am Steg geküsst."
        from: ch08/s03
      - text: "Jonas' Zusage an Hannes am Tor lautete, das Fest finde \"dieses Jahr\" auf dem Gut statt."
        from: ch08/s03
      - text: "Letzten Herbst hat Hedwig Marie auf der Bank unter der Kletterrose die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführt; das steht nirgends."
        from: ch08/s03
      - text: "Sie wollte Hannes anrufen; Marie hat gesagt: \"Das ist meine Sache, Lena. Nicht die vom Dorf.\""
        from: ch08/s03
      - text: "Für das Erntefest hat sie an Stelltafeln von Mats in der Scheune Dutzende alter Fotos aufgehängt, aus Dorfalben, aus Hedwigs Schublade und aus Hannes' Ausschusskiste, mit Zettelchen in ihrer Schrift; für Marie und für Hedwig. Darum lagen die Fotos auf ihrem Küchentisch."
        from: ch10/s02
      - text: "Auf einem kleinen verblichenen Abzug stehen Hedwig an der Gartenmauer, ein dünner barfüßiger Junge und oben auf der Mauer ein Mädchen mit Zopf; Jonas hat Marie davor gesagt: \"Du hast mich beschimpft.\""
        from: ch10/s02
      - text: "Als sie Jonas vor der Fotowand angefahren hat, hat Marie sie am Arm gefasst: \"Lena. Das ist meine Sache.\" Jonas wollte Marie etwas sagen, das sie zuerst hören soll, und hat sie unter die Kletterrose gebeten."
        from: ch10/s02
      - text: "Am Abend hat Marie im Garten barfuß mit Jonas getanzt; sie hat Jonas die Hand gegeben und ihn geduzt."
        from: ch10/s03
    believes:
      - text: "Marie hat Gefühle für Jonas."
        from: ch02/s03
      - text: "Marie ist keine, mit der man einen Sommer spielt; Jonas soll gut auf sie aufpassen."
        from: ch10/s03
      - text: "Wer Marie Erbschleicherei nachsagt, kriegt es mit ihr zu tun."
        from: ch08/s03
      - text: "Jonas ist willkommen; dass Marie und Jonas zusammengehören, hat sie gleich gesagt."
        from: ch10/s03
    does_not_know:
      - "Was Jonas Marie unter der Kletterrose gesagt hat: Rücktritt vom Vorvertrag am 1. September, Absage der Partnerschaft, drei Tage die Woche auf dem Gut, Gretes Haus bleibt (wie Lena von Jonas' Bleiben erfahren hat, sagt der Text nicht)."
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden und einen in Klein Lindau gezogenen Steckling daneben gepflanzt hat."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels Mitte Juli das Gut besichtigt hat."
      - "Dass Jonas Hannes am 1. September zugesagt hat, das Fest bleibe auch in den kommenden Jahren auf dem Gut."
      - "Dass Grete Jonas' Ausrede durchschaut und Marie um Verzeihung gebeten hat."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe aus Hamburg."
        from: ch01/s01
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Absprache mit Jonas: freie Hand bei den Rosen; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Den Rosenschnitt hat sie mit zehn von Hedwig gelernt; Hedwigs alte Schere mit dem roten Griff trägt sie im Holster."
        from: ch08/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels war Mitte Juli auf dem Gut; Jonas hat auf ihre Frage gesagt: \"Ein Interessent.\""
        from: ch04/s02
      - text: "Jonas und sie haben sich am Abend nach dem Helfersamstag auf dem Steg geküsst; auf ihre Frage, ob er im Herbst noch hier ist, hat er gesagt: \"Ich weiß es nicht.\""
        from: ch05/s03
      - text: "Am 14. August hat Jonas Hannes am Tor geantwortet: \"Das Fest findet dieses Jahr auf dem Gut statt.\" Sie ist ihm um den Hals gefallen."
        from: ch07/s02
      - text: "Am 27. August hat sie in der untersten Schublade von Hedwigs Schreibtisch die Weidenkamp-Mappe mit Lageplan und Vorvertrag gefunden; die Stellplätze reichen bis in den Winkel hinter dem letzten Bogen, genau über die Lindenhof-Rose."
        from: ch09/s02
      - text: "Jonas hat den Vorvertrag am Donnerstag, dem 13. August, unterschrieben, dem Tag vor seiner Zusage an Hannes; laut Jonas bietet ihm das Büro eine Partnerschaft mit Einlage an, und er hatte ein Rücktrittsrecht bis nach dem Fest."
        from: ch08/s01
      - text: "Grete hat geahnt, dass so was kommt, und sie um Verzeihung gebeten; Hedwig hat auch Grete gesagt, wen sie sich für den Garten wünscht."
        from: ch08/s02
      - text: "Letzten Herbst hat Hedwig auf der Bank unter der Kletterrose ihre Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführt; das steht nirgends."
        from: ch08/s02
      - text: "In der Nacht hat sie Lena von Lageplan, Unterschrift, Steg, dem \"dieses Jahr\" und Hedwigs Wunsch erzählt; Lena wollte das Dorf anrufen, sie hat abgelehnt."
        from: ch08/s03
      - text: "In Klein Lindau haben beide Stecklinge der Lindenhof-Rose angewurzelt; den kräftigeren hat sie am 2. September eine Handbreit neben den alten Stock gepflanzt, der andere steht weiter unter Folie."
        from: ch09/s02
      - text: "Am alten Stock der Lindenhof-Rose hat sich die Knospe aus dem August geöffnet: eine einzige Blüte, zartrosa und gefüllt."
        from: ch09/s02
      - text: "Hannes hat den Steckling gesehen und gesagt: \"Mach man weiter, Deern\" und \"Den gießt du man jeden Morgen.\""
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, ist der Garten fertig; der Steckling vom Mittwoch treibt ein neues rötliches Blatt, die einzige Blüte der Lindenhof-Rose ist an den Rändern schon müde."
        from: ch10/s01
      - text: "Laut Anke sagt Grete, der Garten habe seit Jahren nicht so ausgesehen, und Hannes hat am Festmorgen um fünf mit Weste in der Küche gestanden."
        from: ch10/s01
      - text: "Der Motor am Morgen in der Remise war Hedwigs alter Trecker; Jonas fährt ihn mit der Erntekrone vorn im Umzug, Hannes geht daneben. Jonas hat sie am Rand gefunden und ihr ernst zugenickt."
        from: ch10/s01
      - text: "Lena hat für das Fest in der Scheune alte Fotos aus Dorfalben, Hedwigs Schublade und Hannes' Ausschusskiste aufgehängt, für sie und für Hedwig; darum lagen die Fotos auf Lenas Küchentisch."
        from: ch10/s02
      - text: "Auf einem Foto steht sie selbst als Mädchen mit Zopf oben auf der Gartenmauer, im rot-weiß gepunkteten Kleid, und schimpft den Jungen unten im Beet; der Junge ist Jonas. Er war auf einen Rosenstock getreten, sie hat gesagt, er habe Füße wie ein Ochse und keinen Verstand dazu."
        from: ch10/s02
      - text: "Laut Jonas hat er Hedwig das damals geschrieben, mit Zeichnung, und den Brief in Gretes Keksdose wiedergefunden."
        from: ch10/s02
      - text: "Jonas ist am Dienstag vom Vorvertrag zurückgetreten und trägt die Kosten selbst; in Hamburg hat er die Partnerschaft persönlich abgesagt."
        from: ch10/s03
      - text: "Jonas hat ihr gesagt: Drei Tage die Woche arbeitet er künftig von hier aus, das Dach macht er in Abschnitten, das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus, er bleibt; und er liebt sie."
        from: ch10/s03
      - text: "Hannes hat am Mittwoch vom Rücktritt gewusst; daher die Weste um fünf."
        from: ch10/s03
      - text: "Sie hat Jonas Hedwigs Wunsch erzählt und gesagt, sie wolle den Garten weiterführen, mit eigenem Betrieb und eigenem Wort, an seiner Seite, nicht in seinem Auftrag, und er solle sie vorher in seine Entscheidungen hineinnehmen; er hat ohne Zögern Ja gesagt und gleich gefragt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Der Jonas aus Hedwigs Notiz zum ersten Steckling der Lindenhof-Rose ist der Erbe; er hat als Kind das Loch gegraben, gegossen und den Steckling jeden Morgen mit dem Lineal gemessen, irgendwo in diesem Winkel."
        from: ch10/s03
      - text: "Sie hat Jonas geküsst und am Abend barfuß mit ihm auf dem Kies getanzt; Lena hat Jonas die Hand gegeben, ihn geduzt und willkommen geheißen. Grete hat mit Hannes getanzt."
        from: ch10/s03
    believes:
      - text: "Das ist keine Fläche, sondern ein Garten, angelegt in den Dreißigerjahren."
        from: ch04/s01
      - text: "Sie hat um jeden Stock gestritten, für sich selbst aber kein Wort eingelegt; ihr eigenes Herz hat sie nicht so verteidigt wie einen Garten."
        from: ch08/s02
      - text: "Am Steg hat sie schon geahnt, dass Jonas der Junge von damals war, und es für sich behalten."
        from: ch10/s02
      - text: "Nicht der Parkplatz allein hat wehgetan, sondern Jonas' Schweigen; auch den Rücktritt hat er wieder ohne sie beschlossen."
        from: ch10/s03
      - text: "Jonas bleibt und meint es ernst; sein Gesicht war ganz ruhig, ohne Zahlen darin."
        from: ch10/s03
      - text: "Sie ist angekommen."
        from: ch10/s03
    does_not_know:
      - "Dass der Rücktritt Jonas 38.000 Euro aus dem Ersparten für die Einlage kostet."
      - "Dass Jonas Hannes ausdrücklich gebeten hat, ihr nichts zu sagen."
      - "Was sonst in Hedwigs Keksdose liegt: Jonas' Kinderbriefe, seine Postkarten bis zum Studium, und dass Grete sie ihm am 31. August gegeben hat."
      - "Wer das Gartenbuch aufgeschlagen in den Ledersessel gelegt hat."
      - "Ob Jonas beim Unterschreiben wusste, dass der Parkplatz die Lindenhof-Rose trifft."
      - "Dass die Partner Jonas die Einlage bis nach dem Fest gestundet hatten."
      - "Dass Jonas sie am 13. August vom Hügel aus am Tor gesehen hat und auf der anderen Seite zum Kombi hinuntergegangen ist."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Dass Jonas für einen Gutachter zur Wertermittlung die Rechnungen für Dach und Fenster gesucht hat."
      - "Dass der Ausschuss die Zusage bis Freitag, den 14., verlangt hatte und sonst im reservierten Zelt hinter dem Feuerwehrhaus gefeiert hätte."
      - "Dass Lena Jonas gewarnt hat, Marie sei keine, mit der man einen Sommer spielt."
      - "Was Weidenkamp sonst plante: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg."
      - "Dass Weidenkamp Grete bei freiwilligem Auszug eine Abfindung vorsah."
      - "Wie Steinhagen den Rücktritt aufgenommen hat und dass die Gruppe noch ein zweites Gut im Blick hat."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr des Guts."
        from: ch03/s03
      - text: "Die Namen von Marie Albers, Hannes Kröger und Grete Paulsen."
        from: ch04/s01
      - text: "Der Makler wollte Ende Juli einen Fotografen für den Garten schicken."
        from: ch04/s01
      - text: "Laut Marie ist der Garten in den Dreißigerjahren angelegt; die 'Rosa Mundi' ist älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes hat gefragt, wohin das Erntefest dann soll."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg, der Parkplatz auf dem Rosengarten; ein paar Rosen bleiben in Kübeln."
        from: ch04/s02
      - text: "Grete hat ein lebenslanges Wohnrecht; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor."
        from: ch04/s02
      - text: "Für den Anbau an seinem Herrenhaus weiter im Süden musste der alte Park weichen; seitdem fehlt ihm etwas."
        from: ch04/s02
      - text: "Er hat Jonas angeboten, ihm Bedenkzeit in den Vertrag zu schreiben; Jonas hat den Notartermin am Montag, dem 10. August, zugesagt."
        from: ch07/s01
      - text: "Jonas hat am Donnerstag, dem 13. August, im Notariat in der Kreisstadt den Vorvertrag unterschrieben; er enthält ein Rücktrittsrecht bis zum zehnten September."
        from: ch07/s01
      - text: "Am Dienstag, dem 1. September, früh am Morgen hat Jonas ihm am Telefon gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt, 38.000 Euro; Jonas tut es leid um seine Arbeit."
        from: ch09/s01
      - text: "Die Gruppe hat noch ein zweites Gut im Blick."
        from: ch09/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste von Weidenkamp heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, nah am Haus, und die Mauer gibt den Sichtschutz gratis."
        from: ch04/s02
      - text: "Für das Erntefest findet sich immer eine Lösung, eine Veranstaltungsfläche gegen Gebühr zu fairen Konditionen."
        from: ch04/s01
      - text: "Der Kaffee im Notariat ist nicht so gut wie der von Frau Paulsen."
        from: ch07/s01
      - text: "Er hat Jonas' Rücktritt fast geahnt, seit dem Notar: Jonas wollte dort nur Wasser."
        from: ch09/s01
      - text: "Behält Jonas das Haus, fehlt ihm wenigstens nichts."
        from: ch09/s01
    does_not_know:
      - "Dass Jonas Hannes zugesagt hat, das Erntefest bleibe jedes Jahr auf dem Gut, und dass Jonas beim Fest am 5. September Hedwigs Trecker im Umzug gefahren ist."
      - "Dass Jonas in Hamburg die Partnerschaft abgesagt hat und künftig drei Tage die Woche vom Gut aus arbeiten will."
      - "Dass Marie am 27. August die Weidenkamp-Mappe mit Vorvertrag und Lageplan gefunden hat und nun mit Grete und Lena davon wissen."
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat, genau in der Ecke, bis zu der die Stellplätze reichen, und dass sie dort einen Steckling gepflanzt hat."
      - "Dass Jonas als Kind mit Hedwig den ersten Steckling der Lindenhof-Rose im Garten gepflanzt hat."
      - "Dass Hedwig sich Marie als Nachfolgerin im Garten gewünscht hat und Marie den Garten mit eigenem Betrieb weiterführen will."
      - "Dass Grete sonst nie Kaffee ohne Kuchen hinstellt."
      - "Dass am Samstag Mitte Juli Helfer aus dem Dorf den Garten hergerichtet haben und Jonas mitgearbeitet hat."
      - "Dass Marie und Jonas ein Paar sind."
