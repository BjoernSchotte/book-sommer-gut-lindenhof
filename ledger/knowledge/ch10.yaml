based_on: ["ch09#e2d68a", "ch10/s01#7366a9", "ch10/s02#b93375", "ch10/s03#b5a114"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf die Treppe gelegt."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Früher bekam die junge Marie für eine Stunde Unkraut ein Stück Streuselkuchen, jeden Dienstag und Freitag; sie selbst hat darüber Buch geführt, auf der Rückseite vom Kalender."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Sie hat Jonas das Mittagessen ohne ein Wort hingestellt."
        from: ch03/s03
      - text: "Mitte Juli kam Ralf Steinhagen zu Jonas aufs Gut; er sprach sie mit Namen an und sagte, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Steinhagen und Jonas auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen, obwohl am Morgen Butterkuchenduft über dem Hof lag; dann ist sie ohne sich umzusehen ins Haus gegangen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli arbeiten Helfer aus dem Dorf im Rosengarten (Landfrauen, Feuerwehr, Nachbarn), Hannes mit dem Trecker, Lena mit dem Klemmbrett; Jonas kam in geliehenen Gummistiefeln aus der Remise."
        from: ch05/s01
      - text: "Sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt, damit diesmal keiner mit leerem Teller dastand, und eine zweite Kanne Kaffee gebracht."
        from: ch05/s01
      - text: "Jonas hat gefragt, ob er zu den Helfern zählt; sie hat ihm zwei Bier aus der Helferkiste gegeben, die Kronkorken gleich mit abgemacht, und ihm Quark für den Nacken angeboten."
        from: ch05/s03
      - text: "Dienstag Ende Juli hat sie mittags Buttermilch und ein Blech Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt, wo Marie und Jonas Rosen zurückschnitten, und lange von Marie zu Jonas und zurück gesehen; dann ging sie ohne ein Wort zum Haus und nahm auf der Treppe jede Stufe einzeln."
        from: ch06/s01
      - text: "Marie hat Hedwigs Gartenbuch im Arbeitszimmer hiergelassen; es liegt dort auf dem Tisch neben der Lampe."
        from: ch06/s02
      - text: "Jonas hat an einem Donnerstag spät am Abend im Arbeitszimmer in den Ordnern Rechnungen fürs Dach gesucht und die fürs Dach gefunden; nach den Fenstern will er morgen weitersuchen."
        from: ch06/s02
      - text: "Jonas hat sich angeboten, ihren Einkauf (zehn Eier, ein Glas Rosengelee, Kartoffeln und Rindfleisch für Mittwoch) am Montag Anfang August auf dem Hansen-Hof zu holen; auf ihren Zettel hat sie doppelt unterstrichen geschrieben: Nicht vergessen zu bezahlen."
        from: ch06/s03
      - text: "Lena macht für sie montags den Hofladen auf, seit Jahren; die Strecke fährt sie seit Jahrzehnten."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet und ob der wiedergekommen ist."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, hat sie Jonas Bratkartoffeln mit Spiegelei hingestellt und ihn nach dem Herrn mit dem silbernen Auto gefragt; Jonas sagte: Hier war er nicht. Ich hatte Termine in der Stadt. Nichts Besonderes."
        from: ch07/s01
      - text: "Freitag, den 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank gebracht, Maries mit Milch, und ihr Blick hing einen Augenblick zu lange an Jonas."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, gegen Abend backt sie einen Probe-Butterkuchen fürs Erntefest, diesmal mit mehr Mandeln, weil Hannes sagt, letztes Jahr sei er zu trocken gewesen."
        from: ch08/s02
      - text: "Marie kam an diesem Abend ohne die Stiefel abzutreten in die Küche, riss beim Abnehmen ihrer Jacke den Aufhänger ab und sagte ihr nur ein Wort: Parkplatz."
        from: ch08/s02
      - text: "Sie hat Marie um Verzeihung gebeten, dass sie geschwiegen hat; sie hatte gedacht, Jonas sage es Marie selbst."
        from: ch08/s02
      - text: "Hedwig hat auch ihr gesagt, wen sie sich für den Garten wünscht; Marie hat genickt, als sie sie darauf ansprach, und weiß es also auch."
        from: ch08/s02
      - text: "Marie hat an ihrem Küchentisch geweint; sie hat ihr eine Ecke vom heißen Butterkuchen in Papier eingeschlagen mitgegeben und sie gebeten, morgen zu sagen, ob er zu süß ist, und die Astern am Rondell zu gießen."
        from: ch08/s02
      - text: "Am Montag, dem 31. August, abends in der Küche hat Jonas ihr gesagt: Ich fahr morgen früh nach Hamburg."
        from: ch09/s01
      - text: "Sie hat Jonas Hedwigs alte blaue Keksdose aus dem Fach unter der Fensterbank gegeben und ihm gesagt: Hedwig hat alles aufgehoben. Lies das, Jung. Was du dann machst, ist deine Sache. Über Marie hat sie den ganzen Abend kein Wort gesagt."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, gegen sieben stand Maries Wagen früh am Tor; sie hat Marie einen Becher Kaffee mit Milch und einen Teller Butterkuchen auf die Bank unter der Kletterrose gestellt und nicht gefragt, wo Marie seit Donnerstag gewesen war."
        from: ch09/s02
      - text: "Marie hat ihr gesagt, der Kuchen sei nicht zu süß, die Mandeln seien saftig, da habe Hannes nichts zu meckern; das habe sie ihr schon am Freitag sagen wollen."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie in der guten dunkelblauen Bluse mit Hedwigs blank geputzter Brosche Marie Kaffee mit Milch gebracht, über Jonas kein Wort gesagt und Marie geraten, sich was Schönes anzuziehen."
        from: ch10/s01
      - text: "Beim Fest in der Scheune standen ihre Bleche auf Lenas Tresen, Butterkuchen mit Mandeln und Bienenstich; sie stand an der Kaffeemaschine."
        from: ch10/s02
      - text: "In der Scheune hat sie Marie und Jonas zusammen an Lenas Fotowand stehen sehen."
        from: ch10/s02
      - text: "Am Abend hat Hannes sie im Garten zum Tanz aufgefordert; sie hat mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Das Gartenbuch gehört ins Arbeitszimmer, und Hedwig hätte gewollt, dass Jonas hineinsieht."
        from: ch06/s02
      - text: "Jonas hat beim Essen am 13. August geschwindelt: Er hat dabei die ganze Zeit sein Spiegelei angeguckt, und seit er klein war, sieht sie ihm an, wenn er schwindelt."
        from: ch08/s02
      - text: "Sie hat so was wie einen Parkplatz geahnt, das Wort nicht, aber so was; diesmal wollte sie es nicht wissen."
        from: ch08/s02
      - text: "Was Jonas nach dem Lesen der Keksdose macht, ist seine Sache."
        from: ch09/s01
      - text: "Die Deern hat mehr Ausdauer als der Giersch."
        from: ch09/s02
      - text: "Der Garten ist fertig fürs Fest: Da kann das Dorf kommen; die zwei Astern am Rondell fehlen nur Marie."
        from: ch10/s01
    does_not_know:
      - "Dass hinter dem Südende des Laubengangs der letzte Stock der Lindenhof-Rose steht und seine Knospe sich am 2. September zu einer Blüte geöffnet hat."
      - "Dass Marie im Hinterhof der alten Schmiede in Klein Lindau Stecklinge der Lindenhof-Rose gezogen und am 2. September einen davon neben den alten Stock gepflanzt hat."
      - "Dass Jonas im Gartenbuch die Notiz über den ersten Steckling der Lindenhof-Rose gefunden hat, bei dem er als Kind das Loch gegraben hat."
      - "Die Einzelheiten der Absprache zwischen Jonas und Marie (Budget, Zwischenstände mit Fotos, freie Hand bei den Rosen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' erst entsorgen wollte und ihnen nun Punktfundamente gibt."
      - "Dass der Makler am letzten Freitag im Juli einen Fotografen schicken will."
      - "Dass Jonas die Rechnungen für einen Gutachter braucht, der den Wert des Guts ermittelt."
      - "Was Steinhagens Unterlagen genau enthalten: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg und den Parkplatz genau auf dem Rosengarten."
      - "Dass Weidenkamp ihr lebenslanges Wohnrecht bestehen lässt, für ihren freiwilligen Auszug aber eine großzügige Abfindung vorsieht und Jonas sie darauf ansprechen soll."
      - "Dass Hannes Steinhagen nach dem Erntefest gefragt hat und Steinhagen eine Veranstaltungsfläche gegen Gebühr anbot."
      - "Dass der Festausschuss bis Freitag, den 14., eine Zusage von Jonas brauchte und Jonas Hannes zugesagt hat, das Fest finde dieses Jahr auf dem Gut statt."
      - "Dass Jonas' 'Termine in der Stadt' am 13. August die Unterschrift unter einen Vorvertrag mit Weidenkamp beim Notar in der Kreisstadt waren, mit Rücktrittsrecht bis zum 10. September."
      - "Dass Marie die Mappe mit Vorvertrag und Lageplan im untersten Fach von Hedwigs Schreibtisch gefunden und Jonas im Arbeitszimmer zur Rede gestellt hat."
      - "Dass Jonas' Einlage fürs Büro fällig war und die Partner sie ihm bis nach dem Fest gestundet haben."
      - "Dass Jonas am 1. September vom Rücktrittsrecht Gebrauch gemacht hat, 38.000 Euro für Notar und Planung selbst trägt und die Partnerschaft in Hamburg persönlich abgesagt hat."
      - "Dass Jonas Hannes zugesagt hat, das Fest bleibe nicht nur dieses Jahr, sondern auch nächstes und danach auf dem Gut."
      - "Dass Jonas Marie gesagt hat, er bleibe, arbeite drei Tage die Woche von hier, und ihr Haus bleibe ihr Haus."
      - "Dass Lena Jonas gewarnt hat, mit Marie keinen Sommer zu spielen."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
      - "Dass Marie und Jonas sich am Festnachmittag in der Mauerecke hinter dem Laubengang ausgesprochen und geküsst haben und Jonas Marie gesagt hat, dass er sie liebt."
      - "Dass Marie in der Nacht zu Lena auf den Hansen-Hof gegangen ist und ihr alles erzählt hat."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg im Rosengarten ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Rings um die Sonnenuhr sitzen alte Holunderstubben unter dem Kies, an der Westseite ein Brombeerwurzelstock, dem Marie seit drei Tagen mit der Hacke nicht beikommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will langsam ziehen, nach Norden zum Tor hin, damit der Ballen die Rose nicht mitreißt."
        from: ch03/s02
      - text: "Mit derselben Kette hat er für Hedwig den Fliederbusch an der Remise herausgeholt."
        from: ch03/s02
      - text: "Er hat Jonas gefragt, ob das Erntefest auf dem Gut bleibt; Jonas sagte, das könne er noch nicht sagen, es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen, die er selbst noch nicht kenne."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Er bringt Sonnabend um halb acht den Trecker, um den Stubben herauszuziehen."
        from: ch03/s02
      - text: "Jonas hat ihm einen Becher Kaffee gebracht, schwarz, und Marie einen mit Milch."
        from: ch03/s02
      - text: "Mitte Juli schaufelt er mit Marie Kies vom Hänger auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht und Jonas getroffen; er kannte seinen Namen."
        from: ch04/s01
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund; Marie hielt dagegen, das sei ein Garten aus den Dreißigerjahren."
        from: ch04/s01
      - text: "Auf seine Frage, wo das Erntefest dann hin solle, sagte Steinhagen, es fände sich eine Lösung: eine Veranstaltungsfläche gegen Gebühr, für Vereine zu sehr fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kam er kurz nach sechs mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine; Timo brachte das zweite Gespann mit Kies für die Seitenwege."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln, eine Nummer zu groß, und sagte, er sei hier, um anzufassen; er hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Er hat mit einem Pfiff über den Garten klargestellt: Im Garten ist Marie die Chefin, wer das nicht weiß, fragt sie."
        from: ch05/s01
      - text: "Jonas ist als Kind, der Lütte von Hedwig, bei ihm auf dem Hänger über die Stoppeln mitgefahren, barfuß; Hedwig musste ihn mit Kuchen vom Hänger locken. Jonas sagt, an den Diesel erinnere er sich noch."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen frei; er hat Jonas die Hand gegeben, ihn Jonas genannt und Du zu ihm gesagt."
        from: ch05/s02
      - text: "Der Festausschuss hat am Sonntagabend Anfang August gesessen und braucht bis Freitag, den 14., eine Zusage von Jonas, auf die man bauen kann; sonst wird im Zelt hinter dem Feuerwehrhaus gefeiert, das schon reserviert ist."
        from: ch06/s03
      - text: "Er hat Jonas das am Montag Anfang August am Hoftor des Hansen-Hofs gesagt, als Jonas Gretes Einkaufskiste in den Kofferraum trug; Jonas hat geantwortet: Bis dahin kriegst du eine Antwort."
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, nachmittags hat er Jonas am schmiedeeisernen Tor gesagt, heute sei die Antwort fällig; Jonas hat geantwortet: Das Fest findet dieses Jahr auf dem Gut statt."
        from: ch07/s02
      - text: "Marie ist Jonas daraufhin am Tor um den Hals gefallen, so heftig, dass er einen Schritt zurück gegen das Tor machen musste."
        from: ch07/s02
      - text: "Am Dienstag, dem 1. September, früh am Fuß des Hügels hat Jonas ihm gesagt: Das Fest bleibt auf dem Gut, Hannes. Nicht nur dieses Jahr. Nächstes auch, und danach. Er bestellt das Zelt ab."
        from: ch09/s01
      - text: "Samstag fährt Jonas beim Fest vorn, mit Hedwigs altem Trecker, den er im Frühjahr gemacht hat; Jonas ist noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Jonas hat ihn gebeten, Marie nichts zu sagen, das müsse er selbst; er hat geantwortet, man rede nicht für andere, aber Jonas solle sie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, nachmittags hat er hellen Kies fürs Rondell gebracht und mit Marie geschaufelt."
        from: ch09/s02
      - text: "Neben dem alten Stock in der Ecke hinter dem Laubengang hat Marie einen Steckling mit rötlichen Blättern in frische Erde gepflanzt; darüber ist eine Blüte offen."
        from: ch09/s02
      - text: "Marie hat ihm gesagt: Samstag ist Fest, und was danach mit dem Garten wird, sagt ihr keiner, Jonas am wenigsten."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, ist Jonas Hedwigs alten Trecker mit der Erntekrone vorn im Umzug durch die Lindenallee gefahren; er selbst ging in Weste mit Ehrennadel, die Mütze in der Hand, neben dem Vorderrad, wie früher neben Hedwig. Das Dorf hat geklatscht."
        from: ch10/s01
      - text: "Am Abend hat er im Garten Grete zum Tanz aufgefordert, und sie hat mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Im Garten läuft es (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Mit dem Spaten wird das nichts; mit Kette und Trecker ist der Stubben schnell heraus."
        from: ch03/s02
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Jonas hat gut gearbeitet; morgen tut ihm alles weh."
        from: ch05/s02
      - text: "Die Frist ist keine Drohung; die Leute wollen wissen, wo sie ihre Bänke hinstellen."
        from: ch06/s03
      - text: "Das Erntefest bleibt auf dem Gut; nun kann er den Weizen in Ruhe dreschen."
        from: ch07/s02
      - text: "Er habe nie daran gezweifelt, dass das Fest auf dem Gut bleibt (so sagt er es Jonas)."
        from: ch09/s01
      - text: "Marie soll weitermachen, und den Steckling soll sie jeden Morgen gießen; das weiß man eben."
        from: ch09/s02
    does_not_know:
      - "Dass der alte Stock hinter dem Laubengang die letzte Lindenhof-Rose ist und Marie in Klein Lindau einen weiteren Steckling davon zieht."
      - "Dass Steinhagens Lageplan den Parkplatz genau auf den Rosengarten legt."
      - "Dass Jonas am 13. August beim Notar einen Vorvertrag mit Weidenkamp unterschrieben hat und am 1. September davon zurückgetreten ist."
      - "Dass die Partner in Hamburg Jonas' Einlage bis nach dem Fest gestundet haben und Jonas die Partnerschaft abgesagt hat."
      - "Dass Marie und Jonas sich am Abend am Steg geküsst haben."
      - "Dass Jonas Marie am Festnachmittag unter der Kletterrose alles gesagt hat und sie sich ausgesprochen haben."
      - "Dass Marie am 27. August den Vorvertrag gefunden hat und Grete und Lena nun vom Parkplatz wissen."
      - "Dass Lena ihn anrufen und das Dorf zusammentrommeln wollte und Marie das abgelehnt hat."
  jonas-behrendt:
    knows:
      - text: "Die Gärtnerin im Rosengarten heißt Marie Albers."
        from: ch01/s01
      - text: "Marie hält die Kletterrose am Hauptweg für eine 'New Dawn', kein Gestrüpp, und lehnt Bagger und Splitt auf dem Weg ab."
        from: ch01/s01
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite; für das Dach steht ein Angebot vom Dachdecker bis Ende Juni aus."
        from: ch01/s02
      - text: "Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen, über die Wege wird noch geredet; ihr Stundensatz steht nicht zur Verhandlung."
        from: ch01/s02
      - text: "Neue Absprache mit Marie: Die Rankbögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief); er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg Ende Juni frei zu haben, vom Tor bis zur Pforte, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Donnerstag um neun Uhr ist in Hamburg die Abnahme des Parkdecks; das Büro braucht ihn dort."
        from: ch02/s02
      - text: "Für die Partnerschaft im Büro ist seine Einlage fällig."
        from: ch02/s02
      - text: "Laut Makler gibt es einen Kaufinteressenten aus der Hotelbranche."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben (gute Wege, Blüten mit Blick vom Haus, keine Ecke, die nach Arbeit aussieht), dann gehe es um andere Zahlen; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Am letzten Freitag im Juli soll ein Fotograf des Maklers den Garten fotografieren."
        from: ch02/s02
      - text: "Erinnerung aus der Kindheit: ein Floß aus Brettern am Gutssee, und Hedwig rief ihn zum Kuchen."
        from: ch02/s02
      - text: "Die Rankbögen der 'Ghislaine' sitzen seit einer Woche fest im Beton und halten; er hat nachgerechnet, was die Fundamente tragen müssen."
        from: ch03/s01
      - text: "Seit dem Gewitter unter den Bögen sagen er und Marie Du zueinander."
        from: ch03/s01
      - text: "Laut Marie hat Hedwig ihr mit zehn den ersten Rosenschnitt beigebracht (über dem Auge, schräg) und ihr ihre alte Schere mit dem roten Griff geschenkt, die Marie noch heute benutzt."
        from: ch03/s01
      - text: "Laut Marie bekam sie als Kind von Grete für eine Stunde Unkraut ein Stück Streuselkuchen, dienstags und freitags, und kam im ersten Sommer jeden Tag mit dem Rad."
        from: ch03/s01
      - text: "Laut Marie redete Hedwig laut mit den Rosen, schimpfte mit der 'Rosa Mundi' und lobte die 'Ghislaine' jeden Juni; Marie redet ebenfalls mit den Rosen."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat Grete ihm gesagt."
        from: ch03/s02
      - text: "Hannes Kröger hat gefragt, ob das Erntefest auf dem Gut bleibt; er hat keine Zusage gegeben, Hannes hat nur genickt."
        from: ch03/s02
      - text: "Das Erntefest ist laut Hannes am ersten Samstag im September; Hannes bringt Sonnabend um halb acht den Trecker."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; die Nummer hat er vom Makler. Steinhagen kennt Zimmerzahl, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Steinhagen besichtigt das Gut am übernächsten Montag, Mitte Juli; er hat zugesagt und den Termin eingetragen, Steinhagen schickt eine Bestätigung."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen, verrutschte Pfannen und faulendes Laub in der Rinne."
        from: ch03/s03
      - text: "Grete hat ihm und Steinhagen auf der Terrasse Kaffee ohne Kuchen hingestellt; in all den Kindersommern hatte sie ihm keine Tasse ohne Kuchen hingestellt, bis zu diesem Morgen."
        from: ch04/s02
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund; Marie sagte, das sei keine Fläche, sondern ein Garten aus den Dreißigerjahren, und die 'Rosa Mundi' sei älter als sie und Steinhagen zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; er selbst hat dazu geschwiegen."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz unten am Steg; er hat Grundrisse, Schnitte und eine Kostenschätzung nach Gewerken durchgesehen, die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Laut Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit einer Zufahrt durch das Tor; ein paar Rosen will Weidenkamp als Akzent in Kübeln behalten."
        from: ch04/s02
      - text: "Grete behält ihr lebenslanges Wohnrecht; zieht sie freiwillig aus, sieht Weidenkamp eine großzügige Abfindung vor. Steinhagen bat ihn, das bei Gelegenheit bei ihr anzusprechen."
        from: ch04/s02
      - text: "Steinhagen erzählte von einem Herrenhaus weiter im Süden, dessen alter Park für den Anbau weichen musste; das Haus läuft gut, aber seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Auf Maries Frage, was Steinhagen wollte, hat er nur gesagt: ein Interessent."
        from: ch04/s02
      - text: "Am Samstag Mitte Juli helfen Leute aus dem Dorf im Rosengarten; Hannes hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Lena hat ihn beim Helfersamstag den ganzen Tag gesiezt, das Klemmbrett vor der Brust; um fünf fragte sie, ob er nächsten Samstag Zeit habe, und er hat Ja gesagt."
        from: ch05/s03
      - text: "Die nummerierten Stellplätze des Lageplans reihen sich genau dort, wo er an der Südmauer gräbt."
        from: ch05/s02
      - text: "Laut Hannes ist er als Kind barfuß auf Hannes' Hänger über die Stoppeln mitgefahren, nach der Gerste, und Hedwig musste ihn mit Kuchen herunterlocken; er erinnert sich an Diesel und Stroh, Hannes' Gesicht hat er nicht behalten."
        from: ch05/s02
      - text: "In der Mitte der Südmauer, nahe der Pforte, wächst unter den Ranken ein alter Rosenstock; Marie sagt, es ist eine 'Ghislaine de Féligonde', die seit Jahren keiner mehr gesehen hat."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte bis zum Geräteschuppen frei; Hannes hat ihm die Hand gegeben, ihn Jonas genannt und Du zu ihm gesagt."
        from: ch05/s02
      - text: "Grete hat ihm auf seine Frage, ob er zu den Helfern zählt, zwei Bier gegeben und Quark für seinen Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "Er hat Marie am Steg von seinen Flößen erzählt: drei, das größte mit Zeichnung geplant, mitten auf dem See abgesoffen; Hedwig lachte am Ufer und sagte, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Er und Marie haben sich bei Sonnenuntergang am Steg geküsst; er hat gesagt, das wollte er seit dem Gewitter, und Marie sagte: Ich auch."
        from: ch05/s03
      - text: "Auf Maries Frage, ob er im Herbst noch hier ist, hat er geantwortet: Ich weiß es nicht."
        from: ch05/s03
      - text: "Laut Marie sind Ende Juli die Gallica und die Damaszener am Tor zum Rückschnitt dran, weil sie nur einmal im Jahr blühen; die Büsche am Rondell bleiben, wie sie sind, und hängen im September voller roter Hagebutten."
        from: ch06/s01
      - text: "Das Junibild kommt laut Marie nicht wieder; Glanz im September heißt: die 'New Dawn' blüht nach (sie schiebt schon wieder Knospen), davor Lavendel und Katzenminze, Frauenmantel an den Kanten, Astern, am Laubengang Dahlien in Reihen."
        from: ch06/s01
      - text: "Grete hat mittags Buttermilch und Johannisbeerkuchen auf die Bank gestellt, lange von Marie zu ihm gesehen und auf der Treppe jede Stufe einzeln genommen; laut Marie meldet sich das bei Grete nur bei Regen, sagt Grete."
        from: ch06/s01
      - text: "Lena hat ihn für den Samstag schon eingetragen, mit Ankunft und Abfahrt; sein Name steht auf der Helferliste am schwarzen Brett im Hofladen. Welchen Samstag, hat er nicht nachgelesen."
        from: ch06/s03
      - text: "Auf seine Nachricht, ob sie morgen wiederkommt, schrieb Marie: Die Rosen fragen das nicht. Die wissen das."
        from: ch06/s01
      - text: "Der Gutachter will für die Wertermittlung jede Rechnung für Dach und Fenster in der Hand haben; die Rechnung fürs Dach (Umdeckung Nordseite, mit Stempel) hat er gefunden, nach den Fenstern sucht er weiter."
        from: ch06/s02
      - text: "Die Fensterflügel im Arbeitszimmer bleiben nach einer Handbreit stecken."
        from: ch06/s02
      - text: "Marie hat Hedwigs Gartenbuch im Arbeitszimmer hiergelassen; laut Grete gehört es dahin, und Hedwig hätte gewollt, dass er hineinsieht."
        from: ch06/s02
      - text: "Im Gartenbuch steht unter der Überschrift Lindenhof-Rose, datiert auf einen Juli vor sechsundzwanzig Jahren: Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen."
        from: ch06/s02
      - text: "Er erinnert sich wieder: Er hat als Kind mit Hedwig den Steckling aus einem Erdbeer-Joghurtbecher gepflanzt, sie sagte 'Nicht drücken', und er hat ihn danach jeden Morgen barfuß mit dem Lineal gemessen; am fünften Tag waren es dreieinhalb."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet; zu Weihnachten ein Anruf von zehn Minuten."
        from: ch06/s02
      - text: "Lena macht für Grete montags den Hofladen auf, seit Jahren; Frieda hat von 'Tante Rosen' eine Dahlie geschenkt bekommen."
        from: ch06/s03
      - text: "Lena hat ihm im Hofladen gesagt: Marie ist keine, mit der man einen Sommer spielt; tut er es doch, nimmt sie es ihm übel, und das ganze Dorf mit ihr. Auf seine Frage, ob Marie ihr etwas gesagt habe, sagte Lena, das müsse er Marie selbst fragen."
        from: ch06/s03
      - text: "Der Festausschuss braucht laut Hannes bis Freitag, den 14., eine Zusage, auf die man bauen kann, sonst wird im reservierten Zelt hinter dem Feuerwehrhaus gefeiert; er hat Hannes geantwortet: Bis dahin kriegst du eine Antwort."
        from: ch06/s03
      - text: "Die Partner in Hamburg wollten am Donnerstag, dem 13., um neun persönlich über seine Einlage sprechen; statt hinzufahren hat er an dem Morgen kurz nach sieben vom Hügel hinter der Scheune mit einem Partner telefoniert, der es hinnahm, dass er nicht nach Hamburg kommt. Die Hamburger Uhrzeit auf dem Briefumschlag ist durchgestrichen."
        from: ch07/s01
      - text: "Nur oben auf dem Hügel hinter der Scheune kommt das Gespräch aus dem Büro durch."
        from: ch07/s01
      - text: "Der Dachdecker hat zurückgerufen und eine Summe für den Herbst genannt; er hat sie unter die durchgestrichene Hamburger Uhrzeit auf den Briefumschlag geschrieben."
        from: ch07/s01
      - text: "Am Donnerstag, dem 13. August, hat er im Notariat in der Kreisstadt in Steinhagens Beisein den Vorvertrag mit Weidenkamp unterschrieben, nachdem der Notar ihn vorgelesen hatte; Marie hatte er unten am Tor aus dem Kastenwagen steigen sehen und war auf der anderen Seite des Hügels zum Kombi gegangen."
        from: ch07/s01
      - text: "Der Vorvertrag gibt ihm ein Rücktrittsrecht bis zum 10. September, fünf Tage nach dem Fest; der Preis eines Rücktritts frisst fast alles, was er für die Einlage gespart hat."
        from: ch07/s01
      - text: "Laut Steinhagen hat bei Weidenkamp noch nie jemand so ein Rücktrittsrecht gezogen."
        from: ch07/s01
      - text: "Auf dem Lageplan reicht die graue Fläche der Stellplätze bis an die Mauer, bis in die Ecke hinter dem Laubengang."
        from: ch07/s01
      - text: "Grete hat ihn beim Essen gefragt, ob der Herr mit dem silbernen Auto wiedergekommen ist, darüber rede das Dorf; er hat geantwortet: Hier war er nicht. Ich hatte Termine in der Stadt. Nichts Besonderes. Sie sagte: Na, denn, Jung."
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat Marie ihn in den Winkel hinter dem letzten Bogen des Laubengangs geführt: Dort steht die Lindenhof-Rose, die Hedwig selbst gezogen hat, kniehoch und krumm, der einzige Stock, den es noch gibt; am längeren Trieb sitzt eine Knospe mit rosa Saum, und laut Marie blüht er wieder."
        from: ch07/s02
      - text: "Marie hat die alte Pflanze im Juni unter den Brombeeren gefunden und die Ecke seitdem vor allen versteckt."
        from: ch07/s02
      - text: "Grete hat mittags Butterkuchen und Kaffee auf die Bank gebracht, und ihr Blick hing einen Augenblick zu lange an ihm."
        from: ch07/s02
      - text: "Er hat Hannes am Tor, als die Antwort fällig war, gesagt: Das Fest findet dieses Jahr auf dem Gut statt; Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, später Nachmittag, kam er vom Hügel ins Arbeitszimmer und fand Marie vor der offenen untersten Schublade mit der Weidenkamp-Mappe: Sie hat Lageplan und Vorvertrag mit seiner Unterschrift gesehen."
        from: ch08/s01
      - text: "Er hat Marie gesagt, das sei ein Vorvertrag, im Büro biete man ihm eine Partnerschaft an, für die er bis Monatsende eine Einlage bringen müsse, das Haupthaus sei schlimmer als die Scheune, und er habe ein Rücktrittsrecht bis nach dem Fest."
        from: ch08/s01
      - text: "Marie hat ihm gesagt: Den Garten hätte sie ihm notfalls hergegeben, aber nicht hinter ihrem Rücken, nicht nach dem Steg; und auf der Schwelle: Er habe sich jede Rose erklären lassen und den Parkplatz nicht erklärt."
        from: ch08/s01
      - text: "Marie hat die Mappe auf den Schreibtisch gelegt, den Lageplan obenauf, und ist an ihm vorbei hinausgegangen; er hat sie nicht aufgehalten."
        from: ch08/s01
      - text: "Das Gartenbuch lag nicht mehr am Fenster, sondern aufgeschlagen, mit dem Rücken nach oben, im Ledersessel in der Ecke des Arbeitszimmers."
        from: ch08/s01
      - text: "Seit Donnerstag, dem 27. August, steht Maries weißer Kastenwagen nicht mehr am Tor; auf keine seiner vier Nachrichten vom Hügel kam eine Antwort."
        from: ch09/s01
      - text: "Am Montag, dem 31. August, hat Grete ihm Hedwigs alte blaue Keksdose gegeben, die er aus den Kindersommern kennt, als er sich auf Zehenspitzen Butterkekse herausstahl: Hedwig hat alles aufgehoben. Lies das, Jung. Was du dann machst, ist deine Sache. Über Marie sagte sie kein Wort."
        from: ch09/s01
      - text: "In der Dose liegen seine Kinderbriefe in Druckschrift an LIEBE TANTE HEDWIG, mit der Frage, wie viele Zentimeter der Steckling gewachsen sei, bitte mit Lineal messen."
        from: ch09/s01
      - text: "In der Dose liegt seine Zeichnung eines Mädchens mit Zopf, die Fäuste in die Seiten gestemmt, auf einer Mauer, daneben in seiner Kinderschrift: Die hat mit mir geschimpft. Er war damals zwölf, die Kleine kaum fünf."
        from: ch09/s01
      - text: "In der Dose liegen seine Postkarten aus Zeltlager und Klassenfahrt mit jedes Jahr weniger Text; die letzte, aus dem Studium, sagt: Nächsten Sommer komm ich bestimmt. Im Sommer darauf kam er nicht, später nur zwei-, dreimal für ein Wochenende; Hedwig hat die Karte glattgestrichen ganz unten aufbewahrt."
        from: ch09/s01
      - text: "Die Partner haben ihm die Einlage bis nach dem Fest gestundet, weil Weidenkamps Anzahlung noch aussteht."
        from: ch09/s01
      - text: "Sein Plan auf dem Briefumschlag: Dach Nordseite im Herbst, Südseite nächstes Jahr, Rinnen selbst; Büro zwei Tage, drei hier; Notar und Planung 38.000 aus dem Ersparten, das für die Einlage gedacht war."
        from: ch09/s01
      - text: "Am Dienstag, dem 1. September, morgens hat er Steinhagen vom Hügel aus gesagt, er ziehe das Rücktrittsrecht und trage wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst, 38.000 Euro."
        from: ch09/s01
      - text: "Steinhagen hat es nach eigenen Worten fast geahnt, seit dem Notar, weil er nur Wasser wollte; die Gruppe hat noch ein zweites Gut im Blick; Steinhagen wünschte ihm Glück mit dem Haus, dann fehle ihm wenigstens nichts."
        from: ch09/s01
      - text: "Er hat die Partnerschaft in Hamburg persönlich abgesagt."
        from: ch10/s03
      - text: "Er hat Hannes am Fuß des Hügels gesagt, das Fest bleibe auf dem Gut, nicht nur dieses Jahr, nächstes auch und danach; Hannes bestellt das Zelt ab."
        from: ch09/s01
      - text: "Er hat Hannes gebeten, Marie nichts zu sagen, das müsse er selbst; Hannes sagte, man rede nicht für andere, aber er solle sie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Am Samstag, dem 5. September, ist er Hedwigs alten Trecker mit der Erntekrone vorn im Umzug durch die Lindenallee gefahren, Hannes in Weste neben dem Vorderrad; das Dorf hat geklatscht. Am Rand hat er Marie gefunden und ihr ernst zugenickt; sie hat sich weggedreht."
        from: ch10/s01
      - text: "An Lenas Fotowand in der Scheune hängt ein altes Foto: Hedwig an der Gartenmauer, daneben er als dünner barfüßiger Junge mit zerschrammtem Knie, oben auf der Mauer Marie als Mädchen mit Zopf im rot-weiß gepunkteten Kleid. Marie ist das Mädchen, das ihn beschimpft hat, weil er auf einen Rosenstock getreten war: Füße wie ein Ochse und keinen Verstand dazu."
        from: ch10/s02
      - text: "Lena hat ihn in der Scheune angefahren: Sie trauen sich was, Herr Behrendt. Nach allem? Marie hat sie zurückgehalten: Das ist ihre Sache."
        from: ch10/s02
      - text: "Er hat Marie am späten Nachmittag auf der Bank unter der Kletterrose gesagt: Rücktritt am Dienstag, die Kosten trägt er selbst, Partnerschaft abgesagt, drei Tage die Woche Arbeit von hier, das Dach in Abschnitten, das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus, er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Marie hat ihm gesagt: Der Parkplatz war es nicht, nicht nur; sein Schweigen hat wehgetan, und den Rücktritt hat er wieder allein, ohne sie beschlossen."
        from: ch10/s03
      - text: "Laut Marie hat Hedwig ihr im letzten Herbst auf dieser Bank die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführt."
        from: ch10/s03
      - text: "Marie will den Garten an seiner Seite weiterführen, nicht in seinem Auftrag, und er soll sie in seine Entscheidungen hineinnehmen, vorher, nicht hinterher; er hat ohne zu zögern Ja gesagt und gleich gefragt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Marie hat in ihrem Hinterhof seit Juni Stecklinge der Lindenhof-Rose gezogen; einer steht eine Handbreit neben dem alten Stock und hat ein neues rötliches Blatt geschoben, der zweite steht noch unter der Folie. Die einzige Blüte am alten Stock hängt müde."
        from: ch10/s03
      - text: "Er hat Marie von der Notiz im Gartenbuch erzählt, vom ersten Steckling, für den er das Loch gegraben hat und den er jeden Morgen mit dem Lineal gemessen hat; danach haben sie sich geküsst."
        from: ch10/s03
      - text: "Am Abend hat er mit Marie im Garten getanzt und ihr zweimal auf die Zehen getreten; Lena hat ihm die Hand gegeben, Willkommen, Jonas gesagt, ihn geduzt und ihn gebeten, gut auf Marie aufzupassen."
        from: ch10/s03
    believes:
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Das Haupthaus ist schlimmer dran als das Scheunendach."
        from: ch03/s03
      - text: "Steinhagen ist der Käufer, den er wollte: einer, der rechnen kann, in Flächen und Fristen denkt und sich nicht lange bitten lässt."
        from: ch03/s03
      - text: "Ob das, was zwischen ihm und Marie unter den Bögen angefangen hat, eine Last verträgt, weiß er nicht; die richtige Entscheidung fühlt sich an wie ein Riss im Fundament."
        from: ch03/s03
      - text: "Mit einem Parkplatz hat er seit dem Wort Stellplatzlösung gerechnet, mit der Zeile über Gretes Abfindung nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "Die jungen Triebe an der Südmauer haben dieselben kleinen, glänzenden Blätter wie die Rose an den Bögen, die er im Juni verschrotten wollte."
        from: ch05/s02
      - text: "Er hat das fremde, warme Gefühl, auf dem Gut mitgerechnet zu werden."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Er ist nicht so klug wie Maries Rosen."
        from: ch06/s01
      - text: "Einer der nummerierten Stellplätze des Lageplans liegt über dem Loch, das er als Kind für den Steckling gegraben hat; welcher Kasten über dieser Stelle liegt, hat er nie ausgerechnet und rechnet es auch jetzt nicht aus."
        from: ch07/s01
      - text: "Er rechnet nicht mehr aus, was sich lohnt, sondern was trägt."
        from: ch09/s01
      - text: "Hannes hat am Fest auf dem Gut gezweifelt, auch wenn er sagt, er habe nie daran gezweifelt; trotzdem war es gut."
        from: ch09/s01
      - text: "Marie musste es zuerst hören, vor allen anderen."
        from: ch10/s02
      - text: "Der erste Steckling, den er mit Hedwig gepflanzt hat, steht irgendwo hier in der Mauerecke hinter dem Laubengang."
        from: ch10/s03
    does_not_know:
      - "Wie die Partner in Hamburg die Absage der Partnerschaft aufgenommen haben."
      - "Dass Grete ihm die Antwort über die Termine in der Stadt nicht geglaubt hat und ihm angesehen hat, dass er schwindelt."
      - "Wo genau im Garten er den Steckling damals gepflanzt hat und ob der Stock in der Ecke hinter dem Laubengang aus diesem Steckling stammt."
      - "Dass Marie mit Lena über ihn gesprochen hat und Lena meint, Marie habe Gefühle für ihn."
      - "Dass Marie nach dem Streit Grete das Wort Parkplatz gesagt und in der Nacht Lena alles erzählt hat, auch vom Steg."
      - "Dass Marie am Steg schon geahnt hat, dass er der Junge von damals war, und es für sich behalten hat."
      - "Dass Lena die Fotos für die Ausstellung aus den Alben im Dorf, Hedwigs Schublade und Hannes' Ausschusskiste gesammelt hat."
  lena-hansen:
    knows:
      - text: "Laut Marie stand in Jonas' Tabelle beim Laubengang 'Entsorgung' für beide Rankbögen der 'Ghislaine', die zweiundfünfzig Jahre alt sind."
        from: ch02/s03
      - text: "Laut Marie kniete Jonas in heller Hose ins nasse Gras vor den Bogen, rüttelte am Eisen, stellte fehlendes Fundament fest und skizzierte eins auf die Rückseite seiner Tabelle: vierzig mal vierzig, achtzig tief wegen Frost."
        from: ch02/s03
      - text: "Laut Marie kam Jonas in geputzten Lederschuhen, seine Hose ist an beiden Knien grün und hin, und am ersten Tag ließ er sie samt Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Marie sagt, sie habe Jonas dazu gebracht, die Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Marie hat zehn Eier für den nächsten Morgen gekauft und zwei Stück Butterkuchen von ihr bekommen; sie sehen sich am Freitag wieder."
        from: ch02/s03
      - text: "Am Samstag Mitte Juli hat sie am Tor die Helfer abgehakt (drei Landfrauen mit Hacken, vier Mann von der Feuerwehr, die Nachbarn vom Dorfteich mit Schubkarren) und die Arbeit verteilt: Wege harken, Giersch an der Westmauer, Kies schaufeln."
        from: ch05/s01
      - text: "Marie hat ihren Rosen Namensschilder gemacht, damit keiner was rausreißt."
        from: ch05/s01
      - text: "Jonas kam in geliehenen Gummistiefeln; sie hat ihn gesiezt und eingetragen."
        from: ch05/s01
      - text: "Um fünf hat sie Jonas gefragt, ob er nächsten Samstag Zeit hat, und er hat Ja gesagt; auf der Helferliste am schwarzen Brett im Hofladen steht er mit Ankunft und Abfahrt."
        from: ch06/s03
      - text: "Für Grete macht sie montags den Hofladen auf, seit Jahren; am Montag Anfang August hat Jonas Gretes Einkauf geholt, und sie hat die Kiste gepackt, ohne auf den Zettel zu sehen."
        from: ch06/s03
      - text: "Sie hat Jonas gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie es ihm übel, und das ganze Dorf mit ihr; auf seine Frage, ob Marie ihr etwas gesagt habe, hat sie ihn an Marie verwiesen."
        from: ch06/s03
      - text: "Laut Frieda hat Tante Rosen ihr eine Dahlie geschenkt."
        from: ch06/s03
      - text: "In der Nacht vom 27. August, um Viertel vor zwölf, kam Marie an ihre Küchentür; auf dem Küchentisch lagen alte Fotos, die sie vor Marie mit einem Geschirrtuch zugedeckt hat."
        from: ch08/s03
      - text: "Laut Marie gibt es einen Lageplan mit grauen Kästchen über dem Rosengarten bis an die Mauer, und Jonas hat heimlich beim Notar einen Vorvertrag unterschrieben, gerade und ohne Zögern."
        from: ch08/s03
      - text: "Laut Marie haben sie und Jonas sich am Abend am Steg geküsst."
        from: ch08/s03
      - text: "Laut Marie hat Jonas Hannes vor zwei Wochen am Tor gesagt, das Fest finde dieses Jahr auf dem Gut statt, und Marie hielt das für ein Versprechen."
        from: ch08/s03
      - text: "Laut Marie hat Hedwig ihr letzten Herbst beim Tee auf der Bank unter der Kletterrose die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführt; aufgeschrieben ist das nirgends, weder im Testament noch auf einem Zettel."
        from: ch08/s03
      - text: "Marie hat das nie erzählt, weil es nach Erbschleicherei klingt, und sie hat sich geschämt, bevor überhaupt einer etwas gesagt hat."
        from: ch08/s03
      - text: "Marie hat Gretes Butterkuchen mitgebracht; sie hat ihn mitten durchgeschnitten."
        from: ch08/s03
      - text: "Sie hat Marie angeboten, morgen früh Hannes anzurufen, sie habe die Helferliste mit jeder Nummer; Marie sagte: Das ist meine Sache, Lena. Nicht die vom Dorf."
        from: ch08/s03
      - text: "Beim Erntefest am 5. September hat sie in der Scheune an Mats' Stelltafeln Dutzende alte Fotos ausgestellt, jedes mit einem Zettel in ihrer Schrift (aus dem Album der Petersens, aus Hedwigs Schublade, aus Hannes' Ausschusskiste), für Marie und für Hedwig; darunter Hedwig mit der Erntekrone, Hedwig und Grete am Kuchentisch und ganz am Ende Hedwig an der Gartenmauer mit einem barfüßigen Jungen und einem Mädchen mit Zopf oben auf der Mauer."
        from: ch10/s02
      - text: "Sie hat Jonas in der Scheune angefahren, ob er sich nach allem was traue; Marie hat sie am Arm gefasst: Das ist meine Sache. Jonas hat Marie gesagt, er müsse ihr etwas sagen, sie müsse es zuerst hören, und sie unter die Kletterrose gebeten; Marie sagte: Fünf Minuten."
        from: ch10/s02
      - text: "Am Abend hat Marie mit Jonas im Garten getanzt; sie hat Jonas die Hand gegeben, ihn willkommen geheißen, geduzt und ihn gebeten, gut auf Marie aufzupassen."
        from: ch10/s03
    believes:
      - text: "Marie hat Gefühle für Jonas; das ist mindestens ein Liebeskummer mit zwei Stück Kuchen."
        from: ch08/s03
      - text: "Die Landfrauen stechen Giersch, seit Marie laufen kann; Namensschilder brauchen sie nicht."
        from: ch05/s01
      - text: "Die Dahlie im Glas hält eine Woche."
        from: ch06/s03
      - text: "Marie hat Hedwig seit ihrem zehnten Jahr den Giersch gestochen; wer ihr Erbschleicherei nachsagt, kriegt es mit ihr zu tun."
        from: ch08/s03
      - text: "Jonas gehört jetzt dazu und zu Marie; sie hat es doch gleich gesagt."
        from: ch10/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat, Stecklinge davon zieht und einen neben den alten Stock gepflanzt hat."
      - "Wer der Käufer ist (Weidenkamp Hotels, Ralf Steinhagen) und was er außer dem Parkplatz plant."
      - "Dass Jonas den Hauptweg Ende Juni frei haben wollte."
      - "Dass Marie und Jonas seit dem Gewitter unter den Bögen Du zueinander sagen."
      - "Dass Jonas für eine Partnerschaft im Büro eine Einlage braucht und ein Rücktrittsrecht bis nach dem Fest hat."
      - "Was Jonas Marie unter der Kletterrose gesagt hat: dass er am 1. September vom Vorvertrag zurückgetreten ist, die Partnerschaft abgesagt hat und bleibt."
      - "Dass Jonas Hannes zugesagt hat, das Fest bleibe auch nächstes Jahr und danach auf dem Gut."
      - "Dass Grete etwas geahnt, geschwiegen und Marie um Verzeihung gebeten hat."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe aus Hamburg."
        from: ch01/s01
      - text: "Jonas will den Rosengarten bis zum Erntefest am 5. September hergerichtet haben: Wege begehbar, Beete sauber, alles, was man vom Haus aus sieht."
        from: ch01/s02
      - text: "Absprache mit Jonas: freie Hand bei den Rosen, über die Wege wird noch geredet; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Grete hat ihr zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Laut Hedwigs Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Neue Absprache: Die Rankbögen bleiben und bekommen Punktfundamente, Jonas bestellt Beton, sie bindet die Rose selbst wieder an; dafür muss der Hauptweg Ende Juni frei sein, vom Tor bis zur Pforte, mit Fotos."
        from: ch02/s01
      - text: "Die Bögen sitzen fest im Beton; Jonas hat daran gerüttelt, nichts gab nach. Sie bindet die 'Ghislaine' wieder an, danach kommt der achte Bogen dran."
        from: ch03/s01
      - text: "Seit dem Gewitter unter den Bögen sagen sie und Jonas Du zueinander; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Hedwig hat ihr mit zehn den ersten Rosenschnitt beigebracht, über dem Auge, schräg, und ihr die alte Schere mit dem roten Griff geschenkt, die sie heute noch hat."
        from: ch03/s01
      - text: "Hedwig hat ihr im letzten Herbst auf der Bank unter der 'New Dawn' die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführt, wenn sie nicht mehr kann; aufgeschrieben ist das nirgends."
        from: ch08/s03
      - text: "Der Hauptweg ist frei; Hannes hat den Garten gelobt (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Auf Hannes' Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas keine Zusage gegeben: es hänge an Gutachten für Dach und Fenster, an den Kosten und an Fristen."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker, um die Stubben an der Sonnenuhr zu ziehen, nach Norden zum Tor hin, weg von der 'Rosa Mundi'."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Jonas hat ihr Kaffee mit Milch gebracht; dass sie Milch nimmt, hat er von Grete."
        from: ch03/s02
      - text: "Mitte Juli schaufelt sie mit Hannes Kies auf die Hauptachse."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat das Gut besucht und mit Jonas auf der Terrasse gesessen; worüber sie sprachen, hat sie nicht gehört."
        from: ch04/s01
      - text: "Grete hat den beiden Kaffee ohne Kuchen gebracht, obwohl am Morgen Butterkuchenduft über dem Hof lag."
        from: ch04/s01
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund und sagte, der Garten werde auf den Fotos sehr schön; von welchen Fotos er sprach, weiß sie nicht."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; Jonas schwieg."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, sagte Jonas nur: ein Interessent."
        from: ch04/s02
      - text: "Für den Helfersamstag Mitte Juli hat sie an jeden Stock, der stehen bleiben muss, ein Pappschild mit der Sorte gehängt, vom Tor bis zur Pforte; die Mauerecke hinter dem Südende des Laubengangs hat sie im Dunkeln selbst freigeschnitten und nur mit einem leeren Schild an einem Pfahl markiert."
        from: ch05/s01
      - text: "Hannes hat Jonas an die Brombeeren an der Südmauer westlich der Pforte geschickt, fort von der Ecke am Laubengang."
        from: ch05/s01
      - text: "Hannes hat über den Garten gerufen, im Garten sei sie die Chefin."
        from: ch05/s01
      - text: "Ole von der Feuerwehr hat an der 'Maiden's Blush' einen langen Trieb abgeknickt; sie hat ihn mit Hedwigs Schere eine Handbreit tiefer abgeschnitten. Die Rose lebt, aber daran hätten im nächsten Juni Blüten gesessen."
        from: ch05/s01
      - text: "Jonas hat an der Südmauer nahe der Pforte einen alten Stock der 'Ghislaine de Féligonde' freigelegt, den seit Jahren keiner gesehen hat; sie hat die jungen Triebe lose mit Bast angebunden."
        from: ch05/s02
      - text: "Grete hat Jonas zwei Bier aus der Helferkiste gegeben und ihm Quark für den Sonnenbrand im Nacken angeboten."
        from: ch05/s03
      - text: "Lena hat Jonas den ganzen Tag gesiezt und ihn um fünf gefragt, ob er nächsten Samstag Zeit hat; laut Jonas hat Lena ihn schon eingetragen, mit Ankunft und Abfahrt."
        from: ch06/s01
      - text: "Jonas hat als Junge am See Flöße gebaut, aus Brettern aus der Remise mit Wäscheleine; das größte soff mitten auf dem See ab, Hedwig lachte und sagte, aus ihm werde nie ein Schiffbauer."
        from: ch05/s03
      - text: "Sie und Jonas haben sich bei Sonnenuntergang am Steg geküsst; er sagte, das wollte er seit dem Gewitter, sie sagte: Ich auch."
        from: ch05/s03
      - text: "Mats hat die Bank im Garten gerichtet, die Latten neu verschraubt und das Holz glatt geschliffen."
        from: ch05/s03
      - text: "Auf ihre Frage, ob er im Herbst noch hier ist, hat Jonas gesagt: Ich weiß es nicht."
        from: ch05/s03
      - text: "Dienstag Ende Juli schneidet sie mit Jonas die einmalblühenden Gallica und Damaszener zurück; sie hat ihm erklärt, dass das Junibild nicht wiederkommt und Glanz im September Nachblüte der 'New Dawn', Stauden, Astern und Dahlien am Laubengang heißt."
        from: ch06/s01
      - text: "Grete hat mittags Buttermilch und Johannisbeerkuchen auf die Bank gestellt, lange von ihr zu Jonas und zurück gesehen und ist ohne ein Wort zum Haus gegangen, jede Stufe einzeln; laut Grete meldet sich das nur bei Regen."
        from: ch06/s01
      - text: "Am Mittwoch, dem 2. September, kurz nach fünf, haben im Hinterhof der alten Schmiede in Klein Lindau beide Stecklinge der Lindenhof-Rose getrieben; feine weiße Wurzeln halten den Ballen bis an den Rand. Den kräftigeren hat sie mitgenommen, über den anderen die Folie wieder glattgezogen."
        from: ch09/s02
      - text: "Jonas hat ihr abends geschrieben: Kommst du morgen wieder? Auf ihre Antwort, die Rosen fragten das nicht, schrieb er: Ich bin nicht so klug wie deine Rosen."
        from: ch06/s01
      - text: "Am Donnerstag, dem 13. August, morgens ist sie mit dem Kastenwagen am Tor vorgefahren und hat eine Kiste mit Töpfen ausgeladen."
        from: ch07/s01
      - text: "Sie hat Jonas die Lindenhof-Rose gezeigt und ihm gesagt, dass Hedwig sie selbst gezogen hat, dass es nur noch diesen einen Stock gibt, dass er wieder blüht und dass sie ihn im Juni unter den Brombeeren gefunden hat; Jonas blieb stumm."
        from: ch07/s02
      - text: "Jonas hat ihr die Finger geküsst, einen nach dem anderen, dort, wo die Dornen rote Striche gezogen hatten."
        from: ch07/s02
      - text: "Hannes kam am 14. August ans Tor, weil an diesem Freitag Jonas' Antwort zum Fest fällig war; davon hatte ihr vorher niemand etwas erzählt."
        from: ch07/s02
      - text: "Jonas hat Hannes gesagt: Das Fest findet dieses Jahr auf dem Gut statt."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, sind die ersten Astern auf, die 'New Dawn' über der Bank steht in zweiter Blüte, und die Knospe der Lindenhof-Rose wird seit zwei Wochen jeden Tag dicker."
        from: ch08/s01
      - text: "Das Gartenbuch fehlte am 27. August auf seinem Platz am Fenster; es lag aufgeschlagen, mit dem Rücken nach oben, im Ledersessel in der Ecke des Arbeitszimmers."
        from: ch08/s01
      - text: "In der untersten, klemmenden Schublade von Hedwigs Schreibtisch lag unter Dachrechnungen eine Mappe von Weidenkamp Hotels, der Firma des Mannes, der im Juli den Garten ein Pfund genannt hatte."
        from: ch08/s01
      - text: "Auf dem Lageplan in der Mappe liegen graue Stellplätze über dem Rosengarten bis an den Backstein, bis in den Winkel hinter dem letzten Bogen, genau über der Lindenhof-Rose; auch über der Sonnenuhr liegt ein graues Kästchen."
        from: ch08/s01
      - text: "Jonas hat den Vorvertrag am Donnerstag, dem 13. August, unterschrieben, gerade und ohne Zögern, einen Tag bevor er Hannes die Zusage fürs Fest gab."
        from: ch08/s01
      - text: "Laut Jonas bietet man ihm im Büro eine Partnerschaft an, für die er bis Monatsende eine Einlage bringen muss; das Haupthaus sei schlimmer als die Scheune (Nordseite, Rinnen), und er habe ein Rücktrittsrecht bis nach dem Fest."
        from: ch08/s01
      - text: "Grete hat am 27. August geahnt, dass so etwas wie ein Parkplatz kommt; sie hat gemerkt, dass Jonas über den Herrn mit dem silbernen Auto geschwindelt hat, geschwiegen, weil sie dachte, er sage es Marie selbst, und sie um Verzeihung gebeten."
        from: ch08/s02
      - text: "Hedwig hat auch Grete gesagt, wen sie sich für den Garten wünscht."
        from: ch08/s02
      - text: "Grete hat ihr eine Ecke vom heißen Probe-Butterkuchen mitgegeben und gesagt, sie solle morgen sagen, ob er zu süß ist, und die Astern am Rondell gießen."
        from: ch08/s02
      - text: "Sie hat Lena in derselben Nacht vom Lageplan, von Jonas' Unterschrift, vom Steg, vom 'dieses Jahr' und von Hedwigs Wunsch erzählt; Lena wollte Hannes anrufen, sie hat abgelehnt: Das sei ihre Sache, nicht die vom Dorf."
        from: ch08/s03
      - text: "Am Mittwoch, dem 2. September, fehlte Jonas' Kombi auf dem Gutshof."
        from: ch09/s02
      - text: "Gegen sieben hat Grete ihr Kaffee mit Milch und Butterkuchen auf die Bank unter der Kletterrose gestellt und nichts gefragt; sie hat Grete gesagt, der Kuchen sei nicht zu süß und die Mandeln saftig, da habe Hannes nichts zu meckern. Grete hat ihr über den Zopf gestrichen."
        from: ch09/s02
      - text: "Sie hat den kräftigeren Steckling eine Handbreit neben dem alten Stock eingepflanzt und angegossen."
        from: ch09/s02
      - text: "Am Nachmittag hat Hannes hellen Kies fürs Rondell gebracht; sie haben zusammen geschaufelt. Hannes hat den Steckling neben dem alten Stock gesehen, die Mütze abgenommen und gesagt, sie solle weitermachen und ihn jeden Morgen gießen."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie das Rondell ein letztes Mal geharkt; die Lindenhof-Rose trägt noch ihre einzige Blüte, an den Rändern schon müde, und der Steckling vom Mittwoch hat an der Spitze ein neues rötliches Blatt. Sie hat ihn gegossen."
        from: ch10/s01
      - text: "Grete kam in der guten dunkelblauen Bluse mit Hedwigs Brosche, brachte ihr Kaffee mit Milch, sagte über Jonas kein Wort und riet ihr, sich was Schönes anzuziehen."
        from: ch10/s01
      - text: "Laut Anke hat Grete gesagt, so habe der Garten seit Jahren nicht ausgesehen, und Hannes hat am Festmorgen schon um fünf in Weste in der Küche gestanden."
        from: ch10/s01
      - text: "Im Umzug durch die Lindenallee ist Jonas in weißem Hemd Hedwigs alten Trecker mit der Erntekrone vorn gefahren, den Motor, den sie am Morgen in der Remise gehört hat; Hannes ging in Weste mit Ehrennadel neben dem Vorderrad. Jonas hat sie am Rand gefunden und ihr ernst zugenickt; sie hat sich weggedreht."
        from: ch10/s01
      - text: "Lena hat für sie und für Hedwig in der Scheune eine Fotowand gemacht, mit Bildern aus den Alben im Dorf, aus Hedwigs Schublade und aus Hannes' Ausschusskiste; dafür lagen die zugedeckten Fotos auf Lenas Küchentisch."
        from: ch10/s02
      - text: "Auf einem alten Foto stehen Hedwig an der Gartenmauer und Jonas als dünner barfüßiger Junge unten im Beet, und oben auf der Mauer steht sie selbst als Mädchen mit Zopf im rot-weiß gepunkteten Kleid: Sie hat ihn beschimpft, weil er auf einen Rosenstock getreten war, Füße wie ein Ochse und keinen Verstand dazu."
        from: ch10/s02
      - text: "Laut Jonas hat er das Tante Hedwig geschrieben, mit Zeichnung, und den Brief in Gretes Keksdose wiedergefunden."
        from: ch10/s02
      - text: "Jonas hat ihr auf der Bank unter der Kletterrose gesagt: Am Dienstag ist er vom Vorvertrag zurückgetreten, die Kosten trägt er selbst, die Partnerschaft in Hamburg hat er persönlich abgesagt; drei Tage die Woche arbeitet er künftig von hier, das Dach macht er in Abschnitten; das Erntefest bleibt jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus; er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Hannes hat am Mittwoch schon vom Rücktritt gewusst, als er den Dahlien antwortete statt ihr; daher die Weste um fünf."
        from: ch10/s03
      - text: "Sie hat Jonas Hedwigs Wunsch gesagt und ihm gesagt, dass sie den Garten an seiner Seite weiterführen will, nicht in seinem Auftrag, und dass er sie vorher in seine Entscheidungen hineinnehmen soll; er hat ohne zu zögern Ja gesagt und gefragt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Sie hat Jonas die Stecklinge gezeigt; Jonas hat ihr erzählt, dass laut Hedwigs Gartenbuch er als Kind für den ersten Steckling der Lindenhof-Rose das Loch gegraben und gegossen und ihn danach jeden Morgen mit dem Lineal gemessen hat."
        from: ch10/s03
      - text: "Am Abend hat sie mit Jonas barfuß auf dem Kies getanzt; Lena hat Jonas willkommen geheißen und geduzt, und er hat darüber gestutzt."
        from: ch10/s03
    believes:
      - text: "Splitt auf dem Hauptweg würde den alten Kies zerstören."
        from: ch01/s01
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Sie hat Jonas dazu gebracht, Hedwigs Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Das hinter dem Haus ist keine Fläche, sondern ein Garten, angelegt in den Dreißigerjahren; die 'Rosa Mundi' ist älter als sie und Steinhagen zusammen und treibt jedes Frühjahr wieder aus."
        from: ch04/s01
      - text: "Lenas Ton gegenüber Jonas ist ihr Vertreterton aus dem Hofladen; Lena misstraut jedem ohne Klemmbrett."
        from: ch06/s01
      - text: "Ihr Herzklopfen damals beim Gewitter kam nicht vom Wetter."
        from: ch05/s03
      - text: "Weil aus Haus und Garten keine Nachricht durchkommt, schreibt Jonas ihr vom Hügel hinter der Scheune."
        from: ch06/s01
      - text: "Sie ist Grete nicht böse, sondern sich selbst: Auch sie hat geschwiegen."
        from: ch08/s02
      - text: "Sie hat um jeden Stock gestritten, aber ihr eigenes Herz nicht so verteidigt wie einen Garten."
        from: ch08/s02
      - text: "Hedwigs Wunsch zu erzählen klingt nach Erbschleicherei."
        from: ch08/s03
      - text: "Was Lena in dieser Nacht für sich behalten will, geht sie nichts an."
        from: ch08/s03
      - text: "Solange die Finger zu tun haben, muss der Kopf nicht mit."
        from: ch10/s02
      - text: "Der Parkplatz war es nicht, nicht nur: Jonas' Schweigen hat wehgetan, und auch den Rücktritt hat er allein beschlossen."
        from: ch10/s03
      - text: "Jonas meint es ernst und bleibt; sie glaubt ihm."
        from: ch10/s03
      - text: "Sie ist angekommen."
        from: ch10/s03
    does_not_know:
      - "Wer das Gartenbuch aufgeschlagen in den Ledersessel gelegt hat."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Dass ein Gutachter den Wert des Guts ermittelt."
      - "Was die Sanierung von Dach und Fenstern des Gutshauses kostet."
      - "Dass am letzten Freitag im Juli ein Fotograf des Maklers den Garten fotografieren soll."
      - "Was Weidenkamp außer dem Parkplatz plant: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg."
      - "Dass Weidenkamp Grete für einen freiwilligen Auszug eine Abfindung anbieten wollte."
      - "Dass das Rücktrittsrecht bis zum 10. September lief und der Rücktritt Jonas 38.000 Euro aus dem Ersparten für die Einlage kostet."
      - "Dass die Partner Jonas die Einlage bis nach dem Fest gestundet hatten."
      - "Dass Jonas Hannes am 1. September gebeten hat, ihr nichts zu sagen."
      - "Dass Grete Jonas am 31. August Hedwigs Keksdose gegeben hat und darin auch seine Kinderbriefe über den Steckling und seine Postkarten lagen."
      - "Dass Jonas den Termin der Partner in Hamburg am 13. August nicht wahrgenommen hat."
      - "Dass der Festausschuss die Frist schon Anfang August gesetzt und Jonas Hannes damals eine Antwort versprochen hat."
      - "Dass Lena Jonas im Hofladen gewarnt hat, mit ihr keinen Sommer zu spielen."
      - "Dass Jonas sie vom Hügel aus bei der Arbeit beobachtet hat, am Laubengang und am Rondell, und am 13. August auf der anderen Seite des Hügels hinuntergegangen ist, statt zu ihr."
      - "Dass Jonas als Kind auf Hannes' Hänger mitgefahren ist und Hannes ihn nicht vergessen hat."
      - "Wo genau im Garten Jonas' erster Steckling stand und ob der alte Stock aus ihm stammt."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zahl der Zimmer im Gutshaus, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Jonas hat der Besichtigung am übernächsten Montag, Mitte Juli, zugestimmt."
        from: ch03/s03
      - text: "Die Namen von Marie Albers, Hannes Kröger und Grete Paulsen."
        from: ch04/s01
      - text: "Laut Marie ist der Garten in den Dreißigerjahren angelegt, mit diesen Wegen und dieser Mauer, und die 'Rosa Mundi' ist älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes Kröger fragt, wo das Erntefest hin soll, wenn das Gut ein Hotel wird."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht."
        from: ch04/s02
      - text: "Jonas hat die Unterlagen durchgesehen, nichts zugesagt und nichts abgesagt; er nannte die Abfindung großzügig und widersprach nicht."
        from: ch04/s02
      - text: "Am Donnerstag, dem 13. August, hat Jonas im Notariat in der Kreisstadt in seinem Beisein den Vorvertrag mit Weidenkamp unterschrieben, ohne abzusetzen; den Kaffee lehnte Jonas ab, Wasser reiche."
        from: ch07/s01
      - text: "Der Vorvertrag enthält ein Rücktrittsrecht für Jonas bis zum 10. September."
        from: ch07/s01
      - text: "Am Dienstag, dem 1. September, früh hat Jonas ihm gesagt, er ziehe das Rücktrittsrecht und trage wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst, 38.000 Euro."
        from: ch09/s01
      - text: "Die Gruppe hat noch ein zweites Gut im Blick."
        from: ch09/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste von Weidenkamp heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, nah am Haus, kurze Wege, die Mauer gibt Sichtschutz gratis."
        from: ch04/s02
      - text: "Für das Erntefest findet sich eine Lösung: eine Veranstaltungsfläche gegen Gebühr, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Seinem Herrenhaus im Süden fehlt etwas, seit der alte Park für den Anbau weichen musste; was, könnte er nicht sagen."
        from: ch04/s02
      - text: "Der Kaffee im Notariat ist nicht so gut wie der von Frau Paulsen."
        from: ch07/s01
      - text: "Er hat den Rücktritt fast geahnt, seit dem Notar, weil Jonas nur Wasser wollte."
        from: ch09/s01
      - text: "Behält Jonas das Haus, fehlt ihm wenigstens nichts."
        from: ch09/s01
    does_not_know:
      - "Dass Hedwig sich gewünscht hat, der Rosengarten möge zum Erntefest wieder blühen."
      - "Dass hinter dem Laubengang der letzte Stock der Lindenhof-Rose steht und Jonas als Kind beim ersten Steckling geholfen hat."
      - "Dass Helfer aus dem Dorf den Rosengarten am Samstag Mitte Juli gemeinsam hergerichtet haben und Jonas mit angepackt hat."
      - "Dass an der Südmauer ein alter Stock der 'Ghislaine de Féligonde' freigelegt wurde."
      - "Dass Jonas Hannes zugesagt hat, das Erntefest bleibe dieses Jahr und auch künftig auf dem Gut."
      - "Dass Jonas das Geld aus dem Verkauf für seine Einlage im Büro brauchte und die 38.000 Euro aus dem Ersparten für die Einlage nimmt."
      - "Dass Jonas und Marie sich am Steg geküsst haben."
      - "Dass Marie am 27. August die Mappe mit Lageplan und Vorvertrag gefunden hat und Grete und Lena nun vom Parkplatz wissen."
      - "Dass das Erntefest am 5. September auf dem Gut gefeiert wurde, Jonas Hedwigs Trecker im Umzug fuhr und bleibt."
