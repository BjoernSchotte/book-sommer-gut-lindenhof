based_on: ["ch09#884662", "ch10/s01#7366a9", "ch10/s02#b93375", "ch10/s03#b5a114"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch lag im Arbeitszimmer, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf der Treppe liegen lassen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Marie hat den Auftrag, den Garten bis zum Fest fertig zu machen, und sagt, Jonas wolle verkaufen."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag morgens Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Als Kind hat Marie jeden Dienstag und Freitag im Garten gearbeitet, eine Stunde Unkraut für ein Stück Streuselkuchen; sie selbst hat auf der Rückseite vom Kalender Buch geführt."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Mitte Juli kam ein Gast im silbernen Firmenwagen aufs Gut; er sprach sie als Frau Paulsen an und sagte, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat dem Gast und Jonas auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen, und ist ohne sich umzusehen ins Haus zurückgegangen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli kamen Helfer aus dem Dorf zum Arbeitseinsatz in den Garten; sie hat drei Bleche Butterkuchen auf den Terrassentisch gestellt, damit diesmal keiner mit leerem Teller dastand."
        from: ch05/s01
      - text: "Sie hat im Lauf des Vormittags eine zweite Kanne Kaffee über die Terrasse getragen und gerufen, wer jetzt keinen Kuchen esse, kriege nachher den Rand."
        from: ch05/s01
      - text: "Jonas hat am Abend gefragt, ob er für die Helferkiste Bier zählt; sie hat ihm zwei Flaschen gegeben und die Kronkorken gleich mit abgemacht."
        from: ch05/s03
      - text: "Jonas hat einen Sonnenbrand im Nacken; sie hat ihm Quark angeboten."
        from: ch05/s03
      - text: "An einem Dienstag Ende Juli hat sie mittags Marie und Jonas im Garten einen Krug Buttermilch und ein Blech Johannisbeerkuchen auf die Bank unter der 'New Dawn' gestellt und von Marie zu Jonas und zurück gesehen, ohne ein Wort."
        from: ch06/s01
      - text: "Marie hat das Gartenbuch im Arbeitszimmer gelassen; es liegt dort neben der Lampe."
        from: ch06/s02
      - text: "Jonas sucht im Arbeitszimmer in Hedwigs Ordnern die Rechnungen für Dach und Fenster; sie hat ihm gesagt, er könne ruhig mal ins Gartenbuch sehen."
        from: ch06/s02
      - text: "Jonas hat die Rechnung fürs Dach gefunden; nach den Fenstern will er am nächsten Tag weitersuchen."
        from: ch06/s02
      - text: "Jonas hat sich angeboten, an einem Montag Anfang August ihren Einkauf im Hofladen der Hansens zu holen; sie hat ihm einen Zettel geschrieben (zehn Eier, ein Glas Rosengelee, Kartoffeln und Rindfleisch für Mittwoch), darunter doppelt unterstrichen: Nicht vergessen zu bezahlen."
        from: ch06/s03
      - text: "Lena macht ihr seit Jahren montags den Hofladen auf."
        from: ch06/s03
      - text: "Im Dorf wird über den Herrn mit dem silbernen Auto geredet, ob der wiedergekommen ist; das hat sie Jonas am Donnerstag, dem 13. August, beim Essen gesagt."
        from: ch07/s01
      - text: "Sie hat Jonas an dem Tag einen Teller Bratkartoffeln mit Spiegelei hingestellt; auf ihre Frage hat er gesagt, er habe Termine in der Stadt gehabt, Büro, nichts Besonderes. Sie hat geantwortet: \"Na, denn, Jung.\""
        from: ch07/s01
      - text: "Am Freitag, dem 14. August, hat sie mittags Butterkuchen und Kaffee auf die Bank im Garten gebracht, Maries Kaffee mit Milch, ihren Blick einen Augenblick zu lange an Jonas gelassen und ist wieder hinaufgegangen."
        from: ch07/s02
      - text: "Am Donnerstag, dem 27. August, gegen Abend backt sie in der Küche Probe-Butterkuchen fürs Erntefest; Hannes sagt, letztes Jahr seien sie zu trocken gewesen."
        from: ch08/s02
      - text: "Marie kam an dem Abend in die Küche und sagte nur ein Wort: \"Parkplatz.\" Jonas' Verkaufspläne sehen also einen Parkplatz vor; sie bringt das mit dem Herrn mit dem silbernen Auto zusammen."
        from: ch08/s02
      - text: "Sie hat so etwas geahnt, das Wort nicht, aber so was; beim Essen mit dem Gerede über das silberne Auto hat Jonas die ganze Zeit sein Spiegelei angeguckt."
        from: ch08/s02
      - text: "Sie hat Marie um Verzeihung gebeten, ohne Aber und ohne Weil."
        from: ch08/s02
      - text: "Hedwig hat ihr gesagt, wen sie sich für den Garten wünscht; Marie weiß es auch, sie hat auf Gretes Frage genickt."
        from: ch08/s02
      - text: "Marie hat am Küchentisch geweint; sie hat ihre Hand auf Maries Faust gelegt, bis Marie Hedwigs Schere mit dem roten Griff aufs Wachstuch gleiten ließ."
        from: ch08/s02
      - text: "Sie hat Marie eine heiße Ecke vom Probe-Butterkuchen in Papier eingeschlagen mitgegeben und gesagt, sie solle morgen sagen, ob er zu süß ist, die Astern am Rondell gieße sonst keiner. Marie hat die Schere ins Holster gesteckt, die Jacke übergezogen und ist gegangen."
        from: ch08/s02
      - text: "Am Montag, dem 31. August, abends in der Küche hat Jonas gesagt: \"Ich fahr morgen früh nach Hamburg.\""
        from: ch09/s01
      - text: "Sie hat Jonas an dem Abend Hedwigs alte blaue Keksdose aus dem Fach unter der Fensterbank über den Tisch geschoben: \"Hedwig hat alles aufgehoben.\" und \"Lies das, Jung. Was du dann machst, ist deine Sache.\" Über Marie hat sie kein Wort gesagt."
        from: ch09/s01
      - text: "Seit Donnerstag, dem 27. August, war Marie nicht mehr auf dem Gut; am Mittwoch, dem 2. September, stand ihr Wagen früh am Tor."
        from: ch09/s02
      - text: "Am Mittwoch, dem 2. September, gegen sieben hat sie Marie einen Becher Kaffee mit Milch und einen Teller Butterkuchen auf die Bank unter der Kletterrose gestellt, nichts gefragt, ihr über den Zopf gestrichen und ist wieder hinaufgegangen."
        from: ch09/s02
      - text: "Laut Marie ist der Butterkuchen nicht zu süß und die Mandeln sind saftig, da habe Hannes nichts zu meckern; das wollte Marie ihr schon am Freitag sagen."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie Marie im Garten Kaffee gebracht (\"Milch ist drin.\"), in der guten dunkelblauen Bluse, am Kragen Hedwigs Brosche, blank geputzt. Über Jonas hat sie kein Wort gesagt."
        from: ch10/s01
      - text: "Laut Marie fehlen am Rondell noch zwei Astern; sie hat ihr gesagt, die fehlten nur ihr, und sie solle sich was Schönes anziehen."
        from: ch10/s01
      - text: "Beim Fest steht sie in der Scheune an der Kaffeemaschine; auf Lenas Tresen stehen ihre Bleche, Butterkuchen mit Mandeln und Bienenstich."
        from: ch10/s02
      - text: "In der Scheune hat sie Marie und Jonas zusammen vor Lenas Fotowand gesehen, den Kopf rasch zur Kanne gesenkt und in den Dampf hinein gelächelt."
        from: ch10/s02
      - text: "Am Abend hat Hannes beim Tanz im Garten die Mütze abgenommen und ihr die Hand hingehalten; sie hat gesagt \"Bist du nicht klug, in unserm Alter?\" und doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Hedwigs Wunsch im Testament gilt Marie, auch wenn ihr Name nicht drinsteht."
        from: ch01/s03
      - text: "Der Verkauf ist Jonas' Sache, der Garten ist Maries."
        from: ch01/s03
      - text: "Das Gartenbuch gehört ins Arbeitszimmer, und Hedwig hätte gewollt, dass Jonas hineinsieht."
        from: ch06/s02
      - text: "Jonas hat beim Essen am 13. August über die Termine in der Stadt geschwindelt; seit er so klein war, sieht sie ihm an, wenn er schwindelt. Diesmal wollte sie es nicht wissen."
        from: ch08/s02
      - text: "Was Jonas tut, wenn er gelesen hat, was Hedwig in der Dose aufgehoben hat, ist seine Sache."
        from: ch09/s01
      - text: "Die Deern hat mehr Ausdauer als der Giersch."
        from: ch09/s02
      - text: "Der Garten ist fertig fürs Fest: \"Da kann das Dorf kommen.\""
        from: ch10/s01
    does_not_know:
      - "Dass Jonas am 13. August im Notariat in der Kreisstadt bei Steinhagen von Weidenkamp einen Vorvertrag unterschrieben hat (Rücktrittsrecht bis 10. September)."
      - "Dass Jonas am 1. September Steinhagen gegenüber das Rücktrittsrecht gezogen hat und die 38.000 Euro für Notar und Planung selbst trägt (die Szenen sagen nicht, ob sie es erfährt)."
      - "Dass Jonas in Hamburg die Partnerschaft persönlich abgesagt hat und künftig drei Tage die Woche vom Gut aus arbeiten will."
      - "Dass Jonas Marie unter der Kletterrose gesagt hat, er bleibe, Gretes Haus bleibe Gretes Haus, und er liebe sie."
      - "Dass Jonas Hannes am 1. September zugesagt hat, das Fest bleibe dauerhaft auf dem Gut."
      - "Was Jonas in der Keksdose gelesen hat und was er sich nachts auf dem Briefumschlag notiert hat (Dach in Abschnitten, Büro zwei Tage, drei hier)."
      - "Wo Marie seit Donnerstag, dem 27. August, gewesen ist."
      - "Dass Marie am 2. September einen Steckling der Lindenhof-Rose neben den alten Stock hinter dem Laubengang gepflanzt hat."
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat und in Klein Lindau Stecklinge davon zieht."
      - "Dass Jonas die Mappe mit Vorvertrag und Lageplan in Hedwigs Schreibtisch verwahrt hat und Marie sie dort gefunden hat."
      - "Was genau im Lageplan steht: dass die Stellplätze bis in die Ecke hinter dem Laubengang reichen."
      - "Dass Jonas Hannes am 14. August zugesagt hat, das Fest finde dieses Jahr auf dem Gut statt (keine Szene belegt, dass sie es mitbekommt)."
      - "Welche Bedingungen Marie und Jonas auf der Terrasse ausgehandelt haben (freie Hand bei den Rosen, Budgetrahmen, Fotos alle zwei Wochen)."
      - "Welche Bedingungen Marie Jonas am Festnachmittag gestellt hat (an seiner Seite, nicht in seinem Auftrag; Entscheidungen vorher gemeinsam)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' entsorgen wollte und sie nun mit Punktfundamenten stehen bleiben sollen."
      - "Dass Marie den Hauptweg bis Ende Juni freihalten musste."
      - "Dass der Makler Ende Juli Fotos vom Garten wollte."
      - "Dass Marie und Jonas sich seit dem Gewitter duzen."
      - "Was Steinhagen im Garten und im Salon gesagt hat (Fläche hinter dem Haus ein Pfund, Erntefest gegen Gebühr, Hotelplan)."
      - "Dass Weidenkamp ihr Wohnrecht bestehen lassen wollte und bei freiwilligem Auszug eine Abfindung vorsah."
      - "Dass Jonas an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt hat."
      - "Dass Marie und Jonas sich auf dem Steg und am Festnachmittag bei der Lindenhof-Rose geküsst haben."
      - "Dass Jonas im Gartenbuch Hedwigs Notiz zum ersten Steckling der Lindenhof-Rose gelesen hat, für den er als Junge das Loch gegraben hat."
      - "Dass der Gutachter die Rechnungen für die Wertermittlung brauchte."
      - "Dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg zur Einlage sprechen wollten."
      - "Was Lena im Hofladen zu Jonas über Marie gesagt hat."
      - "Was Marie und Jonas im Arbeitszimmer gesprochen haben."
      - "Dass Marie in der Nacht zu Lena gefahren ist."
      - "Was Jonas und Marie vor Lenas Fotowand gesprochen haben (das Foto vom Jungen und dem Mädchen auf der Mauer)."
  hannes-kroeger:
    knows:
      - text: "Jonas Behrendt ist auf dem Gut; er hat ihm Kaffee gebracht und ihn mit Herr Kröger angeredet."
        from: ch03/s02
      - text: "Der Hauptweg ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Um die Sonnenuhr haben die alten Holunderstubben den Kies gehoben; an der Westseite sitzt ein Brombeerwurzelstock, dem Marie seit drei Tagen mit der Hacke kommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will, dass langsam gezogen wird, nach Norden zum Tor hin."
        from: ch03/s02
      - text: "Er hat für Hedwig den Fliederbusch an der Remise mit derselben Kette rausgeholt."
        from: ch03/s02
      - text: "Auf seine Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas zuerst nicht zugesagt: Gutachten fürs Dach und für die Fenster, Kosten und Fristen hingen daran."
        from: ch03/s02
      - text: "Das Erntefest ist wie immer am ersten Samstag im September."
        from: ch03/s02
      - text: "Mitte Juli hat er mit dem Hänger Kies ans schmiedeeiserne Tor gebracht und Marie zugeschaufelt."
        from: ch04/s01
      - text: "Der Besucher Mitte Juli war Ralf Steinhagen von Weidenkamp Hotels; er kennt seinen Namen."
        from: ch04/s01
      - text: "Steinhagen hat im Garten zu Jonas gesagt, die Fläche hinter dem Haus sei ein Pfund."
        from: ch04/s01
      - text: "Auf seine Frage nach dem Erntefest hat Steinhagen gesagt, man hätte eine Veranstaltungsfläche gegen Gebühr, für Vereine zu fairen Konditionen; Jonas hat dazu geschwiegen."
        from: ch04/s01
      - text: "Am Samstag Mitte Juli war Arbeitseinsatz im Garten: Landfrauen, Feuerwehr, Nachbarn; er kam mit dem großen grünen Trecker und leerem Hänger, Kalle in der Kabine, Timo mit dem zweiten Gespann voll Kies für die Seitenwege."
        from: ch05/s01
      - text: "Jonas kam in den geliehenen Gummistiefeln, eine Nummer zu groß, und wollte anfassen; er hat ihn an die Brombeeren an der Südmauer westlich der Pforte geschickt."
        from: ch05/s01
      - text: "Als Ole an einem Rosenbusch zerrte, hat er gepfiffen und allen gesagt: Im Garten ist Marie die Chefin."
        from: ch05/s01
      - text: "Jonas ist als Junge, der Lütte von Hedwig, bei ihm auf dem Hänger über die Stoppeln nach der Gerste mitgefahren, barfuß; Hedwig musste ihn mit Kuchen herunterlocken und hat geschimpft. Er hat den Jungen all die Jahre nicht vergessen."
        from: ch05/s02
      - text: "Jonas weiß von der Hängerfahrt noch den Diesel."
        from: ch05/s02
      - text: "Am späten Nachmittag lag die Südmauer von der Pforte nach Westen bis zum alten Geräteschuppen frei; er hat die letzte Fuhre abgefahren."
        from: ch05/s02
      - text: "Er hat Jonas die Hand gegeben, \"Gut gemacht, Jonas\" gesagt und ihn dabei geduzt."
        from: ch05/s02
      - text: "Der Erntefest-Ausschuss brauchte bis Freitag, den vierzehnten August, eine Zusage, sonst wäre im reservierten Zelt hinter dem Feuerwehrhaus gefeiert worden; er hat das Jonas am Hoftor der Hansens gesagt."
        from: ch06/s03
      - text: "Am Freitag, dem 14. August, hat Jonas ihm am Tor geantwortet: \"Das Fest findet dieses Jahr auf dem Gut statt.\" Marie stand dabei."
        from: ch07/s02
      - text: "Am Dienstag, dem 1. September, früh am Morgen hat Jonas ihm am Fuß des Hügels auf dem Feldweg gesagt: \"Das Fest bleibt auf dem Gut, Hannes. Nicht nur dieses Jahr. Nächstes auch, und danach.\" Er bestellt das Zelt ab."
        from: ch09/s01
      - text: "Er hat Jonas gesagt, Samstag fahre er vorn, mit Hedwigs altem Trecker, den er im Frühjahr gemacht hat; Jonas ist noch nie Trecker gefahren."
        from: ch09/s01
      - text: "Jonas hat ihn gebeten, Marie nichts zu sagen, das müsse er selbst; er hat geantwortet, man rede nicht für andere, aber Jonas solle sie nicht zu lange warten lassen."
        from: ch09/s01
      - text: "Am Mittwoch, dem 2. September, nachmittags hat er hellen Kies fürs Rondell gebracht und mit Marie geschaufelt."
        from: ch09/s02
      - text: "Neben dem alten Stock hinter dem Laubengang hat Marie einen Steckling mit rötlichen Blättern in frische Erde gepflanzt; über ihm blüht der alte Stock."
        from: ch09/s02
      - text: "Laut Marie ist Samstag Fest, und was danach mit dem Garten wird, sagt ihr keiner, Jonas am wenigsten."
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, ist er im Umzug durch die Lindenallee in Weste, die Ehrennadel am Revers, die Mütze in der Hand, neben dem Vorderrad von Hedwigs altem Trecker gegangen; Jonas saß am Steuer, über dem Sitz die Erntekrone. Früher ging er an derselben Stelle neben Hedwig. Das Dorf hat geklatscht."
        from: ch10/s01
      - text: "Am Abend hat er im Garten beim Tanz zur Blaskapelle Grete die Hand hingehalten; sie hat gesagt \"Bist du nicht klug, in unserm Alter?\" und doch mit ihm getanzt."
        from: ch10/s03
    believes:
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Mit Maries Arbeit im Garten läuft es (\"Dat löppt\")."
        from: ch03/s02
      - text: "Kommt Weidenkamp aufs Gut, hat das Erntefest dort keinen Platz mehr wie bisher (\"Wo soll das dann hin?\")."
        from: ch04/s01
      - text: "Im Garten hat Marie das Sagen."
        from: ch05/s01
      - text: "Das Erntefest bleibt auf Dauer auf dem Gut; das Zelt wird nicht gebraucht."
        from: ch09/s01
      - text: "Man redet nicht für andere: Was Jonas Marie zu sagen hat, muss Jonas ihr selbst sagen."
        from: ch09/s01
      - text: "Marie soll im Garten weitermachen und den Steckling jeden Morgen gießen (\"Weiß man eben\")."
        from: ch09/s02
    does_not_know:
      - "Dass Jonas am 13. August im Notariat bei Steinhagen von Weidenkamp unterschrieben hat, mit Rücktrittsrecht bis 10. September, fünf Tage nach dem Fest."
      - "Dass Jonas am 1. September Steinhagen gegenüber vom Vorvertrag zurückgetreten ist und die 38.000 Euro für Notar und Planung selbst trägt (Jonas hat ihm nur das Fest zugesagt)."
      - "Dass Jonas die Partnerschaft im Hamburger Büro abgesagt hat und künftig drei Tage die Woche vom Gut aus arbeiten will."
      - "Was Jonas Marie am Festnachmittag unter der Kletterrose gesagt hat und dass sie sich ausgesprochen haben."
      - "Dass Marie den Vorvertrag am 27. August im Arbeitszimmer gefunden hat und dass Grete und Lena davon wissen."
      - "Dass Lena angekündigt hatte, ihn am Morgen nach dem 27. August anzurufen."
      - "Dass Jonas' Einlage fürs Büro fällig war und die Partner sie bis nach dem Fest gestundet hatten."
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass der alte Stock hinter dem Laubengang die letzte Lindenhof-Rose ist und Marie in Klein Lindau einen zweiten Steckling davon zieht."
      - "Dass Weidenkamps Lageplan den Parkplatz auf den Rosengarten legte."
      - "Was Steinhagen und Jonas im Salon besprochen haben (Hotelplan, Abfindung für Grete)."
      - "Dass Marie und Jonas sich auf dem Steg und am Festnachmittag bei der Lindenhof-Rose geküsst haben."
      - "Dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg zur Einlage sprechen wollten."
      - "Dass Hedwig sich Marie als Nachfolgerin im Garten gewünscht hat."
  jonas-behrendt:
    knows:
      - text: "Die Frau im Garten heißt Marie Albers."
        from: ch01/s01
      - text: "Das Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Sieben Fenster im Erdgeschoss zur Gartenseite sind undicht, zwei Flügel verzogen."
        from: ch01/s02
      - text: "Marie hat den Auftrag angenommen: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Marie rechnet nach ihrem eigenen, nicht verhandelbaren Stundensatz ab."
        from: ch01/s02
      - text: "Abmachung mit Marie: Die Bögen der 'Ghislaine' bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief); der Fuß sitzt fest im Beton."
        from: ch03/s01
      - text: "Marie und er sagen seit dem Gewitter unter dem Laubengang Du zueinander."
        from: ch03/s01
      - text: "Marie hat mit zehn im Garten ihren ersten Rosenschnitt gemacht; Hedwig hat ihr die Hand geführt. Als Kind hat Marie jeden Dienstag und Freitag bei Hedwig im Garten gearbeitet."
        from: ch03/s01
      - text: "Marie hat Hedwigs alte Schere mit dem roten Griff und benutzt sie bis heute; Hedwig hat laut mit den Rosen geredet, Marie tut es auch."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie nimmt ihren Kaffee mit Milch (von Grete)."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; seine Nummer hat er vom Makler. Mitte Juli war Steinhagen zur Besichtigung auf dem Gut."
        from: ch04/s01
      - text: "Grete hat ihm und Steinhagen auf der Terrasse Kaffee ohne Kuchen hingestellt; in all seinen Kindersommern gab es bei ihr keine Tasse ohne Kuchen."
        from: ch04/s02
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz unten am Steg; im Lageplan liegt der Parkplatz genau auf dem Rosengarten."
        from: ch04/s02
      - text: "Grete hat ein lebenslanges Wohnrecht; für einen freiwilligen Auszug sah Weidenkamp eine großzügige Abfindung vor."
        from: ch04/s02
      - text: "Steinhagen hat erzählt, bei einem Herrenhaus weiter im Süden habe für den Anbau ein alter Park weichen müssen; seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Laut Hannes ist er als Junge bei ihm auf dem Hänger über die Stoppeln nach der Gerste mitgefahren, barfuß; Hedwig musste ihn mit Kuchen herunterlocken. Ihm ist der Geruch von Diesel und Stroh zurückgekommen."
        from: ch05/s02
      - text: "An der Südmauer hat er eine alte 'Ghislaine de Féligonde' freigelegt; Marie hat die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Hannes hat ihm die Hand gegeben, ihn Jonas genannt und geduzt: \"Gut gemacht, Jonas.\""
        from: ch05/s02
      - text: "Er hat Marie von seinen drei Flößen erzählt; das letzte ist mitten im See abgesoffen, Hedwig hat gelacht."
        from: ch05/s03
      - text: "Er und Marie haben sich bei Sonnenuntergang auf dem Steg geküsst; Marie hat ihn gefragt, ob er im Herbst noch hier ist, er hat geantwortet: \"Ich weiß es nicht.\""
        from: ch05/s03
      - text: "Laut Marie heißt Glanz im September: Nachblüte der 'New Dawn', Lavendel und Katzenminze, Frauenmantel, Astern, am Laubengang Dahlien; die Büsche am Rondell hängen im September voller Hagebutten."
        from: ch06/s01
      - text: "Im Gartenbuch steht unter der Überschrift Lindenhof-Rose, datiert auf einen Juli vor sechsundzwanzig Jahren: Erster Steckling, Jonas hat das Loch gegraben und gegossen, er wollte ihn jeden Morgen messen."
        from: ch06/s02
      - text: "Er erinnert sich wieder: Hedwigs Hand über seiner beim Pflanzen (\"Nicht drücken\"), der Steckling im Erdbeer-Joghurtbecher, jeden Morgen barfuß mit dem Lineal gemessen."
        from: ch06/s02
      - text: "Hedwig hat ihm Brief um Brief geschrieben, er hat selten geantwortet."
        from: ch06/s02
      - text: "Lena hat ihm im Hofladen gesagt: Marie ist keine, mit der man einen Sommer spielt; tut er es doch, nimmt sie es ihm übel, und das ganze Dorf mit ihr."
        from: ch06/s03
      - text: "Er hat am 13. August im Notariat in der Kreisstadt im Beisein von Steinhagen einen Vorvertrag unterschrieben, mit Rücktrittsrecht bis zum zehnten September."
        from: ch07/s01
      - text: "Grete hat ihm beim Essen am 13. August gesagt, im Dorf rede man über den Herrn mit dem silbernen Auto; er hat ihr gesagt, er habe Termine in der Stadt gehabt, Büro. Das war gelogen."
        from: ch07/s01
      - text: "Am 14. August hat Marie ihm hinter dem letzten Bogen des Laubengangs die Lindenhof-Rose gezeigt, von Hedwig selbst gezogen, der letzte Stock."
        from: ch07/s02
      - text: "Am 14. August hat er Hannes geantwortet: \"Das Fest findet dieses Jahr auf dem Gut statt.\" Marie ist ihm daraufhin um den Hals gefallen."
        from: ch07/s02
      - text: "Am 27. August hat Marie im Arbeitszimmer den Vorvertrag mit Lageplan und seiner Unterschrift gefunden; sie hat gesagt, den Garten hätte sie ihm notfalls hergegeben, nicht hinter ihrem Rücken, nicht nach dem Steg, und ist gegangen."
        from: ch08/s01
      - text: "Grete hat ihm am 31. August Hedwigs alte blaue Keksdose gegeben (\"Lies das, Jung. Was du dann machst, ist deine Sache.\"); darin seine Kinderbriefe, seine Postkarten und seine Zeichnung eines Mädchens mit Zopf auf einer Mauer: Die hat mit mir geschimpft."
        from: ch09/s01
      - text: "Am Dienstag, dem 1. September, hat er Steinhagen gesagt, dass er das Rücktrittsrecht zieht und die Kosten für Notar und Planung selbst trägt, 38.000 Euro; Steinhagen hat es fast geahnt, die Gruppe hat ein zweites Gut im Blick."
        from: ch09/s01
      - text: "Er hat Hannes gesagt, das Fest bleibe auf dem Gut, nicht nur dieses Jahr; Hannes bestellt das Zelt ab und hat ihn Samstag mit Hedwigs altem Trecker vorn fahren lassen."
        from: ch09/s01
      - text: "Er hat in Hamburg die Partnerschaft persönlich abgesagt."
        from: ch10/s03
      - text: "Am Samstag, dem 5. September, ist er im Umzug durch die Lindenallee Hedwigs alten Trecker mit der Erntekrone vorn gefahren, im weißen Hemd, Hannes neben dem Vorderrad; das Dorf hat geklatscht."
        from: ch10/s01
      - text: "Er hat Marie am Rand der Allee gefunden und ihr ernst zugenickt; sie hat sich weggedreht und hinter die Feuerwehr geschoben."
        from: ch10/s01
      - text: "In der Scheune hängt an Lenas Fotowand ein Foto: Hedwig an der Gartenmauer, daneben er als dünner Junge, barfuß, das Knie zerschrammt, oben auf der Mauer Marie als Mädchen mit Zopf, die Arme in die Hüften gestemmt."
        from: ch10/s02
      - text: "Marie ist das Mädchen auf der Mauer, das ihn beschimpft hat: Er war auf einen Rosenstock getreten, sie hat gesagt, er habe Füße wie ein Ochse und keinen Verstand dazu. Er hat es Tante Hedwig mit Zeichnung geschrieben; den Brief hat er in Gretes Keksdose wiedergefunden."
        from: ch10/s02
      - text: "Lena hat sich zwischen ihn und Marie geschoben: \"Sie trauen sich was, Herr Behrendt. Nach allem?\"; Marie hat sie zurückgehalten: \"Lena. Das ist meine Sache.\""
        from: ch10/s02
      - text: "Er hat Marie unter der Kletterrose gesagt: vom Vorvertrag zurückgetreten, Kosten trägt er selbst, Partnerschaft abgesagt, drei Tage die Woche von hier aus, Dach in Abschnitten, Erntefest jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus, er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Marie hat ihm gesagt: Der Parkplatz war es nicht, nicht nur; sein Schweigen hat wehgetan, und auch den Rücktritt hat er wieder allein beschlossen. Er hat keine Ausrede gesucht."
        from: ch10/s03
      - text: "Laut Marie hat Hedwig im letzten Herbst auf der Bank unter der Kletterrose ihre Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführe."
        from: ch10/s03
      - text: "Abmachung mit Marie: Sie führt den Garten an seiner Seite, nicht in seinem Auftrag, und er nimmt sie in seine Entscheidungen hinein, vorher, nicht hinterher; er hat ohne Zögern Ja gesagt. Seine erste Frage an sie: was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Neben dem alten Stock der Lindenhof-Rose, dessen einzige Blüte müde hängt, steht ein Steckling mit einem neuen rötlichen Blatt; laut Marie aus ihrem Hinterhof, seit Juni gezogen, der zweite steht noch unter der Folie."
        from: ch10/s03
      - text: "Er hat Marie von Hedwigs Notiz im Gartenbuch erzählt (Erster Steckling, Jonas hat das Loch gegraben und gegossen) und dass er ihn jeden Morgen mit dem Lineal gemessen hat; Marie hat sich neben ihn ins Gras gekniet, die Hand auf seine gelegt und ihn geküsst."
        from: ch10/s03
      - text: "Am Abend hat er mit Marie barfuß auf dem Kies getanzt und ihr zweimal auf die Zehen getreten (\"Füße wie ein Ochse\" – \"Und keinen Verstand dazu\")."
        from: ch10/s03
      - text: "Lena hat ihm die Hand gegeben, ihn geduzt (\"Willkommen, Jonas\") und gesagt: \"Pass mir gut auf sie auf.\" Danach rief sie: \"Hab ich doch gleich gesagt.\""
        from: ch10/s03
    believes:
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "Er wird auf dem Gut mitgerechnet, gehört an diesem Ort dazu – ein fremdes, warmes Gefühl."
        from: ch05/s02
      - text: "Seit dem abgesoffenen Floß rechnet er alles zweimal."
        from: ch05/s03
      - text: "Das Dach lässt sich ohne Verkauf in Abschnitten tragen, wie eine Brücke in Felder geteilt; er rechnet nicht mehr, was sich lohnt, sondern was trägt."
        from: ch09/s01
      - text: "Hannes hat am Fest auf dem Gut sehr wohl gezweifelt; er glaubt ihm das \"Hab ja nie dran gezweifelt\" kein Wort, und es war trotzdem gut."
        from: ch09/s01
      - text: "Marie muss es zuerst hören, vor allen anderen."
        from: ch10/s02
      - text: "Das Loch für den ersten Steckling hat er irgendwo hier, im Winkel hinter dem Laubengang, gegraben."
        from: ch10/s03
    does_not_know:
      - "Ob Grete ihm die Ausrede mit dem Büro geglaubt hat (sie hat es nicht)."
      - "Dass Marie nach dem Arbeitszimmer zu Grete in die Küche gegangen ist und Grete nun vom Parkplatz weiß."
      - "Was genau Marie in der Nacht Lena erzählt hat (Lageplan, Unterschrift, Steg, \"dieses Jahr\") und dass Lena Hannes anrufen wollte."
      - "Wo Marie seit dem 27. August gewesen ist und ob sie seine Nachrichten gelesen hat."
      - "Dass Maries Stecklinge in Klein Lindau im Hinterhof der alten Schmiede stehen."
      - "Dass Marie die Mauerecke hinter dem Südende des Laubengangs nachts selbst freigeschnitten und mit einem leeren Schild markiert hat."
      - "Was Marie bei Lena im Hofladen über ihn erzählt hat."
      - "Wo das Gartenbuch geblieben ist, das nicht mehr an seinem Platz am Fenster liegt."
      - "Dass Marie schon am Steg geahnt hat, dass er der Junge von damals war."
  lena-hansen:
    knows:
      - text: "Der Mann, über den Marie spricht (Jonas), hatte in seiner Tabelle die Entsorgung beider Rankbögen der 'Ghislaine' vorgesehen; er hat am Bogen ein Fundament skizziert, 40 × 40, 80 tief wegen Frost."
        from: ch02/s03
      - text: "Am ersten Tag ließ Jonas Schuhe und Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Am Samstag Mitte Juli hat sie am Tor die Helfer für den Garten abgehakt und eingeteilt; Marie hat an jedem Stock, der stehen bleiben muss, ein Namensschild aufgehängt."
        from: ch05/s01
      - text: "Jonas kam zum Arbeitseinsatz; sie hat ihn eingetragen und gesiezt, und er hat zugesagt, auch den nächsten Samstag zu kommen."
        from: ch05/s03
      - text: "Für Grete macht sie seit Jahren montags den Hofladen auf; an einem Montag Anfang August hat Jonas Gretes Einkauf abgeholt; er kommt aus Hamburg."
        from: ch06/s03
      - text: "Sie hat Jonas im Hofladen gesagt, Marie sei keine, mit der man einen Sommer spielt, und wenn er es doch tue, nehme sie es ihm übel, das ganze Dorf mit ihr."
        from: ch06/s03
      - text: "In der Nacht nach dem 27. August kam Marie an die Küchentür des Hansen-Hofs; die alten Fotos auf dem Küchentisch hat sie mit einem Geschirrtuch zugedeckt."
        from: ch08/s03
      - text: "Laut Marie hat Jonas heimlich beim Notar einen Vorvertrag unterschrieben; auf dem Lageplan liegen Stellplätze über dem Rosengarten bis an die Mauer."
        from: ch08/s03
      - text: "Marie und Jonas haben sich am Abend auf dem Steg geküsst."
        from: ch08/s03
      - text: "Jonas hat Hannes am 14. August am Tor zugesagt, das Fest finde \"dieses Jahr\" auf dem Gut statt; Marie hatte das für ein Versprechen gehalten."
        from: ch08/s03
      - text: "Laut Marie hat Hedwig ihr letzten Herbst auf der Bank unter der Kletterrose die Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführe; das steht nirgends."
        from: ch08/s03
      - text: "Sie hat Marie angekündigt, Hannes anzurufen; Marie hat gesagt: \"Das ist meine Sache, Lena. Nicht die vom Dorf.\""
        from: ch08/s03
      - text: "Beim Erntefest am 5. September steht sie in der Scheune hinter dem Tresen mit Gretes Blechen, im gelben Kleid, Friedas Kornblumenkranz in den Locken."
        from: ch10/s02
      - text: "Sie hat an der Rückwand der Scheune auf Mats' Stelltafeln Dutzende alte Fotos ausgestellt, aus dem Album der Petersens, aus Hedwigs Schublade, aus Hannes' Ausschusskiste, jedes mit Zettel in ihrer Schrift; für Marie und für Hedwig. Es sind die Fotos von ihrem Küchentisch."
        from: ch10/s02
      - text: "Laut Jonas ist er der Junge auf dem Foto an der Gartenmauer und Marie das Mädchen oben, das ihn beschimpft hat; den Brief darüber hat er in Gretes Keksdose wiedergefunden."
        from: ch10/s02
      - text: "Sie hat Jonas angefahren (\"Sie trauen sich was, Herr Behrendt. Nach allem?\"); Marie hat sie am Arm gefasst: \"Lena. Das ist meine Sache.\""
        from: ch10/s02
      - text: "Jonas hat Marie gesagt, er müsse ihr etwas sagen, sie müsse es zuerst hören, vor allen anderen, und sie unter die Kletterrose gebeten; Marie hat fünf Minuten zugesagt."
        from: ch10/s02
      - text: "Am Abend im Garten hat sie Jonas die Hand gegeben, ihn geduzt (\"Willkommen, Jonas\") und gesagt: \"Pass mir gut auf sie auf.\""
        from: ch10/s03
    believes:
      - text: "Marie hat Gefühle für Jonas."
        from: ch02/s03
      - text: "Maries Namensschilder sind unnötig: Die Landfrauen stechen Giersch, seit Marie laufen kann."
        from: ch05/s01
      - text: "Marie ist keine, mit der man einen Sommer spielt; spielt Jonas mit ihr, steht das Dorf hinter Marie."
        from: ch06/s03
      - text: "Marie hat Hedwig seit ihrem zehnten Jahr den Giersch gestochen; wer ihr Erbschleicherei nachsagt, kriegt es mit ihr zu tun."
        from: ch08/s03
      - text: "Jonas gehört jetzt dazu und soll gut auf Marie aufpassen."
        from: ch10/s03
      - text: "Sie hat es gleich gesagt, dass Marie und Jonas zusammengehören (\"Hab ich doch gleich gesagt.\")."
        from: ch10/s03
    does_not_know:
      - "Dass der Käufer Weidenkamp Hotels ist und Ralf Steinhagen das Gut Mitte Juli besichtigt hat."
      - "Dass der Vorvertrag ein Rücktrittsrecht bis 10. September vorsah."
      - "Dass Jonas am 1. September vom Vorvertrag zurückgetreten ist, die Partnerschaft in Hamburg abgesagt hat und bleiben will (keine Szene belegt, dass sie es hört)."
      - "Was Jonas Marie unter der Kletterrose gesagt hat."
      - "Dass Jonas Hannes am 1. September zugesagt hat, das Fest bleibe dauerhaft auf dem Gut."
      - "Dass Jonas' Einlage fürs Büro fällig war und die Partner sie bis nach dem Fest gestundet hatten."
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat, Stecklinge davon zieht und einen am 2. September neben den alten Stock gepflanzt hat."
      - "Dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg zur Einlage sprechen wollten."
      - "Dass Grete Jonas' Schwindeln geahnt und Marie um Verzeihung gebeten hat."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe."
        from: ch01/s01
      - text: "Auftrag von Jonas: den Rosengarten bis zum Erntefest am 5. September herrichten, Wege begehbar, Beete sauber."
        from: ch01/s02
      - text: "Abmachung: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Arbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Laut Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974; die Bögen haben Punktfundamente bekommen."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Seit dem Gewitter unter dem Laubengang sagen Jonas und sie Du zueinander."
        from: ch03/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war Mitte Juli auf dem Gut, hat die Fläche hinter dem Haus ein Pfund genannt und für das Erntefest eine Veranstaltungsfläche gegen Gebühr angeboten."
        from: ch04/s01
      - text: "Nur die Mauerecke hinter dem Südende des Laubengangs trägt keinen Namen; dort hat sie im Dunkeln selbst die Brombeeren zurückgeschnitten und einen Pfahl mit leerem Schild davorgesetzt."
        from: ch05/s01
      - text: "An der Südmauer hat Jonas eine alte 'Ghislaine de Féligonde' freigelegt; sie hat die jungen Triebe mit Bast angebunden."
        from: ch05/s02
      - text: "Jonas hat als Junge am See drei Flöße gebaut; das letzte ist abgesoffen; seitdem rechnet er alles zweimal."
        from: ch05/s03
      - text: "Sie und Jonas haben sich bei Sonnenuntergang auf dem Steg geküsst."
        from: ch05/s03
      - text: "Ihr Plan für den Glanz im September: Nachblüte der 'New Dawn', Lavendel und Katzenminze, Frauenmantel, Astern, am Laubengang Dahlien; die Büsche am Rondell setzen Hagebutten an."
        from: ch06/s01
      - text: "Sie hat Jonas am 14. August die Lindenhof-Rose gezeigt; Hedwig hat sie selbst gezogen, es gibt nur noch diesen einen Stock."
        from: ch07/s02
      - text: "Jonas hat Hannes am 14. August geantwortet: \"Das Fest findet dieses Jahr auf dem Gut statt.\""
        from: ch07/s02
      - text: "Am 27. August fehlte das Gartenbuch auf seinem Platz am Fenster im Arbeitszimmer; wo es ist, weiß sie nicht."
        from: ch08/s01
      - text: "Im Arbeitszimmer lag eine Mappe von Weidenkamp Hotels; im Lageplan reichen die Stellplätze bis in den Winkel hinter dem letzten Bogen, wo die Lindenhof-Rose steht; auf der letzten Seite Jonas' Unterschrift vom 13. August."
        from: ch08/s01
      - text: "Laut Jonas war es ein Vorvertrag; das Büro bot ihm eine Partnerschaft an, für die er eine Einlage bringen musste; er hatte ein Rücktrittsrecht bis nach dem Fest."
        from: ch08/s01
      - text: "Grete hat geahnt, dass Jonas schwindelt, und hat sie um Verzeihung gebeten; Grete weiß von Hedwigs Wunsch für den Garten."
        from: ch08/s02
      - text: "Letzten Herbst hat Hedwig auf der Bank unter der 'New Dawn' ihre Hand genommen und gesagt, sie wünsche sich, dass Marie den Garten einmal weiterführe; das steht nirgends."
        from: ch08/s03
      - text: "Sie hat Lena in der Nacht vom Lageplan, von Jonas' Unterschrift, vom Steg, vom \"dieses Jahr\" und von Hedwigs Wunsch erzählt."
        from: ch08/s03
      - text: "In Klein Lindau haben beide Stecklinge der Lindenhof-Rose getrieben; den kräftigeren hat sie am 2. September eine Handbreit neben den alten Stock gepflanzt, der andere steht weiter unter Folie."
        from: ch09/s02
      - text: "Hannes hat am 2. September den gepflanzten Steckling gesehen und gesagt: \"Mach man weiter, Deern\", \"Den gießt du man jeden Morgen.\""
        from: ch09/s02
      - text: "Am Samstag, dem 5. September, kurz nach sechs, hat sie das Rondell ein letztes Mal geharkt; der Steckling vom Mittwoch treibt ein neues rötliches Blatt, die einzige Blüte am alten Stock wird an den Rändern müde. Sie hat ihn gegossen, wie Hannes geraten hat."
        from: ch10/s01
      - text: "Grete hat ihr am Festmorgen Kaffee mit Milch gebracht, in der guten Bluse mit Hedwigs Brosche, gesagt, da könne das Dorf kommen, die zwei fehlenden Astern fehlten nur ihr, und sie solle sich was Schönes anziehen; über Jonas kein Wort."
        from: ch10/s01
      - text: "Laut Anke sagt Grete, der Garten habe seit Jahren nicht so ausgesehen, und Hannes hat am Festmorgen schon um fünf in der Küche gestanden, mit Weste."
        from: ch10/s01
      - text: "Der Motor, der morgens in der Remise ansprang, war Hedwigs alter Trecker: Im Umzug durch die Lindenallee fuhr Jonas ihn vorn, im weißen Hemd, mit der Erntekrone; Hannes ging in Weste mit Ehrennadel neben dem Vorderrad, wie früher neben Hedwig. Das Dorf hat geklatscht."
        from: ch10/s01
      - text: "Jonas hat sie am Rand der Allee gefunden und ihr ernst zugenickt; sie hat sich weggedreht."
        from: ch10/s01
      - text: "Lena hat für sie und für Hedwig in der Scheune alte Fotos ausgestellt, aus dem Album der Petersens, aus Hedwigs Schublade, aus Hannes' Ausschusskiste; deshalb lagen die Fotos auf Lenas Küchentisch."
        from: ch10/s02
      - text: "Auf einem Foto steht sie selbst als Mädchen mit Zopf im rot-weiß gepunkteten Kleid oben auf der Gartenmauer, unten im Beet der dünne Junge, barfuß: Jonas. Sie hat ihn beschimpft, weil er auf einen Rosenstock getreten war und einen Trieb geknickt hatte; Hedwig hat ein Pflaster geholt."
        from: ch10/s02
      - text: "Laut Jonas hat sie damals gesagt, er habe Füße wie ein Ochse und keinen Verstand dazu; er hat es Tante Hedwig mit Zeichnung geschrieben und den Brief in Gretes Keksdose wiedergefunden."
        from: ch10/s02
      - text: "Grete hat in der Scheune von der Kaffeemaschine zu ihr und Jonas herübergesehen und in den Dampf gelächelt."
        from: ch10/s02
      - text: "Jonas hat ihr unter der Kletterrose gesagt: Am Dienstag ist er vom Vorvertrag zurückgetreten, die Kosten trägt er selbst, in Hamburg hat er die Partnerschaft persönlich abgesagt; drei Tage die Woche arbeitet er künftig von hier aus, das Dach macht er in Abschnitten."
        from: ch10/s03
      - text: "Laut Jonas bleibt das Erntefest jedes Jahr auf dem Gut, der Rosengarten bleibt dem Dorf, Gretes Haus bleibt Gretes Haus, er bleibt, und er liebt sie."
        from: ch10/s03
      - text: "Hannes hat am Mittwoch schon vom Rücktritt gewusst, als er den Dahlien antwortete statt ihr; daher die Weste um fünf."
        from: ch10/s03
      - text: "Sie hat Jonas gesagt, sein Schweigen habe wehgetan und er habe auch den Rücktritt wieder allein beschlossen; sie hat ihm Hedwigs Wunsch erzählt und verlangt: an seiner Seite, nicht in seinem Auftrag, und Entscheidungen vorher gemeinsam. Er hat ohne Zögern Ja gesagt und gleich gefragt, was aus dem leeren Kuhstall werden soll."
        from: ch10/s03
      - text: "Sie hat Jonas den Steckling an der Lindenhof-Rose gezeigt, aus ihrem Hinterhof, seit Juni gezogen, der zweite unter Folie."
        from: ch10/s03
      - text: "Laut Jonas steht in Hedwigs Gartenbuch: Erster Steckling, Jonas hat das Loch gegraben und gegossen; er hat ihn danach jeden Morgen mit dem Lineal gemessen, irgendwo hier."
        from: ch10/s03
      - text: "Sie hat Jonas bei der Lindenhof-Rose geküsst; am Abend hat sie mit ihm barfuß auf dem Kies getanzt, er ist ihr zweimal auf die Zehen getreten."
        from: ch10/s03
      - text: "Lena hat Jonas die Hand gegeben, ihn geduzt (\"Willkommen, Jonas\") und gesagt, er solle gut auf sie aufpassen."
        from: ch10/s03
    believes:
      - text: "Splitt würde den alten Kies des Hauptwegs zerstören."
        from: ch01/s01
      - text: "Grete hat Steinhagen mit Absicht keinen Kuchen hingestellt."
        from: ch04/s01
      - text: "Lena misstraut jedem ohne Klemmbrett."
        from: ch06/s01
      - text: "Grete ist sie nicht böse, sondern sich selbst: Ihr eigenes Herz hat sie nicht so verteidigt wie einen Garten."
        from: ch08/s02
      - text: "Solange die Finger zu tun haben, muss der Kopf nicht mit."
        from: ch10/s02
      - text: "Am Steg hat sie schon geahnt, dass Jonas der Junge von damals war, und es für sich behalten."
        from: ch10/s02
      - text: "Jonas bleibt und meint es ernst."
        from: ch10/s03
      - text: "Sie ist angekommen."
        from: ch10/s03
    does_not_know:
      - "Dass die Kosten des Rücktritts 38.000 Euro für Notar und Planung betragen und aus dem Ersparten für die Einlage kommen."
      - "Dass die Partner Jonas die Einlage bis nach dem Fest gestundet hatten, weil Weidenkamps Anzahlung ausstand."
      - "Dass Jonas Hannes gebeten hat, ihr nichts zu sagen, weil er es ihr selbst sagen wollte."
      - "Dass Grete Jonas die Keksdose gegeben hat und was außer dem Brief mit der Zeichnung darin liegt (Kinderbriefe, Postkarten)."
      - "Dass Steinhagen bei der Unterschrift im Notariat in der Kreisstadt dabei war."
      - "Das genaue Ende des Rücktrittsrechts (10. September); Jonas hat nur \"bis nach dem Fest\" gesagt."
      - "Wo das Gartenbuch geblieben ist."
      - "Dass Jonas sie am 13. August vom Hügel aus am Tor mit der Kiste Töpfe gesehen hat."
      - "Dass der Ausschuss ohne Zusage im Zelt hinter dem Feuerwehrhaus gefeiert hätte."
      - "Wie hoch Hedwigs Geldvermächtnis für die Gartenarbeit ist."
      - "Dass der Makler am letzten Freitag im Juli Fotos vom Garten machen lassen wollte."
      - "Dass Jonas sie vom Hügel hinter der Scheune bei der Arbeit beobachtet hat."
      - "Was Jonas und Steinhagen auf der Terrasse und im Salon besprochen haben."
      - "Dass Weidenkamp rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune und ein Saunahaus am Steg plante."
      - "Dass nur ein paar Rosen in Kübeln bleiben sollten."
      - "Dass Weidenkamp für Gretes freiwilligen Auszug eine Abfindung vorsah."
      - "Dass Hannes sich an Jonas als Jungen auf seinem Hänger erinnert."
      - "Dass Jonas für den Gutachter der Wertermittlung Hedwigs Rechnungen für Dach und Fenster zusammengesucht hat."
      - "Was Lena im Hofladen zu Jonas über sie gesagt hat."
      - "Dass die Partner Jonas am Donnerstag, dem 13., um neun in Hamburg zur Einlage sprechen wollten."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendt ist der Eigentümer des Guts; seine Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Marie Albers, Hannes Kröger und Grete Paulsen kennt er seit seinem Besuch Mitte Juli mit Namen."
        from: ch04/s01
      - text: "Laut Marie ist der Garten in den Dreißigerjahren angelegt, mit diesen Wegen und dieser Mauer; die 'Rosa Mundi' sei älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes Kröger fragt, wo das Erntefest hin soll, wenn Weidenkamp kommt."
        from: ch04/s01
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht."
        from: ch04/s02
      - text: "Am Donnerstag, dem 13. August, hat Jonas im Notariat in der Kreisstadt in seinem Beisein unterschrieben, mit dem Kugelschreiber mit Firmenlogo, den er ihm hingelegt hat; Jonas hat ihn zu ihm zurückgeschoben."
        from: ch07/s01
      - text: "Der Vorvertrag sieht ein Rücktrittsrecht bis zum zehnten September vor."
        from: ch07/s01
      - text: "Jonas wollte zum Termin keinen Kaffee, nur Wasser."
        from: ch07/s01
      - text: "Am Dienstag, dem 1. September, früh hat Jonas ihm gesagt, dass er das Rücktrittsrecht zieht und wie im Vorvertrag vereinbart die Kosten für Notar und Planung selbst trägt, 38.000 Euro; Jonas hat gesagt, es tue ihm leid um seine Arbeit."
        from: ch09/s01
      - text: "Die Gruppe hat noch ein zweites Gut im Blick."
        from: ch09/s01
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste von Weidenkamp heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, kurze Wege für die Gäste, die Mauer als Sichtschutz – der richtige Platz für den Parkplatz."
        from: ch04/s02
      - text: "Ein paar Rosen in Kübeln reichen als Akzent."
        from: ch04/s02
      - text: "Für das Erntefest findet sich eine Lösung: eine Veranstaltungsfläche gegen Gebühr zu fairen Konditionen für Vereine."
        from: ch04/s01
      - text: "Seinem Herrenhaus im Süden fehlt etwas, seit der alte Park für den Anbau weichen musste; was, könnte er nicht sagen."
        from: ch04/s02
      - text: "Der Kaffee im Notariat ist nicht so gut wie der von Frau Paulsen."
        from: ch07/s01
      - text: "Er hat Jonas' Rücktritt fast geahnt, seit dem Notar, weil Jonas nur Wasser wollte."
        from: ch09/s01
      - text: "Behält Jonas das Haus, fehlt ihm wenigstens nichts."
        from: ch09/s01
    does_not_know:
      - "Warum Jonas zurückgetreten ist und wie er Dach und Haus ohne Verkauf tragen will."
      - "Dass Jonas Hannes am 1. September zugesagt hat, das Erntefest bleibe dauerhaft auf dem Gut."
      - "Dass Jonas Hannes am 14. August zugesagt hat, das Erntefest finde dieses Jahr auf dem Gut statt."
      - "Dass Jonas Marie und Grete von der Unterschrift nichts gesagt hat und dass Marie den Vorvertrag am 27. August gefunden hat."
      - "Dass Grete, Lena und Marie vom Parkplatz im Rosengarten wissen."
      - "Dass Jonas' Einlage fürs Büro fällig war, die Partner sie bis nach dem Fest gestundet haben und Jonas die Partnerschaft abgesagt hat."
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat und Stecklinge davon zieht."
      - "Dass Grete ihm den Kuchen vorenthalten hat."
      - "Dass das Dorf am Samstag Mitte Juli beim Arbeitseinsatz im Garten geholfen hat und Jonas mitgearbeitet hat."
      - "Dass an der Südmauer eine alte 'Ghislaine de Féligonde' freigelegt wurde."
      - "Dass Marie und Jonas ein Paar sind."
      - "Dass Jonas als Junge mit Hedwig den ersten Steckling der Lindenhof-Rose in den Garten gepflanzt hat."
      - "Wie das Erntefest am 5. September auf dem Gut gelaufen ist (Jonas vorn auf Hedwigs Trecker)."
