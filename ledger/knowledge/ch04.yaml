based_on: ["ch03#5ce239", "ch04/s01#3dc24e", "ch04/s02#68b6c3"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch lag im Arbeitszimmer, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf der Treppe liegen lassen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Marie hat den Auftrag, den Garten bis zum Fest fertig zu machen, und sagt, Jonas wolle verkaufen."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag morgens Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Marie kam als Kind jeden Dienstag und Freitag in den Garten; sie selbst hat auf der Rückseite vom Kalender Buch geführt, eine Stunde Unkraut gegen ein Stück Streuselkuchen."
        from: ch03/s01
      - text: "Marie nimmt den Kaffee mit Milch; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Ein Gast, Herr Steinhagen, ist auf das Gut gekommen; er kennt ihren Namen und sagt, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Steinhagen und Jonas auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt, ohne Kuchen; sonst stand nichts auf dem Tablett."
        from: ch04/s01
    believes:
      - text: "Hedwigs Wunsch im Testament gilt Marie, auch wenn ihr Name nicht drinsteht."
        from: ch01/s03
      - text: "Der Verkauf ist Jonas' Sache, der Garten ist Maries."
        from: ch01/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Welche Bedingungen Marie und Jonas auf der Terrasse ausgehandelt haben (freie Hand bei den Rosen, Budgetrahmen, Fotos alle zwei Wochen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' entsorgen wollte und sie nun mit Punktfundamenten stehen bleiben sollen."
      - "Dass Marie den Hauptweg bis Ende Juni freihalten muss."
      - "Dass der Makler Ende Juli Fotos vom Garten will."
      - "Dass Marie und Jonas sich beim Gewitter unter dem Laubengang nähergekommen sind und sich seitdem duzen."
      - "Dass Hannes Jonas und Steinhagen nach dem Erntefest gefragt hat und Steinhagen nur eine Veranstaltungsfläche gegen Gebühr anbietet."
      - "Was Steinhagen im Salon vorgelegt hat: rund zwanzig Zimmer, Spa und Seminarraum in Kuhstall und Scheune, ein Saunahaus am Steg."
      - "Dass der Lageplan von Weidenkamp den Parkplatz genau auf den Rosengarten legt."
      - "Dass Weidenkamp ihr lebenslanges Wohnrecht bestehen lassen will und für einen freiwilligen Auszug eine großzügige Abfindung vorsieht, die Jonas bei Gelegenheit ansprechen soll."
  hannes-kroeger:
    knows:
      - text: "Jonas Behrendt ist auf dem Gut; er spricht ihn als Herrn Behrendt an."
        from: ch03/s02
      - text: "Der Hauptweg ist frei, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Marie arbeitet im Rosengarten; an der Sonnenuhr sitzen alte Holunderstubben und an der Westseite ein Brombeerwurzelstock, die mit dem Spaten nicht herauszubekommen sind."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will, dass langsam gezogen wird, damit der Ballen die Rose nicht mitreißt."
        from: ch03/s02
      - text: "Er bringt Sonnabend um halb acht den Trecker, um die Stubben mit der Kette nach Norden zum Tor hin herauszuziehen."
        from: ch03/s02
      - text: "Jonas kann noch nicht sagen, ob das Erntefest auf dem Gut bleibt; es hänge an Gutachten fürs Dach und die Fenster, an den Kosten und an Fristen, die Jonas selbst noch nicht kennt."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September, wie immer."
        from: ch03/s02
      - text: "Er hat Hedwig mit derselben Kette den Fliederbusch an der Remise herausgeholt."
        from: ch03/s02
      - text: "Er fährt mit Marie Kies auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war auf dem Gut; er kannte seinen Namen und hat mit Jonas Garten und Haus angesehen."
        from: ch04/s01
      - text: "Steinhagen nennt die Fläche hinter dem Haus ein Pfund."
        from: ch04/s01
      - text: "Auf seine Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen und ist mit Steinhagen in den Salon gegangen, die Unterlagen durchzugehen."
        from: ch04/s01
    believes:
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
      - text: "Mit Kette und Trecker ist der Stubben ruckzuck raus."
        from: ch03/s02
      - text: "Kommt das Hotel, hat das Erntefest auf dem Gut keinen Platz mehr (\"Wo soll das dann hin?\")."
        from: ch04/s01
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Ob Jonas das Gut an Weidenkamp verkaufen will; Jonas hat es weder gesagt noch abgestritten."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Was im Salon besprochen wurde: rund zwanzig Zimmer, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg."
      - "Dass der Lageplan den Parkplatz genau auf den Rosengarten legt."
      - "Dass Weidenkamp für Gretes freiwilligen Auszug eine Abfindung vorsieht."
  jonas-behrendt:
    knows:
      - text: "Die Frau im Garten heißt Marie Albers."
        from: ch01/s01
      - text: "Die Rose am Hauptweg ist eine 'New Dawn', kein Gestrüpp."
        from: ch01/s01
      - text: "Das Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Sieben Fenster im Erdgeschoss zur Gartenseite sind undicht, zwei Flügel verzogen; für das Dach fehlt noch ein Angebot."
        from: ch01/s02
      - text: "Marie hat den Auftrag angenommen: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Marie rechnet nach ihrem eigenen, nicht verhandelbaren Stundensatz ab."
        from: ch01/s02
      - text: "An den Rankbögen an der Ostmauer hängt seit zweiundfünfzig Jahren eine Rose."
        from: ch02/s01
      - text: "Abmachung mit Marie: Die Bögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief), er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg vom Tor bis zur Pforte bis Ende Juni freizumachen, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Donnerstag um neun Uhr ist die Abnahme des Parkdecks in Hamburg, dort wird er gebraucht."
        from: ch02/s02
      - text: "Seine Einlage für die Partnerschaft im Büro steht an."
        from: ch02/s02
      - text: "Es gibt einen Kaufinteressenten aus der Hotelbranche."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben, dann seien andere Zahlen drin; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Der Makler will am letzten Freitag im Juli einen Fotografen für Fotos vom Garten schicken."
        from: ch02/s02
      - text: "Der Hügel hinter der Scheune ist der einzige Platz am Gut mit Netz."
        from: ch02/s02
      - text: "Er erinnert sich an ein Floß am Gutssee und an Hedwig, die ihn zum Kuchen rief."
        from: ch02/s02
      - text: "Die Bögen der 'Ghislaine' sitzen seit einer Woche fest im Beton und halten; er hat nachgerechnet, was die Fundamente tragen müssen."
        from: ch03/s01
      - text: "Marie hat mit zehn Jahren im Garten ihren ersten Rosenschnitt gemacht; Hedwig hat ihr die Hand geführt."
        from: ch03/s01
      - text: "Marie kam als Kind jeden Dienstag und Freitag; Grete hat Buch geführt, eine Stunde Unkraut gegen ein Stück Streuselkuchen."
        from: ch03/s01
      - text: "Hedwig hat Marie ihre alte Schere mit dem roten Griff geschenkt; Marie hat sie heute noch."
        from: ch03/s01
      - text: "Hedwig hat laut mit den Rosen geredet, und Marie tut es auch."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Marie und er sagen seit dem Gewitter unter dem Laubengang Du zueinander."
        from: ch03/s01
      - text: "Marie nimmt den Kaffee mit Milch (von Grete)."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Hannes bringt Sonnabend um halb acht den Trecker für die Stubben im Garten."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; die Nummer hat er vom Makler."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen und verrutschte Pfannen, in der Rinne fault Laub."
        from: ch03/s03
      - text: "Steinhagen war Mitte Juli zur Besichtigung da; Grete hat beiden auf der Terrasse Kaffee eingeschenkt, ohne Kuchen, zum ersten Mal seit all den Kindersommern."
        from: ch04/s02
      - text: "Beim Rundgang hat Marie Steinhagen gesagt, das sei keine Fläche, sondern ein Garten aus den Dreißigerjahren, und die 'Rosa Mundi' sei älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes hat Steinhagen nach dem Erntefest gefragt; Steinhagen bot eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen. Er selbst hat geschwiegen."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, ein kleines Saunahaus aus Holz unten am Steg."
        from: ch04/s02
      - text: "Grundrisse, Schnitte und Kostenschätzung nach Gewerken sind solide; zwei Balken sind eingeplant (Seite vier, unten), die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Im Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit einer Zufahrt durch das Tor; ein paar Rosen sollen als Akzent in Kübeln bleiben."
        from: ch04/s02
      - text: "Grete hat ein lebenslanges Wohnrecht, das bestehen bleiben soll; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor, und er soll das bei Gelegenheit ansprechen."
        from: ch04/s02
      - text: "Steinhagen hatte ein Herrenhaus weiter im Süden, dessen alter Park für den Anbau weichen musste; seitdem fehle dem Haus etwas."
        from: ch04/s02
      - text: "Steinhagen meldet sich wieder; die Unterlagen mit einer Kopie des Lageplans hat er ihm dagelassen, er hat weder zu- noch abgesagt."
        from: ch04/s02
      - text: "Marie hat er auf ihre Frage nur gesagt, der Besucher sei ein Interessent; die Mappe hat er unter den Laptop geschoben."
        from: ch04/s02
    believes:
      - text: "Marie ist die Gärtnerin."
        from: ch01/s01
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Marie kennt den Garten; eine Firma aus der Kreisstadt wäre zu langsam."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Ende Juni ist der Hauptweg frei, bis zum Herbst gibt es einen Käufer, und die Einlage leistet er zum Jahresende."
        from: ch02/s02
      - text: "Das Haupthaus ist sanierungsbedürftiger als das Scheunendach."
        from: ch03/s03
      - text: "Steinhagen ist der Käufer, den er seit dem Brief vom Nachlassgericht wollte: einer, der rechnen kann und sich nicht lange bitten lässt."
        from: ch03/s03
      - text: "Mit einem Parkplatz auf dem Gelände hat er seit dem Wort Stellplatzlösung gerechnet, mit der Abfindungszeile für Grete nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "\"Ein Interessent\" war nicht gelogen, aber so wenig, dass es kaum Gewicht hatte."
        from: ch04/s02
    does_not_know:
      - "Dass hinter dem Laubengang unter Brombeeren der letzte Stock der Lindenhof-Rose steht."
      - "Dass das Buch, in dem Marie liest, Hedwigs Gartenbuch mit Plänen zu jeder Rose ist."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten, und was Hedwig im letzten Herbst auf der Bank zu Marie gesagt hat."
      - "Was Marie bei Lena im Hofladen über ihn erzählt hat."
      - "Ob das, was zwischen ihm und Marie unter den Bögen angefangen hat, eine Last verträgt."
      - "Warum er Marie nicht mehr gesagt hat als \"Ein Interessent\"."
  lena-hansen:
    knows:
      - text: "Marie arbeitet am Laubengang im Garten von Hedwig."
        from: ch02/s03
      - text: "Der Mann, über den Marie spricht (Jonas), hatte in seiner Tabelle mit Budget und Meilensteinen die Entsorgung beider Rankbögen der 'Ghislaine' vorgesehen."
        from: ch02/s03
      - text: "Er hat am Bogen ein fehlendes Fundament festgestellt und eins skizziert, 40 × 40, 80 tief wegen Frost; dabei hat er sich die helle Hose an beiden Knien grün gemacht."
        from: ch02/s03
      - text: "Am ersten Tag ließ er Schuhe und Socken auf der Freitreppe trocknen."
        from: ch02/s03
    believes:
      - text: "Marie hat Gefühle für Jonas."
        from: ch02/s03
      - text: "Die Bögen werden nicht verschrottet, weil Marie ihn dazu gebracht hat (nach Maries Erzählung)."
        from: ch02/s03
    does_not_know:
      - "Dass Jonas Marie mit dem Rosengarten bis zum Erntefest am 5. September beauftragt hat."
      - "Dass Jonas das Gut verkaufen will."
      - "Dass Marie den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt."
      - "Dass Marie und Jonas sich beim Gewitter unter dem Laubengang nähergekommen sind und sich seitdem duzen."
      - "Dass offen ist, ob das Erntefest auf dem Gut bleibt."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels das Gut besichtigt hat und der Lageplan einen Parkplatz auf dem Rosengarten vorsieht."
  marie-albers:
    knows:
      - text: "Jonas Behrendt ist der Erbe."
        from: ch01/s01
      - text: "Auftrag von Jonas: den Rosengarten bis zum Erntefest am 5. September herrichten, Wege begehbar, Beete sauber."
        from: ch01/s02
      - text: "Jonas will das Gut verkaufen; ein gepflegtes Gut soll einen besseren Preis bringen."
        from: ch01/s02
      - text: "Abmachung: freie Hand bei den Rosen, über die Wege wird geredet, Material nach Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Arbeit Geld hinterlegt, für den Rest nur den Wunsch."
        from: ch01/s03
      - text: "Hinter dem Laubengang unter den Brombeeren steht ein Stock der Lindenhof-Rose mit einer Knospe."
        from: ch01/s03
      - text: "Sie hat Hedwigs Gartenbuch; Grete hat es ihr zwei Tage nach dem Auftrag aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Laut Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas' Tabelle: Hauptweg frei bis Ende Juni; beim Laubengang Entsorgung, Ersatz verzinkt; er hatte schon ein Angebot."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Dafür, dass die Bögen bleiben, muss sie den Hauptweg vom Tor bis zur Pforte bis Ende Juni freimachen, kein Tag später."
        from: ch02/s01
      - text: "Lena meint, dass Marie seit zwanzig Minuten über Jonas' Schuhe redet, sei kein gutes Zeichen – oder ein sehr gutes."
        from: ch02/s03
      - text: "Frieda nennt sie Tante Rosen und hat gefragt, ob sie verliebt ist."
        from: ch02/s03
      - text: "Die Bögen der 'Ghislaine' sitzen seit einer Woche im Beton und halten; sie hat die Rose wieder angebunden, der achte Bogen war als Nächstes dran."
        from: ch03/s01
      - text: "Seit dem Gewitter unter dem Laubengang sagen Jonas und sie Du zueinander; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Jonas weiß, dass sie wie Hedwig mit den Rosen spricht."
        from: ch03/s01
      - text: "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu ihr gesagt hat."
        from: ch03/s01
      - text: "Sie wollte nach dem Gewitter nicht von Jonas' Seite gehen und ist geblieben."
        from: ch03/s01
      - text: "Der Brombeerwurzelstock an der Westseite der Sonnenuhr rührt sich seit drei Tagen nicht unter der Hacke."
        from: ch03/s02
      - text: "Jonas hat Hannes nicht zugesagt, dass das Erntefest auf dem Gut bleibt; es hänge an Gutachten für Dach und Fenster, an Kosten und an Fristen."
        from: ch03/s02
      - text: "Das Erntefest ist am ersten Samstag im September."
        from: ch03/s02
      - text: "Grete hat Jonas gesagt, dass sie den Kaffee mit Milch nimmt."
        from: ch03/s02
      - text: "Sie bringt mit Hannes Kies auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Der Besucher ist Ralf Steinhagen von Weidenkamp Hotels; er kannte ihren Namen, den von Hannes und von Grete."
        from: ch04/s01
      - text: "Grete hat Steinhagen und Jonas auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand gebracht, ohne Kuchen."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus ein Pfund und sagte, das werde auf den Fotos sehr schön; von welchen Fotos er sprach, weiß sie nicht."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an; Jonas schwieg dazu."
        from: ch04/s01
      - text: "Jonas ist mit Steinhagen in den Salon gegangen, die Unterlagen durchzugehen."
        from: ch04/s01
      - text: "Auf ihre Frage hat Jonas gesagt, Steinhagen sei ein Interessent; mehr hat er nicht gesagt."
        from: ch04/s02
    believes:
      - text: "Splitt würde den alten Kies des Hauptwegs zerstören."
        from: ch01/s01
      - text: "Jonas will das Gut verkaufsfertig machen."
        from: ch01/s03
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Jonas kennt den Winkel hinter dem Laubengang nicht; er kommt in seiner Tabelle nicht vor."
        from: ch01/s03
      - text: "Vielleicht hat Lena recht und sie empfindet mehr als Ärger für Jonas."
        from: ch02/s03
      - text: "Ihr Herzklopfen neben Jonas kommt vom Gewitter."
        from: ch03/s01
      - text: "Die Stubben dürfen nur langsam gezogen werden, sonst reißt der Ballen die 'Rosa Mundi' mit."
        from: ch03/s02
      - text: "Der Rosengarten ist keine Fläche, sondern ein Garten aus den Dreißigerjahren, mit diesen Wegen und dieser Mauer."
        from: ch04/s01
      - text: "Grete hat Steinhagen absichtlich keinen Kuchen hingestellt."
        from: ch04/s01
      - text: "Auf \"Ein Interessent\" müsste von Jonas noch etwas folgen."
        from: ch04/s02
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor gesehen hat."
      - "Wie hoch Hedwigs Geldvermächtnis für die Gartenarbeit ist."
      - "Dass Jonas mit einem Käufer bis zum Herbst rechnet."
      - "Dass der Makler am letzten Freitag im Juli einen Fotografen für Fotos vom Garten schicken will."
      - "Dass Jonas am Donnerstag zur Abnahme eines Parkdecks nach Hamburg muss und eine Einlage für die Partnerschaft im Büro ansteht."
      - "Dass Jonas sie vom Hügel hinter der Scheune bei der Arbeit beobachtet hat, auch während seines Telefonats."
      - "Warum Jonas Hannes keine Zusage zum Erntefest gegeben hat."
      - "Was Steinhagen und Jonas auf der Terrasse und im Salon besprochen haben: rund zwanzig Zimmer, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg."
      - "Dass der Lageplan von Weidenkamp den Parkplatz genau auf den Rosengarten legt und nur ein paar Rosen in Kübeln bleiben sollen."
      - "Dass Weidenkamp für Gretes freiwilligen Auszug eine Abfindung vorsieht."
      - "Dass unter Jonas' Laptop die Mappe mit einer Kopie des Lageplans liegt."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendt ist der Eigentümer des Guts; dessen Makler hat ihm Jonas' Nummer gegeben."
        from: ch03/s03
      - text: "Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Namen von Marie Albers, Hannes Kröger und Grete Paulsen."
        from: ch04/s01
      - text: "Marie sagt, der Garten sei in den Dreißigerjahren angelegt, und die 'Rosa Mundi' sei älter als sie beide zusammen."
        from: ch04/s01
      - text: "Hannes sorgt sich, wo das Erntefest bleibt, wenn das Hotel kommt."
        from: ch04/s01
      - text: "Weidenkamps Plan: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg, Parkplatz auf dem Rosengarten mit ein paar Rosen in Kübeln."
        from: ch04/s02
      - text: "Grete Paulsen hat ein lebenslanges Wohnrecht; Weidenkamp sieht für einen freiwilligen Auszug eine großzügige Abfindung vor."
        from: ch04/s02
      - text: "Jonas hat die Abfindung großzügig genannt, nicht widersprochen und weder zu- noch abgesagt; die Unterlagen hat er Jonas dagelassen."
        from: ch04/s02
    believes:
      - text: "Ein Haus mit Geschichte ist genau das, was die Gäste heute suchen."
        from: ch03/s03
      - text: "Die Fläche hinter dem Haus ist ein Pfund: ebener Grund, kurze Wege, die Mauer gibt Sichtschutz gratis."
        from: ch04/s02
      - text: "Für das Erntefest findet sich eine Lösung mit einer Veranstaltungsfläche gegen Gebühr."
        from: ch04/s01
      - text: "Seinem Herrenhaus im Süden fehlt seit dem Verlust des alten Parks etwas, ohne dass er sagen könnte, was."
        from: ch04/s02
    does_not_know:
