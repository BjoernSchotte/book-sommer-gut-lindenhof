based_on: ["ch03#0f9d2b", "ch04/s01#370004", "ch04/s02#68b6c3"]
characters:
  grete-paulsen:
    knows:
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hedwigs Gartenbuch liegt im Arbeitszimmer auf dem Schreibtisch unterm Fenster, mit Plänen und Notizen zu jeder Rose."
        from: ch01/s03
      - text: "Jonas hat Marie den Auftrag gegeben, den Garten bis zum Fest fertig zu machen."
        from: ch01/s03
      - text: "Jonas stand nach dem Gespräch noch eine Weile auf der Terrasse und sah Marie nach."
        from: ch01/s03
      - text: "Jonas hat seine nassen Socken auf die Treppe gelegt."
        from: ch01/s03
      - text: "Sie hat Marie zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt."
        from: ch02/s01
      - text: "Als Marie Kind war, gab es bei ihr jeden Dienstag und Freitag für eine Stunde Unkraut ein Stück Streuselkuchen; sie hat auf der Rückseite vom Kalender Buch geführt."
        from: ch03/s01
      - text: "Marie nimmt Milch in den Kaffee; das hat sie Jonas gesagt."
        from: ch03/s02
      - text: "Sie hat Jonas das Mittagessen ohne ein Wort hingestellt."
        from: ch03/s03
      - text: "Mitte Juli ist ein Besucher im silbernen Firmenwagen gekommen, Ralf Steinhagen; er hat sie mit Namen begrüßt und gesagt, Herr Behrendt habe von ihrem Kaffee geschwärmt."
        from: ch04/s01
      - text: "Sie hat Jonas und Steinhagen auf der Terrasse Kaffee aus der guten Kanne mit dem Goldrand eingeschenkt und keinen Kuchen dazugestellt, obwohl sie am Morgen Butterkuchen gebacken hat."
        from: ch04/s01
    believes:
      - text: "Jonas will das Gut verkaufen (so sagt es Marie); das ist seine Sache, der Garten ist Maries."
        from: ch01/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Die Einzelheiten der Absprache zwischen Jonas und Marie (Budget, Zwischenstände mit Fotos, freie Hand bei den Rosen)."
      - "Dass Jonas die Rankbögen der 'Ghislaine' erst entsorgen wollte und ihnen nun Punktfundamente gibt."
      - "Dass Jonas den Hauptweg Ende Juni frei haben will, vom Tor bis zur Pforte."
      - "Dass der Makler Ende Juli einen Fotografen schicken wollte."
      - "Was Weidenkamp plant: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg, den Parkplatz auf dem Rosengarten."
      - "Dass Weidenkamp ihr bei freiwilligem Auszug eine großzügige Abfindung vorsieht und Steinhagen Jonas gebeten hat, das bei ihr anzusprechen."
      - "Dass Marie und Jonas sich seit dem Gewitter unter dem Laubengang duzen."
      - "Dass Hannes gefragt hat, ob das Erntefest auf dem Gut bleibt, und Jonas es offen gelassen hat."
  hannes-kroeger:
    knows:
      - text: "Der Hauptweg ist frei, die Buchskanten stehen, und die 'Ghislaine' hängt wieder an ihren Bögen im Laubengang."
        from: ch03/s02
      - text: "Um die Sonnenuhr sitzen alte Holunderstubben unter dem Kies, an der Westseite ein Brombeerwurzelstock, dem Marie seit drei Tagen mit der Hacke nicht beikommt."
        from: ch03/s02
      - text: "Die 'Rosa Mundi' steht keinen Meter vom Stubben; Marie will langsam ziehen, nicht ruckzuck, damit der Ballen die Rose nicht mitreißt; gezogen wird nach Norden, zum Tor hin."
        from: ch03/s02
      - text: "Mit derselben Kette hat er Hedwig den Fliederbusch an der Remise rausgeholt."
        from: ch03/s02
      - text: "Jonas kann noch nicht sagen, ob das Erntefest auf dem Gut bleibt; es hänge an Gutachten fürs Dach und für die Fenster, an den Kosten und an Fristen, die er selbst noch nicht kennt."
        from: ch03/s02
      - text: "Das Erntefest ist wie immer am ersten Samstag im September."
        from: ch03/s02
      - text: "Er bringt am Sonnabend um halb acht den Trecker für die Stubben."
        from: ch03/s02
      - text: "Marie und Jonas duzen sich; Marie hat ihm gegenüber das 'Ihnen' heruntergeschluckt."
        from: ch03/s02
      - text: "Mitte Juli schaufelt er mit Marie Kies vom Hänger auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war auf dem Gut, hat mit Jonas auf der Terrasse gesessen und den Garten besichtigt."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus ein Pfund und sagte, den Fotografen des Maklers brauche man Ende Juli nicht mehr, die Bilder mache man selbst."
        from: ch04/s01
      - text: "Auf seine Frage nach dem Erntefest sagte Steinhagen, beim Hotel gäbe es eine Veranstaltungsfläche gegen Gebühr, für Vereine zu sehr fairen Konditionen."
        from: ch04/s01
      - text: "Jonas hat dazu geschwiegen."
        from: ch04/s01
    believes:
      - text: "Die Arbeit im Garten läuft gut (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Mit dem Spaten wird das nix; Kette und Trecker holen den Stubben raus."
        from: ch03/s02
      - text: "Zwischen Marie und Jonas ist etwas."
        from: ch03/s02
    does_not_know:
      - "Dass Jonas das Gut verkaufen will und ein Käufer bis zum Herbst sein Plan ist."
      - "Dass Weidenkamp den Parkplatz genau auf den Rosengarten legen will."
      - "Dass Weidenkamp Grete bei freiwilligem Auszug eine Abfindung vorsieht."
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
  jonas-behrendt:
    knows:
      - text: "Die Gärtnerin im Rosengarten heißt Marie Albers."
        from: ch01/s01
      - text: "Marie hält die Kletterrose am Hauptweg für eine 'New Dawn', kein Gestrüpp, und lehnt Bagger und Splitt auf dem Weg ab."
        from: ch01/s01
      - text: "Das Gutshaus hat sieben undichte Fenster im Erdgeschoss zur Gartenseite; für das Dach steht ein Angebot vom Dachdecker bis Ende Juni aus."
        from: ch01/s02
      - text: "Hedwigs Geldvermächtnis für die Gartenarbeit reicht für einen Sommer Pflege."
        from: ch01/s02
      - text: "Hedwigs Wunsch: Der Rosengarten soll zum Erntefest wieder blühen."
        from: ch01/s02
      - text: "Absprache mit Marie: Rosengarten bis zum Erntefest am 5. September, freie Hand bei den Rosen, über die Wege wird noch geredet; ihr Stundensatz steht nicht zur Verhandlung."
        from: ch01/s02
      - text: "Die zwei Rankbögen an der Ostmauer stecken ohne Fundament im Boden; laut Marie hängt seit zweiundfünfzig Jahren eine Rose daran, die um das Gestell herumgewachsen ist."
        from: ch02/s01
      - text: "Neue Absprache mit Marie: Die Rankbögen bleiben und bekommen je Fuß ein Punktfundament (40 × 40, 80 tief); er bestellt Beton, Marie bindet die Rose selbst wieder an."
        from: ch02/s01
      - text: "Marie hat zugesagt, den Hauptweg Ende Juni frei zu haben, vom Tor bis zur Pforte, mit Fotos und Zollstock."
        from: ch02/s01
      - text: "Donnerstag um neun Uhr ist in Hamburg die Abnahme des Parkdecks; das Büro braucht ihn dort."
        from: ch02/s02
      - text: "Für die Partnerschaft im Büro ist seine Einlage fällig."
        from: ch02/s02
      - text: "Laut Makler gibt es einen Kaufinteressenten aus der Hotelbranche, noch ohne Namen."
        from: ch02/s02
      - text: "Der Makler will den Garten vorzeigbar haben (gute Wege, Blüten mit Blick vom Haus, keine Ecke, die nach Arbeit aussieht), dann gehe es um andere Zahlen; das Dach rechnen die Interessenten ohnehin ein."
        from: ch02/s02
      - text: "Am letzten Freitag im Juli soll ein Fotograf des Maklers den Garten fotografieren."
        from: ch02/s02
      - text: "Erinnerung aus der Kindheit: ein Floß aus Brettern am Gutssee, und Hedwig rief ihn zum Kuchen."
        from: ch02/s02
      - text: "Die Bögen der 'Ghislaine' stehen seit einer Woche im Beton und halten; er hat am Eisen gerüttelt, nichts gab nach. Was die Fundamente tragen müssen, hat er nachgerechnet."
        from: ch03/s01
      - text: "Marie und er duzen sich seit dem Gewitter unter dem Laubengang."
        from: ch03/s01
      - text: "Marie ist als Kind im Garten herumgestromert und hat mit zehn ihren ersten richtigen Rosenschnitt gemacht; Hedwig hat ihr die Hand geführt (über dem Auge, schräg)."
        from: ch03/s01
      - text: "Als Kind bekam Marie bei Grete jeden Dienstag und Freitag für eine Stunde Unkraut ein Stück Streuselkuchen; Grete führte auf der Rückseite vom Kalender Buch."
        from: ch03/s01
      - text: "Hedwig hat Marie ihre alte Schere mit dem roten Griff geschenkt; Marie hat sie heute noch."
        from: ch03/s01
      - text: "Hedwig hat laut und mit tiefer, rauer Stimme mit den Rosen geredet, mit der 'Rosa Mundi' geschimpft und die 'Ghislaine' jeden Juni gelobt; Marie redet auch mit den Rosen."
        from: ch03/s01
      - text: "Die Bank unter der 'New Dawn' war Hedwigs Lieblingsplatz."
        from: ch03/s01
      - text: "Laut Grete nimmt Marie Milch in den Kaffee."
        from: ch03/s02
      - text: "Hannes Kröger hat gefragt, ob das Erntefest auf dem Gut bleibt; er hat es offen gelassen (Gutachten fürs Dach und die Fenster, Kosten, Fristen)."
        from: ch03/s02
      - text: "Das Erntefest ist wie immer am ersten Samstag im September."
        from: ch03/s02
      - text: "Hannes bringt am Sonnabend um halb acht den Trecker, um mit Kette die Stubben an der Sonnenuhr zu ziehen."
        from: ch03/s02
      - text: "Ralf Steinhagen von Weidenkamp Hotels hat ihn angerufen; die Nummer hat er vom Makler. Steinhagen kennt Zimmerzahl des Gutshauses, Grundfläche der Scheune und Baujahr."
        from: ch03/s03
      - text: "Er hat der Besichtigung durch Weidenkamp am übernächsten Montag (Mitte Juli) zugesagt und sie eingetragen; Steinhagen schickt eine Bestätigung."
        from: ch03/s03
      - text: "Das Scheunendach hat Moos in den Fugen und eine Reihe verrutschter Pfannen, in der Rinne fault Laub."
        from: ch03/s03
      - text: "Grete hat Steinhagen und ihm Kaffee aus der guten Kanne eingeschenkt, ohne Kuchen; in all seinen Kindersommern hat sie ihm nie eine Tasse ohne Kuchen hingestellt, bis zu diesem Morgen."
        from: ch04/s02
      - text: "Beim Rundgang nannte Steinhagen die Fläche hinter dem Haus ein Pfund und sagte zu Marie, den Fotografen des Maklers brauche man Ende Juli nicht mehr, die Bilder mache Weidenkamp selbst."
        from: ch04/s01
      - text: "Marie hat Steinhagen widersprochen: Das sei keine Fläche, sondern ein Garten, angelegt in den Dreißigerjahren; die 'Rosa Mundi' sei älter als sie beide zusammen."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen."
        from: ch04/s01
      - text: "Hotelplan von Weidenkamp: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, unten am Steg ein kleines Saunahaus aus Holz; Grundrisse, Schnitte und eine Kostenschätzung nach Gewerken, zwei Balken eingeplant (Seite vier, unten)."
        from: ch04/s02
      - text: "Steinhagens Lasten und Fristen halten jeder Prüfung stand; die Summe liegt kaum über seiner eigenen Schätzung."
        from: ch04/s02
      - text: "Im Lageplan liegt der Parkplatz genau auf dem Rosengarten, nummeriert, mit Zufahrt durch das Tor; Steinhagen begründet es mit ebenem Grund, kurzen Wegen und der Mauer als Sichtschutz. Ein paar Rosen sollen als Akzent in Kübeln bleiben."
        from: ch04/s02
      - text: "Laut Steinhagen hat Grete ein lebenslanges Wohnrecht, das bestehen bleibt; für einen freiwilligen Auszug sieht Weidenkamp eine großzügige Abfindung vor, und Steinhagen bittet ihn, das bei Grete anzusprechen."
        from: ch04/s02
      - text: "Steinhagen hatte vor ein paar Jahren ein Herrenhaus weiter im Süden, dessen alter Park für den Anbau weichen musste; das Haus läuft gut, aber seitdem fehle ihm etwas."
        from: ch04/s02
      - text: "Steinhagen lässt ihm Zeit und meldet sich; er selbst hat nichts zu- und nichts abgesagt."
        from: ch04/s02
      - text: "Eine Kopie des Lageplans liegt in der dünnen Kartonmappe im Salon; er hat sie unter den Laptop geschoben."
        from: ch04/s02
      - text: "Auf Maries Frage, was Steinhagen wollte, hat er nur gesagt: \"Ein Interessent.\""
        from: ch04/s02
    believes:
      - text: "Marie ist die Gärtnerin."
        from: ch01/s01
      - text: "Ein gepflegtes Gut bringt einen besseren Preis."
        from: ch01/s02
      - text: "Ein Garten funktioniert wie eine Baustelle: ohne Abnahmen keine Zahlung."
        from: ch01/s02
      - text: "Marie kennt den Garten; das ist ein Vorteil gegenüber einer Firma aus der Kreisstadt, die zu spät anfangen würde."
        from: ch01/s02
      - text: "Sein Plan geht auf: Ende Juni der freie Hauptweg, danach ein Käufer bis zum Herbst und die Einlage zum Jahresende."
        from: ch02/s02
      - text: "Das Haupthaus ist in schlimmerem Zustand als das Scheunendach, dessen Kosten er ungefähr kennt."
        from: ch03/s03
      - text: "Steinhagen ist der Käufer, den er seit dem Brief vom Nachlassgericht will: einer, der rechnen kann und sich nicht lange bitten lässt."
        from: ch03/s03
      - text: "Die Zusage zur Besichtigung ist die richtige Entscheidung, fühlt sich aber an wie ein Riss im Fundament."
        from: ch03/s03
      - text: "Ob das, was mit Marie unter den Bögen angefangen hat, eine Last verträgt, weiß er nicht."
        from: ch03/s03
      - text: "Mit dem Parkplatz hat er seit dem Wort Stellplatzlösung gerechnet, mit der Zeile über Gretes Abfindung nicht."
        from: ch04/s02
      - text: "Grete hat mehr geahnt als er."
        from: ch04/s02
      - text: "\"Ein Interessent\" war nicht gelogen, aber so wenig, dass es kaum Gewicht hatte; warum er Marie nicht mehr gesagt hat, weiß er selbst nicht."
        from: ch04/s02
    does_not_know:
      - "Dass hinter dem Laubengang unter den Brombeeren der letzte Stock der Lindenhof-Rose steht."
      - "Dass Marie Hedwig versprochen hat, den Garten zu retten."
      - "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu Marie gesagt hat."
      - "Dass Grete Marie von Hedwigs Gartenbuch im Arbeitszimmer erzählt und es ihr gegeben hat."
      - "Dass Marie mit Lena über ihn gesprochen hat und Lena meint, Marie habe Gefühle für ihn."
      - "Dass Marie nicht wusste, von welchem Fototermin Steinhagen sprach."
  lena-hansen:
    knows:
      - text: "Laut Marie stand in Jonas' Tabelle beim Laubengang 'Entsorgung' für beide Rankbögen der 'Ghislaine', die zweiundfünfzig Jahre alt sind."
        from: ch02/s03
      - text: "Laut Marie kniete Jonas in heller Hose ins nasse Gras vor den Bogen, rüttelte am Eisen, stellte fehlendes Fundament fest und skizzierte eins auf die Rückseite seiner Tabelle: vierzig mal vierzig, achtzig tief wegen Frost."
        from: ch02/s03
      - text: "Laut Marie kam Jonas in geputzten Lederschuhen, seine Hose ist an beiden Knien grün und hin, und am ersten Tag ließ er sie samt Socken auf der Freitreppe trocknen."
        from: ch02/s03
      - text: "Marie sagt, sie habe Jonas dazu gebracht, die Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Marie hat zehn Eier für den nächsten Morgen gekauft und zwei Stück Butterkuchen von ihr bekommen; sie sehen sich am Freitag wieder."
        from: ch02/s03
    believes:
      - text: "Marie hat Gefühle für Jonas; dass sie seit zwanzig Minuten über seine Schuhe redet, ist kein gutes oder ein sehr gutes Zeichen."
        from: ch02/s03
    does_not_know:
      - "Dass Marie hinter dem Laubengang unter den Brombeeren den letzten Stock der Lindenhof-Rose gefunden hat."
      - "Dass es einen Kaufinteressenten aus der Hotelbranche gibt und der Makler Ende Juli einen Fotografen schicken wollte."
      - "Dass Jonas den Hauptweg Ende Juni frei haben will."
      - "Dass Marie und Jonas sich seit dem Gewitter unter dem Laubengang duzen."
      - "Dass Ralf Steinhagen von Weidenkamp Hotels Mitte Juli das Gut besichtigt hat."
      - "Dass Weidenkamp den Parkplatz auf den Rosengarten legen will."
  marie-albers:
    knows:
      - text: "Der Erbe aus Hamburg kommt an diesem Tag auf das Gut."
        from: ch01/s01
      - text: "Jonas Behrendt ist der Erbe."
        from: ch01/s01
      - text: "Jonas will den Rosengarten bis zum Erntefest am 5. September hergerichtet haben: Wege begehbar, Beete sauber, alles, was man vom Haus aus sieht."
        from: ch01/s02
      - text: "Jonas will das Gut verkaufen."
        from: ch01/s02
      - text: "Absprache mit Jonas: freie Hand bei den Rosen, über die Wege wird noch geredet; Material nach seinem Budget, Zwischenstände alle zwei Wochen mit Fotos."
        from: ch01/s02
      - text: "Hedwigs Testament: Der Rosengarten soll zum Erntefest am 5. September in altem Glanz wieder blühen."
        from: ch01/s03
      - text: "Hedwig hat für die Gartenarbeit Geld hinterlassen, für den Rest nur den Wunsch, den keiner einfordern kann."
        from: ch01/s03
      - text: "Hinter dem Laubengang steht unter den Brombeeren ein Stock der Lindenhof-Rose, die Hedwig selbst gezogen hat."
        from: ch01/s03
      - text: "Grete hat ihr zwei Tage nach dem Auftrag am Morgen Hedwigs Gartenbuch aus dem Arbeitszimmer geholt; sie hat es jetzt."
        from: ch02/s01
      - text: "Laut Hedwigs Gartenbuch steht an Bogen sieben und acht des Laubengangs die 'Ghislaine de Féligonde', gepflanzt 1974."
        from: ch02/s01
      - text: "Jonas' Tabelle sah 'Hauptweg frei bis Ende Juni' und beim Laubengang 'Entsorgung, Ersatz verzinkt' für beide Rankbögen der 'Ghislaine' vor."
        from: ch02/s01
      - text: "Jonas plant seit zwölf Jahren Parkhäuser."
        from: ch02/s01
      - text: "Die Rankbögen stecken ohne Fundament im Boden, seit zweiundfünfzig Jahren."
        from: ch02/s01
      - text: "Neue Absprache: Die Rankbögen bleiben und bekommen Punktfundamente, Jonas bestellt Beton, sie bindet die Rose selbst wieder an; dafür muss der Hauptweg Ende Juni frei sein, vom Tor bis zur Pforte, mit Fotos."
        from: ch02/s01
      - text: "Die Bögen stehen seit einer Woche im Beton und halten; Jonas hat gerüttelt, nichts gab nach (\"Wie eine Eins\")."
        from: ch03/s01
      - text: "Seit dem Gewitter unter dem Laubengang duzen Jonas und sie sich; wer damit angefangen hat, weiß sie nicht mehr."
        from: ch03/s01
      - text: "Was Hedwig im letzten Herbst auf der Bank unter der 'New Dawn' zu ihr gesagt hat, trägt sie seither mit sich."
        from: ch03/s01
      - text: "Den Rosenschnitt hat sie mit zehn von Hedwig gelernt (über dem Auge, schräg); Hedwigs alte Schere mit dem roten Griff hat sie heute noch."
        from: ch03/s01
      - text: "Jonas hat bemerkt, dass sie mit den Rosen redet wie Hedwig."
        from: ch03/s01
      - text: "Hannes findet, die Arbeit läuft (\"Dat löppt, Deern\")."
        from: ch03/s02
      - text: "Hannes will die Holunderstubben und den Brombeerwurzelstock an der Sonnenuhr mit Kette und Trecker ziehen, nach Norden zum Tor hin, und bringt den Trecker am Sonnabend um halb acht."
        from: ch03/s02
      - text: "Auf Hannes' Frage, ob das Erntefest auf dem Gut bleibt, hat Jonas nicht zugesagt: Es hänge an Gutachten fürs Dach und für die Fenster, an den Kosten und an Fristen, die er selbst noch nicht kennt."
        from: ch03/s02
      - text: "Jonas weiß von Grete, dass sie Milch in den Kaffee nimmt."
        from: ch03/s02
      - text: "Mitte Juli schüttet sie mit Hannes Kies auf die Hauptachse; noch zwei Fuhren, dann ist sie an der Sonnenuhr."
        from: ch04/s01
      - text: "Ralf Steinhagen von Weidenkamp Hotels war auf dem Gut; ein Hotelmann."
        from: ch04/s01
      - text: "Grete hat Jonas und Steinhagen auf der Terrasse Kaffee aus der guten Kanne eingeschenkt, sonst stand nichts auf dem Tablett, obwohl am Morgen Butterkuchenduft über dem Hof lag."
        from: ch04/s01
      - text: "Steinhagen nannte die Fläche hinter dem Haus ein Pfund und sagte zu ihr, das werde auf den Fotos sehr schön; den Fotografen des Maklers brauche man Ende Juli nicht mehr, die Bilder mache man selbst."
        from: ch04/s01
      - text: "Auf Hannes' Frage nach dem Erntefest bot Steinhagen eine Veranstaltungsfläche gegen Gebühr an, für Vereine zu fairen Konditionen; Jonas schwieg dazu."
        from: ch04/s01
      - text: "Auf ihre Frage, was Steinhagen wollte, hat Jonas gesagt: \"Ein Interessent.\""
        from: ch04/s02
    believes:
      - text: "Splitt auf dem Hauptweg würde den alten Kies zerstören."
        from: ch01/s01
      - text: "Jonas will das Gut verkaufsfertig machen."
        from: ch01/s03
      - text: "Der Stock hinter dem Laubengang ist die letzte Lindenhof-Rose."
        from: ch01/s03
      - text: "Den Winkel hinter dem Laubengang sieht man von der Terrasse nicht, und in Jonas' Tabelle kommt er nicht vor."
        from: ch01/s03
      - text: "Für Hauptweg, Giersch und den Stock unter den Brombeeren bleibt ihr kaum Zeit."
        from: ch02/s01
      - text: "Sie hat Jonas dazu gebracht, Hedwigs Bögen nicht auf den Schrott zu fahren."
        from: ch02/s03
      - text: "Was sie für Jonas empfindet, ist nur Ärger, aber vielleicht hat Lena recht und es ist mehr."
        from: ch02/s03
      - text: "Ihr Herzklopfen neben Jonas kommt vom Gewitter."
        from: ch03/s01
      - text: "Mit einem Ruck würde der Ballen des Stubbens die 'Rosa Mundi' mitreißen; Rosen zieht man nicht ruckzuck."
        from: ch03/s02
      - text: "Das ist keine Fläche, sondern ein Garten, angelegt in den Dreißigerjahren; die 'Rosa Mundi' ist älter als sie und Steinhagen zusammen."
        from: ch04/s01
      - text: "Einen Kuchenrand hat es heute offenbar gegeben, wenn auch nur für Steinhagen."
        from: ch04/s01
      - text: "Sie hat auf ein Wort von Jonas gewartet, das nach Nein klang, und keins bekommen."
        from: ch04/s01
      - text: "Nach \"Ein Interessent\" käme von Jonas noch etwas."
        from: ch04/s02
    does_not_know:
      - "Was Jonas an der bröckelnden Gartenmauer neben dem Tor so still werden ließ."
      - "Wie hoch Hedwigs Geldvermächtnis ist und dass es nur für einen Sommer Pflege reicht."
      - "Dass Jonas fest damit rechnet, bis zum Herbst einen Käufer zu haben."
      - "Wie schlimm es um Fenster und Dach des Gutshauses steht (sieben undichte Fenster, ausstehendes Dachangebot)."
      - "Von welchem Fototermin Steinhagen sprach: dass der Makler am letzten Freitag im Juli einen Fotografen schicken wollte."
      - "Dass Jonas am Donnerstag zur Abnahme des Parkdecks nach Hamburg muss und eine Einlage für die Partnerschaft fällig ist."
      - "Dass Jonas sie vom Hügel aus bei der Arbeit beobachtet hat."
      - "Was Weidenkamp plant: rund zwanzig Zimmer im Gutshaus, Spa und Seminarraum in Kuhstall und Scheune, Saunahaus am Steg."
      - "Dass im Lageplan der Parkplatz genau auf dem Rosengarten liegt und nur ein paar Rosen in Kübeln bleiben sollen."
      - "Dass Weidenkamp Grete bei freiwilligem Auszug eine Abfindung vorsieht."
      - "Dass Jonas eine Kopie des Lageplans unter seinem Laptop liegen hat."
  ralf-steinhagen:
    knows:
      - text: "Jonas Behrendts Nummer hat er vom Makler."
