gaps:
  - Keine Uhrzeiten in der Szene; Küchengespräch (Montagabend) und Anruf (Dienstagmorgen) nur als Tagesangaben, daher ohne Zeitleisten-Struktur.
  - Datum des Dienstags (1. September) erschlossen aus „Montag, der einunddreißigste August“, nicht wörtlich genannt.
  - Wann und wie die Partner die Einlage bis nach dem Fest gestundet haben, zeigt keine Szene; ch07/s01 und ch08/s01 nennen noch die Frist bis Monatsende. Absatz 11 setzt die Stundung als geschehen voraus.
  - Höhe des Ersparten und der Einlage bleibt offen; Absatz 11 sagt nur, dass die 38.000 für Notar und Planung aus dem für die Einlage gedachten Ersparten kommen sollen.
  - Der Tagesanbruch („Himmel grau“, Amsel) hat keine Uhrzeit; deshalb ohne Zeitleisten-Struktur (event/day/at).
