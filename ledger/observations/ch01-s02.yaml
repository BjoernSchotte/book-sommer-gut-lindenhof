    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "Jonas will das Gut verkaufen" }
  - kind: speech
    who: marie-albers
    quote: "Mein Stundensatz steht auf meiner Rechnung“, sagte sie. „Der ist nicht verhandelbar. Material kommt extra, nach Beleg."
    status: claim
    about: [marie-albers]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Material nach Budget. Ich setze einen Rahmen, und den halten wir."
    status: claim
    about: [jonas-behrendt]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Alte Rosen fressen Mist wie Pferde."
    status: claim
    about: [marie-albers, garten]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Und ich will Zwischenstände. Alle zwei Wochen, mit Fotos."
    status: claim
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Fotos von Wegen, die fertig sind."
    status: claim
    about: [jonas-behrendt, garten]
    tags: []
  - kind: belief
    who: jonas-behrendt
    quote: "Auf einer Baustelle gab es ohne Abnahmen keine Zahlung, und er sah keinen Grund, warum ein Garten anders funktionieren sollte."
    status: belief
    about: [jonas-behrendt, garten]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Aber bei allem, was gewachsen ist, habe ich freie Hand. Kein alter Stock wird gerodet und kein Weg planiert, ohne dass ich gefragt werde."
    status: claim
    about: [marie-albers, garten]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Dann sage ich Ihnen das. Sie erkennen es nicht."
    status: claim
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Ich erkenne, wenn etwas nichts mehr trägt."
    status: claim
    about: [jonas-behrendt]
    tags: []
  - kind: belief
    who: jonas-behrendt
    quote: "eine Firma aus der Kreisstadt, Anfahrt, Angebot, Einarbeitung, und der Juni wäre vorbei, bevor dort jemand eine Schere in die Hand nahm"
    status: belief
    about: [jonas-behrendt]
    tags: []
  - kind: belief
    who: jonas-behrendt
    quote: "Diese Frau kannte den Garten. Das war ein Vorteil, so ärgerlich er ihn fand."
    status: belief
    about: [jonas-behrendt, marie-albers, garten]
    tags: []
    fact: { subject: jonas-behrendt, predicate: believes, value: "Marie kennt den Garten" }
  - kind: speech
    who: jonas-behrendt
    quote: "Das Budget bleibt, wie es ist“, sagte er. „Wenn Ihre Rosen mehr kosten, fehlt es woanders."
    status: claim
    about: [jonas-behrendt]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Dann fehlt es woanders. Bei den Rosen nicht."
    status: claim
    about: [marie-albers, garten]
    tags: []
  - kind: narrator_claim
    who: jonas-behrendt
    quote: "Er hatte zwölf Jahre lang Lasten gerechnet, Brücken, Parkdecks, Decken über vierzig Meter"
    status: fact
    about: [jonas-behrendt]
    tags: []
  - kind: relationship
    who: jonas-behrendt
    quote: "und jetzt brachte ihn ein Stück Grün aus dem Takt. Das ärgerte ihn mehr als die nassen Socken auf der Treppe, und es ging die Frau nichts an."
    status: fact
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: event
    who: jonas-behrendt
    quote: "„Einverstanden“, sagte er. „Freie Hand bei den Rosen. Über die Wege reden wir.“"
    status: fact
    about: [jonas-behrendt, marie-albers, garten]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "„Über die Wege reden wir“, wiederholte sie, als prüfe sie den Satz auf Dornen."
    status: claim
    about: [marie-albers, garten]
    tags: []
  - kind: event
    who: jonas-behrendt
    quote: "Er stand auf und streckte ihr die Hand hin, weil man so etwas abschloss. Marie wischte die Finger an der Arbeitshose ab, was nichts nützte, und schlug ein."
    status: fact
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: relationship
    who: jonas-behrendt
    quote: "Ein paar Krümel Erde wechselten dabei den Besitzer, und trotzdem ließ er nicht als Erster los."
    status: fact
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: relationship
    who: marie-albers
    quote: "Den Garten kriegen Sie, Herr Behrendt."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Ob Sie ihn verdient haben, sehen wir im September."
