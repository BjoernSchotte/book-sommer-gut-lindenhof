gaps:
  - Wochentag und Datum der Szene sind nicht genannt; nur 'Tag von ch02/s01, nach dem Vormittag' ist belegt. Welcher Donnerstag gemeint ist, bleibt offen.
  - Projektleiterin, Partner und Makler bleiben namenlos; der Makler hat keine Wiki-Seite.
  - Gutssee und Steg haben keine eigene Wiki-Seite; die Ortsfakten hängen am Hügel (Blick).
  - Der Steg ist nur noch 'vorn tiefer als hinten'; die fehlenden Bretter der alten Fassung sind gestrichen. Ob der Steg begehbar ist, lassen die geänderten Absätze offen.
