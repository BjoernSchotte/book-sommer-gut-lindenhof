gaps:
  - Ob dies der Sonnabend ist, für den Hannes in ch03/s02 den Trecker um halb acht zugesagt hat, bleibt offen; hier kommt er schon kurz nach sechs (Anfang Juli zugesagt, jetzt Mitte Juli).
  - Wie viele Leute insgesamt kommen und wer die Liste mit Lena vorbereitet hat, nennt die Szene nicht.
  - Ob Jonas und Marie an diesem Vormittag miteinander sprechen, bleibt offen; Jonas sieht nicht zu ihr herüber.
  - Absatz 1 und 20 nennen nicht, was in der namenlosen Mauerecke hinter dem Südende des Laubengangs steht; laut Wiki (garten, Fest) ist es die letzte Lindenhof-Rose. Der Text lässt es offen.
  - Absatz 20 sagt nicht, warum Marie Jonas nachsieht und schweigt (Schutz der Ecke vor ihm/den Helfern ist nur angedeutet).
