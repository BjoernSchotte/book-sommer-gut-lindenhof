gaps:
  - Keine Uhrzeit und kein Wochentag im Text; die Szene liegt nach dem Morgen ('stärker als am Morgen') und etwa eine Woche nach dem Betonieren ('Seit einer Woche'). Daher kein strukturierter Zeiteintrag.
  - Hedwig Behrendt hat keine eigene Wiki-Seite; ihre Stimme ('tiefe, raue Stimme'), die geschenkte Schere und die Bank-Erinnerung hängen an marie-albers bzw. garten.
  - Remise, Lindenallee und Buchenwald haben keine eigene Wiki-Seite.
  - Die Szene sagt nicht, welcher Bogen gerade gebunden wird; nur, dass danach 'der achte Bogen' folgt.
  - Absatz 15 ('Lass sie drin. Steht dir.') hat keine Sprecherangabe; Jonas als Sprecher ist aus dem Wechsel mit Absatz 14 und 16 erschlossen.
  - Absatz 18 sagt nur, dass Marie nicht mehr weiß, wer mit dem Du angefangen hat; ob Jonas es weiß, lässt der Text offen.
