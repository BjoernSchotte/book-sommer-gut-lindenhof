gaps:
  - Der Wochentag des Besuchs wird in der Szene nicht genannt; laut ch03/s03 war die Besichtigung für den übernächsten Montag, Mitte Juli, vereinbart.
  - Welche Unterlagen Steinhagen mitbringt und von welchen Fotos er spricht, bleibt offen; der Parkplatz-Plan wird nicht ausgesprochen.
  - Wovon Jonas und Steinhagen auf der Terrasse sprechen, bleibt außerhalb von Maries Hörweite.
