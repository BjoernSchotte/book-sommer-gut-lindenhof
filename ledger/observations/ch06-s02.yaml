end_quote: "Oder ob er bloß etwas festhielt, das hier als Einziges ihm allein gehörte."
items:
  - kind: event
    who: jonas-behrendt
    quote: "Jonas stellte ihn zurück und zog den nächsten aus dem untersten Fach."
