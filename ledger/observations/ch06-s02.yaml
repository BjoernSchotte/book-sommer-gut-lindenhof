gaps:
  - Szenenzeit nur „Donnerstag, spät am Abend“, keine Uhrzeit; daher keine Struktur für die Zeitleiste. Welcher Donnerstag (nach ch06/s01, Dienstag Ende Juli) sagt der Text nicht.
  - Hedwigs Sätze in der Erinnerung haben kein `who`, weil Hedwig keine Wiki-Seite hat.
  - Das Datum der Notiz („ein Juli vor sechsundzwanzig Jahren“) passt nur zu Jonas' Alter von 35, wenn er beim Steckling etwa neun war; der Text nennt sein Alter damals nicht.
  - Ob Marie schon wusste, dass das Buch im Arbeitszimmer liegt, oder Grete es dorthin legte, bleibt offen; Grete sagt nur, Marie habe es „hiergelassen“.
  - Absatz 1 nennt für den Gutachter nur „nächste Woche“, keinen Tag; der frühere Montag entfällt.
  - Absatz 2 nennt nur „Donnerstag, spät am Abend“, keine Uhrzeit; daher keine Zeitstruktur.
  - Absatz 31 sagt nicht ausdrücklich, dass Grete die Tür schließt; die Zuordnung folgt aus dem Zusammenhang.
  - Absatz 1 nennt keinen Termin für den Gutachter mehr; das frühere „nächste Woche“ entfällt.
  - Hedwig hat keine Wiki-Seite; ihr Lachen und ihre Antwort in Absatz 21 stehen ohne `who`.
  - Absatz 9 nennt „seit vierzig Jahren“ als Gretes Schätzung für das Alter der Ordner; ob alle Ordner so alt sind, sagt der Text nicht.
  - Absatz 30 sagt nicht, ob Jonas die Fensterrechnung am nächsten Tag tatsächlich sucht.
  - Ob Marie die Seite mit Hedwigs Notiz zum ersten Steckling kennt, lässt der Absatz offen; Jonas fragt es sich nur.
