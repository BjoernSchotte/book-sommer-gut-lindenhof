gaps:
  - Wo Jonas am Mittwoch ist, sagt die Szene nicht; nur dass sein Kombi auf dem Gutshof fehlt.
  - Wer „Moin, Deern. Heller Kies fürs Rondell.“ sagt, nennt die Szene nicht ausdrücklich; der Satz steht im Absatz mit Kalle, gemeint ist nach Sinn Hannes.
  - Ob Marie Jonas' Nachrichten gelesen hat, bleibt weiter offen.
