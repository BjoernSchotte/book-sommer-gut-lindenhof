gaps:
  - Das Datum des Szenentags und des „übernächsten Montags“ bleibt offen; belegt ist nur „Mitte Juli“ (aus Steinhagens Rede).
  - Ob Jonas Marie, Grete oder Hannes vom Termin erzählt, lässt die Szene offen; belegt ist nur, dass er nicht hinuntergeht.
  - Die „Stellplatzlösung“ wird nicht verortet; der Parkplatz auf dem Rosengarten ist in der Szene nicht belegt.
  - Wen Jonas im Büro anrufen wollte, lässt Absatz 22 offen; belegt ist nur „die halbe Nummer vom Büro“, nicht gewählt.
