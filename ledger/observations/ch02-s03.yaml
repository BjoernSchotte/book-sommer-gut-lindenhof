items:
  - kind: event
    who: marie-albers
    quote: "Marie stellte das Rad vor dem Hoftor ab, zehn Minuten vor Ladenschluss, und ging durch die offene Diele."
    status: fact
    about: [marie-albers, hofladen]
    tags: []
