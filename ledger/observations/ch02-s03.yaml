    tags: []
  - kind: event
    who: marie-albers
    quote: "Hinter der Kirche bog sie auf den Feldweg, der in einem weiten Bogen um die Weiden zur alten Schmiede führte, zwischen hohen Knicks, in denen der Holunder blühte."
    status: fact
    about: [marie-albers]
    tags: []
    fact: { subject: "ch02/s03@heimweg", predicate: at_place, value: "Feldweg um die Weiden zur alten Schmiede" }
