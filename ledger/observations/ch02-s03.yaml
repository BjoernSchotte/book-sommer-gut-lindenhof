    quote: "Der Juniabend wollte nicht enden, die Sonne stand noch eine Handbreit über dem Weizen"
    status: fact
    about: [marie-albers]
    tags: []
    fact: { subject: "ch02/s03@heimweg", predicate: at_time, value: "Juniabend, kurz vor Sonnenuntergang" }
  - kind: object_fact
    who: marie-albers
    quote: "Im Korb am Lenker klapperten die Eier bei jedem Schlagloch, also fuhr sie langsamer, das Kuchenpäckchen obendrauf wie einen Deckel."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: belief
    who: marie-albers
    quote: "Ärger, sagte sie sich. Das war ein Mann mit einer Tabelle, der alles entsorgen wollte, was älter war als er"
    status: belief
    about: [marie-albers, jonas-behrendt]
    tags: []
    fact: { subject: marie-albers, predicate: believes, value: "was sie für Jonas empfindet, ist nur Ärger" }
  - kind: knowledge_gain
    who: marie-albers
    quote: "Dann war es trotzdem da, ohne dass sie es gerufen hätte: wie er vor dem Bogen gehockt hatte, die Skizze vom Fundament auf dem Knie, und danach dieses kurze Lächeln."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: relationship
