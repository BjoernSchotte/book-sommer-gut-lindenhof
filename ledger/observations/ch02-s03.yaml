    quote: "Für einen Moment war da kein Herr Behrendt gewesen, nur einer, der über ihren dummen Witz mit der Brennnesseljauche lachen musste."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: event
