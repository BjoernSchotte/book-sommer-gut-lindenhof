source: manuscript/ch10/s02.md
source_hash: "43ff06"
extracted_by: bb-ingest
end_actual: dialogue
end_quote: "„Fünf Minuten“, sagte sie. „Dann muss ich Kuchen schneiden.“"
items:
  - kind: event
    who: marie-albers
    quote: "Marie setzte das Messer an, drückte durch bis aufs Blech und hob das nächste Stück Butterkuchen auf den Teller."
    status: fact
    about: [marie-albers, scheune]
    tags: []
    fact: { subject: ch10/s02@kuchen, predicate: at_place, value: scheune }
  - kind: place_fact
    quote: "In der Scheune summte das halbe Dorf."
    status: fact
    about: [scheune]
    tags: []
  - kind: place_fact
    quote: "Unter den dunklen Balken standen Bänke und Tische in langen Reihen, das Tor war weit offen, und durch die Lichtstreifen zog Kaffeeduft."
    status: fact
    about: [scheune]
    tags: []
  - kind: object_fact
    quote: "Auf Lenas Tresen warteten Gretes Bleche, links der Butterkuchen mit den saftigen Mandeln, rechts der Bienenstich, die Creme noch kühl vom Keller."
    status: fact
    about: [scheune, lena-hansen, grete-paulsen]
    tags: []
  - kind: speech
    quote: "Zwei Butter, ein Bienenstich für Tisch vier"
    status: fact
    about: [scheune]
    tags: []
  - kind: belief
    who: marie-albers
    quote: "Solange die Finger zu tun hatten, musste der Kopf nicht mit."
    status: belief
    about: [marie-albers]
    tags: []
  - kind: narrator_claim
    quote: "Der Trecker in der Allee, das ernste Nicken, das weiße Hemd, das alles lag unter der nächsten Reihe und der übernächsten."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: object_fact
    who: lena-hansen
    quote: "Lena stand neben ihr, im gelben Kleid, Friedas Kranz aus Kornblumen schief in den Locken."
    status: fact
    about: [lena-hansen]
    tags: []
    fact: { subject: lena-hansen, predicate: has_object, value: "Friedas Kranz aus Kornblumen" }
  - kind: event
    who: lena-hansen
    quote: "Sie nahm Marie das Messer weg, legte es aufs Blech und wischte ihr einen Krümel vom Handgelenk."
    status: fact
    about: [lena-hansen, marie-albers]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Ich bin noch nicht fertig."
    status: claim
    about: [marie-albers]
    tags: []
  - kind: speech
    who: lena-hansen
    quote: "Doch. Bist du."
    status: claim
    about: [lena-hansen, marie-albers]
    tags: []
  - kind: speech
    who: lena-hansen
    quote: "Komm mit. Ich will dir was zeigen, und das wartet nicht."
    status: claim
    about: [lena-hansen, marie-albers]
    tags: []
  - kind: event
    who: lena-hansen
    quote: "an Kalle vorbei, der unter einem Tisch auf Abfall wartete."
    status: fact
    about: [lena-hansen, marie-albers, hannes-kroeger, scheune]
    tags: []
  - kind: place_fact
    quote: "An der Rückwand standen Stelltafeln aus hellem Holz, Mats' Arbeit, sauber verzapft."
    status: fact
    about: [scheune, lena-hansen]
    tags: []
  - kind: object_fact
    quote: "Hedwig hob lachend die Erntekrone über den Kopf. Am Kuchentisch stand sie mit Grete, beide in Kittelschürzen, Grete noch mit dunklem Haar."
    status: fact
    about: [scheune, grete-paulsen]
    tags: []
  - kind: object_fact
    quote: "Lampions im Rosengarten, irgendwann in den Siebzigern, verschwommen im Abendlicht."
    status: fact
    about: [scheune]
    tags: []
  - kind: knowledge_gain
    who: marie-albers
    quote: "Unter jedem Bild klebte ein Zettelchen in Lenas runder Schrift: aus dem Album der Petersens, aus Hedwigs Schublade, aus Hannes' Ausschusskiste."
    status: fact
    about: [marie-albers, lena-hansen, hannes-kroeger, scheune]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "Lena hat die Fotos aus Dorfalben, Hedwigs Schublade und Hannes' Ausschusskiste gesammelt" }
  - kind: speech
    who: lena-hansen
    quote: "Für dich“, sagte Lena. „Und für Hedwig."
    status: fact
    about: [lena-hansen, marie-albers]
    tags: []
  - kind: knowledge_gain
    who: marie-albers
    quote: "Darum lagen die Fotos auf meinem Küchentisch."
    status: fact
    about: [marie-albers, lena-hansen]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "die verdeckten Fotos auf Lenas Küchentisch waren für die Ausstellung" }
  - kind: event
    who: marie-albers
    quote: "Weiter kam Marie nicht, also drückte sie Lenas Finger, so fest, dass die Freundin lachte."
    status: fact
    about: [marie-albers, lena-hansen]
    tags: []
  - kind: object_fact
    quote: "Ganz am Ende, fast schon in der Ecke, hing ein kleiner Abzug mit weißem Zackenrand, so verblichen, dass die Farben ins Bräunliche liefen."
    status: fact
    about: [scheune]
    tags: []
  - kind: object_fact
    quote: "Hedwig stand an der Gartenmauer, eine Hand über den Augen. Neben ihr ein dünner Junge, barfuß, das eine Knie zerschrammt. Oben auf den Backsteinen ein Mädchen mit Zopf, die Arme in die Hüften gestemmt, das Kinn streng zu ihm gesenkt."
    status: fact
    about: [scheune, marie-albers, jonas-behrendt]
    tags: []
  - kind: knowledge_gain
    who: marie-albers
    quote: "Das Kleid war ihres. Rot mit weißen Punkten, sie hatte es getragen, bis es nicht mehr zuging."
    status: fact
    about: [marie-albers]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "sie selbst ist das Mädchen mit Zopf auf der Mauer im Foto" }
  - kind: knowledge_gain
    who: marie-albers
    quote: "Und den Jungen erkannte sie jetzt, wo er vor ihr an der Wand hing."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
    fact: { subject: marie-albers, predicate: believes, value: "der Junge auf dem Foto ist Jonas" }
  - kind: event
    who: jonas-behrendt
    quote: "Jonas stand hinter ihr, und sie wusste nicht, seit wann."
    status: fact
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Du hast mich beschimpft."
    status: fact
    about: [jonas-behrendt, marie-albers]
    tags: []
    fact: { subject: jonas-behrendt, predicate: knows, value: "Marie ist das Mädchen auf der Mauer, das ihn beschimpft hat" }
  - kind: speech
    who: jonas-behrendt
    quote: "Ich war auf einen Rosenstock getreten. Du hast gesagt, ich hätte Füße wie ein Ochse und keinen Verstand dazu."
    status: claim
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Ich hab es Tante Hedwig geschrieben. Mit Zeichnung. Der Brief lag in Gretes Keksdose, ich hab ihn wiedergefunden."
    status: claim
    about: [jonas-behrendt, grete-paulsen]
    tags: []
  - kind: narrator_claim
    quote: "So viele Jahre, und sie hatte ihn nicht erkannt, im Juni, im Matsch hinter dem Tor, in seinen geputzten Schuhen."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: knowledge_gain
    who: marie-albers
    quote: "Dabei war die Erinnerung die ganze Zeit da gewesen, irgendwo hinten im Kopf."
    status: fact
    about: [marie-albers]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "sie hat als Kind den Jungen aus Hamburg wegen eines geknickten Rosentriebs beschimpft" }
  - kind: narrator_claim
    quote: "Ein Junge aus Hamburg, der zu laut lachte und zu wenig aufpasste. Der geknickte Trieb, über den sie sich empört hatte wie über einen Schaden im eigenen Garten."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: narrator_claim
    quote: "Hedwig hatte ein Pflaster geholt und dabei leise in sich hineingeschmunzelt."
    status: fact
    about: [jonas-behrendt]
    tags: []
  - kind: belief
    who: marie-albers
    quote: "Am Steg hatte Marie es schon geahnt und für sich behalten."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: object_fact
    who: grete-paulsen
    quote: "Drüben an der Kaffeemaschine stand Grete in ihrer dunkelblauen Bluse."
    status: fact
    about: [grete-paulsen, scheune]
    tags: []
  - kind: event
    who: grete-paulsen
    quote: "Sie hob den Kopf zu ihnen, senkte ihn rasch zur Kanne und lächelte in den Dampf hinein."
    status: fact
    about: [grete-paulsen, marie-albers, jonas-behrendt]
    tags: []
  - kind: event
    who: lena-hansen
    quote: "Lena schob sich zwischen die beiden, den Kranz verrutscht, die Wangen rot."
    status: fact
    about: [lena-hansen, marie-albers, jonas-behrendt]
    tags: []
  - kind: speech
    who: lena-hansen
    quote: "Du traust dich was. Nach allem?"
    status: claim
    about: [lena-hansen, jonas-behrendt]
    tags: []
  - kind: event
    who: marie-albers
    quote: "Marie fasste sie am Arm. Fest, so wie in jener Nacht in Lenas Küche, als Lena das ganze Dorf hatte anrufen wollen."
    status: fact
    about: [marie-albers, lena-hansen]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Lena. Das ist meine Sache."
    status: fact
    about: [marie-albers, lena-hansen]
    tags: []
  - kind: event
    who: lena-hansen
    quote: "Schließlich trat sie zur Seite, gerade so weit, dass ihr kein Wort entging."
    status: fact
    about: [lena-hansen, marie-albers]
    tags: []
  - kind: object_fact
    who: jonas-behrendt
    quote: "Das weiße Hemd hatte einen Ölfleck am Ärmel, vom Trecker vermutlich."
    status: fact
    about: [jonas-behrendt]
    tags: []
  - kind: narrator_claim
    quote: "Er wirkte müde und zugleich ruhiger als im ganzen Sommer."
    status: fact
    about: [jonas-behrendt]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Ich muss dir etwas sagen, Marie. Du musst es zuerst hören, vor allen anderen."
    status: claim
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: event
    quote: "Sein Blick ging zu den Tischen hinüber, wo Anke den Bienenstich verteilte."
    status: fact
    about: [jonas-behrendt, scheune]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Kommst du mit unter die Kletterrose?"
    status: claim
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: narrator_claim
    quote: "Auf der Bank unter der Kletterrose hatten sie Buttermilch getrunken, Knie an Knie. Dort hatte Hedwig im letzten Herbst ihre Hand genommen."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Fünf Minuten“, sagte sie. „Dann muss ich Kuchen schneiden."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
