source: manuscript/ch10/s01.md
source_hash: "7366a9"
extracted_by: bb-ingest
end_actual: question
end_quote: "Warum fuhr einer, der verkauft hatte, den Trecker der Toten durch die Allee? Und was hatte Hannes am Mittwoch gewusst?"
items:
  - kind: event
    who: marie-albers
    quote: "Marie zog die Harke ein letztes Mal um das Rondell, Bahn für Bahn, bis der helle Kies glatt lag wie frisch gekämmt."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: time
    who: marie-albers
    quote: "Es war Samstag, der fünfte September, kurz nach sechs."
    status: fact
    about: [marie-albers]
    tags: []
    event: harke
    day: "+0"
    at: ["06:00", "06:15"]
    fact: { subject: ch10/s01@harke, predicate: at_time, value: "Samstag, 5. September" }
  - kind: narrator_claim
    quote: "Über der Wiese zum Gutssee lag noch Nebel, so dicht, dass der Steg darin verschwand."
    status: fact
    about: []
    tags: []
  - kind: narrator_claim
    quote: "An den Damaszenerrosen leuchteten die Hagebutten, prall und orangerot. Die zweite Blüte der 'New Dawn' hing nass über der Mauer."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: event
    who: marie-albers
    quote: "Dann ging sie durch den Laubengang bis in die Mauerecke und kniete sich ins feuchte Gras."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: object_fact
    quote: "Die Lindenhof-Rose trug noch ihre einzige Blüte, an den Rändern schon müde."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: knowledge_gain
    who: marie-albers
    quote: "Daneben stand der Steckling vom Mittwoch. An seiner Spitze saß ein neues rötliches Blatt, kaum größer als ein Fingernagel."
    status: fact
    about: [marie-albers]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "der am Mittwoch gepflanzte Steckling treibt ein neues Blatt" }
  - kind: speech
    who: marie-albers
    quote: "Na, du. Gerade rechtzeitig."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: event
    who: marie-albers
    quote: "Sie goss ihn, wie Hannes es ihr geraten hatte, und blieb länger knien, als nötig war."
    status: fact
    about: [marie-albers, hannes-kroeger]
    tags: []
  - kind: object_fact
    who: grete-paulsen
    quote: "Statt der Kittelschürze trug sie die gute dunkelblaue Bluse, am Kragen Hedwigs Brosche, blank geputzt."
    status: fact
    about: [grete-paulsen]
    tags: []
    fact: { subject: grete-paulsen, predicate: has_object, value: "Hedwigs Brosche" }
  - kind: speech
    who: grete-paulsen
    quote: "Milch ist drin."
    status: fact
    about: [grete-paulsen, marie-albers]
    tags: []
  - kind: narrator_claim
    quote: "Der Kaffee war heiß und ein bisschen zu stark, so wie an jedem Festtag, an den sie sich erinnern konnte."
    status: fact
    about: [grete-paulsen, marie-albers]
    tags: []
  - kind: speech
    who: grete-paulsen
    quote: "Na. Da kann das Dorf kommen."
    status: claim
    about: [grete-paulsen, marie-albers]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Am Rondell fehlen noch zwei Astern."
    status: claim
    about: [marie-albers]
    tags: []
  - kind: speech
    who: grete-paulsen
    quote: "Die fehlen nur dir. Nun trink, Deern, der wird sonst kalt."
    status: claim
    about: [grete-paulsen, marie-albers]
    tags: []
  - kind: narrator_claim
    quote: "Über Jonas sagte Grete kein Wort, und Marie fragte nicht."
    status: fact
    about: [grete-paulsen, marie-albers, jonas-behrendt]
    tags: []
  - kind: speech
    who: grete-paulsen
    quote: "Zieh dir was Schönes an, Kind"
    status: claim
    about: [grete-paulsen, marie-albers]
    tags: []
  - kind: event
    quote: "Vom Hof her stotterte in der Remise ein alter Motor, setzte aus und sprang an."
    status: fact
    about: []
    tags: []
  - kind: event
    who: marie-albers
    quote: "Dann ging sie außen herum zum Kastenwagen, ohne einen Fuß auf das Pflaster zu setzen."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: object_fact
    who: marie-albers
    quote: "Im Dorf hing ihr Kleid seit drei Tagen an der Schranktür."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: event
    who: marie-albers
    quote: "Am frühen Nachmittag stand sie am Rand der Lindenallee und zupfte am Saum."
    status: fact
    about: [marie-albers, lindenallee]
    tags: []
    fact: { subject: ch10/s01@umzug, predicate: at_place, value: lindenallee }
  - kind: object_fact
    who: marie-albers
    quote: "Das Sommerkleid war hell, mit kleinen blauen Blüten, und reichte ihr bis knapp über die Knie."
    status: fact
    about: [marie-albers]
    tags: []
    fact: { subject: marie-albers, predicate: has_object, value: "helles Sommerkleid mit kleinen blauen Blüten" }
  - kind: narrator_claim
    quote: "Jetzt kam sie sich darin vor wie eine Fremde mit geliehenen Armen, die bis zum Ellbogen von Dornen zerkratzt waren."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: place_fact
    quote: "Gelbes Lindenlaub lag im Staub der Bankette."
    status: fact
    about: [lindenallee]
    tags: []
  - kind: event
    quote: "Links von ihr standen die Landfrauen mit ihren Körben, rechts die Feuerwehr in Uniform, die Jüngsten mit sonnenroten Ohren."
    status: fact
    about: [lindenallee, marie-albers]
    tags: []
  - kind: speech
    quote: "Deern! Dich hätt ich glatt nicht erkannt."
    status: claim
    about: [marie-albers]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Ich mich auch nicht"
    status: claim
    about: [marie-albers]
    tags: []
  - kind: knowledge_gain
    who: marie-albers
    quote: "Grete sagt, so hat er seit Jahren nicht ausgesehen."
    status: claim
    about: [marie-albers, grete-paulsen]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "Grete lobt den Garten (über Anke)" }
  - kind: speech
    who: marie-albers
    quote: "Grete sagt viel."
    status: claim
    about: [marie-albers, grete-paulsen]
    tags: []
  - kind: speech
    quote: "Grete sagt fast nie was."
    status: claim
    about: [grete-paulsen]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Ohne Rosenschere weiß ich gar nicht, wohin mit meinen Händen."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: knowledge_gain
    who: marie-albers
    quote: "Hannes hat heute Morgen schon um fünf in der Küche gestanden. Mit Weste."
    status: claim
    about: [marie-albers, hannes-kroeger]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "Hannes stand am Festmorgen um fünf in Weste in der Küche" }
  - kind: narrator_claim
    quote: "Sie wandte sich zu den anderen Frauen zurück, ehe Marie fragen konnte, wozu einer um fünf in der Weste stand."
    status: fact
    about: [marie-albers, hannes-kroeger]
    tags: []
  - kind: event
    quote: "Der Umzug kam. Trecker rollten im Schritttempo heran, blank gewaschen, mit Bändern an den Spiegeln."
    status: fact
    about: [lindenallee]
    tags: []
  - kind: object_fact
    quote: "Hoch über dem Sitz schwankte die Erntekrone an ihrem Gestell, gebunden aus Weizen, Gerste und Hafer, mit bunten Bändern, die im Wind flatterten."
    status: fact
    about: [lindenallee]
    tags: []
  - kind: knowledge_gain
    who: marie-albers
    quote: "Sein Tuckern war dasselbe wie am Morgen in der Remise."
    status: fact
    about: [marie-albers]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "der Motor am Morgen in der Remise war Hedwigs alter Trecker" }
  - kind: knowledge_gain
    who: marie-albers
    quote: "Am Steuer saß Jonas in einem weißen Hemd mit aufgekrempelten Ärmeln."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "Jonas fährt Hedwigs Trecker mit der Erntekrone vorn im Umzug" }
  - kind: object_fact
    who: jonas-behrendt
    quote: "Er hielt sich sehr gerade, beide Hände am Lenkrad, als müsste er jede Bohle einer Brücke einzeln abnehmen."
    status: fact
    about: [jonas-behrendt]
    tags: []
    fact: { subject: jonas-behrendt, predicate: has_object, value: "Hedwigs alter Trecker" }
  - kind: event
    who: hannes-kroeger
    quote: "Neben dem Vorderrad ging Hannes in Weste, die Ehrennadel am Revers, die Mütze in der Hand."
    status: fact
    about: [hannes-kroeger, jonas-behrendt]
    tags: []
    fact: { subject: hannes-kroeger, predicate: has_object, value: "Weste mit Ehrennadel" }
  - kind: narrator_claim
    quote: "Früher hatte er an derselben Stelle neben Hedwig Schritt gehalten, und Marie hatte als Kind genau hier am Rand gestanden."
    status: fact
    about: [hannes-kroeger, marie-albers, lindenallee]
    tags: []
  - kind: relationship
    quote: "Das Dorf klatschte."
    status: fact
    about: [jonas-behrendt]
    tags: []
  - kind: speech
    quote: "Wie bei Hedwig“, sagte Anke über die Schulter. „Genau so."
    status: claim
    about: [jonas-behrendt]
    tags: []
  - kind: narrator_claim
    quote: "Keiner wunderte sich außer Marie."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: event
    who: jonas-behrendt
    quote: "Er suchte die Leute am Rand ab, langsam, Gesicht für Gesicht, und dann fand er sie."
    status: fact
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: relationship
    who: jonas-behrendt
    quote: "Er hob nicht die Hand. Er nickte ihr ernst zu."
    status: fact
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: event
    who: marie-albers
    quote: "Sie drehte sich weg, ehe Anke sich noch einmal umdrehte, und schob sich hinter die Feuerwehr, bis nur noch die Krone über den Köpfen schwankte."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: belief
    who: marie-albers
    quote: "Warum fuhr einer, der verkauft hatte, den Trecker der Toten durch die Allee?"
    status: belief
    about: [marie-albers, jonas-behrendt]
    tags: []
    fact: { subject: marie-albers, predicate: believes, value: "Jonas hat das Gut verkauft" }
  - kind: belief
    who: marie-albers
    quote: "Und was hatte Hannes am Mittwoch gewusst?"
    status: belief
    about: [marie-albers, hannes-kroeger]
    tags: []
    fact: { subject: marie-albers, predicate: believes, value: "Hannes wusste am Mittwoch etwas, das er ihr verschwieg" }
