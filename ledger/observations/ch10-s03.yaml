    about: [marie-albers, garten]
    tags: []
    fact: { subject: jonas-behrendt, predicate: knows, value: "Hedwig wünschte sich Marie als Nachfolgerin im Garten" }
  - kind: speech
    who: marie-albers
    quote: "An deiner Seite, Jonas. Nicht in deinem Auftrag."
    status: claim
    about: [marie-albers, jonas-behrendt, garten]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Und du nimmst mich in deine Entscheidungen hinein. Vorher, nicht hinterher."
    status: claim
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: relationship
    who: jonas-behrendt
    quote: "„Ja“, sagte er, ohne zu zögern."
