    who: jonas-behrendt
    quote: "Erster Steckling. Jonas hat das Loch gegraben und gegossen. Ich hab ihn jeden Morgen mit dem Lineal gemessen."
    status: fact
    about: [jonas-behrendt, garten]
    tags: []
  - kind: event
    who: marie-albers
    quote: "Marie kniete sich neben ihn ins Gras, mitten im hellen Kleid, und legte ihre Hand auf seine."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: place_fact
    quote: "Die zweite Blüte duftete über ihren Köpfen."
    status: fact
    about: [garten]
    tags: []
  - kind: relationship
    who: marie-albers
    quote: "Sie zog ihn am Kragen zu sich herunter und küsste ihn"
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: narrator_claim
    quote: "Die fünf Minuten waren längst um. Den Kuchen schnitt heute jemand anders."
    status: fact
    about: [marie-albers]
    tags: []
