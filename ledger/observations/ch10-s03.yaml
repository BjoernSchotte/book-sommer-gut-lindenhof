    status: fact
    about: [garten]
    tags: []
    fact: { subject: ch10/s03@tanz, predicate: at_place, value: garten }
  - kind: event
    quote: "Das halbe Dorf tanzte zwischen Lavendel und Astern, die Feuerwehr noch in Uniform, die Landfrauen mit roten Wangen und Kalle mittendrin, auf der Suche nach heruntergefallenem Kuchen."
