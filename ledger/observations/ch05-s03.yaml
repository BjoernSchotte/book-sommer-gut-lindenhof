end_actual: question
end_quote: "Reichte ein Sommer, um Wurzeln zu schlagen?"
items:
  - kind: event
    who: marie-albers
    quote: "Marie ließ die Füße tiefer ins Wasser sinken, bis es ihr an die Waden reichte."
    status: fact
    about: [marie-albers, steg]
    tags: []
    fact: { subject: ch05/s03@steg-abend, predicate: at_place, value: steg }
  - kind: place_fact
    quote: "Am Rand war der See lauwarm, weiter unten kühler."
    status: fact
    about: [steg]
    tags: []
  - kind: object_fact
    who: marie-albers
    quote: "Die Gummistiefel lagen neben ihr auf den Brettern, einer umgekippt, und rochen nach Kies und Giersch."
    status: fact
    about: [marie-albers, steg]
    tags: []
  - kind: event
    quote: "Die Helfer waren fort. Hannes' Trecker hatte als Letzter die Allee hinuntergebrummt, Lena hatte zum Abschied mit dem Klemmbrett gewinkt."
    status: fact
    about: [hannes-kroeger, lena-hansen]
    tags: []
  - kind: place_fact
    quote: "Über die Wiese hinweg brannte in Gretes Küche Licht, ein gelbes Viereck in der dämmrigen Hauswand."
    status: fact
    about: [steg, grete-paulsen]
    tags: []
  - kind: place_fact
    quote: "links und rechts vom Steg raschelte das Schilf, obwohl kaum ein Lüftchen ging"
    status: fact
    about: [steg]
    tags: []
  - kind: narrator_claim
    who: marie-albers
    quote: "Ihr tat alles weh, die Schultern, der Rücken, die Knie, und trotzdem hätte sie singen mögen, was niemand zu wissen brauchte."
    status: fact
    about: [marie-albers]
    tags: []
  - kind: narrator_claim
    who: marie-albers
    quote: "Sie drehte sich nicht um, denn den Schritt auf den alten Planken kannte sie inzwischen."
    status: fact
    about: [marie-albers, jonas-behrendt]
    tags: []
  - kind: event
    who: jonas-behrendt
    quote: "Jonas setzte sich neben sie, zwei Flaschen Bier in der Hand, beschlagen vor Kälte. Er war barfuß, die Hosenbeine aufgekrempelt."
    status: fact
    about: [jonas-behrendt, steg]
    tags: []
    fact: { subject: jonas-behrendt, predicate: at_place, value: steg }
  - kind: speech
    who: jonas-behrendt
    quote: "Die Kiste ist für Helfer, hat sie gesagt. Ich hab gefragt, ob ich zähle."
    status: claim
    about: [jonas-behrendt, grete-paulsen]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Sie hat mir zwei gegeben und die Kronkorken gleich mit abgemacht."
    status: claim
    about: [jonas-behrendt, grete-paulsen]
    tags: []
  - kind: narrator_claim
    who: jonas-behrendt
    quote: "Seine Unterarme waren zerkratzt, feine rote Striche kreuz und quer."
    status: fact
    about: [jonas-behrendt]
    tags: []
  - kind: knowledge_gain
    who: marie-albers
    quote: "Krebsrot, genau zwischen Haaransatz und Kragen."
    status: fact
    about: [jonas-behrendt, marie-albers]
    tags: []
    fact: { subject: marie-albers, predicate: knows, value: "Jonas hat Sonnenbrand im Nacken" }
  - kind: speech
    who: jonas-behrendt
    quote: "Grete hat mir schon Quark angeboten."
    status: claim
    about: [jonas-behrendt, grete-paulsen]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Ich schmier mir keinen Quark in den Nacken, Marie."
    status: claim
    about: [jonas-behrendt, marie-albers]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Lena hat mich den ganzen Tag gesiezt. Mit dem Klemmbrett vor der Brust, wie ein Schild."
    status: claim
    about: [jonas-behrendt, lena-hansen]
    tags: []
  - kind: speech
    who: marie-albers
    quote: "Das ist ihr Vertreterton."
    status: claim
    about: [lena-hansen]
    tags: []
  - kind: time
    who: jonas-behrendt
    quote: "Um fünf hat sie mich gefragt, ob ich nächsten Samstag Zeit habe."
    status: claim
    about: [jonas-behrendt, lena-hansen]
    tags: []
    fact: { subject: ch05/s03@lenas-frage, predicate: at_time, value: "17:00" }
  - kind: speech
    who: jonas-behrendt
    quote: "Ich hab Ja gesagt, bevor ich nachdenken konnte."
    status: claim
    about: [jonas-behrendt, lena-hansen]
    tags: []
    fact: { subject: jonas-behrendt, predicate: knows, value: "hat Lena für nächsten Samstag zugesagt" }
  - kind: speech
    who: marie-albers
    quote: "Mats hat sie auch so gekriegt."
    status: claim
    about: [lena-hansen]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Hier hab ich Flöße gebaut“, sagte Jonas. „Als Junge. Aus Brettern aus der Remise, mit Wäscheleine verschnürt."
    status: fact
    about: [jonas-behrendt, steg]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Grete hat die Leine wochenlang gesucht."
    status: claim
    about: [grete-paulsen, jonas-behrendt]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Drei, glaube ich. Das letzte war das größte. Eine Woche hab ich daran geplant, mit Zeichnung."
    status: claim
    about: [jonas-behrendt]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Mitten auf dem See ist es abgesoffen. Ganz langsam, erst eine Ecke, dann die andere, dann ich."
    status: fact
    about: [jonas-behrendt, steg]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Hedwig hat am Ufer gestanden und gelacht, bis sie sich ins Gras setzen musste."
    status: fact
    about: [jonas-behrendt]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Sie hat gesagt, aus mir wird nie ein Schiffbauer."
    status: claim
    about: [jonas-behrendt]
    tags: []
  - kind: speech
    who: jonas-behrendt
    quote: "Seitdem rechne ich alles zweimal."
    status: claim
    about: [jonas-behrendt]
    tags: []
  - kind: belief
    who: marie-albers
    quote: "Ein dünner Junge oben auf der Gartenmauer, barfuß, Schorf auf den Knien, der sich an den Steinen festhielt und trotzdem nicht herunterwollte. Ob er das gewesen war?"
    status: belief
    about: [marie-albers, jonas-behrendt]
    tags: []
    fact: { subject: marie-albers, predicate: believes, value: "Jonas war vielleicht der Junge auf der Gartenmauer" }
  - kind: event
    who: marie-albers
    quote: "Sie nahm einen Schluck und sagte nichts. Es war ein Bild ohne Namen, und sie wollte es nicht zerreden."
    status: fact
    about: [marie-albers]
    tags: []
