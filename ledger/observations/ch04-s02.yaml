gaps:
  - Keine Uhrzeit in der Szene; sie schließt am selben Vormittag an ch04/s01 an (Kies, Hannes, Marie), ohne Zeitangabe.
  - Ob der Lageplan auch die Zufahrt durch das Tor und die Zahl der Stellplätze festlegt, bleibt ungenannt; nur „nummeriert, mit einer Zufahrt durch das Tor“.
  - Wo Steinhagens Herrenhaus „weiter im Süden“ liegt, bleibt offen.
