gaps:
  - Ob Grete Jonas' Ausrede glaubt, lässt die Szene offen.
  - Ob Jonas den Termin der Partner am 13. um neun in Hamburg (ch06/s03) abgesagt hat, erzählt die Szene nicht; er telefoniert stattdessen morgens mit einem Partner.
  - Die Höhe der vereinbarten Summe und der Dachdecker-Summe nennt die Szene nicht.
  - Die Höhe der Dachdecker-Summe nennt die Szene nicht.
  - Warum Jonas heute nicht nach Hamburg kommen kann, sagt die Szene nicht; dass er den Termin der Partner (ch06/s03) abgesagt hat, ist nur aus der Rede des Partners und der durchgestrichenen Zeile zu schließen.
  - Die Höhe der Dachdecker-Summe nennt Absatz 4 nicht.
  - Die Höhe der Anzahlung von Weidenkamp und ob die Partner sie als Sicherheit annehmen, lässt Absatz 4 offen; es ist Jonas' Rechnung.
  - Wann Jonas den Dachdecker zuvor angerufen hat, erzählt die Szene nicht; Absatz 4 nennt nur den Rückruf.
  - Die Höhe der vereinbarten Summe und des Rücktrittspreises nennt Absatz 14 nicht.
  - Ob Grete Jonas' Antwort „Hier war er nicht.“ als Ausweichen erkennt, lässt Absatz 28 offen.
  - Wie Jonas den Notartermin am Montag zusagte (Telefon, Mail, Treffen) und wie Steinhagen die Bedenkzeit anbot, erzählt Absatz 4 nicht.
