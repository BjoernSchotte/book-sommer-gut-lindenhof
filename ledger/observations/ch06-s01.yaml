gaps:
  - Ob Jonas tatsächlich auf dem Hügel unter der Eiche steht, ist nur Maries Schluss und Vorstellung.
  - Ob „schon um neun“ den Szenenbeginn markiert oder die Hitze dieser Tage allgemein beschreibt, lässt der Satz offen; als Szenenzeit 09:00 verankert.
  - Warum die Rosmarinstöcke der Mutter seit dem letzten Winter bei Marie stehen und ob sie zurückgehen, lässt der Absatz offen.
  - Welche Sorten die Büsche am Rondell mit den welken Köpfen sind, sagt Absatz 6 nur als „Gleiche Familie“; dass sie einmalblühend sind, folgt aus dem Zusammenhang, nicht wörtlich.
  - "Absatz 11: Ob der Fototermin des Maklers Ende Juli stattfand oder abgesagt wurde, lässt „war seitdem keine Rede mehr“ offen."
  - "Absatz 26/8: Die Dahlien sind noch nicht gepflanzt, nur die Pflanzlöcher geritzt; wann sie in die Erde kommen, bleibt offen."
  - "Absatz 27: Dass die Brombeeren in der Mauerecke fort sind, sagt der Absatz nicht mehr wörtlich, nur „Das Licht kam jetzt bis an den Boden“."
