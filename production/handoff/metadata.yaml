description: "Ein verwilderter Rosengarten. Ein Erbe, der verkaufen will. Und
  nur ein Sommer bis zum Erntefest. Als Gärtnerin Marie Albers den Auftrag
  annimmt, den Rosengarten von Gut Lindenhof zu retten, ahnt sie nicht, dass ihr
  Auftraggeber sie so auf die Palme bringen wird. Jonas Behrendt, Bauingenieur
  aus Hamburg, will Wege planieren, Termine einhalten und das Gut so schnell wie
  möglich loswerden. Marie will nur eines: dass Hedwigs letzte Lindenhof-Rose
  wieder blüht. Doch der Sommer auf dem Land hat seine eigenen Pläne. Gretes
  Kuchen, Hannes' Trecker, Lenas Helferliste und ein Abend am Gutssee bringen
  Marie und Jonas näher, als beiden lieb ist. Und Jonas entdeckt, dass er auf
  diesem Gut einmal zu Hause war. Doch zwischen ihnen steht eine Entscheidung,
  die Jonas allein treffen muss – und ein Geheimnis, das Marie das Herz brechen
  könnte. Ein Roman über Rosen, Rückschnitt und den Mut, Wurzeln zu schlagen."
