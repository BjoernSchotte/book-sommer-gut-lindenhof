# Genre-Standard: Cozy-Krimi. Erbt krimi; Gewalt im Off, kaum Fluchen, kleiner Kreis Verdächtiger.
name: krimi-cozy
extends: krimi
rules:
  craft.profanity-density: { severity: warn, max_per_1000: 0 }
  craft.gore-lexicon: { severity: warn, max_per_1000: 0 }
  case.suspect-count: { severity: warn }
  plan.private-share: { share: [0.20, 0.50] }
hints:
  - Gewalt bleibt im Off; gezeigt werden der Fund und die Folgen, nicht die Tat.
  - Die Amateurin hat einen persönlichen Grund, sich einzumischen, und die Polizei einen Grund, sie gewähren zu lassen.
