# Genre-Standard: Krimi. Erbt roman; schaltet die Fall-Regeln ein.
name: krimi
extends: roman
rules:
  craft.prologue: off # Täterprolog ist im Krimi üblich
  case.culprit-late: { severity: warn, max_share: 0.30 }
  case.herring-unresolved: { severity: warn }
  case.detective-culprit: { severity: info }
  case.culprit-pov: { severity: info }
  case.suspect-count: { severity: info, count: [3, 6] }
  plan.private-share: { severity: warn, share: [0.10, 0.35] }
  # Krimi-Fachsprache, im Lexikon sonst Klischee (research/handwerk/ki-lexikon.md § 6)
  ai-lex.fiction.geuebt: off # Rechtsmedizin und Spurensicherung arbeiten „mit geübten Handgriffen“
  ai-lex.floskel.erdboden-verschluckt: off # Polizeisprache bei Vermissten
  ai-lex.vocab.akribisch: off # Spurensicherung arbeitet akribisch
lists:
  # Polizei- und Rechtsmedizin-Sprache, die Laien ohne Erklärung nicht verstehen
  jargon:
    add: [Asservat, Asservatenkammer, KTU, Spurenträger, Leichenschau, Totenflecke, Leichenstarre,
          ED-Behandlung, Vernehmungsprotokoll, Haftrichter]
factcheck:
  domains: [law, police, forensics, medicine, place, time]
hints:
  - { text: "Jeder Hinweis, den die Ermittlerin nutzt, liegt offen vor der Leserin: unscheinbar darf er sein, versteckt nie.", when: case_clue }
  - Privates stützt den Fall oder reibt an ihm; es verdrängt ihn nicht.
  - Spannung entsteht auch aus Gefahr und Zeitdruck, nicht nur aus dem Rätsel.
scaffold:
  flags: { crime_tools: true, timeline: light }
